desc: datasets and tables can be managed with bq mk/ls/show/head/rm and queried
steps:
  mk_dataset:
    exec:
      command: tests/e2e/bq.sh mk --dataset e2e
    test: current.exit_code == 0
  ls_datasets:
    exec:
      command: tests/e2e/bq.sh ls --format=json
    test: |
      current.exit_code == 0 && current.stdout contains '"datasetId":"e2e"'
  mk_table:
    exec:
      command: tests/e2e/bq.sh mk --table e2e.users id:INTEGER,name:STRING,created:TIMESTAMP
    test: current.exit_code == 0
  show_table:
    exec:
      command: tests/e2e/bq.sh show --format=json e2e.users
    test: |
      current.exit_code == 0 &&
      current.stdout contains '"name":"created"' &&
      current.stdout contains '"type":"TIMESTAMP"'
  insert:
    exec:
      command: >-
        tests/e2e/bq.sh query --nouse_legacy_sql
        "INSERT INTO e2e.users VALUES (1, 'alice', TIMESTAMP '2024-01-01 00:00:00'), (2, 'bob', CURRENT_TIMESTAMP())"
    test: current.exit_code == 0
  select:
    exec:
      command: >-
        tests/e2e/bq.sh query --nouse_legacy_sql --format=json
        'SELECT id, name FROM `test.e2e.users` ORDER BY id'
    test: |
      current.exit_code == 0 &&
      trim(current.stdout) == '[{"id":"1","name":"alice"},{"id":"2","name":"bob"}]'
  head:
    exec:
      command: tests/e2e/bq.sh head --format=json --max_rows=1 e2e.users
    test: |
      current.exit_code == 0 && trim(current.stdout) == '[{"created":"2024-01-01 00:00:00","id":"1","name":"alice"}]'
  update:
    exec:
      command: >-
        tests/e2e/bq.sh query --nouse_legacy_sql
        "UPDATE e2e.users SET name = UPPER(name) WHERE id = 1"
    test: current.exit_code == 0
  delete:
    exec:
      command: >-
        tests/e2e/bq.sh query --nouse_legacy_sql
        "DELETE FROM e2e.users WHERE id = 2"
    test: current.exit_code == 0
  merge:
    exec:
      command: >-
        tests/e2e/bq.sh query --nouse_legacy_sql
        "MERGE e2e.users AS u USING (SELECT 1 AS id, 'ann' AS name UNION ALL SELECT 3, 'carol') AS s
        ON u.id = s.id
        WHEN MATCHED THEN UPDATE SET name = CONCAT(u.name, '/', s.name)
        WHEN NOT MATCHED THEN INSERT (id, name) VALUES (s.id, s.name)"
    test: current.exit_code == 0
  select_after_dml:
    exec:
      command: >-
        tests/e2e/bq.sh query --nouse_legacy_sql --format=json
        'SELECT id, name FROM `test.e2e.users` ORDER BY id'
    test: |
      current.exit_code == 0 &&
      trim(current.stdout) == '[{"id":"1","name":"ALICE/ann"},{"id":"3","name":"carol"}]'
  create_table_with_nested_types:
    exec:
      command: >-
        tests/e2e/bq.sh query --nouse_legacy_sql
        "CREATE TABLE e2e.nested (id INT64, tags ARRAY<STRING>, point STRUCT<x INT64, y INT64>)"
    test: current.exit_code == 0
  insert_nested:
    exec:
      command: >-
        tests/e2e/bq.sh query --nouse_legacy_sql
        "INSERT INTO e2e.nested VALUES (1, ['a', 'b'], STRUCT(2 AS x, 3 AS y))"
    test: current.exit_code == 0
  select_nested:
    exec:
      command: >-
        tests/e2e/bq.sh query --nouse_legacy_sql --format=json
        'SELECT * FROM `test.e2e.nested`'
    test: |
      current.exit_code == 0 &&
      trim(current.stdout) == '[{"id":"1","point":{"x":"2","y":"3"},"tags":["a","b"]}]'
  dry_run_does_not_create_a_table:
    exec:
      command: >-
        tests/e2e/bq.sh query --nouse_legacy_sql --dry_run
        "CREATE TABLE e2e.dry_run (id INT64)"
    test: current.exit_code == 0 && current.stdout contains "successfully validated"
  show_table_from_dry_run:
    exec:
      command: tests/e2e/bq.sh show e2e.dry_run
    test: current.exit_code != 0
  rm_nested_table:
    exec:
      command: tests/e2e/bq.sh rm -f -t e2e.nested
    test: current.exit_code == 0
  rm_table:
    exec:
      command: tests/e2e/bq.sh rm -f -t e2e.users
    test: current.exit_code == 0
  ls_tables_after_rm:
    exec:
      command: tests/e2e/bq.sh ls --format=json e2e
    test: current.exit_code == 0 && !(current.stdout contains "users")
  rm_dataset:
    exec:
      command: tests/e2e/bq.sh rm -f -d e2e
    test: current.exit_code == 0
  show_missing_dataset:
    exec:
      command: tests/e2e/bq.sh show e2e
    test: current.exit_code != 0
