# What the Go client checks is left to tests/e2e/goclient; these steps cover the requests bq builds
# from its own flags and how it prints the responses. A project of its own keeps them independent
# of concurrent runbooks.
desc: bq mk, update, show and head build requests the emulator accepts and print its responses
steps:
  mk_dataset:
    exec:
      command: BQ_EMULATOR_PROJECT=bq-dataset-table tests/e2e/bq.sh mk --dataset e2e
    test: current.exit_code == 0
  update_dataset:
    exec:
      command: BQ_EMULATOR_PROJECT=bq-dataset-table tests/e2e/bq.sh update --dataset --description 'e2e data' --set_label env:test e2e
    test: current.exit_code == 0
  show_dataset:
    exec:
      command: BQ_EMULATOR_PROJECT=bq-dataset-table tests/e2e/bq.sh show --format=json e2e
    test: |
      current.exit_code == 0 &&
      current.stdout contains '"description":"e2e data"' &&
      current.stdout contains '"labels":{"env":"test"}'
  mk_table:
    exec:
      command: BQ_EMULATOR_PROJECT=bq-dataset-table tests/e2e/bq.sh mk --table e2e.users id:INTEGER,name:STRING,created:TIMESTAMP
    test: current.exit_code == 0
  mk_labeled_table:
    exec:
      command: >-
        BQ_EMULATOR_PROJECT=bq-dataset-table tests/e2e/bq.sh mk --table --description 'labeled users' --label env:test
        e2e.labeled id:INTEGER
    test: current.exit_code == 0
  # bq clears a label by patching it to null.
  update_table_labels:
    exec:
      command: BQ_EMULATOR_PROJECT=bq-dataset-table tests/e2e/bq.sh update --set_label tier:1 --clear_label env e2e.labeled
    test: current.exit_code == 0
  show_labeled_table:
    exec:
      command: BQ_EMULATOR_PROJECT=bq-dataset-table tests/e2e/bq.sh show --format=json e2e.labeled
    test: |
      current.exit_code == 0 &&
      current.stdout contains '"description":"labeled users"' &&
      current.stdout contains '"labels":{"tier":"1"}'
  insert:
    exec:
      command: >-
        BQ_EMULATOR_PROJECT=bq-dataset-table tests/e2e/bq.sh query --nouse_legacy_sql
        "INSERT INTO e2e.users VALUES (1, 'alice', TIMESTAMP '2024-01-01 00:00:00'), (2, 'bob', CURRENT_TIMESTAMP())"
    test: current.exit_code == 0
  head:
    exec:
      command: BQ_EMULATOR_PROJECT=bq-dataset-table tests/e2e/bq.sh head --format=json --max_rows=1 e2e.users
    test: |
      current.exit_code == 0 && trim(current.stdout) == '[{"created":"2024-01-01 00:00:00","id":"1","name":"alice"}]'
  head_selected_fields:
    exec:
      command: BQ_EMULATOR_PROJECT=bq-dataset-table tests/e2e/bq.sh head --format=json --selected_fields=id --max_rows=1 e2e.users
    test: |
      current.exit_code == 0 && trim(current.stdout) == '[{"id":"1"}]'
  update_expiration:
    exec:
      command: BQ_EMULATOR_PROJECT=bq-dataset-table tests/e2e/bq.sh update --expiration 3600 e2e.users
    test: current.exit_code == 0
  # bq sends the whole schema it is given, built from its inline form.
  update_schema_adds_column:
    exec:
      command: BQ_EMULATOR_PROJECT=bq-dataset-table tests/e2e/bq.sh update e2e.users id:INTEGER,name:STRING,created:TIMESTAMP,email:STRING
    test: current.exit_code == 0
  show_updated_table:
    exec:
      command: BQ_EMULATOR_PROJECT=bq-dataset-table tests/e2e/bq.sh show --format=json e2e.users
    test: |
      current.exit_code == 0 &&
      current.stdout contains '"expirationTime"' &&
      current.stdout contains '"name":"email"'
  rm_tables:
    exec:
      command: >-
        BQ_EMULATOR_PROJECT=bq-dataset-table tests/e2e/bq.sh rm -f -t e2e.labeled &&
        BQ_EMULATOR_PROJECT=bq-dataset-table tests/e2e/bq.sh rm -f -t e2e.users
    test: current.exit_code == 0
  rm_dataset:
    exec:
      command: BQ_EMULATOR_PROJECT=bq-dataset-table tests/e2e/bq.sh rm -f -d e2e
    test: current.exit_code == 0
