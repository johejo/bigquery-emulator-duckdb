version: 1
description: >-
  Record whether a GQL CALL inside GRAPH_TABLE can declare a column of the enclosing query in its
  variable scope list, which the documentation describes only for graph variables. GoogleSQL's
  reference implementation accepts it. Requires an Enterprise or Enterprise Plus reservation.
vars:
  dataset: bqa_${run}_${case}
cases:
  - name: enclosing_query_column
    steps:
      - name: create_dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: fixture
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            query: |
              CREATE TABLE `${project}.${dataset}.Nodes` (id INT64 PRIMARY KEY NOT ENFORCED)
              AS SELECT id FROM UNNEST([1, 2, 3]) AS id;
              CREATE PROPERTY GRAPH `${project}.${dataset}.g`
              NODE TABLES (`${project}.${dataset}.Nodes` AS N);
            useLegacySql: false
            timeoutMs: 200000
      - name: query
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            query: |
              SELECT (
                SELECT ARRAY_AGG(FORMAT('%d:%d', id, correlated) ORDER BY id)
                FROM GRAPH_TABLE(`${project}.${dataset}.g`
                  MATCH (n:N)
                  CALL (n, k) {
                    RETURN n.id AS id, k AS correlated
                  }
                  RETURN id, correlated)
              ) AS result
              FROM (SELECT 7 AS k)
            useLegacySql: false
        observe:
          error: /body/error
          errors: /body/errors
          rows: /body/rows
    cleanup:
      - name: delete_dataset
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
