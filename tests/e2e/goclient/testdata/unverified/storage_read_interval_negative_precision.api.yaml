version: 1
description: >-
  Check whether Storage Read rounds a negative INTERVAL time part toward zero or down
  in Arrow and Avro. Positive cases are recorded in tests/e2e/storage/testdata.
vars:
  dataset: bqa_${run}_${case}
  table: projects/${project}/datasets/${dataset}/tables/t
  stream: ${table}/streams/_default
  # Arrow MONTH_DAY_NANO: value = (0 months, 0 days, -1001 ns).
  nano_schema: '/////3gAAAAQAAAAAAAKAAwACgAJAAQACgAAABAAAAAAAQQACAAIAAAABAAIAAAABAAAAAEAAAAUAAAAEAAUABAADwAOAAgAAAAEABAAAAAQAAAAGAAAAAAACwEYAAAAAAAAAAAABgAIAAYABgAAAAAAAgAFAAAAdmFsdWUAAAA='
  nano_batch: '/////4gAAAAUAAAAAAAAAAwAFgAUABMADAAEAAwAAAAQAAAAAAAAABQAAAAAAAADBAAKABgADAAIAAQACgAAABQAAAA4AAAAAQAAAAAAAAAAAAAAAgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAEAAAABAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAX/P///////w=='
templates:
  read_interval:
    steps:
      - name: create_dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: create_table
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            query: >-
              CREATE TABLE `${project}.${dataset}.t` (value INTERVAL)
            useLegacySql: false
            location: US
            timeoutMs: 60000
      - name: append_nanos
        grpc:
          method: google.cloud.bigquery.storage.v1.BigQueryWrite/AppendRows
          headers:
            x-goog-request-params: write_stream=${stream}
          requests:
            - writeStream: ${stream}
              arrowRows:
                writerSchema: {serializedSchema: '${nano_schema}'}
                rows: {serializedRecordBatch: '${nano_batch}'}
        observe:
          error: /messages/0/error
      - name: session
        grpc:
          method: google.cloud.bigquery.storage.v1.BigQueryRead/CreateReadSession
          headers:
            x-goog-request-params: read_session.table=${table}
          requests:
            - parent: projects/${project}
              readSession:
                table: ${table}
                dataFormat: ${format}
              maxStreamCount: 1
        bind:
          read_stream: /messages/0/streams/0/name
        observe:
          code: /code
          arrowSchema: /messages/0/arrowSchema/serializedSchema
          avroSchema: /messages/0/avroSchema/schema
      - name: read
        grpc:
          method: google.cloud.bigquery.storage.v1.BigQueryRead/ReadRows
          headers:
            x-goog-request-params: read_stream=${read_stream}
          requests:
            - readStream: ${read_stream}
        observe:
          messages: /messages
    cleanup:
      - name: delete_dataset
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
cases:
  - name: arrow_nanos
    template: read_interval
    vars: {format: ARROW}
  - name: avro_nanos
    template: read_interval
    vars: {format: AVRO}
