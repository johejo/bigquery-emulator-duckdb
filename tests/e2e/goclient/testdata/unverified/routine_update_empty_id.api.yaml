version: 1
# routines.insert answers an empty routine ID with "Project ID, dataset ID and routine ID cannot be
# missing or empty in call to routines.insert" (scenarios/testdata/empty_request_values.api.yaml);
# the emulator assumes routines.update names itself the same way.
description: routines.update with an empty routine ID in the Routine resource.
vars:
  dataset: bqa_${run}_${case}
cases:
  - name: routine_update_empty_id
    steps:
      - name: create_dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: insert
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets/${dataset}/routines
          body:
            routineReference: {projectId: '${project}', datasetId: '${dataset}', routineId: f}
            routineType: SCALAR_FUNCTION
            definitionBody: '1'
      - name: update
        rest:
          method: PUT
          path: /bigquery/v2/projects/${project}/datasets/${dataset}/routines/f
          body:
            routineReference: {projectId: '${project}', datasetId: '${dataset}', routineId: ''}
            routineType: SCALAR_FUNCTION
            definitionBody: '2'
        observe:
          status: /status
    cleanup:
      - name: delete_dataset
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
