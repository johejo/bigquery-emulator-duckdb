version: 1
# decimalTargetTypes cases that external_decimal_target_types.api.yaml of
# tests/e2e/scenarios/testdata leaves open: DECIMALs in RECORDs and REPEATED columns, a declared
# nested type other than the selected one, JSON tables, and an unknown type through tables.insert.
# No expected values below are taken from the emulator.
# nested.parquet, written by arrow-go v18.8.0 without statistics or dictionaries, has one row of
# r REQUIRED group {n INT32 DECIMAL(9, 2) = 1.25}, rw REQUIRED group {n FIXED_LEN_BYTE_ARRAY
# DECIMAL(40, 2) = 1.25} and list REPEATED INT32 DECIMAL(9, 2) = [1.25, 1.00].
description: >-
  decimal_target_types of nested Parquet DECIMALs and of JSON tables.
vars:
  dataset: bqa_${run}_${case}
  prefix: gs://${bucket}/${run}/${case}
  query: SELECT * FROM `${project}.${dataset}.t`
  nested: ""
  # '{"n": 1.25}\n'
  json: eyJuIjogMS4yNX0K
templates:
  # Creates `t` with the DDL statement `ddl` over the object `object`, whose contents are
  # `source`, and reads its metadata and rows.
  ddl:
    steps:
      - name: dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: source
        gcs: {method: PUT, object: '${run}/${case}/${object}', base64: '${source}'}
      - name: create
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: ${ddl}
        observe:
          status: /status
          errors: /body/errors
      - name: get
        rest:
          method: GET
          path: /bigquery/v2/projects/${project}/datasets/${dataset}/tables/t
        observe:
          external: /body/externalDataConfiguration
          schema: /body/schema
      - name: metadata
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: >-
              SELECT (SELECT ddl FROM `${project}.${dataset}.INFORMATION_SCHEMA.TABLES` WHERE table_name = 't'),
              ARRAY(SELECT AS STRUCT option_name, option_type, option_value
              FROM `${project}.${dataset}.INFORMATION_SCHEMA.TABLE_OPTIONS` WHERE table_name = 't' ORDER BY option_name)
        observe:
          status: /status
          rows: /body/rows
      - name: query
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: ${query}
        observe:
          status: /status
          jobComplete: /body/jobComplete
          schema: /body/schema
          rows: /body/rows
          errors: /body/errors
    cleanup:
      - name: delete
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
      - name: delete_source
        gcs: {method: DELETE, object: '${run}/${case}/${object}'}
  # As ddl, creating `t` with tables.insert and the resource `table`.
  rest:
    steps:
      - name: dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: source
        gcs: {method: PUT, object: '${run}/${case}/${object}', base64: '${source}'}
      - name: create
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets/${dataset}/tables
          body: ${table}
        observe:
          status: /status
          external: /body/externalDataConfiguration
          schema: /body/schema
      - name: query
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: ${query}
        observe:
          status: /status
          jobComplete: /body/jobComplete
          schema: /body/schema
          rows: /body/rows
          errors: /body/errors
    cleanup:
      - name: delete
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
      - name: delete_source
        gcs: {method: DELETE, object: '${run}/${case}/${object}'}
cases:
  - name: nested_bignumeric
    template: ddl
    vars:
      object: nested.parquet
      source: '${nested}'
      ddl: CREATE EXTERNAL TABLE `${project}.${dataset}.t` OPTIONS (format = 'PARQUET', uris = ['${prefix}/nested.parquet'], decimal_target_types = ['BIGNUMERIC'])
  - name: nested_string
    template: ddl
    vars:
      object: nested.parquet
      source: '${nested}'
      ddl: CREATE EXTERNAL TABLE `${project}.${dataset}.t` OPTIONS (format = 'PARQUET', uris = ['${prefix}/nested.parquet'], decimal_target_types = ['STRING'])
  - name: nested_numeric_bignumeric
    template: ddl
    vars:
      object: nested.parquet
      source: '${nested}'
      ddl: CREATE EXTERNAL TABLE `${project}.${dataset}.t` OPTIONS (format = 'PARQUET', uris = ['${prefix}/nested.parquet'], decimal_target_types = ['NUMERIC', 'BIGNUMERIC'])
  # A declared nested type other than the one decimalTargetTypes selects.
  - name: nested_declared_numeric
    template: ddl
    vars:
      object: nested.parquet
      source: '${nested}'
      ddl: CREATE EXTERNAL TABLE `${project}.${dataset}.t` (r STRUCT<n NUMERIC>, list ARRAY<NUMERIC>) OPTIONS (format = 'PARQUET', uris = ['${prefix}/nested.parquet'], decimal_target_types = ['BIGNUMERIC'])
  - name: json_ddl
    template: ddl
    vars:
      object: a.json
      source: '${json}'
      ddl: CREATE EXTERNAL TABLE `${project}.${dataset}.t` (n NUMERIC) OPTIONS (format = 'JSON', uris = ['${prefix}/a.json'], decimal_target_types = ['BIGNUMERIC'])
  - name: json_autodetect_rest
    template: rest
    vars:
      object: a.json
      source: '${json}'
      table:
        tableReference: {projectId: '${project}', datasetId: '${dataset}', tableId: t}
        externalDataConfiguration:
          sourceFormat: NEWLINE_DELIMITED_JSON
          sourceUris: ['${prefix}/a.json']
          autodetect: true
          decimalTargetTypes: [BIGNUMERIC]
  - name: unknown_rest
    template: rest
    vars:
      object: nested.parquet
      source: '${nested}'
      table:
        tableReference: {projectId: '${project}', datasetId: '${dataset}', tableId: t}
        externalDataConfiguration:
          sourceFormat: PARQUET
          sourceUris: ['${prefix}/nested.parquet']
          decimalTargetTypes: [FLOAT64]
