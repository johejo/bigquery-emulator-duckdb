version: 1
# Nested DECIMAL cases that tests/e2e/scenarios/testdata/external_decimal_unheld.api.yaml leaves
# open: BigQuery's error for a value of a REPEATED column the type does not hold, which that
# file's cases did not reach, for a value with more fractional digits than BIGNUMERIC's, and for a
# value both beyond NUMERIC's range and with more fractional digits than NUMERIC's. The emulator
# rejects these as unsupported.
# Each source, written by arrow-go v18.8.0 without statistics or dictionaries, has one row of
# r REQUIRED group {n DECIMAL} and list REPEATED DECIMAL = [n], the same value in both:
# d40_2_large FIXED_LEN_BYTE_ARRAY DECIMAL(40, 2) = 1e35, d40_12_fine DECIMAL(40, 12) =
# 1.000000000001, d76_0_large DECIMAL(76, 0) = 1e39, d76_40_fine DECIMAL(76, 40) =
# 1.0000000000000000000000000000000000000001 and d50_12_both DECIMAL(50, 12) =
# 1000000000000000000000000000000.000000000001.
# No expected values below are taken from the emulator.
description: >-
  Errors reading nested Parquet DECIMAL values that their type does not hold.
vars:
  dataset: bqa_${run}_${case}
  prefix: gs://${bucket}/${run}/${case}
  d40_2_large: ""
  d40_12_fine: ""
  d76_0_large: ""
  d76_40_fine: ""
  d50_12_both: ""
templates:
  # Creates `t` with the DDL statement `ddl` over the object src.parquet, whose contents are
  # `source`, and reads its column `column`.
  ddl:
    steps:
      - name: dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: source
        gcs: {method: PUT, object: '${run}/${case}/src.parquet', base64: '${source}'}
      - name: create
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: ${ddl}
        observe:
          status: /status
          errors: /body/errors
      - name: get
        rest:
          method: GET
          path: /bigquery/v2/projects/${project}/datasets/${dataset}/tables/t
        observe:
          status: /status
          schema: /body/schema
      - name: read
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: SELECT ${column} FROM `${project}.${dataset}.t`
        observe:
          status: /status
          schema: /body/schema
          rows: /body/rows
          errors: /body/errors
    cleanup:
      - name: delete
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
      - name: delete_source
        gcs: {method: DELETE, object: '${run}/${case}/src.parquet'}
cases:
  # A REPEATED column's value beyond the type's range or with too many fractional digits.
  - name: list_numeric_range
    template: ddl
    vars:
      source: '${d40_2_large}'
      column: list
      ddl: CREATE EXTERNAL TABLE `${project}.${dataset}.t` OPTIONS (format = 'PARQUET', uris = ['${prefix}/src.parquet'])
  - name: list_numeric_fraction
    template: ddl
    vars:
      source: '${d40_12_fine}'
      column: list
      ddl: CREATE EXTERNAL TABLE `${project}.${dataset}.t` OPTIONS (format = 'PARQUET', uris = ['${prefix}/src.parquet'])
  - name: list_bignumeric_range
    template: ddl
    vars:
      source: '${d76_0_large}'
      column: list
      ddl: CREATE EXTERNAL TABLE `${project}.${dataset}.t` OPTIONS (format = 'PARQUET', uris = ['${prefix}/src.parquet'], decimal_target_types = ['BIGNUMERIC'])
  # More fractional digits than BIGNUMERIC's, as BIGNUMERIC and as STRING.
  - name: record_bignumeric_fraction
    template: ddl
    vars:
      source: '${d76_40_fine}'
      column: r
      ddl: CREATE EXTERNAL TABLE `${project}.${dataset}.t` OPTIONS (format = 'PARQUET', uris = ['${prefix}/src.parquet'], decimal_target_types = ['BIGNUMERIC'])
  - name: record_string_fraction
    template: ddl
    vars:
      source: '${d76_40_fine}'
      column: r
      ddl: CREATE EXTERNAL TABLE `${project}.${dataset}.t` OPTIONS (format = 'PARQUET', uris = ['${prefix}/src.parquet'], decimal_target_types = ['STRING'])
  # Beyond NUMERIC's range and with more fractional digits than NUMERIC's.
  - name: record_numeric_both
    template: ddl
    vars:
      source: '${d50_12_both}'
      column: r
      ddl: CREATE EXTERNAL TABLE `${project}.${dataset}.t` OPTIONS (format = 'PARQUET', uris = ['${prefix}/src.parquet'])
