version: 1
description: >-
  Storage Write change data capture forms that third_party/bigquery_docs/change-data-capture.md does not settle.
vars:
  dataset: bqa_${run}_${case}
  table: projects/${project}/datasets/${dataset}/tables/t
  stream: ${table}/streams/_default
  descriptor:
    name: Row
    field:
      - {name: id, number: 1, type: TYPE_INT64, label: LABEL_OPTIONAL}
      - {name: name, number: 2, type: TYPE_STRING, label: LABEL_OPTIONAL}
      - {name: salary, number: 3, type: TYPE_INT64, label: LABEL_OPTIONAL}
      - {name: _CHANGE_TYPE, number: 4, type: TYPE_STRING, label: LABEL_OPTIONAL}
      - {name: _CHANGE_SEQUENCE_NUMBER, number: 5, type: TYPE_STRING, label: LABEL_OPTIONAL}
cases:
  - name: missing_change_type_without_primary_key
    description: >-
      Whether a table without a primary key rejects a writer schema with the pseudocolumns when the first row has no _CHANGE_TYPE, as it does when the row is an INSERT.
    steps:
      - {name: create_dataset, rest: {method: POST, path: "/bigquery/v2/projects/${project}/datasets", body: {datasetReference: {datasetId: "${dataset}"}, location: US}}}
      - name: create_table
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            query: "CREATE TABLE `${project}.${dataset}.t` (id INT64, name STRING, salary INT64)"
            useLegacySql: false
            location: US
        observe: {error: /body/error, rows: /body/rows}
      - name: append
        grpc:
          method: google.cloud.bigquery.storage.v1.BigQueryWrite/AppendRows
          headers: {x-goog-request-params: "write_stream=${stream}"}
          requests:
            - writeStream: ${stream}
              protoRows:
                writerSchema: {protoDescriptor: "${descriptor}"}
                rows: {serializedRows: ["CAESAWEYAQ=="]}
        observe:
          code: /code
          result0: /messages/0/appendResult
          errorCode0: /messages/0/error/code
          error0: /messages/0/error/message
          rowErrors0: /messages/0/rowErrors
      - name: check
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            query: "SELECT id, name, salary FROM `${project}.${dataset}.t` ORDER BY id"
            useLegacySql: false
            location: US
        observe: {error: /body/error, rows: /body/rows}
    cleanup:
      - {name: delete_dataset, rest: {method: DELETE, path: "/bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true"}}
  - name: explicit_stream_without_primary_key
    description: >-
      What an explicit stream answers for an INSERT row on a table without a primary key.
    steps:
      - {name: create_dataset, rest: {method: POST, path: "/bigquery/v2/projects/${project}/datasets", body: {datasetReference: {datasetId: "${dataset}"}, location: US}}}
      - name: create_table
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            query: "CREATE TABLE `${project}.${dataset}.t` (id INT64, name STRING, salary INT64)"
            useLegacySql: false
            location: US
        observe: {error: /body/error, rows: /body/rows}
      - name: create_stream
        grpc:
          method: google.cloud.bigquery.storage.v1.BigQueryWrite/CreateWriteStream
          headers: {x-goog-request-params: "parent=${table}"}
          requests:
            - {parent: "${table}", writeStream: {type: COMMITTED}}
        bind: {explicit: /messages/0/name}
      - name: append
        grpc:
          method: google.cloud.bigquery.storage.v1.BigQueryWrite/AppendRows
          headers: {x-goog-request-params: "write_stream=${explicit}"}
          requests:
            - writeStream: ${explicit}
              protoRows:
                writerSchema: {protoDescriptor: "${descriptor}"}
                rows: {serializedRows: ["CAESAWEYASIGSU5TRVJU"]}
        observe:
          code: /code
          result0: /messages/0/appendResult
          errorCode0: /messages/0/error/code
          error0: /messages/0/error/message
          rowErrors0: /messages/0/rowErrors
      - name: check
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            query: "SELECT id, name, salary FROM `${project}.${dataset}.t` ORDER BY id"
            useLegacySql: false
            location: US
        observe: {error: /body/error, rows: /body/rows}
    cleanup:
      - {name: delete_dataset, rest: {method: DELETE, path: "/bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true"}}
  - name: unknown_change_type_after_insert
    description: >-
      The row error for an unknown _CHANGE_TYPE once the connection writes INSERT rows.
    steps:
      - {name: create_dataset, rest: {method: POST, path: "/bigquery/v2/projects/${project}/datasets", body: {datasetReference: {datasetId: "${dataset}"}, location: US}}}
      - name: create_table
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            query: "CREATE TABLE `${project}.${dataset}.t` (id INT64 PRIMARY KEY NOT ENFORCED, name STRING, salary INT64)"
            useLegacySql: false
            location: US
        observe: {error: /body/error, rows: /body/rows}
      - name: append
        grpc:
          method: google.cloud.bigquery.storage.v1.BigQueryWrite/AppendRows
          headers: {x-goog-request-params: "write_stream=${stream}"}
          requests:
            - writeStream: ${stream}
              protoRows:
                writerSchema: {protoDescriptor: "${descriptor}"}
                rows: {serializedRows: ["CAESAWEYASIGSU5TRVJU"]}
            - protoRows: {rows: {serializedRows: ["CAISAWIYASIFTUVSR0U="]}}
        observe:
          code: /code
          result0: /messages/0/appendResult
          errorCode0: /messages/0/error/code
          error0: /messages/0/error/message
          rowErrors0: /messages/0/rowErrors
          result1: /messages/1/appendResult
          errorCode1: /messages/1/error/code
          error1: /messages/1/error/message
          rowErrors1: /messages/1/rowErrors
      - name: check
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            query: "SELECT id, name, salary FROM `${project}.${dataset}.t` ORDER BY id"
            useLegacySql: false
            location: US
        observe: {error: /body/error, rows: /body/rows}
    cleanup:
      - {name: delete_dataset, rest: {method: DELETE, path: "/bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true"}}
  - name: insert_invalid_sequence
    description: >-
      Whether an INSERT row checks its sequence number.
    steps:
      - {name: create_dataset, rest: {method: POST, path: "/bigquery/v2/projects/${project}/datasets", body: {datasetReference: {datasetId: "${dataset}"}, location: US}}}
      - name: create_table
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            query: "CREATE TABLE `${project}.${dataset}.t` (id INT64 PRIMARY KEY NOT ENFORCED, name STRING, salary INT64)"
