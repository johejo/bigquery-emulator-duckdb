version: 1
description: Record the exact IPC field metadata BigQuery emits for Arrow JSON, including ARRAY<JSON>.
vars:
  dataset: bqa_${run}_${case}
  table: projects/${project}/datasets/${dataset}/tables/t
cases:
  - name: arrow_json_schema
    steps:
      - name: create_dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: create_table
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            query: CREATE TABLE `${project}.${dataset}.t` (j JSON, items ARRAY<JSON>, rec STRUCT<j JSON>)
            useLegacySql: false
            location: US
      - name: create_read_session
        grpc:
          method: google.cloud.bigquery.storage.v1.BigQueryRead/CreateReadSession
          headers:
            x-goog-request-params: read_session.table=${table}
          requests:
            - parent: projects/${project}
              readSession: {table: '${table}', dataFormat: ARROW}
              maxStreamCount: 1
        observe:
          code: /code
          schema: /messages/0/arrowSchema/serializedSchema
    cleanup:
      - name: delete_dataset
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
