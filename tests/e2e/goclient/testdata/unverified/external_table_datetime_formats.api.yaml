version: 1
# BigQuery's answers settle what time_zone, date_format, datetime_format, time_format and
# timestamp_format, which third_party/bigquery_docs/reference/standard-sql/
# data-definition-language.md and the timeZone, dateFormat, datetimeFormat, timeFormat
# and timestampFormat of reference/rest/v2/tables.md describe, do to the reads and
# metadata of CSV and JSON external tables: whether they take SQL-style format elements,
# C-style ones or both, whether a format excludes the default forms, which values
# time_zone takes and applies to, and how tables.get and INFORMATION_SCHEMA store them.
# The Parquet case reuses types.parquet of external_table_parquet_types.api.yaml.
# Sources, as `id,value` records or JSON lines:
# - date_format_sql: "1,01/02/2024\n2,2024-01-02\n3,1/2/2024\n4,01/02/24\n"
# - date_format_c: "1,01/02/2024\n2,2024-01-02\n3,1/2/2024\n4,01/02/24\n"
# - datetime_format: "1,01/02/2024 03:04:05.123\n2,01/02/2024 03:04:05\n3,01/02/2024
#   03:04:05.123456\n4,2024-01-02 03:04:05\n"
# - time_format: "1,03:04:05.123\n2,03:04:05\n3,03:04:05.123456\n"
# - time_format_12_hour: "1,03:04:05 PM\n2,15:04:05\n3,03:04:05 AM\n"
# - timestamp_format: "1,01/02/2024 03:04:05\n2,2024-01-02 03:04:05\n3,01/02/2024 03:04:05 +09\n"
# - timestamp_format_zone: "1,01/02/2024 03:04:05 +09\n2,01/02/2024 03:04:05\n"
# - timestamp_format_c: "1,01/02/2024 03:04:05\n2,2024-01-02 03:04:05\n"
# - time_zone_name: "1,2024-01-02 03:04:05\n2,2024-01-02 03:04:05 UTC\n3,2024-01-02
#   03:04:05+09\n4,2024-07-02 03:04:05\n5,2024-01-02T03:04:05Z\n6,2024-01-02\n"
# - time_zone_offset: "1,2024-01-02 03:04:05\n2,2024-01-02 03:04:05 UTC\n3,2024-01-02
#   03:04:05+09\n4,2024-07-02 03:04:05\n5,2024-01-02T03:04:05Z\n6,2024-01-02\n"
# - time_zone_datetime: "1,2024-01-02 03:04:05\n2,2024-01-02 03:04:05 UTC\n"
# - time_zone_with_format: "1,01/02/2024 03:04:05\n"
# - time_zone_invalid: "1,2024-01-02 03:04:05\n"
# - date_format_invalid: "1,2024-01-02\n"
# - date_format_empty: "1,2024-01-02\n"
# - date_format_other_types: "1,01/02/2024,2024-01-02 03:04:05,2024-01-02
#   03:04:05\n2,01/02/2024,01/02/2024 03:04:05,01/02/2024 03:04:05\n"
# - all_formats: "1,2024/01/02,2024/01/02 03:04:05,03.04.05,2024/01/02 03:04:05\n"
# - autodetect_date_format: "d\n01/02/2024\n"
# - json_date_format: "{\"id\":1,\"v\":\"01/02/2024\"}\n{\"id\":2,\"v\":\"2024-01-02\"}\n"
# - json_time_zone: "{\"id\":1,\"v\":\"2024-01-02
#   03:04:05\"}\n{\"id\":2,\"v\":\"2024-01-02T03:04:05Z\"}\n"
# - rest_formats: "1,2024/01/02,2024/01/02 03:04:05,03.04.05,2024/01/02 03:04:05\n"
description: >-
  time_zone, date_format, datetime_format, time_format and timestamp_format of external
  tables.
vars:
  dataset: bqa_${run}_${case}
  prefix: gs://${bucket}/${run}/${case}
  query: SELECT * FROM `${project}.${dataset}.t` ORDER BY 1
  types: ""
templates:
  # Creates `t` with the DDL statement `ddl` over the object `object`, whose contents are
  # `source`, and runs `query` on it.
  ddl:
    steps:
      - name: dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: source
        gcs: {method: PUT, object: '${run}/${case}/${object}', base64: '${source}'}
      - name: create
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: ${ddl}
        observe:
          status: /status
          errors: /body/errors
      - name: get
        rest:
          method: GET
          path: /bigquery/v2/projects/${project}/datasets/${dataset}/tables/t
        observe:
          external: /body/externalDataConfiguration
          schema: /body/schema
      - name: ddl
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: SELECT ddl FROM `${project}.${dataset}.INFORMATION_SCHEMA.TABLES` WHERE table_name = 't'
        observe:
          rows: /body/rows
      - name: options
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: SELECT option_name, option_type, option_value FROM `${project}.${dataset}.INFORMATION_SCHEMA.TABLE_OPTIONS` WHERE table_name = 't' ORDER BY option_name
        observe:
          rows: /body/rows
      - name: query
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: ${query}
        bind:
          job: /body/jobReference/jobId
        observe:
          status: /status
          jobComplete: /body/jobComplete
          schema: /body/schema
          rows: /body/rows
          errors: /body/errors
      - name: job
        rest:
          method: GET
          path: /bigquery/v2/projects/${project}/jobs/${job}?location=US
        observe:
          status: /body/status
    cleanup:
      - name: delete
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
      - name: delete_source
        gcs: {method: DELETE, object: '${run}/${case}/${object}'}
  # As ddl, creating `t` with tables.insert and the resource `table`.
  rest:
    steps:
      - name: dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: source
        gcs: {method: PUT, object: '${run}/${case}/${object}', base64: '${source}'}
      - name: create
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets/${dataset}/tables
          body: ${table}
        observe:
          status: /status
          external: /body/externalDataConfiguration
          schema: /body/schema
      - name: get
        rest:
          method: GET
          path: /bigquery/v2/projects/${project}/datasets/${dataset}/tables/t
        observe:
          external: /body/externalDataConfiguration
          schema: /body/schema
      - name: ddl
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: SELECT ddl FROM `${project}.${dataset}.INFORMATION_SCHEMA.TABLES` WHERE table_name = 't'
        observe:
          rows: /body/rows
      - name: options
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: SELECT option_name, option_type, option_value FROM `${project}.${dataset}.INFORMATION_SCHEMA.TABLE_OPTIONS` WHERE table_name = 't' ORDER BY option_name
        observe:
          rows: /body/rows
      - name: query
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: ${query}
        bind:
          job: /body/jobReference/jobId
        observe:
          status: /status
          jobComplete: /body/jobComplete
          schema: /body/schema
          rows: /body/rows
          errors: /body/errors
      - name: job
        rest:
          method: GET
          path: /bigquery/v2/projects/${project}/jobs/${job}?location=US
        observe:
          status: /body/status
    cleanup:
      - name: delete
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
      - name: delete_source
        gcs: {method: DELETE, object: '${run}/${case}/${object}'}
cases:
  - name: date_format_sql
    template: ddl
    vars:
      object: "s.csv"
      source: "MSwwMS8wMi8yMDI0CjIsMjAyNC0wMS0wMgozLDEvMi8yMDI0CjQsMDEvMDIvMjQK"
      ddl: "CREATE EXTERNAL TABLE `${project}.${dataset}.t` (id INT64, v DATE) OPTIONS (format = 'CSV', uris = ['${prefix}/s.csv'], date_format = 'MM/DD/YYYY', max_bad_records = 100)"
  - name: date_format_c
    template: ddl
    vars:
      object: "s.csv"
      source: "MSwwMS8wMi8yMDI0CjIsMjAyNC0wMS0wMgozLDEvMi8yMDI0CjQsMDEvMDIvMjQK"
      ddl: "CREATE EXTERNAL TABLE `${project}.${dataset}.t` (id INT64, v DATE) OPTIONS (format = 'CSV', uris = ['${prefix}/s.csv'], date_format = '%m/%d/%Y', max_bad_records = 100)"
  - name: datetime_format
    template: ddl
    vars:
      object: "s.csv"
      source: "MSwwMS8wMi8yMDI0IDAzOjA0OjA1LjEyMwoyLDAxLzAyLzIwMjQgMDM6MDQ6MDUKMywwMS8wMi8yMDI0IDAzOjA0OjA1LjEyMzQ1Ngo0LDIwMjQtMDEtMDIgMDM6MDQ6MDUK"
      ddl: "CREATE EXTERNAL TABLE `${project}.${dataset}.t` (id INT64, v DATETIME) OPTIONS (format = 'CSV', uris = ['${prefix}/s.csv'], datetime_format = 'MM/DD/YYYY HH24:MI:SS.FF3', max_bad_records = 100)"
  - name: time_format
    template: ddl
    vars:
      object: "s.csv"
      source: "MSwwMzowNDowNS4xMjMKMiwwMzowNDowNQozLDAzOjA0OjA1LjEyMzQ1Ngo="
      ddl: "CREATE EXTERNAL TABLE `${project}.${dataset}.t` (id INT64, v TIME) OPTIONS (format = 'CSV', uris = ['${prefix}/s.csv'], time_format = 'HH24:MI:SS.FF3', max_bad_records = 100)"
  - name: time_format_12_hour
    template: ddl
    vars:
      object: "s.csv"
      source: "MSwwMzowNDowNSBQTQoyLDE1OjA0OjA1CjMsMDM6MDQ6MDUgQU0K"
      ddl: "CREATE EXTERNAL TABLE `${project}.${dataset}.t` (id INT64, v TIME) OPTIONS (format = 'CSV', uris = ['${prefix}/s.csv'], time_format = 'HH12:MI:SS AM', max_bad_records = 100)"
  - name: timestamp_format
    template: ddl
    vars:
      object: "s.csv"
      source: "MSwwMS8wMi8yMDI0IDAzOjA0OjA1CjIsMjAyNC0wMS0wMiAwMzowNDowNQozLDAxLzAyLzIwMjQgMDM6MDQ6MDUgKzA5Cg=="
      ddl: "CREATE EXTERNAL TABLE `${project}.${dataset}.t` (id INT64, v TIMESTAMP) OPTIONS (format = 'CSV', uris = ['${prefix}/s.csv'], timestamp_format = 'MM/DD/YYYY HH24:MI:SS', max_bad_records = 100)"
  - name: timestamp_format_zone
    template: ddl
    vars:
      object: "s.csv"
      source: "MSwwMS8wMi8yMDI0IDAzOjA0OjA1ICswOQoyLDAxLzAyLzIwMjQgMDM6MDQ6MDUK"
      ddl: "CREATE EXTERNAL TABLE `${project}.${dataset}.t` (id INT64, v TIMESTAMP) OPTIONS (format = 'CSV', uris = ['${prefix}/s.csv'], timestamp_format = 'MM/DD/YYYY HH24:MI:SS TZH', max_bad_records = 100)"
  - name: timestamp_format_c
    template: ddl
    vars:
      object: "s.csv"
      source: "MSwwMS8wMi8yMDI0IDAzOjA0OjA1CjIsMjAyNC0wMS0wMiAwMzowNDowNQo="
      ddl: "CREATE EXTERNAL TABLE `${project}.${dataset}.t` (id INT64, v TIMESTAMP) OPTIONS (format = 'CSV', uris = ['${prefix}/s.csv'], timestamp_format = '%m/%d/%Y %H:%M:%S', max_bad_records = 100)"
  - name: time_zone_name
    template: ddl
    vars:
      object: "s.csv"
      source: "MSwyMDI0LTAxLTAyIDAzOjA0OjA1CjIsMjAyNC0wMS0wMiAwMzowNDowNSBVVEMKMywyMDI0LTAxLTAyIDAzOjA0OjA1KzA5CjQsMjAyNC0wNy0wMiAwMzowNDowNQo1LDIwMjQtMDEtMDJUMDM6MDQ6MDVaCjYsMjAyNC0wMS0wMgo="
      ddl: "CREATE EXTERNAL TABLE `${project}.${dataset}.t` (id INT64, v TIMESTAMP) OPTIONS (format = 'CSV', uris = ['${prefix}/s.csv'], time_zone = 'America/Los_Angeles', max_bad_records = 100)"
  - name: time_zone_offset
    template: ddl
    vars:
      object: "s.csv"
      source: "MSwyMDI0LTAxLTAyIDAzOjA0OjA1CjIsMjAyNC0wMS0wMiAwMzowNDowNSBVVEMKMywyMDI0LTAxLTAyIDAzOjA0OjA1KzA5CjQsMjAyNC0wNy0wMiAwMzowNDowNQo1LDIwMjQtMDEtMDJUMDM6MDQ6MDVaCjYsMjAyNC0wMS0wMgo="
      ddl: "CREATE EXTERNAL TABLE `${project}.${dataset}.t` (id INT64, v TIMESTAMP) OPTIONS (format = 'CSV', uris = ['${prefix}/s.csv'], time_zone = '+09:00', max_bad_records = 100)"
  # Whether time_zone applies to DATETIME values.
  - name: time_zone_datetime
    template: ddl
    vars:
      object: "s.csv"
      source: "MSwyMDI0LTAxLTAyIDAzOjA0OjA1CjIsMjAyNC0wMS0wMiAwMzowNDowNSBVVEMK"
      ddl: "CREATE EXTERNAL TABLE `${project}.${dataset}.t` (id INT64, v DATETIME) OPTIONS (format = 'CSV', uris = ['${prefix}/s.csv'], time_zone = 'America/Los_Angeles', max_bad_records = 100)"
  - name: time_zone_with_format
    template: ddl
    vars:
      object: "s.csv"
      source: "MSwwMS8wMi8yMDI0IDAzOjA0OjA1Cg=="
      ddl: "CREATE EXTERNAL TABLE `${project}.${dataset}.t` (id INT64, v TIMESTAMP) OPTIONS (format = 'CSV', uris = ['${prefix}/s.csv'], time_zone = 'Asia/Tokyo', timestamp_format = 'MM/DD/YYYY HH24:MI:SS', max_bad_records = 100)"
  - name: time_zone_invalid
    template: ddl
    vars:
      object: "s.csv"
      source: "MSwyMDI0LTAxLTAyIDAzOjA0OjA1Cg=="
      ddl: "CREATE EXTERNAL TABLE `${project}.${dataset}.t` (id INT64, v TIMESTAMP) OPTIONS (format = 'CSV', uris = ['${prefix}/s.csv'], time_zone = 'Mars/Base')"
  - name: date_format_invalid
    template: ddl
    vars:
      object: "s.csv"
      source: "MSwyMDI0LTAxLTAyCg=="
      ddl: "CREATE EXTERNAL TABLE `${project}.${dataset}.t` (id INT64, v DATE) OPTIONS (format = 'CSV', uris = ['${prefix}/s.csv'], date_format = 'XYZ')"
  - name: date_format_empty
    template: ddl
    vars:
      object: "s.csv"
      source: "MSwyMDI0LTAxLTAyCg=="
      ddl: "CREATE EXTERNAL TABLE `${project}.${dataset}.t` (id INT64, v DATE) OPTIONS (format = 'CSV', uris = ['${prefix}/s.csv'], date_format = '')"
  # Whether date_format applies to DATETIME and TIMESTAMP values.
  - name: date_format_other_types
    template: ddl
    vars:
      object: "s.csv"
      source: "MSwwMS8wMi8yMDI0LDIwMjQtMDEtMDIgMDM6MDQ6MDUsMjAyNC0wMS0wMiAwMzowNDowNQoyLDAxLzAyLzIwMjQsMDEvMDIvMjAyNCAwMzowNDowNSwwMS8wMi8yMDI0IDAzOjA0OjA1Cg=="
      ddl: "CREATE EXTERNAL TABLE `${project}.${dataset}.t` (id INT64, d DATE, dt DATETIME, ts TIMESTAMP) OPTIONS (format = 'CSV', uris = ['${prefix}/s.csv'], date_format = 'MM/DD/YYYY', max_bad_records = 100)"
  # Each option, as tables.get, INFORMATION_SCHEMA's DDL and TABLE_OPTIONS store it.
  - name: all_formats
    template: ddl
    vars:
      object: "s.csv"
      source: "MSwyMDI0LzAxLzAyLDIwMjQvMDEvMDIgMDM6MDQ6MDUsMDMuMDQuMDUsMjAyNC8wMS8wMiAwMzowNDowNQo="
      ddl: "CREATE EXTERNAL TABLE `${project}.${dataset}.t` (id INT64, d DATE, dt DATETIME, t TIME, ts TIMESTAMP) OPTIONS (format = 'CSV', uris = ['${prefix}/s.csv'], time_zone = 'Asia/Tokyo', date_format = 'YYYY/MM/DD', datetime_format = 'YYYY/MM/DD HH24:MI:SS', time_format = 'HH24.MI.SS', timestamp_format = 'YYYY/MM/DD HH24:MI:SS')"
  # Whether CSV schema detection takes date_format.
  - name: autodetect_date_format
    template: ddl
    vars:
      object: "s.csv"
      source: "ZAowMS8wMi8yMDI0Cg=="
      ddl: "CREATE EXTERNAL TABLE `${project}.${dataset}.t`  OPTIONS (format = 'CSV', uris = ['${prefix}/s.csv'], date_format = 'MM/DD/YYYY', autodetect = true)"
  - name: json_date_format
    template: ddl
    vars:
      object: "s.json"
      source: "eyJpZCI6MSwidiI6IjAxLzAyLzIwMjQifQp7ImlkIjoyLCJ2IjoiMjAyNC0wMS0wMiJ9Cg=="
      ddl: "CREATE EXTERNAL TABLE `${project}.${dataset}.t` (id INT64, v DATE) OPTIONS (format = 'JSON', uris = ['${prefix}/s.json'], date_format = 'MM/DD/YYYY', max_bad_records = 100)"
  - name: json_time_zone
    template: ddl
    vars:
      object: "s.json"
      source: "eyJpZCI6MSwidiI6IjIwMjQtMDEtMDIgMDM6MDQ6MDUifQp7ImlkIjoyLCJ2IjoiMjAyNC0wMS0wMlQwMzowNDowNVoifQo="
      ddl: "CREATE EXTERNAL TABLE `${project}.${dataset}.t` (id INT64, v TIMESTAMP) OPTIONS (format = 'JSON', uris = ['${prefix}/s.json'], time_zone = 'America/Los_Angeles', max_bad_records = 100)"
  # tables.insert with each field.
  - name: rest_formats
    template: rest
    vars:
      object: "s.csv"
      source: "MSwyMDI0LzAxLzAyLDIwMjQvMDEvMDIgMDM6MDQ6MDUsMDMuMDQuMDUsMjAyNC8wMS8wMiAwMzowNDowNQo="
      table: {"tableReference": {"projectId": "${project}", "datasetId": "${dataset}", "tableId": "t"}, "externalDataConfiguration": {"sourceFormat": "CSV", "sourceUris": ["${prefix}/s.csv"], "timeZone": "Asia/Tokyo", "dateFormat": "YYYY/MM/DD", "datetimeFormat": "YYYY/MM/DD HH24:MI:SS", "timeFormat": "HH24.MI.SS", "timestampFormat": "YYYY/MM/DD HH24:MI:SS", "schema": {"fields": [{"name": "id", "type": "INTEGER"}, {"name": "d", "type": "DATE"}, {"name": "dt", "type": "DATETIME"}, {"name": "t", "type": "TIME"}, {"name": "ts", "type": "TIMESTAMP"}]}}}
  # date_format on a Parquet table, to which the documentation does not apply it.
  - name: parquet_date_format
    template: ddl
    vars:
      object: "types.parquet"
      source: "${types}"
      ddl: "CREATE EXTERNAL TABLE `${project}.${dataset}.t` (d DATE) OPTIONS (format = 'PARQUET', uris = ['${prefix}/types.parquet'], date_format = 'MM/DD/YYYY')"
