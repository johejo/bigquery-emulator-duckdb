version: 1
description: >-
  Record what BigQuery does with primary keys where its documentation is silent: the messages of
  the statements it rejects, whether copies keep a primary key, the column types and spellings a
  primary key takes, and how tables.patch and tables.update treat tableConstraints.
  third_party/bigquery_docs/reference/standard-sql/data-definition-language.md
  third_party/bigquery_docs/reference/rest/v2/tables.md
vars:
  dataset: bqa_${run}_${case}
  table: t
  fixture: CREATE TABLE `${project}.${dataset}.t` (a INT64, b STRING, PRIMARY KEY (a) NOT ENFORCED)
templates:
  statement:
    steps:
      - name: create_dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: fixture
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            query: ${fixture}
            useLegacySql: false
            location: US
        observe:
          error: /body/error
      - name: statement
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            query: ${statement}
            useLegacySql: false
            location: US
        observe:
          error: /body/error
          errors: /body/errors
      - name: table
        rest:
          method: GET
          path: /bigquery/v2/projects/${project}/datasets/${dataset}/tables/${table}
        observe:
          tableConstraints: /body/tableConstraints
          error: /body/error
    cleanup:
      - name: delete_dataset
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
  rest_update:
    steps:
      - name: create_dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: insert
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets/${dataset}/tables
          body:
            tableReference: {projectId: '${project}', datasetId: '${dataset}', tableId: t}
            schema:
              fields:
                - {name: a, type: INTEGER}
                - {name: b, type: STRING}
            tableConstraints:
              primaryKey: {columns: [a]}
        observe:
          tableConstraints: /body/tableConstraints
          error: /body/error
      - name: update
        rest:
          method: ${method}
          path: /bigquery/v2/projects/${project}/datasets/${dataset}/tables/t
          body: ${update}
        observe:
          tableConstraints: /body/tableConstraints
          error: /body/error
      - name: table
        rest:
          method: GET
          path: /bigquery/v2/projects/${project}/datasets/${dataset}/tables/t
        observe:
          tableConstraints: /body/tableConstraints
    cleanup:
      - name: delete_dataset
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
cases:
  - name: enforced_primary_key
    template: statement
    vars:
      fixture: SELECT 1
      statement: CREATE TABLE `${project}.${dataset}.t` (a INT64, PRIMARY KEY (a))
  - name: enforced_added_primary_key
    template: statement
    vars:
      statement: ALTER TABLE `${project}.${dataset}.t` DROP PRIMARY KEY, ADD PRIMARY KEY (b)
  - name: second_primary_key
    template: statement
    vars:
      statement: ALTER TABLE `${project}.${dataset}.t` ADD PRIMARY KEY (b) NOT ENFORCED
  - name: drop_missing_primary_key
    template: statement
    vars:
      fixture: CREATE TABLE `${project}.${dataset}.t` (a INT64)
      statement: ALTER TABLE `${project}.${dataset}.t` DROP PRIMARY KEY
  - name: drop_primary_key_column
    template: statement
    vars:
      statement: ALTER TABLE `${project}.${dataset}.t` DROP COLUMN a
  - name: default_on_primary_key_column
    template: statement
    vars:
      statement: ALTER TABLE `${project}.${dataset}.t` ALTER COLUMN a SET DEFAULT 1
  - name: create_default_primary_key_column
    template: statement
    vars:
      fixture: SELECT 1
      statement: >-
        CREATE TABLE `${project}.${dataset}.t` (a INT64 DEFAULT 1, PRIMARY KEY (a) NOT ENFORCED)
  - name: missing_primary_key_column
    template: statement
    vars:
      fixture: SELECT 1
      statement: CREATE TABLE `${project}.${dataset}.t` (a INT64, PRIMARY KEY (c) NOT ENFORCED)
  - name: primary_key_column_case
    template: statement
    vars:
      fixture: SELECT 1
      statement: CREATE TABLE `${project}.${dataset}.t` (Ab INT64, PRIMARY KEY (aB) NOT ENFORCED)
  - name: added_primary_key_column_case
    template: statement
    vars:
      fixture: CREATE TABLE `${project}.${dataset}.t` (Ab INT64)
      statement: ALTER TABLE `${project}.${dataset}.t` ADD PRIMARY KEY (aB) NOT ENFORCED
  - name: array_primary_key
    template: statement
    vars:
      fixture: SELECT 1
      statement: >-
        CREATE TABLE `${project}.${dataset}.t` (a ARRAY<INT64>, PRIMARY KEY (a) NOT ENFORCED)
  - name: struct_primary_key
    template: statement
    vars:
      fixture: SELECT 1
      statement: >-
        CREATE TABLE `${project}.${dataset}.t` (a STRUCT<x INT64>, PRIMARY KEY (a) NOT ENFORCED)
  - name: float_primary_key
    template: statement
    vars:
      fixture: SELECT 1
      statement: CREATE TABLE `${project}.${dataset}.t` (a FLOAT64, PRIMARY KEY (a) NOT ENFORCED)
  - name: json_primary_key
    template: statement
    vars:
      fixture: SELECT 1
      statement: CREATE TABLE `${project}.${dataset}.t` (a JSON, PRIMARY KEY (a) NOT ENFORCED)
  - name: like_primary_key
    template: statement
    vars:
      table: l
      statement: CREATE TABLE `${project}.${dataset}.l` LIKE `${project}.${dataset}.t`
  - name: copy_primary_key
    template: statement
    vars:
      table: c
      statement: CREATE TABLE `${project}.${dataset}.c` COPY `${project}.${dataset}.t`
  - name: clone_primary_key
    template: statement
    vars:
      table: c
      statement: CREATE TABLE `${project}.${dataset}.c` CLONE `${project}.${dataset}.t`
  - name: snapshot_primary_key
    template: statement
    vars:
      table: s
      statement: CREATE SNAPSHOT TABLE `${project}.${dataset}.s` CLONE `${project}.${dataset}.t`
  - name: foreign_key_table_constraints
    template: statement
    vars:
      table: f
      statement: >-
        CREATE TABLE `${project}.${dataset}.f` (a INT64,
        FOREIGN KEY (a) REFERENCES `${project}.${dataset}.t` (a) NOT ENFORCED)
  - name: patch_without_table_constraints
    template: rest_update
    vars:
      method: PATCH
      update: {description: x}
  - name: patch_empty_table_constraints
    template: rest_update
    vars:
      method: PATCH
      update: {tableConstraints: {}}
  - name: patch_null_table_constraints
    template: rest_update
    vars:
      method: PATCH
      update: {tableConstraints: null}
  - name: patch_missing_primary_key_column
    template: rest_update
    vars:
      method: PATCH
      update: {tableConstraints: {primaryKey: {columns: [c]}}}
  - name: patch_empty_primary_key
    template: rest_update
    vars:
      method: PATCH
      update: {tableConstraints: {primaryKey: {columns: []}}}
  - name: update_without_table_constraints
    template: rest_update
    vars:
      method: PUT
      update:
        tableReference: {projectId: '${project}', datasetId: '${dataset}', tableId: t}
        schema:
          fields:
            - {name: a, type: INTEGER}
            - {name: b, type: STRING}
  - name: view_table_constraints
    steps:
      - name: create_dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: insert
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets/${dataset}/tables
          body:
            tableReference: {projectId: '${project}', datasetId: '${dataset}', tableId: v}
            view: {query: SELECT 1 AS a, useLegacySql: false}
            tableConstraints:
              primaryKey: {columns: [a]}
        observe:
          tableConstraints: /body/tableConstraints
          error: /body/error
    cleanup:
      - name: delete_dataset
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
  - name: copy_job_primary_key
    steps:
      - name: create_dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: fixture
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            query: ${fixture}
            useLegacySql: false
            location: US
        observe:
          error: /body/error
      - name: copy
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/jobs
          body:
            configuration:
              copy:
                sourceTable: {projectId: '${project}', datasetId: '${dataset}', tableId: t}
                destinationTable: {projectId: '${project}', datasetId: '${dataset}', tableId: c}
            jobReference: {projectId: '${project}', location: US}
        bind:
          job: /body/jobReference/jobId
        observe:
          error: /body/error
      - name: completed_copy
        rest:
          method: GET
          path: /bigquery/v2/projects/${project}/jobs/${job}?location=US
        until: {/body/status/state: DONE}
        observe:
          errorResult: /body/status/errorResult
      - name: table
        rest:
          method: GET
          path: /bigquery/v2/projects/${project}/datasets/${dataset}/tables/c
        observe:
          tableConstraints: /body/tableConstraints
    cleanup:
      - name: delete_dataset
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
