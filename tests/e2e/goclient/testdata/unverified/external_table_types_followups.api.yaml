version: 1
# Questions BigQuery's answers in external_table_csv_types, external_table_json_types,
# external_table_parquet_types and external_table_datetime_formats leave open: Parquet
# columns read as GEOGRAPHY, the tables.insert forms of the date and time options that DDL
# rejects, schema detection with dateFormat, and TIMESTAMP forms of JSON and with
# time_zone. types.parquet is that of external_table_parquet_types.api.yaml.
description: >-
  Follow-up questions about external table types and date/time options.
vars:
  dataset: bqa_${run}_${case}
  prefix: gs://${bucket}/${run}/${case}
  query: SELECT * FROM `${project}.${dataset}.t` ORDER BY 1
  types: ""
templates:
  # Creates `t` with the DDL statement `ddl` over the object `object`, whose contents are
  # `source`, and runs `query` on it.
  ddl:
    steps:
      - name: dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: source
        gcs: {method: PUT, object: '${run}/${case}/${object}', base64: '${source}'}
      - name: create
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: ${ddl}
        observe:
          status: /status
          errors: /body/errors
      - name: get
        rest:
          method: GET
          path: /bigquery/v2/projects/${project}/datasets/${dataset}/tables/t
        observe:
          external: /body/externalDataConfiguration
          schema: /body/schema
      - name: ddl
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: SELECT ddl FROM `${project}.${dataset}.INFORMATION_SCHEMA.TABLES` WHERE table_name = 't'
        observe:
          rows: /body/rows
      - name: options
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: SELECT option_name, option_type, option_value FROM `${project}.${dataset}.INFORMATION_SCHEMA.TABLE_OPTIONS` WHERE table_name = 't' ORDER BY option_name
        observe:
          rows: /body/rows
      - name: query
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: ${query}
        bind:
          job: /body/jobReference/jobId
        observe:
          status: /status
          jobComplete: /body/jobComplete
          schema: /body/schema
          rows: /body/rows
          errors: /body/errors
      - name: job
        rest:
          method: GET
          path: /bigquery/v2/projects/${project}/jobs/${job}?location=US
        observe:
          status: /body/status
    cleanup:
      - name: delete
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
      - name: delete_source
        gcs: {method: DELETE, object: '${run}/${case}/${object}'}
  # As ddl, creating `t` with tables.insert and the resource `table`.
  rest:
    steps:
      - name: dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: source
        gcs: {method: PUT, object: '${run}/${case}/${object}', base64: '${source}'}
      - name: create
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets/${dataset}/tables
          body: ${table}
        observe:
          status: /status
          external: /body/externalDataConfiguration
          schema: /body/schema
      - name: get
        rest:
          method: GET
          path: /bigquery/v2/projects/${project}/datasets/${dataset}/tables/t
        observe:
          external: /body/externalDataConfiguration
          schema: /body/schema
      - name: ddl
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: SELECT ddl FROM `${project}.${dataset}.INFORMATION_SCHEMA.TABLES` WHERE table_name = 't'
        observe:
          rows: /body/rows
      - name: options
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: SELECT option_name, option_type, option_value FROM `${project}.${dataset}.INFORMATION_SCHEMA.TABLE_OPTIONS` WHERE table_name = 't' ORDER BY option_name
        observe:
          rows: /body/rows
      - name: query
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: ${query}
        bind:
          job: /body/jobReference/jobId
        observe:
          status: /status
          jobComplete: /body/jobComplete
          schema: /body/schema
          rows: /body/rows
          errors: /body/errors
      - name: job
        rest:
          method: GET
          path: /bigquery/v2/projects/${project}/jobs/${job}?location=US
        observe:
          status: /body/status
    cleanup:
      - name: delete
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
      - name: delete_source
        gcs: {method: DELETE, object: '${run}/${case}/${object}'}
  # As ddl, where the query fails.
  ddl_failure:
    steps:
      - name: dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: source
        gcs: {method: PUT, object: '${run}/${case}/${object}', base64: '${source}'}
      - name: create
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: ${ddl}
        observe:
          status: /status
          errors: /body/errors
      - name: get
        rest:
          method: GET
          path: /bigquery/v2/projects/${project}/datasets/${dataset}/tables/t
        observe:
          external: /body/externalDataConfiguration
          schema: /body/schema
      - name: ddl
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: SELECT ddl FROM `${project}.${dataset}.INFORMATION_SCHEMA.TABLES` WHERE table_name = 't'
        observe:
          rows: /body/rows
      - name: options
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: SELECT option_name, option_type, option_value FROM `${project}.${dataset}.INFORMATION_SCHEMA.TABLE_OPTIONS` WHERE table_name = 't' ORDER BY option_name
        observe:
          rows: /body/rows
      - name: query
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: ${query}
        expectFailure: true
        observe:
          status: /status
          reason: /body/error/errors/0/reason
          message: /body/error/message
    cleanup:
      - name: delete
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
      - name: delete_source
        gcs: {method: DELETE, object: '${run}/${case}/${object}'}
  # As ddl, where the statement fails.
  create_failure:
    steps:
      - name: dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: source
        gcs: {method: PUT, object: '${run}/${case}/${object}', base64: '${source}'}
      - name: create
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: ${ddl}
        expectFailure: true
        observe:
          status: /status
          reason: /body/error/errors/0/reason
          message: /body/error/message
    cleanup:
      - name: delete
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
      - name: delete_source
        gcs: {method: DELETE, object: '${run}/${case}/${object}'}
cases:
  # A STRING column read as GEOGRAPHY.
  - name: s_wkt_as_geography
    template: ddl
    vars:
      object: "types.parquet"
      source: "${types}"
      query: "SELECT ST_ASTEXT(s_wkt) FROM `${project}.${dataset}.t`"
      ddl: "CREATE EXTERNAL TABLE `${project}.${dataset}.t` (s_wkt GEOGRAPHY) OPTIONS (format = 'PARQUET', uris = ['${prefix}/types.parquet'])"
  # A BYTE_ARRAY column of WKB read as GEOGRAPHY.
  - name: b_wkb_as_geography
    template: ddl
    vars:
      object: "types.parquet"
      source: "${types}"
      query: "SELECT ST_ASTEXT(b_wkb) FROM `${project}.${dataset}.t`"
      ddl: "CREATE EXTERNAL TABLE `${project}.${dataset}.t` (b_wkb GEOGRAPHY) OPTIONS (format = 'PARQUET', uris = ['${prefix}/types.parquet'])"
  # Whether CSV schema detection takes dateFormat: source "d\n01/02/2024\n".
  - name: rest_autodetect_date_format
    template: rest
    vars:
      object: "s.csv"
      source: "ZAowMS8wMi8yMDI0Cg=="
      table: {"tableReference": {"projectId": "${project}", "datasetId": "${dataset}", "tableId": "t"}, "externalDataConfiguration": {"sourceUris": ["${prefix}/${object}"], "sourceFormat": "CSV", "autodetect": true, "dateFormat": "MM/DD/YYYY"}}
  # tables.insert with a C-style dateFormat, which DDL rejects.
  - name: rest_c_date_format
    template: rest
    vars:
      object: "s.csv"
      source: "MSwwMS8wMi8yMDI0Cg=="
      table: {"tableReference": {"projectId": "${project}", "datasetId": "${dataset}", "tableId": "t"}, "externalDataConfiguration": {"sourceUris": ["${prefix}/${object}"], "sourceFormat": "CSV", "dateFormat": "%m/%d/%Y", "schema": {"fields": [{"name": "id", "type": "INTEGER"}, {"name": "v", "type": "DATE"}]}}}
  # tables.insert with a timeZone that DDL rejects.
  - name: rest_offset_time_zone
    template: rest
    vars:
      object: "s.csv"
      source: "MSwyMDI0LTAxLTAyCg=="
      table: {"tableReference": {"projectId": "${project}", "datasetId": "${dataset}", "tableId": "t"}, "externalDataConfiguration": {"sourceUris": ["${prefix}/${object}"], "sourceFormat": "CSV", "timeZone": "+09:00", "schema": {"fields": [{"name": "id", "type": "INTEGER"}, {"name": "v", "type": "DATE"}]}}}
  # tables.insert of a Parquet table with dateFormat, which DDL rejects.
  - name: rest_parquet_date_format
    template: rest
    vars:
      object: "types.parquet"
      source: "${types}"
      table: {"tableReference": {"projectId": "${project}", "datasetId": "${dataset}", "tableId": "t"}, "externalDataConfiguration": {"sourceUris": ["${prefix}/${object}"], "sourceFormat": "PARQUET", "dateFormat": "MM/DD/YYYY"}}
  # The TIMESTAMP strings of a JSON table without time_zone: {"id": N, "v": VALUE} with 2024-01-02
  #   03:04:05, 2024-01-02T03:04:05+09:00, 2024/01/02 03:04, 2024-01-02 03:04:05 UTC and 2024-01-02.
  - name: json_timestamp_forms
    template: ddl
    vars:
      object: "s.json"
      source: "eyJpZCI6IDEsICJ2IjogIjIwMjQtMDEtMDIgMDM6MDQ6MDUifQp7ImlkIjogMiwgInYiOiAiMjAyNC0wMS0wMlQwMzowNDowNSswOTowMCJ9CnsiaWQiOiAzLCAidiI6ICIyMDI0LzAxLzAyIDAzOjA0In0KeyJpZCI6IDQsICJ2IjogIjIwMjQtMDEtMDIgMDM6MDQ6MDUgVVRDIn0KeyJpZCI6IDUsICJ2IjogIjIwMjQtMDEtMDIifQo="
      ddl: "CREATE EXTERNAL TABLE `${project}.${dataset}.t` (id INT64, v TIMESTAMP) OPTIONS (format = 'JSON', uris = ['${prefix}/s.json'], max_bad_records = 100)"
  # Unix epoch TIMESTAMP values of a CSV table with time_zone: 1534680695 and 1.534680695e12.
  - name: csv_timestamp_epoch_time_zone
    template: ddl
    vars:
      object: "s.csv"
      source: "MSwxNTM0NjgwNjk1CjIsMS41MzQ2ODA2OTVlMTIK"
      ddl: "CREATE EXTERNAL TABLE `${project}.${dataset}.t` (id INT64, v TIMESTAMP) OPTIONS (format = 'CSV', uris = ['${prefix}/s.csv'], time_zone = 'Asia/Tokyo', max_bad_records = 100)"
