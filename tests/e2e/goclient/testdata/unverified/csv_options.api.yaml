version: 1
# Follow-ups to tests/e2e/scenarios/testdata/csv_options.api.yaml, which BigQuery's answers there
# leave open: which control characters other than \x01 a load turns into spaces, whether an empty
# value of a non-STRING column fails under nullMarkers as under nullMarker, how INFORMATION_SCHEMA
# shows a quote other than the default and orders several CSV options, and whether TABLE_OPTIONS
# lists skip_leading_rows 0, which the DDL leaves out.
description: >-
  CSV control characters, nullMarkers with empty non-STRING values, and INFORMATION_SCHEMA of CSV
  external tables with a single quote, combined options and skip_leading_rows 0.
vars:
  dataset: bqa_${run}_${case}
  destination: {projectId: '${project}', datasetId: '${dataset}', tableId: destination}
  schema:
    fields:
      - {name: id, type: INTEGER}
      - {name: s, type: STRING}
  prefix: gs://${bucket}/${run}/${case}
  # "1,a\n"
  external_csv: MSxhCg==
templates:
  load:
    steps:
      - name: create_dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: load
        rest:
          method: POST
          path: /upload/bigquery/v2/projects/${project}/jobs?uploadType=multipart
          body:
            jobReference: {projectId: '${project}', location: US}
            configuration: '${load_configuration}'
          uploadBase64: '${csv}'
        bind: {job: /body/jobReference/jobId}
      - name: completed_load
        rest:
          method: GET
          path: /bigquery/v2/projects/${project}/jobs/${job}?location=US
        until: {/body/status/state: DONE}
        observe: {status: /body/status}
      - name: read
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            query: SELECT id, TO_HEX(CAST(s AS BYTES)) AS s FROM `${project}.${dataset}.destination` ORDER BY id
            useLegacySql: false
            location: US
            timeoutMs: 200000
        observe: {errors: /body/errors, rows: /body/rows}
    cleanup:
      - name: delete_dataset
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
  external:
    steps:
      - name: dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: source
        gcs: {method: PUT, object: '${run}/${case}/a.csv', base64: '${external_csv}'}
      - name: create
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: ${ddl}
        observe:
          status: /status
          errors: /body/errors
      - name: get
        rest:
          method: GET
          path: /bigquery/v2/projects/${project}/datasets/${dataset}/tables/t
        observe:
          external: /body/externalDataConfiguration
      - name: options
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: SELECT option_name, option_type, option_value FROM `${project}.${dataset}.INFORMATION_SCHEMA.TABLE_OPTIONS` WHERE table_name = 't' ORDER BY option_name
        observe:
          errors: /body/errors
          rows: /body/rows
      - name: information_schema
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: SELECT ddl FROM `${project}.${dataset}.INFORMATION_SCHEMA.TABLES` WHERE table_name = 't'
        observe:
          errors: /body/errors
          rows: /body/rows
    cleanup:
      - name: delete
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
      - name: delete_source
        gcs: {method: DELETE, object: '${run}/${case}/a.csv'}
cases:
  # "1,a\x0bb\n2,a\x1fb\n3,a\x7fb\n4,\"a\tb\"\n"
  - name: control_characters
    template: load
    vars:
      load_configuration: {load: {destinationTable: '${destination}', sourceFormat: CSV, schema: '${schema}'}}
      csv: MSxhC2IKMixhH2IKMyxhf2IKNCwiYQliIgo=
  # ",a\n"
  - name: null_markers_empty_integer
    template: load
    vars:
      load_configuration: {load: {destinationTable: '${destination}', sourceFormat: CSV, schema: '${schema}', nullMarkers: [NA]}}
      csv: LGEK
  - name: external_single_quote
    template: external
    vars:
      ddl: CREATE EXTERNAL TABLE `${project}.${dataset}.t` (id INT64, s STRING) OPTIONS (format = 'CSV', uris = ['${prefix}/a.csv'], quote = "'")
  - name: external_combined
    template: external
    vars:
      ddl: >-
        CREATE EXTERNAL TABLE `${project}.${dataset}.t` (id INT64, s STRING) OPTIONS (format = 'CSV',
        uris = ['${prefix}/a.csv'], ignore_unknown_values = true, skip_leading_rows = 1,
        null_marker = 'NA', field_delimiter = ',', allow_jagged_rows = true)
  - name: external_skip_zero
    template: external
    vars:
      ddl: CREATE EXTERNAL TABLE `${project}.${dataset}.t` (id INT64, s STRING) OPTIONS (format = 'CSV', uris = ['${prefix}/a.csv'], skip_leading_rows = 0)
