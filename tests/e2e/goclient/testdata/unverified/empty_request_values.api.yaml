version: 1
# The emulator reads checked request resources as protocol buffers, which cannot tell an empty
# string or a *_UNSPECIFIED enum from a field left out: an empty ID is reported missing, and an
# explicit UNSPECIFIED language, argument kind or argument mode, or an empty disposition, is read
# as omitted. These cases record whether BigQuery does the same.
description: >-
  Empty IDs, explicit UNSPECIFIED enum values and empty dispositions in datasets.insert,
  tables.insert, routines.insert and jobs.insert.
vars:
  dataset: bqa_${run}_${case}
templates:
  routine:
    steps:
      - name: create_dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: insert
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets/${dataset}/routines
          body: ${routine}
        observe:
          status: /status
          language: /body/language
          arguments: /body/arguments
      - name: get
        rest:
          method: GET
          path: /bigquery/v2/projects/${project}/datasets/${dataset}/routines/f
        observe:
          language: /body/language
          arguments: /body/arguments
    cleanup:
      - name: delete_dataset
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
cases:
  - name: dataset_empty_id
    steps:
      - name: insert
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {projectId: '${project}', datasetId: ''}
            location: US
        observe:
          status: /status
  - name: table_empty_id
    steps:
      - name: create_dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: insert
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets/${dataset}/tables
          body:
            tableReference: {projectId: '${project}', datasetId: '${dataset}', tableId: ''}
            schema:
              fields: [{name: x, type: INT64}]
        observe:
          status: /status
    cleanup:
      - name: delete_dataset
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
  - name: routine_empty_id
    steps:
      - name: create_dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: insert
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets/${dataset}/routines
          body:
            routineReference: {projectId: '${project}', datasetId: '${dataset}', routineId: ''}
            routineType: SCALAR_FUNCTION
            definitionBody: '1'
        observe:
          status: /status
    cleanup:
      - name: delete_dataset
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
  - name: routine_language_unspecified
    template: routine
    vars:
      routine:
        routineReference: {projectId: '${project}', datasetId: '${dataset}', routineId: f}
        routineType: SCALAR_FUNCTION
        language: LANGUAGE_UNSPECIFIED
        arguments: [{name: x, dataType: {typeKind: INT64}}]
        definitionBody: x * 2
  - name: function_argument_mode_unspecified
    template: routine
    vars:
      routine:
        routineReference: {projectId: '${project}', datasetId: '${dataset}', routineId: f}
        routineType: SCALAR_FUNCTION
        language: SQL
        arguments: [{name: x, dataType: {typeKind: INT64}, mode: MODE_UNSPECIFIED}]
        definitionBody: x * 2
  - name: function_argument_kind_unspecified
    template: routine
    vars:
      routine:
        routineReference: {projectId: '${project}', datasetId: '${dataset}', routineId: f}
        routineType: SCALAR_FUNCTION
        language: SQL
        arguments:
          - {name: x, argumentKind: ARGUMENT_KIND_UNSPECIFIED, dataType: {typeKind: INT64}}
        definitionBody: x * 2
  # A query job's writeDisposition defaults to WRITE_EMPTY, so the second job fails if BigQuery
  # reads the empty one as omitted.
  - name: query_job_empty_dispositions
    steps:
      - name: create_dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: first
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/jobs
          body:
            jobReference: {location: US}
            configuration:
              query:
                query: SELECT 1 AS x
                useLegacySql: false
                destinationTable: {projectId: '${project}', datasetId: '${dataset}', tableId: t}
                createDisposition: ''
                writeDisposition: ''
        bind:
          first_job: /body/jobReference/jobId
      - name: first_done
        rest:
          method: GET
          path: /bigquery/v2/projects/${project}/jobs/${first_job}?location=US
        until: {/body/status/state: DONE}
        observe:
          errorResult: /body/status/errorResult
      - name: second
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/jobs
          body:
            jobReference: {location: US}
            configuration:
              query:
                query: SELECT 2 AS x
                useLegacySql: false
                destinationTable: {projectId: '${project}', datasetId: '${dataset}', tableId: t}
                createDisposition: ''
                writeDisposition: ''
        bind:
          second_job: /body/jobReference/jobId
      - name: second_done
        rest:
          method: GET
          path: /bigquery/v2/projects/${project}/jobs/${second_job}?location=US
        until: {/body/status/state: DONE}
        observe:
          errorResult: /body/status/errorResult
      - name: rows
        rest:
          method: GET
          path: /bigquery/v2/projects/${project}/datasets/${dataset}/tables/t/data
        observe:
          rows: /body/rows
    cleanup:
      - name: delete_dataset
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
