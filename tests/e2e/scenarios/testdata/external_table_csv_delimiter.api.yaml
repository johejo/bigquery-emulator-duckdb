version: 1
# The CSV load guide specifies one byte as the delimiter and replacement of undecodable data.
# The CSV options in reference/rest/v2/tables.md specify that a UTF-8 delimiter leaves its
# remaining bytes in the field and that an ISO-8859-1 character is a single-byte separator.
description: CSV external tables split at a single byte before decoding fields.
vars:
  dataset: bqa_${run}_${case}
  prefix: gs://${bucket}/${run}/${case}
  # "idas\n7a\"cab\"\n": the quoted 'a' is data, and the separator is 'a', not 'ab'.
  contents: aWRhcwo3YSJjYWIiCg==
  options: "skip_leading_rows = 1, field_delimiter = 'ab'"
templates:
  ddl:
    steps:
      - name: dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: source
        gcs: {method: PUT, object: '${run}/${case}/a.csv', base64: '${contents}'}
      - name: create
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: >-
              CREATE EXTERNAL TABLE `${project}.${dataset}.t` ${schema}
              OPTIONS (format = 'CSV', uris = ['${prefix}/a.csv'], ${options})
        observe: {status: /status, errors: /body/errors}
      - name: read
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: SELECT id, s FROM `${project}.${dataset}.t`
        observe: {status: /status, errors: /body/errors, rows: /body/rows}
    cleanup:
      - name: delete_dataset
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
      - name: delete_source
        gcs: {method: DELETE, object: '${run}/${case}/a.csv'}
cases:
  - name: explicit_schema
    template: ddl
    vars:
      schema: (id INT64, s STRING)
    expect:
      create: {status: 200}
      read: {status: 200, rows: [{f: [{v: '7'}, {v: cab}]}]}
  - name: detected_schema
    template: ddl
    vars:
      schema: ''
    expect:
      create: {status: 200}
      read: {status: 200, rows: [{f: [{v: '7'}, {v: cab}]}]}
  - name: iso_8859_1
    template: ddl
    vars:
      schema: ''
      # "idés\n7é\"café ü\"\n" in ISO-8859-1. The quoted separator is data.
      contents: aWTpcwo36SJjYWbpIPwiCg==
      options: "skip_leading_rows = 1, field_delimiter = 'é', encoding = 'ISO-8859-1'"
    expect:
      create: {status: 200}
      read: {status: 200, rows: [{f: [{v: '7'}, {v: 'café ü'}]}]}
  - name: utf8_first_byte
    template: ddl
    vars:
      schema: (id INT64, s STRING)
      # "7éplain\n" in UTF-8. Splitting at C3 leaves A9 at the start of the second field.
      contents: N8OpcGxhaW4K
      options: "field_delimiter = 'é', encoding = 'UTF-8'"
    expect:
      create: {status: 200}
      read: {status: 200, rows: [{f: [{v: '7'}, {v: '�plain'}]}]}
