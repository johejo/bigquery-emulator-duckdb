version: 1
# Recorded on BigQuery in project johejo-sandbox, run lopxclghzg3xdg56lp7l5s7bhc, with sources in
# the bucket johejo-sandbox-us; the answers sidecar keeps the observations. Messages that name a
# Cloud Storage path give it as /bigstore/BUCKET/OBJECT.
# Hive-partitioned external tables. third_party/bigquery_docs/hive-partitioned-queries.md
# describes the layout, the AUTO, STRINGS and CUSTOM detection modes and the required partition
# filter, and third_party/bigquery_docs/reference/standard-sql/data-definition-language.md the
# WITH PARTITION COLUMNS clause; these cases settle detected types and order, the metadata
# tables.get and INFORMATION_SCHEMA report, the values queries read and the layouts BigQuery
# rejects. Unless a case says otherwise, sources are JSON files {"x":1} (first) and {"x":2}
# (second) at the object paths `p1` and `p2` under the prefix, read with an explicit schema.
description: >-
  Hive partitioning of external tables created by DDL and tables.insert, with sources in a Cloud
  Storage bucket.
vars:
  dataset: bqa_${run}_${case}
  prefix: gs://${bucket}/${run}/${case}
  first: 'eyJ4IjoxfQo='
  second: 'eyJ4IjoyfQo='
  columns: '(x INT64)'
  partition: WITH PARTITION COLUMNS
  format: JSON
  options: ''
  uris: "['${prefix}/*']"
  ddl: CREATE EXTERNAL TABLE `${project}.${dataset}.t` ${columns} ${partition} OPTIONS (format = '${format}', uris = ${uris}, hive_partition_uri_prefix = '${prefix}'${options})
  query: SELECT TO_JSON_STRING(t) AS row, _FILE_NAME AS file FROM `${project}.${dataset}.t` AS t ORDER BY file
  table_schema: {fields: [{name: x, type: INTEGER}]}
templates:
  # Creates the table with `ddl` from `first` at `p1` and `second` at `p2`, then reads it.
  ddl:
    steps:
      - name: dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: a
        gcs: {method: PUT, object: '${run}/${case}/${p1}', base64: '${first}'}
      - name: b
        gcs: {method: PUT, object: '${run}/${case}/${p2}', base64: '${second}'}
      - name: create
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: ${ddl}
        observe:
          status: /status
          errors: /body/errors
          message: /body/error/message
      - name: get
        rest:
          method: GET
          path: /bigquery/v2/projects/${project}/datasets/${dataset}/tables/t
        observe:
          status: /status
          schema: /body/schema
          external: /body/externalDataConfiguration
      - name: information_schema
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: SELECT ddl FROM `${project}.${dataset}.INFORMATION_SCHEMA.TABLES` WHERE table_name = 't'
        observe:
          errors: /body/errors
          rows: /body/rows
      - name: query
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: ${query}
        observe:
          status: /status
          errors: /body/errors
          message: /body/error/message
          schema: /body/schema
          rows: /body/rows
    cleanup:
      - name: delete
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
      - name: delete_a
        gcs: {method: DELETE, object: '${run}/${case}/${p1}'}
      - name: delete_b
        gcs: {method: DELETE, object: '${run}/${case}/${p2}'}
  # As ddl, with require_hive_partition_filter, and queries with and without eligible filters.
  require:
    steps:
      - name: dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: a
        gcs: {method: PUT, object: '${run}/${case}/${p1}', base64: '${first}'}
      - name: b
        gcs: {method: PUT, object: '${run}/${case}/${p2}', base64: '${second}'}
      - name: create
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: ${ddl}
        observe:
          status: /status
          errors: /body/errors
      - name: get
        rest:
          method: GET
          path: /bigquery/v2/projects/${project}/datasets/${dataset}/tables/t
        observe:
          status: /status
          requirePartitionFilter: /body/requirePartitionFilter
          external: /body/externalDataConfiguration
      - name: table_options
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: SELECT option_name, option_type, option_value FROM `${project}.${dataset}.INFORMATION_SCHEMA.TABLE_OPTIONS` WHERE table_name = 't' ORDER BY option_name
        observe:
          errors: /body/errors
          rows: /body/rows
      - name: information_schema
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: SELECT ddl FROM `${project}.${dataset}.INFORMATION_SCHEMA.TABLES` WHERE table_name = 't'
        observe:
          errors: /body/errors
          rows: /body/rows
      - name: no_filter
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: SELECT x FROM `${project}.${dataset}.t` ORDER BY x
        expectFailure: true
        observe:
          status: /status
          reason: /body/error/errors/0/reason
          message: /body/error/message
      - name: key_filter
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: SELECT x, k FROM `${project}.${dataset}.t` WHERE k = 1 ORDER BY x
        observe:
          status: /status
          errors: /body/errors
          rows: /body/rows
      - name: key_and_column_filter
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: SELECT x FROM `${project}.${dataset}.t` WHERE k > 0 AND x = 2 ORDER BY x
        observe:
          status: /status
          errors: /body/errors
          rows: /body/rows
      - name: key_or_column_filter
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: SELECT x FROM `${project}.${dataset}.t` WHERE k = 1 OR x = 2 ORDER BY x
        expectFailure: true
        observe:
          status: /status
          reason: /body/error/errors/0/reason
          message: /body/error/message
      - name: column_filter
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: SELECT x FROM `${project}.${dataset}.t` WHERE x = 2
        expectFailure: true
        observe:
          status: /status
          reason: /body/error/errors/0/reason
          message: /body/error/message
      - name: key_function_filter
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: SELECT x FROM `${project}.${dataset}.t` WHERE k + 1 = 2 ORDER BY x
        observe:
          status: /status
          errors: /body/errors
          message: /body/error/message
          rows: /body/rows
      - name: key_is_not_null
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: SELECT x FROM `${project}.${dataset}.t` WHERE k IS NOT NULL ORDER BY x
        observe:
          status: /status
          errors: /body/errors
          message: /body/error/message
          rows: /body/rows
    cleanup:
      - name: delete
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
      - name: delete_a
        gcs: {method: DELETE, object: '${run}/${case}/${p1}'}
      - name: delete_b
        gcs: {method: DELETE, object: '${run}/${case}/${p2}'}
  # Creates the table with tables.insert, `table_schema` and `configuration`, then reads it.
  api:
    steps:
      - name: dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: a
        gcs: {method: PUT, object: '${run}/${case}/${p1}', base64: '${first}'}
      - name: b
        gcs: {method: PUT, object: '${run}/${case}/${p2}', base64: '${second}'}
      - name: create
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets/${dataset}/tables
          body:
            tableReference: {tableId: t}
            schema: ${table_schema}
            externalDataConfiguration: ${configuration}
        observe:
          status: /status
          message: /body/error/message
          schema: /body/schema
          external: /body/externalDataConfiguration
      - name: get
        rest:
          method: GET
          path: /bigquery/v2/projects/${project}/datasets/${dataset}/tables/t
        observe:
          status: /status
          schema: /body/schema
          external: /body/externalDataConfiguration
      - name: list
        rest:
          method: GET
          path: /bigquery/v2/projects/${project}/datasets/${dataset}/tables
        observe:
          tables: /body/tables/0/externalDataConfiguration
      - name: information_schema
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: SELECT ddl FROM `${project}.${dataset}.INFORMATION_SCHEMA.TABLES` WHERE table_name = 't'
        observe:
          errors: /body/errors
          rows: /body/rows
      - name: query
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: ${query}
        observe:
          status: /status
          errors: /body/errors
          message: /body/error/message
          schema: /body/schema
          rows: /body/rows
    cleanup:
      - name: delete
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
      - name: delete_a
        gcs: {method: DELETE, object: '${run}/${case}/${p1}'}
      - name: delete_b
        gcs: {method: DELETE, object: '${run}/${case}/${p2}'}
  # As ddl, for a table BigQuery does not create.
  ddl_rejected:
    steps:
      - name: dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: a
        gcs: {method: PUT, object: '${run}/${case}/${p1}', base64: '${first}'}
      - name: b
        gcs: {method: PUT, object: '${run}/${case}/${p2}', base64: '${second}'}
      - name: create
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: ${ddl}
        expectFailure: true
        observe:
          status: /status
          reason: /body/error/errors/0/reason
          message: /body/error/message
    cleanup:
      - name: delete
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
      - name: delete_a
        gcs: {method: DELETE, object: '${run}/${case}/${p1}'}
      - name: delete_b
        gcs: {method: DELETE, object: '${run}/${case}/${p2}'}
  # As ddl, for sources a query cannot read.
  ddl_unreadable:
    steps:
      - name: dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: a
        gcs: {method: PUT, object: '${run}/${case}/${p1}', base64: '${first}'}
      - name: b
        gcs: {method: PUT, object: '${run}/${case}/${p2}', base64: '${second}'}
      - name: create
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: ${ddl}
        observe:
          status: /status
          errors: /body/errors
          message: /body/error/message
      - name: get
        rest:
          method: GET
          path: /bigquery/v2/projects/${project}/datasets/${dataset}/tables/t
        observe:
          status: /status
          schema: /body/schema
          external: /body/externalDataConfiguration
      - name: information_schema
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: SELECT ddl FROM `${project}.${dataset}.INFORMATION_SCHEMA.TABLES` WHERE table_name = 't'
        observe:
          errors: /body/errors
          rows: /body/rows
      - name: query
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: ${query}
        expectFailure: true
        observe:
          status: /status
          reason: /body/error/errors/0/reason
          message: /body/error/message
    cleanup:
      - name: delete
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
      - name: delete_a
        gcs: {method: DELETE, object: '${run}/${case}/${p1}'}
      - name: delete_b
        gcs: {method: DELETE, object: '${run}/${case}/${p2}'}
  # As ddl_rejected, observing only the status and reason of an error whose location the
  # project's name shifts.
  ddl_rejected_located:
    steps:
      - name: dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: a
        gcs: {method: PUT, object: '${run}/${case}/${p1}', base64: '${first}'}
      - name: b
        gcs: {method: PUT, object: '${run}/${case}/${p2}', base64: '${second}'}
      - name: create
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: ${ddl}
        expectFailure: true
        observe:
          status: /status
          reason: /body/error/errors/0/reason
    cleanup:
      - name: delete
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
      - name: delete_a
        gcs: {method: DELETE, object: '${run}/${case}/${p1}'}
      - name: delete_b
        gcs: {method: DELETE, object: '${run}/${case}/${p2}'}
  # As api, for a table BigQuery does not create.
  api_rejected:
    steps:
      - name: dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: a
        gcs: {method: PUT, object: '${run}/${case}/${p1}', base64: '${first}'}
      - name: b
        gcs: {method: PUT, object: '${run}/${case}/${p2}', base64: '${second}'}
      - name: create
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets/${dataset}/tables
          body:
            tableReference: {tableId: t}
            schema: ${table_schema}
            externalDataConfiguration: ${configuration}
        expectFailure: true
        observe:
          status: /status
          reason: /body/error/errors/0/reason
          message: /body/error/message
    cleanup:
      - name: delete
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
      - name: delete_a
        gcs: {method: DELETE, object: '${run}/${case}/${p1}'}
      - name: delete_b
        gcs: {method: DELETE, object: '${run}/${case}/${p2}'}
cases:
  # AUTO detection of the documented types: STRING, INTEGER, DATE and TIMESTAMP.
  - name: auto_types
    template: ddl
    vars:
      p1: "d=2024-01-02/n=1/s=a/ts=2024-01-02 03:04:05+00/a.json"
      p2: "d=2024-01-03/n=2/s=b/ts=2024-01-03 03:04:05+00/b.json"
    expect: {"create": {"status": 200}, "get": {"external": {"hivePartitioningOptions": {"fields": ["d", "n", "s", "ts"], "mode": "AUTO", "sourceUriPrefix": "${prefix}"}, "sourceFormat": "NEWLINE_DELIMITED_JSON", "sourceUris": ["${prefix}/*"]}, "schema": {"fields": [{"mode": "NULLABLE", "name": "x", "type": "INTEGER"}, {"mode": "NULLABLE", "name": "d", "type": "DATE"}, {"mode": "NULLABLE", "name": "n", "type": "INTEGER"}, {"mode": "NULLABLE", "name": "s", "type": "STRING"}, {"mode": "NULLABLE", "name": "ts", "type": "TIMESTAMP"}]}, "status": 200}, "information_schema": {"rows": [{"f": [{"v": "CREATE EXTERNAL TABLE `${project}.${dataset}.t`\n(\n  x INT64,\n  d DATE,\n  n INT64,\n  s STRING,\n  ts TIMESTAMP\n)\nWITH PARTITION COLUMNS\nOPTIONS(\n  format=\"NEWLINE_DELIMITED_JSON\",\n  hive_partition_uri_prefix=\"${prefix}\",\n  uris=[\"${prefix}/*\"]\n);"}]}]}, "query": {"rows": [{"f": [{"v": "{\"x\":1,\"d\":\"2024-01-02\",\"n\":1,\"s\":\"a\",\"ts\":\"2024-01-02T03:04:05Z\"}"}, {"v": "${prefix}/d=2024-01-02/n=1/s=a/ts=2024-01-02 03:04:05+00/a.json"}]}, {"f": [{"v": "{\"x\":2,\"d\":\"2024-01-03\",\"n\":2,\"s\":\"b\",\"ts\":\"2024-01-03T03:04:05Z\"}"}, {"v": "${prefix}/d=2024-01-03/n=2/s=b/ts=2024-01-03 03:04:05+00/b.json"}]}], "schema": {"fields": [{"mode": "NULLABLE", "name": "row", "type": "STRING"}, {"mode": "NULLABLE", "name": "file", "type": "STRING"}]}, "status": 200}}
  # Values of types AUTO does not list, signs and leading zeros.
  - name: auto_other_values
    template: ddl
    vars:
      p1: "f=1.5/b=true/neg=-1/z=01/dt=2024-01-02T03:04:05/a.json"
      p2: "f=2.5/b=false/neg=-2/z=02/dt=2024-01-03T03:04:05/b.json"
    expect: {"create": {"status": 200}, "get": {"external": {"hivePartitioningOptions": {"fields": ["f", "b", "neg", "z", "dt"], "mode": "AUTO", "sourceUriPrefix": "${prefix}"}, "sourceFormat": "NEWLINE_DELIMITED_JSON", "sourceUris": ["${prefix}/*"]}, "schema": {"fields": [{"mode": "NULLABLE", "name": "x", "type": "INTEGER"}, {"mode": "NULLABLE", "name": "f", "type": "STRING"}, {"mode": "NULLABLE", "name": "b", "type": "STRING"}, {"mode": "NULLABLE", "name": "neg", "type": "INTEGER"}, {"mode": "NULLABLE", "name": "z", "type": "INTEGER"}, {"mode": "NULLABLE", "name": "dt", "type": "TIMESTAMP"}]}, "status": 200}, "information_schema": {"rows": [{"f": [{"v": "CREATE EXTERNAL TABLE `${project}.${dataset}.t`\n(\n  x INT64,\n  f STRING,\n  b STRING,\n  neg INT64,\n  z INT64,\n  dt TIMESTAMP\n)\nWITH PARTITION COLUMNS\nOPTIONS(\n  format=\"NEWLINE_DELIMITED_JSON\",\n  hive_partition_uri_prefix=\"${prefix}\",\n  uris=[\"${prefix}/*\"]\n);"}]}]}, "query": {"rows": [{"f": [{"v": "{\"x\":1,\"f\":\"1.5\",\"b\":\"true\",\"neg\":-1,\"z\":1,\"dt\":\"2024-01-02T03:04:05Z\"}"}, {"v": "${prefix}/f=1.5/b=true/neg=-1/z=01/dt=2024-01-02T03:04:05/a.json"}]}, {"f": [{"v": "{\"x\":2,\"f\":\"2.5\",\"b\":\"false\",\"neg\":-2,\"z\":2,\"dt\":\"2024-01-03T03:04:05Z\"}"}, {"v": "${prefix}/f=2.5/b=false/neg=-2/z=02/dt=2024-01-03T03:04:05/b.json"}]}], "schema": {"fields": [{"mode": "NULLABLE", "name": "row", "type": "STRING"}, {"mode": "NULLABLE", "name": "file", "type": "STRING"}]}, "status": 200}}
  # Timestamps without an offset and with Z.
  - name: auto_timestamp_forms
    template: ddl
    vars:
      p1: "plain=2024-01-02 03:04:05/z=2024-01-02T03:04:05Z/a.json"
      p2: "plain=2024-01-03 03:04:05/z=2024-01-03T03:04:05Z/b.json"
    expect: {"create": {"status": 200}, "get": {"external": {"hivePartitioningOptions": {"fields": ["plain", "z"], "mode": "AUTO", "sourceUriPrefix": "${prefix}"}, "sourceFormat": "NEWLINE_DELIMITED_JSON", "sourceUris": ["${prefix}/*"]}, "schema": {"fields": [{"mode": "NULLABLE", "name": "x", "type": "INTEGER"}, {"mode": "NULLABLE", "name": "plain", "type": "TIMESTAMP"}, {"mode": "NULLABLE", "name": "z", "type": "TIMESTAMP"}]}, "status": 200}, "information_schema": {"rows": [{"f": [{"v": "CREATE EXTERNAL TABLE `${project}.${dataset}.t`\n(\n  x INT64,\n  plain TIMESTAMP,\n  z TIMESTAMP\n)\nWITH PARTITION COLUMNS\nOPTIONS(\n  format=\"NEWLINE_DELIMITED_JSON\",\n  hive_partition_uri_prefix=\"${prefix}\",\n  uris=[\"${prefix}/*\"]\n);"}]}]}, "query": {"rows": [{"f": [{"v": "{\"x\":1,\"plain\":\"2024-01-02T03:04:05Z\",\"z\":\"2024-01-02T03:04:05Z\"}"}, {"v": "${prefix}/plain=2024-01-02 03:04:05/z=2024-01-02T03:04:05Z/a.json"}]}, {"f": [{"v": "{\"x\":2,\"plain\":\"2024-01-03T03:04:05Z\",\"z\":\"2024-01-03T03:04:05Z\"}"}, {"v": "${prefix}/plain=2024-01-03 03:04:05/z=2024-01-03T03:04:05Z/b.json"}]}], "schema": {"fields": [{"mode": "NULLABLE", "name": "row", "type": "STRING"}, {"mode": "NULLABLE", "name": "file", "type": "STRING"}]}, "status": 200}}
  # An INTEGER-looking value and a STRING value of one key.
  - name: auto_merge_integer_string
    template: ddl
    vars:
      p1: "k=1/a.json"
      p2: "k=x/b.json"
