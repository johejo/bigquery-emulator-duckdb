                "name": "id",
                "type": "INTEGER"
              },
              {
                "name": "v",
                "type": "DATETIME"
              }
            ]
          }
        },
        "job": {
          "status": {
            "errors": [
              {
                "location": "query",
                "message": "Invalid datetime string \"2024-01-02 03:04\" Field: v; Value: 2024-01-02 03:04",
                "reason": "invalidQuery"
              },
              {
                "location": "gs://${bucket}/${run}/datetime_spellings/s.json",
                "message": "Error while reading table: ${project}.bqa_${run}_datetime_spellings.t, error message: JSON parsing error in row starting at position 135: Could not convert non-string JSON value to DATETIME type. Field: v; Value: 1 File: gs://${bucket}/${run}/datetime_spellings/s.json",
                "reason": "invalid"
              },
              {
                "location": "query",
                "message": "Invalid datetime string \"2024-01-02 03:04:05 UTC\" Field: v; Value: 2024-01-02 03:04:05 UTC",
                "reason": "invalidQuery"
              },
              {
                "location": "query",
                "message": "Invalid datetime string \"2024-01-02T03:04:05Z\" Field: v; Value: 2024-01-02T03:04:05Z",
                "reason": "invalidQuery"
              },
              {
                "location": "query",
                "message": "Invalid datetime string \"2024-01-02 03:04:05.1234567\" Field: v; Value: 2024-01-02 03:04:05.1234567",
                "reason": "invalidQuery"
              },
              {
                "location": "gs://${bucket}/${run}/datetime_spellings/s.json",
                "message": "Error while reading table: ${project}.bqa_${run}_datetime_spellings.t, error message: JSON parsing error in row starting at position 300: Could not convert non-string JSON value to DATETIME type. Field: v; Value: 1 File: gs://${bucket}/${run}/datetime_spellings/s.json",
                "reason": "invalid"
              },
              {
                "location": "gs://${bucket}/${run}/datetime_spellings/s.json",
                "message": "Error while reading table: ${project}.bqa_${run}_datetime_spellings.t, error message: JSON parsing error in row starting at position 319: JSON object specified for non-record field: v File: gs://${bucket}/${run}/datetime_spellings/s.json",
                "reason": "invalid"
              }
            ],
            "state": "DONE"
          }
        },
        "query": {
          "errors": [
            {
              "location": "query",
              "reason": "invalidQuery"
            },
            {
              "location": "gs://${bucket}/${run}/datetime_spellings/s.json",
              "reason": "invalid"
            },
            {
              "location": "query",
              "reason": "invalidQuery"
            },
            {
              "location": "query",
              "reason": "invalidQuery"
            },
            {
              "location": "query",
              "reason": "invalidQuery"
            },
            {
