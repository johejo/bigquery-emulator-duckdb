      source: '${types}'
      table:
        tableReference: {projectId: '${project}', datasetId: '${dataset}', tableId: t}
        externalDataConfiguration:
          sourceFormat: PARQUET
          sourceUris: ['${prefix}/types.parquet']
          decimalTargetTypes: [STRING, STRING]
    expect: {"create": {"external": {"decimalTargetTypes": ["STRING", "STRING"], "sourceFormat": "PARQUET", "sourceUris": ["${prefix}/types.parquet"]}, "schema": {"fields": [{"mode": "REQUIRED", "name": "bool", "type": "BOOLEAN"}, {"mode": "REQUIRED", "name": "i32", "type": "INTEGER"}, {"mode": "REQUIRED", "name": "i64", "type": "INTEGER"}, {"mode": "REQUIRED", "name": "i8", "type": "INTEGER"}, {"mode": "REQUIRED", "name": "u32", "type": "INTEGER"}, {"mode": "REQUIRED", "name": "u64", "type": "INTEGER"}, {"mode": "REQUIRED", "name": "f32", "type": "FLOAT"}, {"mode": "REQUIRED", "name": "f64", "type": "FLOAT"}, {"mode": "REQUIRED", "name": "dec9", "type": "STRING"}, {"mode": "REQUIRED", "name": "dec18", "type": "STRING"}, {"mode": "REQUIRED", "name": "dec38", "type": "STRING"}, {"mode": "REQUIRED", "name": "s", "type": "STRING"}, {"mode": "REQUIRED", "name": "s_int", "type": "STRING"}, {"mode": "REQUIRED", "name": "s_date", "type": "STRING"}, {"mode": "REQUIRED", "name": "s_datetime", "type": "STRING"}, {"mode": "REQUIRED", "name": "s_json", "type": "STRING"}, {"mode": "REQUIRED", "name": "s_wkt", "type": "STRING"}, {"mode": "REQUIRED", "name": "b", "type": "BYTES"}, {"mode": "REQUIRED", "name": "b_wkb", "type": "BYTES"}, {"mode": "REQUIRED", "name": "d", "type": "DATE"}, {"mode": "REQUIRED", "name": "t", "type": "TIME"}, {"mode": "REQUIRED", "name": "ts", "type": "TIMESTAMP"}, {"mode": "REQUIRED", "name": "tsl", "type": "TIMESTAMP"}, {"mode": "REQUIRED", "name": "tsms", "type": "TIMESTAMP"}, {"mode": "REQUIRED", "name": "tsns", "type": "INTEGER"}]}, "status": 200}, "query": {"jobComplete": true, "rows": [{"f": [{"v": "true"}, {"v": "42"}, {"v": "42"}, {"v": "42"}, {"v": "42"}, {"v": "42"}, {"v": "1.5"}, {"v": "1.5"}, {"v": "1.25"}, {"v": "1.25"}, {"v": "1.25"}, {"v": "a"}, {"v": "42"}, {"v": "2024-01-02"}, {"v": "2024-01-02 03:04:05"}, {"v": "{\"a\":1}"}, {"v": "POINT(1 2)"}, {"v": "YQ=="}, {"v": "AQEAAAAAAAAAAADwPwAAAAAAAABA"}, {"v": "2024-01-02"}, {"v": "03:04:05.000006"}, {"v": "1.704164645000006E9"}, {"v": "1.704164645000006E9"}, {"v": "1.704164645006E9"}, {"v": "1704164645000006007"}]}], "schema": {"fields": [{"mode": "NULLABLE", "name": "bool", "type": "BOOLEAN"}, {"mode": "NULLABLE", "name": "i32", "type": "INTEGER"}, {"mode": "NULLABLE", "name": "i64", "type": "INTEGER"}, {"mode": "NULLABLE", "name": "i8", "type": "INTEGER"}, {"mode": "NULLABLE", "name": "u32", "type": "INTEGER"}, {"mode": "NULLABLE", "name": "u64", "type": "INTEGER"}, {"mode": "NULLABLE", "name": "f32", "type": "FLOAT"}, {"mode": "NULLABLE", "name": "f64", "type": "FLOAT"}, {"mode": "NULLABLE", "name": "dec9", "type": "STRING"}, {"mode": "NULLABLE", "name": "dec18", "type": "STRING"}, {"mode": "NULLABLE", "name": "dec38", "type": "STRING"}, {"mode": "NULLABLE", "name": "s", "type": "STRING"}, {"mode": "NULLABLE", "name": "s_int", "type": "STRING"}, {"mode": "NULLABLE", "name": "s_date", "type": "STRING"}, {"mode": "NULLABLE", "name": "s_datetime", "type": "STRING"}, {"mode": "NULLABLE", "name": "s_json", "type": "STRING"}, {"mode": "NULLABLE", "name": "s_wkt", "type": "STRING"}, {"mode": "NULLABLE", "name": "b", "type": "BYTES"}, {"mode": "NULLABLE", "name": "b_wkb", "type": "BYTES"}, {"mode": "NULLABLE", "name": "d", "type": "DATE"}, {"mode": "NULLABLE", "name": "t", "type": "TIME"}, {"mode": "NULLABLE", "name": "ts", "type": "TIMESTAMP"}, {"mode": "NULLABLE", "name": "tsl", "type": "TIMESTAMP"}, {"mode": "NULLABLE", "name": "tsms", "type": "TIMESTAMP"}, {"mode": "NULLABLE", "name": "tsns", "type": "INTEGER"}]}, "status": 200}}
