                  "v": "\"+09:00\""
                }
              ]
            },
            {
              "f": [
                {
                  "v": "uris"
                },
                {
                  "v": "ARRAY<STRING>"
                },
                {
                  "v": "[\"gs://${bucket}/${run}/rest_offset_time_zone/s.csv\"]"
                }
              ]
