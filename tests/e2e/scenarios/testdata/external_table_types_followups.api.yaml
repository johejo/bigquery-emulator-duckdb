          "reason": "invalidQuery",
          "message": "Cannot set desired timezone: +09:00."
        }
      }
  # tables.insert of a Parquet table with dateFormat, which DDL rejects.
  - name: rest_parquet_date_format
    template: rest_create_failure
    vars:
      object: "types.parquet"
      source: "${types}"
      table: {"tableReference": {"projectId": "${project}", "datasetId": "${dataset}", "tableId": "t"}, "externalDataConfiguration": {"sourceUris": ["${prefix}/${object}"], "sourceFormat": "PARQUET", "dateFormat": "MM/DD/YYYY"}}
    expect: {
        "create": {
          "status": 400,
          "reason": "invalid",
          "message": "Unsupported option 'date_format' for format STORAGE_FORMAT_PARQUET"
        }
      }
  # The TIMESTAMP strings of a JSON table without time_zone: {"id": N, "v": VALUE} with 2024-01-02
  #   03:04:05, 2024-01-02T03:04:05+09:00, 2024/01/02 03:04, 2024-01-02 03:04:05 UTC and 2024-01-02.
  - name: json_timestamp_forms
    template: ddl
