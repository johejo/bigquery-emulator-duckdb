version: 1
# Recorded on BigQuery in project johejo-sandbox, run l3mnlojrl7xh7mhuzcwoxd27w6, with
# sources in the bucket johejo-sandbox-us; the answers sidecar keeps the
# observations. Questions BigQuery's answers in external_table_csv_types, external_table_json_types,
# external_table_parquet_types and external_table_datetime_formats leave open: Parquet
# columns read as GEOGRAPHY, the tables.insert forms of the date and time options that DDL
# rejects, schema detection with dateFormat, and TIMESTAMP forms of JSON and with
# time_zone. types.parquet is that of external_table_parquet_types.api.yaml.
description: >-
  Follow-up questions about external table types and date/time options.
vars:
  dataset: bqa_${run}_${case}
  prefix: gs://${bucket}/${run}/${case}
  query: SELECT * FROM `${project}.${dataset}.t` ORDER BY 1
  types: ""
templates:
  # Creates `t` with the DDL statement `ddl` over the object `object`, whose contents are
  # `source`, and runs `query` on it.
  ddl:
    steps:
      - name: dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: source
        gcs: {method: PUT, object: '${run}/${case}/${object}', base64: '${source}'}
      - name: create
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: ${ddl}
        observe:
          status: /status
          errors: /body/errors
      - name: get
        rest:
          method: GET
          path: /bigquery/v2/projects/${project}/datasets/${dataset}/tables/t
        observe:
          external: /body/externalDataConfiguration
          schema: /body/schema
      - name: ddl
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: SELECT ddl FROM `${project}.${dataset}.INFORMATION_SCHEMA.TABLES` WHERE table_name = 't'
        observe:
          rows: /body/rows
      - name: options
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: SELECT option_name, option_type, option_value FROM `${project}.${dataset}.INFORMATION_SCHEMA.TABLE_OPTIONS` WHERE table_name = 't' ORDER BY option_name
        observe:
          rows: /body/rows
      - name: query
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: ${query}
        bind:
          job: /body/jobReference/jobId
        observe:
          status: /status
          jobComplete: /body/jobComplete
          schema: /body/schema
          rows: /body/rows
          errors: /body/errors
      - name: job
        rest:
          method: GET
          path: /bigquery/v2/projects/${project}/jobs/${job}?location=US
        observe:
          status: /body/status
    cleanup:
      - name: delete
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
      - name: delete_source
        gcs: {method: DELETE, object: '${run}/${case}/${object}'}
  # As ddl, creating `t` with tables.insert and the resource `table`.
  rest:
    steps:
      - name: dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: source
        gcs: {method: PUT, object: '${run}/${case}/${object}', base64: '${source}'}
      - name: create
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets/${dataset}/tables
          body: ${table}
        observe:
          status: /status
          external: /body/externalDataConfiguration
          schema: /body/schema
      - name: get
        rest:
          method: GET
          path: /bigquery/v2/projects/${project}/datasets/${dataset}/tables/t
        observe:
          external: /body/externalDataConfiguration
          schema: /body/schema
      - name: ddl
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: SELECT ddl FROM `${project}.${dataset}.INFORMATION_SCHEMA.TABLES` WHERE table_name = 't'
        observe:
          rows: /body/rows
      - name: options
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: SELECT option_name, option_type, option_value FROM `${project}.${dataset}.INFORMATION_SCHEMA.TABLE_OPTIONS` WHERE table_name = 't' ORDER BY option_name
        observe:
          rows: /body/rows
      - name: query
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: ${query}
        bind:
          job: /body/jobReference/jobId
        observe:
          status: /status
          jobComplete: /body/jobComplete
          schema: /body/schema
          rows: /body/rows
          errors: /body/errors
      - name: job
        rest:
          method: GET
          path: /bigquery/v2/projects/${project}/jobs/${job}?location=US
        observe:
          status: /body/status
    cleanup:
      - name: delete
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
      - name: delete_source
        gcs: {method: DELETE, object: '${run}/${case}/${object}'}
  # As ddl, where the query fails.
  ddl_failure:
    steps:
      - name: dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: source
        gcs: {method: PUT, object: '${run}/${case}/${object}', base64: '${source}'}
      - name: create
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: ${ddl}
        observe:
          status: /status
          errors: /body/errors
      - name: get
        rest:
          method: GET
          path: /bigquery/v2/projects/${project}/datasets/${dataset}/tables/t
        observe:
          external: /body/externalDataConfiguration
          schema: /body/schema
      - name: ddl
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: SELECT ddl FROM `${project}.${dataset}.INFORMATION_SCHEMA.TABLES` WHERE table_name = 't'
        observe:
          rows: /body/rows
      - name: options
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: SELECT option_name, option_type, option_value FROM `${project}.${dataset}.INFORMATION_SCHEMA.TABLE_OPTIONS` WHERE table_name = 't' ORDER BY option_name
        observe:
          rows: /body/rows
      - name: query
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: ${query}
        expectFailure: true
        observe:
          status: /status
          reason: /body/error/errors/0/reason
          message: /body/error/message
    cleanup:
      - name: delete
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
      - name: delete_source
        gcs: {method: DELETE, object: '${run}/${case}/${object}'}
  # As ddl, where the statement fails.
  create_failure:
    steps:
      - name: dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: source
        gcs: {method: PUT, object: '${run}/${case}/${object}', base64: '${source}'}
      - name: create
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: ${ddl}
        expectFailure: true
        observe:
          status: /status
          reason: /body/error/errors/0/reason
          message: /body/error/message
    cleanup:
      - name: delete
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
      - name: delete_source
        gcs: {method: DELETE, object: '${run}/${case}/${object}'}
  # As rest, where the query fails.
  rest_failure:
    steps:
      - name: dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: source
        gcs: {method: PUT, object: '${run}/${case}/${object}', base64: '${source}'}
      - name: create
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets/${dataset}/tables
          body: ${table}
        observe:
          status: /status
          external: /body/externalDataConfiguration
          schema: /body/schema
      - name: get
        rest:
          method: GET
          path: /bigquery/v2/projects/${project}/datasets/${dataset}/tables/t
        observe:
          external: /body/externalDataConfiguration
          schema: /body/schema
      - name: ddl
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: SELECT ddl FROM `${project}.${dataset}.INFORMATION_SCHEMA.TABLES` WHERE table_name = 't'
        observe:
          rows: /body/rows
      - name: options
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: SELECT option_name, option_type, option_value FROM `${project}.${dataset}.INFORMATION_SCHEMA.TABLE_OPTIONS` WHERE table_name = 't' ORDER BY option_name
        observe:
          rows: /body/rows
      - name: query
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: ${query}
        expectFailure: true
        observe:
          status: /status
          reason: /body/error/errors/0/reason
          message: /body/error/message
    cleanup:
      - name: delete
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
      - name: delete_source
        gcs: {method: DELETE, object: '${run}/${case}/${object}'}
  # As rest, where tables.insert fails.
  rest_create_failure:
    steps:
      - name: dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: source
        gcs: {method: PUT, object: '${run}/${case}/${object}', base64: '${source}'}
      - name: create
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets/${dataset}/tables
          body: ${table}
        expectFailure: true
        observe:
          status: /status
          reason: /body/error/errors/0/reason
          message: /body/error/message
    cleanup:
      - name: delete
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
      - name: delete_source
        gcs: {method: DELETE, object: '${run}/${case}/${object}'}
cases:
  # A STRING column read as GEOGRAPHY.
  - name: s_wkt_as_geography
    template: ddl
    vars:
      object: "types.parquet"
      source: "${types}"
      query: "SELECT ST_ASTEXT(s_wkt) FROM `${project}.${dataset}.t`"
      ddl: "CREATE EXTERNAL TABLE `${project}.${dataset}.t` (s_wkt GEOGRAPHY) OPTIONS (format = 'PARQUET', uris = ['${prefix}/types.parquet'])"
    expect: {
        "create": {
          "status": 200
        },
        "ddl": {
          "rows": [
            {
              "f": [
                {
                  "v": "CREATE EXTERNAL TABLE `${project}.bqa_${run}_s_wkt_as_geography.t`\nOPTIONS(\n  format=\"PARQUET\",\n  uris=[\"gs://${bucket}/${run}/s_wkt_as_geography/types.parquet\"]\n);"
                }
              ]
            }
          ]
        },
        "get": {
          "external": {
            "sourceFormat": "PARQUET",
            "sourceUris": [
              "gs://${bucket}/${run}/s_wkt_as_geography/types.parquet"
            ]
          },
          "schema": {
            "fields": [
              {
                "name": "s_wkt",
                "type": "GEOGRAPHY"
              }
            ]
          }
        },
        "job": {
          "status": {
            "state": "DONE"
          }
        },
        "options": {
          "rows": [
            {
              "f": [
                {
                  "v": "format"
                },
                {
                  "v": "STRING"
                },
                {
                  "v": "\"PARQUET\""
                }
              ]
            },
            {
              "f": [
                {
                  "v": "uris"
                },
                {
                  "v": "ARRAY<STRING>"
                },
                {
                  "v": "[\"gs://${bucket}/${run}/s_wkt_as_geography/types.parquet\"]"
                }
              ]
            }
          ]
        },
        "query": {
          "jobComplete": true,
          "rows": [
            {
              "f": [
                {
                  "v": "POINT(1 2)"
                }
              ]
            }
          ],
          "schema": {
            "fields": [
              {
                "mode": "NULLABLE",
                "name": "f0_",
                "type": "STRING"
              }
            ]
          },
          "status": 200
        }
      }
