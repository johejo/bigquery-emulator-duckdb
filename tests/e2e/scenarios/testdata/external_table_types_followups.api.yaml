  # tables.insert with a C-style dateFormat, which DDL rejects.
  - name: rest_c_date_format
    template: rest_failure
    vars:
      object: "s.csv"
      source: "MSwwMS8wMi8yMDI0Cg=="
      table: {"tableReference": {"projectId": "${project}", "datasetId": "${dataset}", "tableId": "t"}, "externalDataConfiguration": {"sourceUris": ["${prefix}/${object}"], "sourceFormat": "CSV", "dateFormat": "%m/%d/%Y", "schema": {"fields": [{"name": "id", "type": "INTEGER"}, {"name": "v", "type": "DATE"}]}}}
    expect: {
        "create": {
          "external": {
            "dateFormat": "%m/%d/%Y",
            "sourceFormat": "CSV",
            "sourceUris": [
              "gs://${bucket}/${run}/rest_c_date_format/s.csv"
            ]
          },
          "schema": {
            "fields": [
              {
                "mode": "NULLABLE",
                "name": "id",
                "type": "INTEGER"
              },
              {
                "mode": "NULLABLE",
                "name": "v",
                "type": "DATE"
              }
            ]
          },
          "status": 200
        },
        "ddl": {
          "rows": [
            {
              "f": [
                {
                  "v": "CREATE EXTERNAL TABLE `${project}.bqa_${run}_rest_c_date_format.t`\n(\n  id INT64,\n  v DATE\n)\nOPTIONS(\n  date_format=\"%m/%d/%Y\",\n  format=\"CSV\",\n  uris=[\"gs://${bucket}/${run}/rest_c_date_format/s.csv\"]\n);"
                }
              ]
            }
          ]
        },
        "get": {
          "external": {
            "dateFormat": "%m/%d/%Y",
            "sourceFormat": "CSV",
            "sourceUris": [
              "gs://${bucket}/${run}/rest_c_date_format/s.csv"
            ]
          },
          "schema": {
            "fields": [
              {
                "mode": "NULLABLE",
                "name": "id",
                "type": "INTEGER"
              },
              {
                "mode": "NULLABLE",
                "name": "v",
                "type": "DATE"
              }
            ]
          }
        },
        "options": {
          "rows": [
            {
              "f": [
                {
