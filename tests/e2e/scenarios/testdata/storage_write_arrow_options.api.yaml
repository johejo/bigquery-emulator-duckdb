                rows: {serializedRecordBatch: '/////4gAAAAUAAAAAAAAAAwAFgAUABMADAAEAAwAAAAIAAAAAAAAABQAAAAAAAADBAAKABgADAAIAAQACgAAABQAAAA4AAAAAQAAAAAAAAAAAAAAAgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAgAAAAAAAAAAAAAAAEAAAABAAAAAAAAAAAAAAAAAAAACgAAAAAAAAA='}
        expectFailure: true
        observe:
          code: /code
          error: /error
          messages: /messages
    cleanup:
      - name: delete_dataset
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
    expect:
      append:
        code: InvalidArgument
        error: {code: 3, message: "Invalid stream name. Entity: ${stream}"}
        messages: [{appendResult: {}, writeStream: '${stream}'}, {appendResult: {}}, {appendResult: {}}, {appendResult: {}}, {appendResult: {}}, {appendResult: {}}, {appendResult: {}}, {appendResult: {}}]
  # One connection's NULL names, each request's interpretation lasting as
  # google/cloud/bigquery/storage/v1/storage.proto specifies: the map for its request, the default
  # until another request sets it. The ninth request changes the writer schema, where BigQuery
  # ends the RPC successfully without answering it or the tenth, or appending their rows.
