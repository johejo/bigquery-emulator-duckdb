version: 1
# Recorded on BigQuery in run nedc75o5ucmak3pzj56nlvwqin. The displayed DDL uses
# the REST format and URI list, not the spelling accepted by CREATE EXTERNAL TABLE.
description: INFORMATION_SCHEMA displays Bigtable external table metadata without bigtableOptions.
vars:
  dataset: bqa_${run}_${case}
  uri: https://googleapis.com/bigtable/projects/${project}/instances/bqanswers/tables/bigtable-external
cases:
  - name: bigtable_metadata
    steps:
      - name: dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body: {datasetReference: {datasetId: '${dataset}'}, location: US}
      - name: create
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets/${dataset}/tables
          body:
            tableReference:
              tableId: t
            externalDataConfiguration:
              sourceFormat: BIGTABLE
              sourceUris: ['${uri}']
              bigtableOptions:
                readRowkeyAsString: true
                ignoreUnspecifiedColumnFamilies: true
                columnFamilies:
                  - familyId: family_a
                    type: STRING
                    onlyReadLatest: true
        observe: {status: /status, external: /body/externalDataConfiguration}
      - name: ddl
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            query: SELECT ddl FROM `${project}.${dataset}.INFORMATION_SCHEMA.TABLES` WHERE table_name = 't'
        observe: {rows: /body/rows}
      - name: options
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            query: SELECT option_name, option_type, option_value FROM `${project}.${dataset}.INFORMATION_SCHEMA.TABLE_OPTIONS` WHERE table_name = 't' ORDER BY option_name
        observe: {rows: /body/rows}
    cleanup:
      - name: delete
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
    expect:
      create:
        status: 200
        external:
          sourceFormat: BIGTABLE
          sourceUris: ['${uri}']
          bigtableOptions:
            readRowkeyAsString: true
            ignoreUnspecifiedColumnFamilies: true
            columnFamilies:
              - familyId: family_a
                type: STRING
                onlyReadLatest: true
      ddl:
        rows:
          - f:
              - v: |-
                  CREATE EXTERNAL TABLE `${project}.${dataset}.t`
                  (
                    rowkey STRING,
                    family_a STRUCT<column ARRAY<STRUCT<name STRING, cell STRUCT<timestamp TIMESTAMP, value STRING>>>>
                  )
                  OPTIONS(
                    format="BIGTABLE",
                    uris=["${uri}"]
                  );
      options:
        rows:
          - f: [{v: format}, {v: STRING}, {v: '"BIGTABLE"'}]
          - f: [{v: uris}, {v: 'ARRAY<STRING>'}, {v: '["${uri}"]'}]
