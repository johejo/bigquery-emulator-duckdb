        gcs: {method: DELETE, object: '${run}/${case}/${object}'}
cases:
  # Known bug: CSV schema detection with dateFormat is unsupported.
  - name: rest_autodetect_date_format
    template: rest
    vars:
      object: "s.csv"
      source: "ZAowMS8wMi8yMDI0Cg=="
      table: {"tableReference": {"projectId": "${project}", "datasetId": "${dataset}", "tableId": "t"}, "externalDataConfiguration": {"sourceUris": ["${prefix}/${object}"], "sourceFormat": "CSV", "autodetect": true, "dateFormat": "MM/DD/YYYY"}}
    expect: {
        "create": {
          "external": {
            "autodetect": true,
            "dateFormat": "MM/DD/YYYY",
            "sourceFormat": "CSV",
            "sourceUris": [
              "gs://${bucket}/${run}/rest_autodetect_date_format/s.csv"
            ]
          },
          "schema": {
            "fields": [
              {
                "mode": "NULLABLE",
                "name": "d",
                "type": "DATE"
              }
            ]
          },
          "status": 200
        },
        "ddl": {
          "rows": [
            {
              "f": [
                {
                  "v": "CREATE EXTERNAL TABLE `${project}.bqa_${run}_rest_autodetect_date_format.t`\nOPTIONS(\n  date_format=\"MM/DD/YYYY\",\n  format=\"CSV\",\n  uris=[\"gs://${bucket}/${run}/rest_autodetect_date_format/s.csv\"]\n);"
                }
              ]
            }
          ]
        },
        "get": {
          "external": {
            "autodetect": true,
            "dateFormat": "MM/DD/YYYY",
            "sourceFormat": "CSV",
            "sourceUris": [
              "gs://${bucket}/${run}/rest_autodetect_date_format/s.csv"
            ]
          },
          "schema": {
            "fields": [
              {
                "mode": "NULLABLE",
                "name": "d",
                "type": "DATE"
              }
            ]
          }
        },
        "job": {
          "status": {
            "state": "DONE"
          }
        },
        "options": {
          "rows": [
            {
              "f": [
                {
                  "v": "date_format"
                },
                {
                  "v": "STRING"
                },
                {
                  "v": "\"MM/DD/YYYY\""
                }
              ]
            },
            {
              "f": [
                {
                  "v": "format"
                },
                {
                  "v": "STRING"
                },
                {
                  "v": "\"CSV\""
                }
              ]
            },
            {
              "f": [
                {
                  "v": "uris"
                },
                {
                  "v": "ARRAY<STRING>"
                },
                {
                  "v": "[\"gs://${bucket}/${run}/rest_autodetect_date_format/s.csv\"]"
                }
              ]
            }
          ]
        },
        "query": {
          "jobComplete": true,
          "rows": [
            {
              "f": [
                {
                  "v": "2024-01-02"
                }
              ]
            }
          ],
          "schema": {
            "fields": [
              {
                "mode": "NULLABLE",
                "name": "d",
                "type": "DATE"
              }
            ]
          },
          "status": 200
        }
      }
