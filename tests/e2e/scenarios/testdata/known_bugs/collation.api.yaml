version: 1
# Recorded on BigQuery in project johejo-sandbox, run l363n2yqs7fv7idu23nyuidffo; the answers
# sidecar keeps the observations. BigQuery answers CREATE TABLE AS SELECT and CREATE VIEW in
# jobs.query with the schema of the table or view they create, which the emulator leaves out of
# DDL responses. ../collation.api.yaml checks the schemas the table and the view keep.
description: >-
  The schema jobs.query returns for a CREATE TABLE AS SELECT and a CREATE VIEW of collated columns.
vars:
  dataset: e2e_${run}_${case}
templates:
  statement:
    steps:
      - name: create_dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: statement
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            query: ${statement}
            useLegacySql: false
            timeoutMs: 200000
        observe:
          error: /body/error
          errors: /body/errors
          schema: /body/schema
    cleanup:
      - name: delete_dataset
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
cases:
  - name: create_table_as_select
    template: statement
    vars:
      statement: >-
        CREATE TABLE `${project}.${dataset}.t` AS
        SELECT COLLATE('a', 'und:ci') AS c, STRUCT(COLLATE('b', 'und:ci') AS f) AS s,
        [COLLATE('c', 'und:ci')] AS a
    expect:
      statement:
        schema:
          fields:
            - {collation: und:ci, name: c, type: STRING}
            - fields:
                - {collation: und:ci, name: f, type: STRING}
              name: s
              type: RECORD
            - {collation: und:ci, mode: REPEATED, name: a, type: STRING}
  - name: view
    template: statement
    vars:
      statement: >-
        CREATE VIEW `${project}.${dataset}.v` AS SELECT COLLATE('a', 'und:ci') AS c
    expect:
      statement:
        schema:
          fields:
            - {collation: und:ci, name: c, type: STRING}
