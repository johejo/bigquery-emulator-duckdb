  dec50_null: "UEFSMRUAFTYVNiwVBBUAFQYVBhwAAAACAAAAAwIAAAAAAAAAAAAAAAAGxrk1uLvUAAAVBBksSAZzY2hlbWEVAgAVDhUqFQIYBWRlYzUwJQoVKBVkLFwVKBVkAAAAFgQZHBkcJggcFQ4ZJQAGGRgFZGVjNTAVABYEFlwWXCYISRwVABUAFQIAAAAWXBYEJggWXBQAACgZcGFycXVldC1nbyB2ZXJzaW9uIDE4LjguMBkcHAAAAIMAAABQQVIx"
  dec38_20: "UEFSMRUAFSwVLCwVAhUAFQYVBhwAAAACAAAAAgEAAAAAAAAABsa5Nbi71AAAFQQZLEgGc2NoZW1hFQIAFQ4VIBUCGAVkZWMzOCUKFSgVTCxcFSgVTAAAABYCGRwZHCYIHBUOGSUABhkYBWRlYzM4FQAWAhZSFlImCEkcFQAVABUCAAAAFlIWAiYIFlIUAAAoGXBhcnF1ZXQtZ28gdmVyc2lvbiAxOC44LjAZHBwAAACDAAAAUEFSMQ=="
  dec38_20_frac: "UEFSMRUAFSwVLCwVAhUAFQYVBhwAAAACAAAAAgEAAAAAAAAABXzpbyHZnbQAFQQZLEgGc2NoZW1hFQIAFQ4VIBUCGAVkZWMzOCUKFSgVTCxcFSgVTAAAABYCGRwZHCYIHBUOGSUABhkYBWRlYzM4FQAWAhZSFlImCEkcFQAVABUCAAAAFlIWAiYIFlIUAAAoGXBhcnF1ZXQtZ28gdmVyc2lvbiAxOC44LjAZHBwAAACDAAAAUEFSMQ=="
  dec76_40: "UEFSMRUAFUwVTCwVAhUAFQYVBhwAAAACAAAAAgEAAAAAAAAAAAAAAAAAAAAku/RuNDPN75aocrlAAAAAABUEGSxIBnNjaGVtYRUCABUOFUAVAhgFZGVjNzYlChVQFZgBLFwVUBWYAQAAABYCGRwZHCYIHBUOGSUABhkYBWRlYzc2FQAWAhZyFnImCEkcFQAVABUCAAAAFnIWAiYIFnIUAAAoGXBhcnF1ZXQtZ28gdmVyc2lvbiAxOC44LjAZHBwAAACFAAAAUEFSMQ=="
  dec18_10: "UEFSMRUAFRwVHCwVAhUAFQYVBhwAAAACAAAAAgEA3Q7pAgAAABUEGSxIBnNjaGVtYRUCABUEJQIYBWRlYzE4JQoVFBUkLFwVFBUkAAAAFgIZHBkcJggcFQQZJQAGGRgFZGVjMTgVABYCFkIWQiYISRwVABUAFQIAAAAWQhYCJggWQhQAACgZcGFycXVldC1nbyB2ZXJzaW9uIDE4LjguMBkcHAAAAIEAAABQQVIx"
  s_null: "UEFSMRUAFRYVFiwVBBUAFQYVBhwAAAACAAAAAwEBAAAAYRUEGSxIBnNjaGVtYRUCABUMJQIYAXMlAEwcAAAAFgQZHBkcJggcFQwZJQAGGRgBcxUAFgQWPBY8JghJHBUAFQAVAgAAABY8FgQmCBY8FAAAKBlwYXJxdWV0LWdvIHZlcnNpb24gMTguOC4wGRwcAAAAcQAAAFBBUjE="
templates:
  # Creates `t` with the DDL statement `ddl` over the object `object`, whose contents are
  # `source`, and runs `query` on it.
  ddl:
    steps:
      - name: dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: source
        gcs: {method: PUT, object: '${run}/${case}/${object}', base64: '${source}'}
      - name: create
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: ${ddl}
        observe:
          status: /status
          errors: /body/errors
      - name: get
        rest:
          method: GET
          path: /bigquery/v2/projects/${project}/datasets/${dataset}/tables/t
        observe:
          external: /body/externalDataConfiguration
          schema: /body/schema
      - name: ddl
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: SELECT ddl FROM `${project}.${dataset}.INFORMATION_SCHEMA.TABLES` WHERE table_name = 't'
        observe:
          rows: /body/rows
      - name: options
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: SELECT option_name, option_type, option_value FROM `${project}.${dataset}.INFORMATION_SCHEMA.TABLE_OPTIONS` WHERE table_name = 't' ORDER BY option_name
        observe:
          rows: /body/rows
      - name: query
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: ${query}
        bind:
          job: /body/jobReference/jobId
        observe:
          status: /status
          jobComplete: /body/jobComplete
          schema: /body/schema
          rows: /body/rows
          errors: /body/errors
      - name: job
        rest:
          method: GET
          path: /bigquery/v2/projects/${project}/jobs/${job}?location=US
        observe:
          status: /body/status
    cleanup:
      - name: delete
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
      - name: delete_source
        gcs: {method: DELETE, object: '${run}/${case}/${object}'}
  # As ddl, creating `t` with tables.insert and the resource `table`.
  rest:
    steps:
      - name: dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: source
        gcs: {method: PUT, object: '${run}/${case}/${object}', base64: '${source}'}
      - name: create
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets/${dataset}/tables
          body: ${table}
        observe:
          status: /status
          external: /body/externalDataConfiguration
