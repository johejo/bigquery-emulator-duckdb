version: 1
# Recorded on BigQuery in project johejo-sandbox, run ahjpbnimu3gaa5n7mq3w4pvcah; the answers
# sidecar keeps the observations.
description: >-
  Foreign key metadata the emulator drops rather than storing and returning.
vars:
  dataset: e2e_${run}_${case}
cases:
  - name: foreign_key_table_constraints
    steps:
      - name: create_dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body: {datasetReference: {datasetId: '${dataset}'}, location: US}
      - name: fixture
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            query: CREATE TABLE `${project}.${dataset}.t` (a INT64, b STRING, PRIMARY KEY (a) NOT ENFORCED)
            useLegacySql: false
            location: US
        observe: {error: /body/error}
      - name: statement
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            query: >-
              CREATE TABLE `${project}.${dataset}.f` (a INT64,
              FOREIGN KEY (a) REFERENCES `${project}.${dataset}.t` (a) NOT ENFORCED)
            useLegacySql: false
            location: US
        observe: {error: /body/error}
      - name: table
        rest:
          method: GET
          path: /bigquery/v2/projects/${project}/datasets/${dataset}/tables/f
        observe: {tableConstraints: /body/tableConstraints}
    cleanup:
      - name: delete_dataset
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
    expect:
      fixture: {}
      statement: {}
      table:
        tableConstraints:
          foreignKeys:
            - name: fk$1
              referencedTable: {projectId: '${project}', datasetId: '${dataset}', tableId: t}
              columnReferences: [{referencingColumn: a, referencedColumn: a}]
