# Expectations are from the accompanying BigQuery answer sidecar.
# Known mismatch: load replacement with CSV autodetect is unsupported.
version: 1
# Follow-up to scenarios/testdata/destination_collation.api.yaml. Query destination
# replacement and load replacement need not have the same inheritance rules.
description: >-
  WRITE_TRUNCATE load collation: separate a retained table default, the current
  dataset default, an unchanged schema and a replacement schema. Use multipart
  CSV uploads to avoid GCS prerequisites. Read metadata before and after the load,
  verify the old row was replaced, and add a column to exercise the retained default.
vars:
  dataset: bqa_${run}_${case}
  table_setup: ''
  dataset_setup: ''
  load_schema: '${mixed_schema}'
  mixed_schema:
    fields:
      - {name: value, type: STRING}
      - {name: binary, type: STRING, collation: ''}
      - {name: ci, type: STRING, collation: 'und:ci'}
  unassigned_schema:
    fields:
      - {name: value, type: STRING}
      - {name: binary, type: STRING}
      - {name: ci, type: STRING}
  changed_schema:
    fields:
      - {name: value, type: STRING}
      - {name: renamed, type: STRING}
      - {name: ci, type: STRING, collation: ''}
  changed_collation_schema:
    fields:
      - {name: value, type: STRING, collation: 'und:ci'}
      - {name: binary, type: STRING, collation: 'und:ci'}
      - {name: ci, type: STRING, collation: ''}
  table_ci: ALTER TABLE `${project}.${dataset}.destination` SET DEFAULT COLLATE 'und:ci';
  table_empty: ALTER TABLE `${project}.${dataset}.destination` SET DEFAULT COLLATE '';
  dataset_ci: ALTER SCHEMA `${project}.${dataset}` SET DEFAULT COLLATE 'und:ci';
  dataset_empty: ALTER SCHEMA `${project}.${dataset}` SET DEFAULT COLLATE '';
  load_configuration:
    load:
      destinationTable: {projectId: '${project}', datasetId: '${dataset}', tableId: destination}
      sourceFormat: CSV
      writeDisposition: WRITE_TRUNCATE
      schema: '${load_schema}'
  recorded_schema_1: {"fields": [{"collation": "und:ci", "mode": "NULLABLE", "name": "string_field_0", "type": "STRING"}, {"collation": "und:ci", "mode": "NULLABLE", "name": "string_field_1", "type": "STRING"}, {"collation": "und:ci", "mode": "NULLABLE", "name": "string_field_2", "type": "STRING"}, {"collation": "und:ci", "name": "added", "type": "STRING"}]}
  recorded_schema_2: {"fields": [{"collation": "und:ci", "mode": "NULLABLE", "name": "string_field_0", "type": "STRING"}, {"collation": "und:ci", "mode": "NULLABLE", "name": "string_field_1", "type": "STRING"}, {"collation": "und:ci", "mode": "NULLABLE", "name": "string_field_2", "type": "STRING"}]}
  recorded_schema_3: {"fields": [{"name": "value", "type": "STRING"}, {"collation": "", "name": "binary", "type": "STRING"}, {"collation": "und:ci", "name": "ci", "type": "STRING"}]}
templates:
  replace:
    steps:
      - name: create_dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: fixture
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            query: |
              CREATE TABLE `${project}.${dataset}.destination`
                (value STRING, binary STRING COLLATE '', ci STRING COLLATE 'und:ci');
              INSERT `${project}.${dataset}.destination` VALUES ('old', 'a', 'a');
              ${table_setup}
              ${dataset_setup}
            useLegacySql: false
            timeoutMs: 200000
        observe: {jobComplete: /body/jobComplete, errors: /body/errors}
      - name: before_load
        rest:
          method: GET
          path: /bigquery/v2/projects/${project}/datasets/${dataset}/tables/destination
        observe: {defaultCollation: /body/defaultCollation, schema: /body/schema, numRows: /body/numRows}
      - name: load
        rest:
          method: POST
          path: /upload/bigquery/v2/projects/${project}/jobs?uploadType=multipart
          body:
            jobReference: {projectId: '${project}', location: US}
            configuration: '${load_configuration}'
          upload: |
            new,A,A
        bind: {job: /body/jobReference/jobId}
      - name: completed_load
        rest:
          method: GET
          path: /bigquery/v2/projects/${project}/jobs/${job}?location=US
        until: {/body/status/state: DONE}
        observe: {status: /body/status, outputRows: /body/statistics/load/outputRows}
      - name: after_load
        rest:
          method: GET
          path: /bigquery/v2/projects/${project}/datasets/${dataset}/tables/destination
        observe: {defaultCollation: /body/defaultCollation, schema: /body/schema, numRows: /body/numRows}
      - name: add_and_read
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            query: |
              ALTER TABLE `${project}.${dataset}.destination` ADD COLUMN added STRING;
              SELECT * FROM `${project}.${dataset}.destination`;
            useLegacySql: false
            timeoutMs: 200000
        observe: {jobComplete: /body/jobComplete, errors: /body/errors, rows: /body/rows}
      - name: after_add
        rest:
          method: GET
          path: /bigquery/v2/projects/${project}/datasets/${dataset}/tables/destination
        observe: {defaultCollation: /body/defaultCollation, schema: /body/schema}
    cleanup:
      - name: delete_dataset
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
cases:
  - name: autodetect_empty_dataset_ci
    template: replace
    vars:
      table_setup: '${table_empty}'
      dataset_setup: '${dataset_ci}'
      load_configuration:
        load:
          destinationTable: {projectId: '${project}', datasetId: '${dataset}', tableId: destination}
          sourceFormat: CSV
          writeDisposition: WRITE_TRUNCATE
          autodetect: true
    expect: {"add_and_read": {"jobComplete": true, "rows": [{"f": [{"v": "new"}, {"v": "A"}, {"v": "A"}, {"v": null}]}]}, "after_add": {"defaultCollation": "und:ci", "schema": "${recorded_schema_1}"}, "after_load": {"defaultCollation": "und:ci", "numRows": "1", "schema": "${recorded_schema_2}"}, "before_load": {"defaultCollation": "", "numRows": "1", "schema": "${recorded_schema_3}"}, "completed_load": {"outputRows": "1", "status": {"state": "DONE"}}, "fixture": {"jobComplete": true}}
