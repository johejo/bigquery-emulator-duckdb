version: 1
# Recorded on BigQuery in project johejo-sandbox, run ogj6cok4pl35drtorqgjhk34iz, with sources in
# the bucket johejo-sandbox-us; the answers sidecar keeps the observations. This case follows
# ../external_table_bad_records.api.yaml. BigQuery's warning of the malformed line names the token
# it expected, a key, where the emulator's says only that the line is not valid JSON.
description: >-
  Warnings for skipped bad records of a JSON external table.
vars:
  dataset: bqa_${run}_${case}
  prefix: gs://${bucket}/${run}/${case}
  # '{"id": 1, "s": "a"}\n{"id": 2.5, "s": "b"}\n{"id": 3,\n{"id": 4, "s": "d"}\n': a fraction
  # of an INT64 and a malformed line.
  bad_json: eyJpZCI6IDEsICJzIjogImEifQp7ImlkIjogMi41LCAicyI6ICJiIn0KeyJpZCI6IDMsCnsiaWQiOiA0LCAicyI6ICJkIn0K
templates:
  # Creates the table `t` with `ddl` over the object `${object}` of `source`, runs `query` with
  # jobs.query, and reads the job's status and results.
  warnings:
    steps:
      - name: dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: source
        gcs: {method: PUT, object: '${run}/${case}/${object}', base64: '${source}'}
      - name: create
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: ${ddl}
        observe:
          status: /status
          errors: /body/errors
      - name: query
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: ${query}
        bind:
          job: /body/jobReference/jobId
        observe:
          status: /status
          errors: /body/errors
          rows: /body/rows
      - name: job
        rest:
          method: GET
          path: /bigquery/v2/projects/${project}/jobs/${job}?location=US
        observe:
          status: /body/status
      - name: results
        rest:
          method: GET
          path: /bigquery/v2/projects/${project}/queries/${job}?location=US&timeoutMs=200000
        observe:
          errors: /body/errors
          rows: /body/rows
    cleanup:
      - name: delete
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
      - name: delete_source
        gcs: {method: DELETE, object: '${run}/${case}/${object}'}
cases:
  - name: warnings_json
    template: warnings
    vars:
      object: a.json
      source: '${bad_json}'
      ddl: CREATE EXTERNAL TABLE `${project}.${dataset}.t` (id INT64, s STRING) OPTIONS (format = 'JSON', uris = ['${prefix}/a.json'], max_bad_records = 2)
      query: SELECT * FROM `${project}.${dataset}.t` ORDER BY id
    expect: {"create": {"status": 200}, "job": {"status": {"errors": [{"location": "${prefix}/a.json", "message": "Error while reading table: ${project}.${dataset}.t, error message: JSON parsing error in row starting at position 20: Could not convert value 'number_value: \t \"2.5\"' to integer. Field: id; Value: 2.5 File: ${prefix}/a.json", "reason": "invalid"}, {"location": "${prefix}/a.json", "message": "Error while reading table: ${project}.${dataset}.t, error message: JSON parsing error in row starting at position 42: Expected key File: ${prefix}/a.json", "reason": "invalid"}], "state": "DONE"}}, "query": {"errors": [{"location": "${prefix}/a.json", "reason": "invalid"}, {"location": "${prefix}/a.json", "reason": "invalid"}], "rows": [{"f": [{"v": "1"}, {"v": "a"}]}, {"f": [{"v": "4"}, {"v": "d"}]}], "status": 200}, "results": {"errors": [{"location": "${prefix}/a.json", "message": "Error while reading table: ${project}.${dataset}.t, error message: JSON parsing error in row starting at position 20: Could not convert value 'number_value: \t \"2.5\"' to integer. Field: id; Value: 2.5 File: ${prefix}/a.json", "reason": "invalid"}, {"location": "${prefix}/a.json", "message": "Error while reading table: ${project}.${dataset}.t, error message: JSON parsing error in row starting at position 42: Expected key File: ${prefix}/a.json", "reason": "invalid"}], "rows": [{"f": [{"v": "1"}, {"v": "a"}]}, {"f": [{"v": "4"}, {"v": "d"}]}]}}
