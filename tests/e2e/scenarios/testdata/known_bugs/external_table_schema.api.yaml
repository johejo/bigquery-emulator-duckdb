version: 1
# Recorded on BigQuery in project johejo-sandbox, run s5rfwap3udv2nbrpb2g6smeloe, as the
# last_file_query case of ../external_table_schema.api.yaml; the answers sidecar keeps the
# observations. BigQuery queries a wildcard whose files lack a column of the schema it detects from
# the alphabetically last one, but the emulator requires every file to have each column.
description: >-
  A query of a Parquet external table whose sources lack a column of the detected schema.
# Detection cases settle what the Parquet conversions of
# [Loading Parquet data](third_party/bigquery_docs/loading-data-cloud-storage-parquet.md)
# leave open for external tables: the mode a REQUIRED or OPTIONAL Parquet column takes, whether
# NUMERIC takes the DECIMAL's precision and scale, whether tables.get reports modes and autodetect,
# the DDL INFORMATION_SCHEMA records, and which file of several gives the schema. The
# [DDL reference](third_party/bigquery_docs/reference/standard-sql/data-definition-language.md)
# gives the DROP EXTERNAL TABLE error only as a template.
# Fixtures were written with arrow-go v18.8.0's Parquet writer, uncompressed, without statistics or
# dictionaries, and base64-encoded without newlines:
# - types: one row of id INT64 REQUIRED = 1; s BYTE_ARRAY (STRING) OPTIONAL = 'a'; d INT32 (DATE)
#   REQUIRED = 2024-01-02; n INT32 (DECIMAL(9, 2)) OPTIONAL = 1.25; ts INT64 (TIMESTAMP(MICROS,
#   isAdjustedToUTC)) OPTIONAL = 2024-01-02 03:04:05.000006 UTC.
# - x and y: one row of an OPTIONAL INT64 column x or y = 1.
vars:
  dataset: bqa_${run}_${case}
  prefix: gs://${bucket}/${run}/${case}
  types_parquet: 
  x_parquet: UEFSMRUAFRwVHCwVAhUAFQYVBhwAAAACAAAAAgEBAAAAAAAAABUEGSxIBnNjaGVtYRUCABUEJQIYAXgAFgIZHBkcJggcFQQZJQAGGRgBeBUAFgIWQhZCJghJHBUAFQAVAgAAABZCFgImCBZCFAAAKBBhcnJvdy1nbyB2MTguOC4wGRwcAAAAYgAAAFBBUjE=
  y_parquet: UEFSMRUAFRwVHCwVAhUAFQYVBhwAAAACAAAAAgEBAAAAAAAAABUEGSxIBnNjaGVtYRUCABUEJQIYAXkAFgIZHBkcJggcFQQZJQAGGRgBeRUAFgIWQhZCJghJHBUAFQAVAgAAABZCFgImCBZCFAAAKBBhcnJvdy1nbyB2MTguOC4wGRwcAAAAYgAAAFBBUjE=
  external_ddl: CREATE EXTERNAL TABLE `${project}.${dataset}.t` OPTIONS (format = 'PARQUET', uris = ['${prefix}/types.parquet'])
templates:
  statements:
    steps:
      - name: dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: x
        gcs: {method: PUT, object: '${run}/${case}/x.parquet', base64: '${x_parquet}'}
      - name: y
        gcs: {method: PUT, object: '${run}/${case}/y.parquet', base64: '${y_parquet}'}
      - name: setup
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: ${setup}
      - name: statement
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: ${statement}
        observe:
          status: /status
          reason: /body/error/errors/0/reason
          message: /body/error/message
          jobComplete: /body/jobComplete
          errors: /body/errors
      - name: get
        rest:
          method: GET
          path: /bigquery/v2/projects/${project}/datasets/${dataset}/tables/t
        observe:
          status: /status
          type: /body/type
          schema: /body/schema
          external: /body/externalDataConfiguration
    cleanup:
      - name: delete
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
      - name: delete_x
        gcs: {method: DELETE, object: '${run}/${case}/x.parquet'}
      - name: delete_y
        gcs: {method: DELETE, object: '${run}/${case}/y.parquet'}
cases:
  - name: last_file_query
    template: statements
    vars:
      setup: CREATE EXTERNAL TABLE `${project}.${dataset}.t` OPTIONS (format = 'PARQUET', uris = ['${prefix}/*'])
      statement: SELECT * FROM `${project}.${dataset}.t`
    expect: {"get": {"external": {"autodetect": true, "sourceFormat": "PARQUET", "sourceUris": ["${prefix}/*"]}, "schema": {"fields": [{"mode": "NULLABLE", "name": "y", "type": "INTEGER"}]}, "status": 200, "type": "EXTERNAL"}, "statement": {"jobComplete": true, "status": 200}}
