version: 1
# Recorded on BigQuery in run 57r2rkus46qu66qfvafpaunihk; see the adjacent answers file.
description: Verify that a qualifier that is not valid UTF-8 keeps its bytes as the STRING name of family.column.
# Fixture: use the instance from the Bigtable metadata scenario, in the same project as the URI
# below. The row with key 0xFF holds the qualifier "q"; the row "good" holds the qualifier 0xFF.
# Both cells hold "ok". In Bash:
#   table=bigtable-utf8-key-probe
#   cbt -project "$PROJECT" -instance bqanswers createtable "$table" families=family
#   for pair in /w==:cQ== Z29vZA==:/w==; do
#     curl --fail-with-body -sS -H "Authorization: Bearer $(gcloud auth print-access-token)" \
#       -H 'Content-Type: application/json' \
#       "https://bigtable.googleapis.com/v2/projects/$PROJECT/instances/bqanswers/tables/$table:mutateRow" \
#       -d "{\"rowKey\":\"${pair%%:*}\",\"mutations\":[{\"setCell\":{\"familyName\":\"family\",\"columnQualifier\":\"${pair#*:}\",\"timestampMicros\":\"1000\",\"value\":\"b2s=\"}}]}"
#   done
# After collecting answers, delete the Bigtable table. The cases only clean up their BigQuery datasets.
vars:
  dataset: bqa_${run}_${case}
  uri: https://googleapis.com/bigtable/projects/${project}/instances/bqanswers/tables/bigtable-utf8-key-probe
  create_body:
    tableReference: {tableId: t}
    externalDataConfiguration:
      sourceFormat: BIGTABLE
      sourceUris: ['${uri}']
      bigtableOptions: '${options}'
  read_body:
    location: US
    useLegacySql: false
    timeoutMs: 100000
    query: SELECT ${select} FROM `${project}.${dataset}.t` ORDER BY 1
templates:
  read:
    steps:
      - name: dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body: {datasetReference: {datasetId: '${dataset}'}, location: US}
      - name: create
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets/${dataset}/tables
          body: '${create_body}'
        observe: {status: /status}
      - name: read
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body: '${read_body}'
        observe: {complete: /body/jobComplete, rows: /body/rows}
    cleanup:
      - name: delete
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
cases:
  # The emulator rejects the qualifier as unsupported, since a DuckDB string cannot hold its bytes.
  - name: qualifier_name
    template: read
    vars:
      options: {ignoreUnspecifiedColumnFamilies: true, columnFamilies: [{familyId: family}]}
      select: TO_HEX(rowkey), ARRAY(SELECT TO_HEX(CAST(c.name AS BYTES)) FROM UNNEST(family.column) AS c)
    expect:
      create: {status: 200}
      read:
        complete: true
        rows:
          - {f: [{v: 676f6f64}, {v: [{v: ff}]}]}
          - {f: [{v: ff}, {v: [{v: '71'}]}]}
