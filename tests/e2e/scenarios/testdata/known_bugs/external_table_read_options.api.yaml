version: 1
# Recorded on BigQuery in project johejo-sandbox, runs u7cpdqrvw5o36sz2dqity2hjp7 and
# jkuzqacy4awgmgefozp4uve2bm, with sources in the bucket johejo-sandbox-us; the answers sidecar
# keeps the observations. These cases of
# ../external_table_read_options.api.yaml skip bad records. A query that skips them succeeds with
# an errors[] entry, of reason invalid and the source's location, for each one, which the emulator
# leaves out. When a CSV table's bad records exceed max_bad_records, BigQuery fails with reason
# invalid, the emulator with invalidQuery, since DuckDB raises the error. Of a table of several
# files, BigQuery reports the Rows of every record but those of too many values, whatever the
# order of the files, as external_table_bad_records.api.yaml shows; the emulator, the number of
# the record that exceeds the limit, in the order of the files' URIs.
description: >-
  Queries of CSV and JSON external tables that skip or exceed max_bad_records.
vars:
  dataset: bqa_${run}_${case}
  schema:
    fields:
      - {name: id, type: INTEGER}
      - {name: s, type: STRING}
  prefix: gs://${bucket}/${run}/${case}
  # "1,a\n2,b\n", and gzip of it.
  csv: MSxhCjIsYgo=
  csv_gzip: H4sIAAAAAAAC/zPUSeQy0kniAgCpdCtxCAAAAA==
  # '{"id": 1, "s": "a"}\n{"id": 2, "s": "b"}\n', and gzip of it.
  json: eyJpZCI6IDEsICJzIjogImEifQp7ImlkIjogMiwgInMiOiAiYiJ9Cg==
  json_gzip: H4sIAAAAAAAC/6tWykxRslIw1FFQKgbSSolKtVzVEDEjmFgSUAwAn8D+DSgAAAA=
  # "1,a\nx,b\n3,c,extra\n4,d\n": a value INT64 cannot hold and one value too many.
  bad_csv: MSxhCngsYgozLGMsZXh0cmEKNCxkCg==
  # "5,e\ny,f\n"
  bad_csv_b: NSxlCnksZgo=
  # '{"id": 1, "s": "a"}\n{"id": 2.5, "s": "b"}\n{"id": 3,\n{"id": 4, "s": "d"}\n': a fraction
  # of an INT64 and a malformed line.
  bad_json: eyJpZCI6IDEsICJzIjogImEifQp7ImlkIjogMi41LCAicyI6ICJiIn0KeyJpZCI6IDMsCnsiaWQiOiA0LCAicyI6ICJkIn0K
  # "1,café\n2,ü€\n" in UTF-16LE, without and with a byte order mark, UTF-16BE, UTF-32LE and
  # UTF-32BE, and "1,café\n2,ü\n" in ISO-8859-1.
  utf16le: MQAsAGMAYQBmAOkACgAyACwA/ACsIAoA
  utf16le_bom: //4xACwAYwBhAGYA6QAKADIALAD8AKwgCgA=
  utf16be: ADEALABjAGEAZgDpAAoAMgAsAPwgrAAK
  utf32le: MQAAACwAAABjAAAAYQAAAGYAAADpAAAACgAAADIAAAAsAAAA/AAAAKwgAAAKAAAA
  utf32be: AAAAMQAAACwAAABjAAAAYQAAAGYAAADpAAAACgAAADIAAAAsAAAA/AAAIKwAAAAK
  iso_8859_1: MSxjYWbpCjIs/Ao=
  # "1,café\n2,ü€\n" in UTF-32LE with a byte order mark, and "1,café\n2,ü\n" in ISO-8859-1 in
  # gzip.
  utf32le_bom: //4AADEAAAAsAAAAYwAAAGEAAABmAAAA6QAAAAoAAAAyAAAALAAAAPwAAACsIAAACgAAAA==
  iso_8859_1_gzip: H4sIAAAAAAAC/zPUSU5Me8llpPOHCwAfOJkOCwAAAA==
  # gzip of utf16le.
  utf16le_gzip: H4sIAAAAAAAC/zNk0GFIZkhkSGN4ycDFYATk/WFYo8DFAADFrZ8CGAAAAA==
  # '{"id": 1, "s": "café"}\n' in UTF-16LE and in ISO-8859-1.
  json_utf16le: ewAiAGkAZAAiADoAIAAxACwAIAAiAHMAIgA6ACAAIgBjAGEAZgDpACIAfQAKAA==
  json_iso_8859_1: eyJpZCI6IDEsICJzIjogImNhZukifQo=
templates:
  # Creates the table `t` with `create_body` sent to `create_resource`, from the object
  # `${object}` of `source`, and reads its metadata and rows.
  external:
    steps:
      - name: dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: source
        gcs: {method: PUT, object: '${run}/${case}/${object}', base64: '${source}'}
      - name: create
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/${create_resource}
          body: ${create_body}
        observe:
          status: /status
          errors: /body/errors
      - name: get
        rest:
          method: GET
          path: /bigquery/v2/projects/${project}/datasets/${dataset}/tables/t
        observe:
          external: /body/externalDataConfiguration
      - name: options
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: SELECT option_name, option_type, option_value FROM `${project}.${dataset}.INFORMATION_SCHEMA.TABLE_OPTIONS` WHERE table_name = 't' ORDER BY option_name
        observe:
          errors: /body/errors
          rows: /body/rows
      - name: information_schema
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: SELECT ddl FROM `${project}.${dataset}.INFORMATION_SCHEMA.TABLES` WHERE table_name = 't'
        observe:
          errors: /body/errors
          rows: /body/rows
      - name: query
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: SELECT * FROM `${project}.${dataset}.t` ORDER BY id
        observe:
          status: /status
          errors: /body/errors
          rows: /body/rows
    cleanup:
      - name: delete
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
      - name: delete_source
        gcs: {method: DELETE, object: '${run}/${case}/${object}'}
  # As external, for a table a query cannot read.
  external_unreadable:
    steps:
      - name: dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: source
        gcs: {method: PUT, object: '${run}/${case}/${object}', base64: '${source}'}
      - name: create
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/${create_resource}
          body: ${create_body}
        observe:
          status: /status
          errors: /body/errors
      - name: get
        rest:
          method: GET
          path: /bigquery/v2/projects/${project}/datasets/${dataset}/tables/t
        observe:
          external: /body/externalDataConfiguration
      - name: options
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: SELECT option_name, option_type, option_value FROM `${project}.${dataset}.INFORMATION_SCHEMA.TABLE_OPTIONS` WHERE table_name = 't' ORDER BY option_name
        observe:
          errors: /body/errors
          rows: /body/rows
      - name: information_schema
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: SELECT ddl FROM `${project}.${dataset}.INFORMATION_SCHEMA.TABLES` WHERE table_name = 't'
        observe:
          errors: /body/errors
          rows: /body/rows
      - name: query
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: SELECT * FROM `${project}.${dataset}.t` ORDER BY id
        expectFailure: true
        observe:
          status: /status
          reason: /body/error/errors/0/reason
          message: /body/error/message
    cleanup:
      - name: delete
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
      - name: delete_source
        gcs: {method: DELETE, object: '${run}/${case}/${object}'}
  # As external_unreadable, observing only the reason.
  external_unreadable_reason:
    steps:
      - name: dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: source
        gcs: {method: PUT, object: '${run}/${case}/${object}', base64: '${source}'}
      - name: create
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/${create_resource}
          body: ${create_body}
        observe:
          status: /status
          errors: /body/errors
      - name: get
        rest:
          method: GET
          path: /bigquery/v2/projects/${project}/datasets/${dataset}/tables/t
        observe:
          external: /body/externalDataConfiguration
      - name: options
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: SELECT option_name, option_type, option_value FROM `${project}.${dataset}.INFORMATION_SCHEMA.TABLE_OPTIONS` WHERE table_name = 't' ORDER BY option_name
        observe:
          errors: /body/errors
          rows: /body/rows
      - name: information_schema
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: SELECT ddl FROM `${project}.${dataset}.INFORMATION_SCHEMA.TABLES` WHERE table_name = 't'
        observe:
          errors: /body/errors
          rows: /body/rows
      - name: query
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: SELECT * FROM `${project}.${dataset}.t` ORDER BY id
        expectFailure: true
        observe:
          status: /status
          reason: /body/error/errors/0/reason
    cleanup:
      - name: delete
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
      - name: delete_source
        gcs: {method: DELETE, object: '${run}/${case}/${object}'}
  # The statement `ddl`, which BigQuery rejects.
  rejected:
    steps:
      - name: dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: create
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: ${ddl}
        expectFailure: true
        observe:
          status: /status
          reason: /body/error/errors/0/reason
          message: /body/error/message
    cleanup:
      - name: delete
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
  # A table of `ddl` over the objects `${object}` and `${object_b}`, which a query cannot read.
  two_unreadable:
    steps:
      - name: dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: source
        gcs: {method: PUT, object: '${run}/${case}/${object}', base64: '${source}'}
      - name: source_b
        gcs: {method: PUT, object: '${run}/${case}/${object_b}', base64: '${source_b}'}
      - name: create
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: ${ddl}
        observe:
          status: /status
          errors: /body/errors
      - name: query
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: SELECT * FROM `${project}.${dataset}.t` ORDER BY id
        expectFailure: true
        observe:
          status: /status
          reason: /body/error/errors/0/reason
          message: /body/error/message
    cleanup:
      - name: delete
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
      - name: delete_source
        gcs: {method: DELETE, object: '${run}/${case}/${object}'}
      - name: delete_source_b
        gcs: {method: DELETE, object: '${run}/${case}/${object_b}'}
  # The table `create_body`, which tables.insert rejects.
  api_rejected:
    steps:
      - name: dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: create
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets/${dataset}/tables
          body: ${create_body}
        expectFailure: true
        observe:
          status: /status
          reason: /body/error/errors/0/reason
          message: /body/error/message
    cleanup:
      - name: delete
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
cases:
  - name: max_bad_records_csv_within
    template: external
    vars:
      object: a.csv
      source: '${bad_csv}'
      create_resource: queries
      create_body:
        useLegacySql: false
        location: US
        timeoutMs: 200000
        query: CREATE EXTERNAL TABLE `${project}.${dataset}.t` (id INT64, s STRING) OPTIONS (format = 'CSV', uris = ['${prefix}/a.csv'], max_bad_records = 2)
    expect: {"create": {"status": 200}, "get": {"external": {"maxBadRecords": 2, "sourceFormat": "CSV", "sourceUris": ["${prefix}/a.csv"]}}, "options": {"rows": [{"f": [{"v": "format"}, {"v": "STRING"}, {"v": "\"CSV\""}]}, {"f": [{"v": "max_bad_records"}, {"v": "INT64"}, {"v": "2"}]}, {"f": [{"v": "uris"}, {"v": "ARRAY<STRING>"}, {"v": "[\"${prefix}/a.csv\"]"}]}]}, "information_schema": {"rows": [{"f": [{"v": "CREATE EXTERNAL TABLE `${project}.${dataset}.t`\n(\n  id INT64,\n  s STRING\n)\nOPTIONS(\n  max_bad_records=2,\n  format=\"CSV\",\n  uris=[\"${prefix}/a.csv\"]\n);"}]}]}, "query": {"errors": [{"location": "${prefix}/a.csv", "reason": "invalid"}, {"location": "${prefix}/a.csv", "reason": "invalid"}], "rows": [{"f": [{"v": "1"}, {"v": "a"}]}, {"f": [{"v": "4"}, {"v": "d"}]}], "status": 200}}
  - name: max_bad_records_csv_exceeded
    template: external_unreadable
    vars:
      object: a.csv
      source: '${bad_csv}'
      create_resource: queries
      create_body:
        useLegacySql: false
        location: US
        timeoutMs: 200000
        query: CREATE EXTERNAL TABLE `${project}.${dataset}.t` (id INT64, s STRING) OPTIONS (format = 'CSV', uris = ['${prefix}/a.csv'], max_bad_records = 1)
    expect: {"create": {"status": 200}, "get": {"external": {"maxBadRecords": 1, "sourceFormat": "CSV", "sourceUris": ["${prefix}/a.csv"]}}, "options": {"rows": [{"f": [{"v": "format"}, {"v": "STRING"}, {"v": "\"CSV\""}]}, {"f": [{"v": "max_bad_records"}, {"v": "INT64"}, {"v": "1"}]}, {"f": [{"v": "uris"}, {"v": "ARRAY<STRING>"}, {"v": "[\"${prefix}/a.csv\"]"}]}]}, "information_schema": {"rows": [{"f": [{"v": "CREATE EXTERNAL TABLE `${project}.${dataset}.t`\n(\n  id INT64,\n  s STRING\n)\nOPTIONS(\n  max_bad_records=1,\n  format=\"CSV\",\n  uris=[\"${prefix}/a.csv\"]\n);"}]}]}, "query": {"status": 400, "reason": "invalid", "message": "Error while reading table: ${project}.${dataset}.t, error message: CSV processing encountered too many errors, giving up. Rows: 3; errors: 2; max bad: 1; error percent: 0"}}
  - name: max_bad_records_csv_files
    template: two_unreadable
    vars:
      object: a.csv
      source: '${bad_csv}'
      object_b: b.csv
      source_b: '${bad_csv_b}'
      ddl: CREATE EXTERNAL TABLE `${project}.${dataset}.t` (id INT64, s STRING) OPTIONS (format = 'CSV', uris = ['${prefix}/*.csv'], max_bad_records = 2)
    expect: {"create": {"status": 200}, "query": {"status": 400, "reason": "invalid", "message": "Error while reading table: ${project}.${dataset}.t, error message: CSV processing encountered too many errors, giving up. Rows: 5; errors: 3; max bad: 2; error percent: 0"}}
  - name: max_bad_records_api
    template: external
    vars:
      object: a.csv
      source: '${bad_csv}'
      create_resource: datasets/${dataset}/tables
      create_body:
        tableReference: {tableId: t}
        schema: '${schema}'
        externalDataConfiguration:
          sourceFormat: CSV
          sourceUris: ['${prefix}/a.csv']
          maxBadRecords: 2
    expect: {"create": {"status": 200}, "get": {"external": {"maxBadRecords": 2, "sourceFormat": "CSV", "sourceUris": ["${prefix}/a.csv"]}}, "options": {"rows": [{"f": [{"v": "format"}, {"v": "STRING"}, {"v": "\"CSV\""}]}, {"f": [{"v": "max_bad_records"}, {"v": "INT64"}, {"v": "2"}]}, {"f": [{"v": "uris"}, {"v": "ARRAY<STRING>"}, {"v": "[\"${prefix}/a.csv\"]"}]}]}, "information_schema": {"rows": [{"f": [{"v": "CREATE EXTERNAL TABLE `${project}.${dataset}.t`\n(\n  id INT64,\n  s STRING\n)\nOPTIONS(\n  max_bad_records=2,\n  format=\"CSV\",\n  uris=[\"${prefix}/a.csv\"]\n);"}]}]}, "query": {"errors": [{"location": "${prefix}/a.csv", "reason": "invalid"}, {"location": "${prefix}/a.csv", "reason": "invalid"}], "rows": [{"f": [{"v": "1"}, {"v": "a"}]}, {"f": [{"v": "4"}, {"v": "d"}]}], "status": 200}}
  - name: max_bad_records_json_within
    template: external
    vars:
      object: a.json
      source: '${bad_json}'
      create_resource: queries
      create_body:
        useLegacySql: false
        location: US
        timeoutMs: 200000
        query: CREATE EXTERNAL TABLE `${project}.${dataset}.t` (id INT64, s STRING) OPTIONS (format = 'JSON', uris = ['${prefix}/a.json'], max_bad_records = 2)
    expect: {"create": {"status": 200}, "get": {"external": {"maxBadRecords": 2, "sourceFormat": "NEWLINE_DELIMITED_JSON", "sourceUris": ["${prefix}/a.json"]}}, "options": {"rows": [{"f": [{"v": "format"}, {"v": "STRING"}, {"v": "\"NEWLINE_DELIMITED_JSON\""}]}, {"f": [{"v": "max_bad_records"}, {"v": "INT64"}, {"v": "2"}]}, {"f": [{"v": "uris"}, {"v": "ARRAY<STRING>"}, {"v": "[\"${prefix}/a.json\"]"}]}]}, "information_schema": {"rows": [{"f": [{"v": "CREATE EXTERNAL TABLE `${project}.${dataset}.t`\n(\n  id INT64,\n  s STRING\n)\nOPTIONS(\n  max_bad_records=2,\n  format=\"NEWLINE_DELIMITED_JSON\",\n  uris=[\"${prefix}/a.json\"]\n);"}]}]}, "query": {"errors": [{"location": "${prefix}/a.json", "reason": "invalid"}, {"location": "${prefix}/a.json", "reason": "invalid"}], "rows": [{"f": [{"v": "1"}, {"v": "a"}]}, {"f": [{"v": "4"}, {"v": "d"}]}], "status": 200}}
  - name: max_bad_records_csv_files_swapped
    template: two_unreadable
    vars:
      object: a.csv
      source: '${bad_csv_b}'
      object_b: b.csv
      source_b: '${bad_csv}'
      ddl: CREATE EXTERNAL TABLE `${project}.${dataset}.t` (id INT64, s STRING) OPTIONS (format = 'CSV', uris = ['${prefix}/*.csv'], max_bad_records = 2)
    expect: {"create": {"status": 200}, "query": {"status": 400, "reason": "invalid", "message": "Error while reading table: ${project}.${dataset}.t, error message: CSV processing encountered too many errors, giving up. Rows: 5; errors: 3; max bad: 2; error percent: 0"}}
