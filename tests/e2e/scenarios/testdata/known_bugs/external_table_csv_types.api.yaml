                "type": "GEOGRAPHY"
              }
            ]
          }
        },
        "query": {
          "status": 400,
          "reason": "invalid",
          "message": "Error while reading table: ${project}.bqa_${run}_geography_invalid.t, error message: Unexpected 'INVALID' at position 0.; line_number: 1 byte_offset_to_start_of_line: 0 column_index: 1 column_name: \"v\" column_type: GEOGRAPHY value: \"INVALID\" File: gs://${bucket}/${run}/geography_invalid/s.csv"
        }
      }
