  - name: table_without_primary_key
    description: >-
      BigQuery names the table's project by its number, which tests/e2e/projects.jsonl gives the test project.
    vars: {project_number: "123456789012"}
    steps:
      - {name: create_dataset, rest: {method: POST, path: "/bigquery/v2/projects/${project}/datasets", body: {datasetReference: {datasetId: "${dataset}"}, location: US}}}
      - name: create_table
