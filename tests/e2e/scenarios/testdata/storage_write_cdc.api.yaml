version: 1
description: >-
  Storage Write change data capture rows, from the examples and ordering rules in third_party/bigquery_docs/change-data-capture.md.
vars:
  dataset: bqa_${run}_${case}
  table: projects/${project}/datasets/${dataset}/tables/t
  stream: ${table}/streams/_default
  descriptor:
    name: Row
    field:
      - {name: id, number: 1, type: TYPE_INT64, label: LABEL_OPTIONAL}
      - {name: name, number: 2, type: TYPE_STRING, label: LABEL_OPTIONAL}
      - {name: salary, number: 3, type: TYPE_INT64, label: LABEL_OPTIONAL}
      - {name: _CHANGE_TYPE, number: 4, type: TYPE_STRING, label: LABEL_OPTIONAL}
      - {name: _CHANGE_SEQUENCE_NUMBER, number: 5, type: TYPE_STRING, label: LABEL_OPTIONAL}
cases:
  - name: documented_upsert_and_delete
    description: >-
      The example in third_party/bigquery_docs/change-data-capture.md.
    steps:
      - {name: create_dataset, rest: {method: POST, path: "/bigquery/v2/projects/${project}/datasets", body: {datasetReference: {datasetId: "${dataset}"}, location: US}}}
      - name: create_table
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            query: "CREATE TABLE `${project}.${dataset}.t` (id INT64 PRIMARY KEY NOT ENFORCED, name STRING, salary INT64)"
            useLegacySql: false
            location: US
      - name: seed
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            query: "INSERT `${project}.${dataset}.t` VALUES (100, 'Charlie', 2000), (101, 'Tal', 3000), (102, 'Lee', 5000)"
            useLegacySql: false
            location: US
      - name: append
        grpc:
          method: google.cloud.bigquery.storage.v1.BigQueryWrite/AppendRows
          headers: {x-goog-request-params: "write_stream=${stream}"}
          requests:
            - writeStream: ${stream}
              protoRows:
                writerSchema: {protoDescriptor: "${descriptor}"}
                rows: {serializedRows: ["CGQiBkRFTEVURQ==", "CGUSA1RhbBjAPiIGVVBTRVJU", "CGkSBUl6dW1pGPAuIgZVUFNFUlQ="]}
        observe:
          code: /code
          result0: /messages/0/appendResult
          error0: /messages/0/error
          rowErrors0: /messages/0/rowErrors
      - name: check
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            query: "SELECT id, name, salary FROM `${project}.${dataset}.t` ORDER BY id"
            useLegacySql: false
            location: US
        observe: {error: /body/error, rows: /body/rows}
    expect:
      append:
        code: OK
        result0: {}
      check: {rows: [{f: [{v: "101"}, {v: "Tal"}, {v: "8000"}]}, {f: [{v: "102"}, {v: "Lee"}, {v: "5000"}]}, {f: [{v: "105"}, {v: "Izumi"}, {v: "6000"}]}]}
    cleanup:
      - {name: delete_dataset, rest: {method: DELETE, path: "/bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true"}}
  - name: documented_sequence_example_1
    description: >-
      Example 1 of third_party/bigquery_docs/change-data-capture.md: '7B' takes precedence over '77'.
    steps:
      - {name: create_dataset, rest: {method: POST, path: "/bigquery/v2/projects/${project}/datasets", body: {datasetReference: {datasetId: "${dataset}"}, location: US}}}
      - name: create_table
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            query: "CREATE TABLE `${project}.${dataset}.t` (id INT64 PRIMARY KEY NOT ENFORCED, name STRING, salary INT64)"
            useLegacySql: false
            location: US
      - name: append
        grpc:
          method: google.cloud.bigquery.storage.v1.BigQueryWrite/AppendRows
          headers: {x-goog-request-params: "write_stream=${stream}"}
          requests:
            - writeStream: ${stream}
              protoRows:
                writerSchema: {protoDescriptor: "${descriptor}"}
                rows: {serializedRows: ["CAESBmxhdGVzdBgBIgZVUFNFUlQqAjdC"]}
            - protoRows: {rows: {serializedRows: ["CAESBW9sZGVyGAEiBlVQU0VSVCoCNzc="]}}
        observe:
          code: /code
          result0: /messages/0/appendResult
          error0: /messages/0/error
          rowErrors0: /messages/0/rowErrors
          result1: /messages/1/appendResult
          error1: /messages/1/error
          rowErrors1: /messages/1/rowErrors
      - name: check
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            query: "SELECT id, name, salary FROM `${project}.${dataset}.t` ORDER BY id"
            useLegacySql: false
            location: US
        observe: {error: /body/error, rows: /body/rows}
    expect:
      append:
        code: OK
        result0: {}
        result1: {}
      check: {rows: [{f: [{v: "1"}, {v: "latest"}, {v: "1"}]}]}
    cleanup:
      - {name: delete_dataset, rest: {method: DELETE, path: "/bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true"}}
