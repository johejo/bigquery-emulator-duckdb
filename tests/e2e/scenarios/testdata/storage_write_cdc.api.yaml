              protoRows:
                writerSchema: {protoDescriptor: "${descriptor}"}
                rows: {serializedRows: ["CAESAWEYASIGVVBTRVJU"]}
        expectFailure: true
        observe:
          code: /code
          error: /error
          messages: /messages
    expect:
      append: {"code": "InvalidArgument", "error": {"code": 3, "message": "Create UPSERT stream is not supported for primary key disabled table: ${project_number}:${dataset}.t for now. Entity: ${stream}"}, "messages": []}
      create_table: {}
    cleanup:
      - {name: delete_dataset, rest: {method: DELETE, path: "/bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true"}}
  - name: explicit_stream
    description: >-
      An explicit stream writes only inserts.
    steps:
      - {name: create_dataset, rest: {method: POST, path: "/bigquery/v2/projects/${project}/datasets", body: {datasetReference: {datasetId: "${dataset}"}, location: US}}}
      - name: create_table
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            query: "CREATE TABLE `${project}.${dataset}.t` (id INT64 PRIMARY KEY NOT ENFORCED, name STRING, salary INT64)"
            useLegacySql: false
            location: US
        observe: {error: /body/error}
      - name: create_stream
        grpc:
          method: google.cloud.bigquery.storage.v1.BigQueryWrite/CreateWriteStream
          headers: {x-goog-request-params: "parent=${table}"}
          requests:
            - {parent: "${table}", writeStream: {type: COMMITTED}}
        bind: {stream: /messages/0/name}
      - name: append
        grpc:
          method: google.cloud.bigquery.storage.v1.BigQueryWrite/AppendRows
          headers: {x-goog-request-params: "write_stream=${stream}"}
          requests:
            - writeStream: ${stream}
              protoRows:
                writerSchema: {protoDescriptor: "${descriptor}"}
                rows: {serializedRows: ["CAESAWEYASIGVVBTRVJU"]}
        observe:
          code: /code
          result0: /messages/0/appendResult
          errorCode0: /messages/0/error/code
          error0: /messages/0/error/message
          rowErrors0: /messages/0/rowErrors
      - name: check
