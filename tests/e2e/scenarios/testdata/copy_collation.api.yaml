    expect: {"add_and_read": {"jobComplete": true, "rows": [{"f": [{"v": "first"}, {"v": "A"}, {"v": "A"}]}, {"f": [{"v": "second"}, {"v": "a"}, {"v": "a"}]}]}, "after_add": {"schema": "${recorded_schema_1}"}, "completed_copy": {"status": {"state": "DONE"}}, "destination": {"numRows": "2", "schema": "${recorded_schema_2}", "type": "TABLE"}, "first_source": {"defaultCollation": "und:ci", "schema": "${recorded_schema_2}", "type": "TABLE"}, "fixture": {"jobComplete": true}, "second_source": {"defaultCollation": "", "schema": "${recorded_schema_3}"}}
  - name: multi_empty_then_ci
