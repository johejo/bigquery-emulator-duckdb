    expect: {"add_and_read": {"jobComplete": true, "rows": [{"f": [{"v": "first"}, {"v": "A"}, {"v": "A"}]}]}, "after_add": {"defaultCollation": "", "schema": "${recorded_schema_2}"}, "completed_copy": {"status": {"state": "DONE"}}, "destination": {"defaultCollation": "", "numRows": "1", "schema": "${recorded_schema_2}", "type": "SNAPSHOT"}, "first_source": {"defaultCollation": "", "schema": "${recorded_schema_2}", "type": "TABLE"}, "fixture": {"jobComplete": true}, "second_source": {"defaultCollation": "", "schema": "${recorded_schema_3}"}}
