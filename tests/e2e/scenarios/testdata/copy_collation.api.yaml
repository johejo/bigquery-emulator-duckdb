  - name: multi_empty_then_unassigned
    template: copy
    vars:
      source_setup: ALTER TABLE `${project}.${source_dataset}.first` SET DEFAULT COLLATE '';
    expect: {"add_and_read": {"jobComplete": true, "rows": [{"f": [{"v": "first"}, {"v": "A"}, {"v": "A"}]}, {"f": [{"v": "second"}, {"v": "a"}, {"v": "a"}]}]}, "after_add": {"schema": "${recorded_schema_1}"}, "completed_copy": {"status": {"state": "DONE"}}, "destination": {"numRows": "2", "schema": "${recorded_schema_2}", "type": "TABLE"}, "first_source": {"defaultCollation": "", "schema": "${recorded_schema_2}", "type": "TABLE"}, "fixture": {"jobComplete": true}, "second_source": {"schema": "${recorded_schema_3}"}}
  - name: multi_replace_ci_with_empty
    template: copy
    vars:
      source_setup: '${set_both_empty}'
      destination_setup: '${replace_ci}'
      disposition: WRITE_TRUNCATE
    expect: {"add_and_read": {"jobComplete": true, "rows": [{"f": [{"v": "first"}, {"v": "A"}, {"v": "A"}]}, {"f": [{"v": "second"}, {"v": "a"}, {"v": "a"}]}]}, "after_add": {"defaultCollation": "und:ci", "schema": "${recorded_schema_4}"}, "completed_copy": {"status": {"state": "DONE"}}, "destination": {"defaultCollation": "und:ci", "numRows": "2", "schema": "${recorded_schema_2}", "type": "TABLE"}, "first_source": {"defaultCollation": "", "schema": "${recorded_schema_2}", "type": "TABLE"}, "fixture": {"jobComplete": true}, "second_source": {"defaultCollation": "", "schema": "${recorded_schema_3}"}}
  - name: multi_replace_empty_with_ci
    template: copy
    vars:
      source_setup: '${set_both_ci}'
      destination_setup: '${replace_empty}'
      disposition: WRITE_TRUNCATE
    expect: {"add_and_read": {"jobComplete": true, "rows": [{"f": [{"v": "first"}, {"v": "A"}, {"v": "A"}]}, {"f": [{"v": "second"}, {"v": "a"}, {"v": "a"}]}]}, "after_add": {"defaultCollation": "", "schema": "${recorded_schema_1}"}, "completed_copy": {"status": {"state": "DONE"}}, "destination": {"defaultCollation": "", "numRows": "2", "schema": "${recorded_schema_2}", "type": "TABLE"}, "first_source": {"defaultCollation": "und:ci", "schema": "${recorded_schema_2}", "type": "TABLE"}, "fixture": {"jobComplete": true}, "second_source": {"defaultCollation": "und:ci", "schema": "${recorded_schema_3}"}}
