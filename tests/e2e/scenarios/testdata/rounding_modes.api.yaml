                WHERE table_name = 'api' ORDER BY ordinal_position
          rows: [{"f": [{"v": "even"}, {"v": "ROUND_HALF_EVEN"}]}, {"f": [{"v": "away"}, {"v": "ROUND_HALF_AWAY_FROM_ZERO"}]}]
      - {"name": "additional_form_0", "use": "sql", "vars": {"sql": "INSERT t (s) VALUES (STRUCT(NUMERIC '1'))"}}
      - name: "additional_form_1"
        use: "sql"
