        vars: {"sql": "CREATE TABLE src (n NUMERIC(5,1)); CREATE TABLE default_src (i INT64) OPTIONS(default_rounding_mode='ROUND_HALF_EVEN')"}
      - name: "copy_without_default"
        use: "sql"
        vars:
          sql: |-
            CREATE TABLE `${project}.${even_dataset}.dst` COPY src; ALTER TABLE `${project}.${even_dataset}.dst` ADD COLUMN m NUMERIC(5,1); INSERT `${project}.${even_dataset}.dst` (n,m) VALUES(2.25,2.25)
      - name: "inherited_dataset_default"
        use: "rows"
        vars: {"sql": "SELECT CAST(n AS STRING),CAST(m AS STRING) FROM `${project}.${even_dataset}.dst`", "rows": [{"f": [{"v": "2.3"}, {"v": "2.3"}]}]}
      - name: "copy_source_default"
        use: "sql"
        vars:
          sql: |-
            CREATE TABLE copied_default COPY default_src; ALTER TABLE copied_default ADD COLUMN n NUMERIC(5,1); INSERT copied_default(n) VALUES(2.25)
      - {"name": "source_default_value", "use": "rows", "vars": {"sql": "SELECT CAST(n AS STRING) FROM copied_default", "rows": [{"f": [{"v": "2.2"}]}]}}
      - name: "copy_with_options"
        use: "sql"
