      - name: "options_values"
        use: "rows"
        vars: {"sql": "SELECT CAST(n AS STRING),CAST(m AS STRING) FROM options", "rows": [{"f": [{"v": "2.3"}, {"v": "2.2"}]}]}
      - name: "replace_default"
        use: "sql"
        vars:
          sql: |-
            CREATE TABLE replaced LIKE default_src OPTIONS(default_rounding_mode='ROUND_HALF_AWAY_FROM_ZERO'); ALTER TABLE replaced ADD COLUMN n NUMERIC(5,1); INSERT replaced(n) VALUES(2.25)
      - {"name": "replaced_default_value", "use": "rows", "vars": {"sql": "SELECT CAST(n AS STRING) FROM replaced", "rows": [{"f": [{"v": "2.3"}]}]}}
    cleanup:
      - {"name": "delete_0", "use": "delete_dataset"}
      - {"name": "delete_1", "rest": {"method": "DELETE", "path": "/bigquery/v2/projects/${project}/datasets/${even_dataset}?deleteContents=true"}}
  - name: "copied_defaults_copy"
