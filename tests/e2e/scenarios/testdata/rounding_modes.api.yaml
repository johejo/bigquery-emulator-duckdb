# Expectations are preserved from the original Go E2E tests and recorded BigQuery answers.
version: 1
description: "Migrated from all ten rounding_mode tests. Values come from documented rounding examples and previously collected BigQuery answers; emulator-only rejections remain explicit. SDK PutMultiError decoding remains in Go."
vars:
  away: "ROUND_HALF_AWAY_FROM_ZERO"
  dataset: "e2e_${run}_${case}"
  even: "ROUND_HALF_EVEN"
  csv_values: |
    2.25,2.5,2.25
    -2.25,-2.5,-2.25
    2.35,1.5,2.35
  json_values: |
    {"n":2.25,"b":2.5,"away":2.25}
    {"n":-2.25,"b":-2.5,"away":-2.25}
    {"n":2.35,"b":1.5,"away":2.35}
  nested_numbers: "{\"n\": 2.25, \"b\": 2.5, \"away\": 2.25, \"s\": {\"n\": -2.25}, \"a\": [2.25, -2.25, 2.35]}"
  nested_strings: "{\"n\": \"2.25\", \"b\": \"2.5\", \"away\": \"2.25\", \"s\": {\"n\": \"-2.25\"}, \"a\": [\"2.25\", \"-2.25\", \"2.35\"]}"
  numeric_overflow_csv: |
    9999.95,1,1
  bignumeric_overflow_csv: |
    1,9999999999.5,1
  numeric_overflow_json: "{\"n\":9999.95,\"b\":1,\"away\":1}"
  bignumeric_overflow_json: "{\"n\":1,\"b\":9999999999.5,\"away\":1}"
  inherited_modes:
    defaultRoundingMode: "ROUND_HALF_EVEN"
    precision: "5"
    scale: "1"
    schema:
      "$subset":
        fields:
          - {"$subset": {"fields": {"$oneOf": [{"$missing": true}, null, []]}, "name": "n", "roundingMode": "ROUND_HALF_EVEN"}}
          - {"$subset": {"fields": {"$oneOf": [{"$missing": true}, null, []]}, "name": "b", "roundingMode": "ROUND_HALF_EVEN"}}
          - {"$subset": {"fields": {"$oneOf": [{"$missing": true}, null, []]}, "name": "away", "roundingMode": "ROUND_HALF_AWAY_FROM_ZERO"}}
  replaced_modes:
    defaultRoundingMode: "ROUND_HALF_EVEN"
    precision: "5"
    scale: "1"
    schema:
      "$subset":
        fields:
          - {"$subset": {"fields": {"$oneOf": [{"$missing": true}, null, []]}, "name": "n", "roundingMode": {"$oneOf": [{"$missing": true}, null, ""]}}}
          - {"$subset": {"fields": {"$oneOf": [{"$missing": true}, null, []]}, "name": "b", "roundingMode": {"$oneOf": [{"$missing": true}, null, ""]}}}
          - {"$subset": {"fields": {"$oneOf": [{"$missing": true}, null, []]}, "name": "away", "roundingMode": "ROUND_HALF_AWAY_FROM_ZERO"}}
  unparameterized_modes:
    defaultRoundingMode: "ROUND_HALF_EVEN"
    precision: {"$oneOf": [{"$missing": true}, null, "0"]}
    scale: {"$oneOf": [{"$missing": true}, null, "0"]}
    schema:
      "$subset":
        fields:
          - {"$subset": {"fields": {"$oneOf": [{"$missing": true}, null, []]}, "name": "n", "roundingMode": {"$oneOf": [{"$missing": true}, null, ""]}}}
          - {"$subset": {"fields": {"$oneOf": [{"$missing": true}, null, []]}, "name": "b", "roundingMode": {"$oneOf": [{"$missing": true}, null, ""]}}}
          - {"$subset": {"fields": {"$oneOf": [{"$missing": true}, null, []]}, "name": "away", "roundingMode": "ROUND_HALF_AWAY_FROM_ZERO"}}
  away_to_even_rows: [{"f": [{"v": "2.3"}, {"v": "2.2"}, {"v": "2"}, {"v": "2.2"}]}]
  even_to_away_rows: [{"f": [{"v": "2.2"}, {"v": "2.3"}, {"v": "3"}, {"v": "2.3"}]}]
  unspecified_rows: [{"f": [{"v": "2.3"}, {"v": "2.3"}, {"v": "3"}, {"v": "2.3"}]}]
  even_rows:
    - {"f": [{"v": "-2.2"}, {"v": "-2"}, {"v": "-2.3"}]}
    - {"f": [{"v": "2.2"}, {"v": "2"}, {"v": "2.3"}]}
    - {"f": [{"v": "2.4"}, {"v": "2"}, {"v": "2.4"}]}
  away_rows:
    - {"f": [{"v": "-2.3"}, {"v": "-3"}, {"v": "-2.3"}]}
    - {"f": [{"v": "2.3"}, {"v": "3"}, {"v": "2.3"}]}
    - {"f": [{"v": "2.4"}, {"v": "2"}, {"v": "2.4"}]}
  unrounded_rows:
    - {"f": [{"v": "-2.25"}, {"v": "-2.5"}, {"v": "-2.25"}]}
    - {"f": [{"v": "2.25"}, {"v": "2.5"}, {"v": "2.25"}]}
    - {"f": [{"v": "2.35"}, {"v": "1.5"}, {"v": "2.35"}]}
  even_nested_rows: [{"f": [{"v": "2.2"}, {"v": "2"}, {"v": "2.3"}, {"v": "-2.2"}, {"v": "2.2,-2.2,2.4"}]}]
  away_nested_rows: [{"f": [{"v": "2.3"}, {"v": "3"}, {"v": "2.3"}, {"v": "-2.3"}, {"v": "2.3,-2.3,2.4"}]}]
  explicit_fields:
    - {"name": "n", "precision": "5", "roundingMode": "ROUND_HALF_EVEN", "scale": "1", "type": "NUMERIC"}
    - {"name": "b", "precision": "10", "roundingMode": "ROUND_HALF_EVEN", "type": "BIGNUMERIC"}
    - {"name": "away", "precision": "5", "roundingMode": "ROUND_HALF_AWAY_FROM_ZERO", "scale": "1", "type": "NUMERIC"}
  implicit_fields:
    - {"name": "n", "precision": "5", "scale": "1", "type": "NUMERIC"}
    - {"name": "b", "precision": "10", "type": "BIGNUMERIC"}
    - {"name": "away", "precision": "5", "roundingMode": "ROUND_HALF_AWAY_FROM_ZERO", "scale": "1", "type": "NUMERIC"}
  unparameterized_fields:
    - {"name": "n", "type": "NUMERIC"}
    - {"name": "b", "type": "BIGNUMERIC"}
    - {"name": "away", "roundingMode": "ROUND_HALF_AWAY_FROM_ZERO", "type": "NUMERIC"}
  explicit_nested_fields:
    - {"name": "n", "precision": "5", "roundingMode": "ROUND_HALF_EVEN", "scale": "1", "type": "NUMERIC"}
    - {"name": "b", "precision": "10", "roundingMode": "ROUND_HALF_EVEN", "type": "BIGNUMERIC"}
    - {"name": "away", "precision": "5", "roundingMode": "ROUND_HALF_AWAY_FROM_ZERO", "scale": "1", "type": "NUMERIC"}
    - {"fields": [{"name": "n", "precision": "5", "roundingMode": "ROUND_HALF_EVEN", "scale": "1", "type": "NUMERIC"}], "name": "s", "type": "RECORD"}
    - {"mode": "REPEATED", "name": "a", "precision": "5", "roundingMode": "ROUND_HALF_EVEN", "scale": "1", "type": "NUMERIC"}
  implicit_nested_fields:
    - {"name": "n", "precision": "5", "scale": "1", "type": "NUMERIC"}
    - {"name": "b", "precision": "10", "type": "BIGNUMERIC"}
    - {"name": "away", "precision": "5", "roundingMode": "ROUND_HALF_AWAY_FROM_ZERO", "scale": "1", "type": "NUMERIC"}
    - {"fields": [{"name": "n", "precision": "5", "scale": "1", "type": "NUMERIC"}], "name": "s", "type": "RECORD"}
    - {"mode": "REPEATED", "name": "a", "precision": "5", "scale": "1", "type": "NUMERIC"}
  existing_same_schema: |-
    CREATE TABLE t(n NUMERIC(5,1),b BIGNUMERIC(10,0),away NUMERIC(5,1) OPTIONS(rounding_mode='ROUND_HALF_AWAY_FROM_ZERO')); INSERT t VALUES(7,7,7)
  existing_wider_precision: |-
    CREATE TABLE t(n NUMERIC(6,1),b BIGNUMERIC(10,0),away NUMERIC(5,1) OPTIONS(rounding_mode='ROUND_HALF_AWAY_FROM_ZERO')); INSERT t VALUES(7,7,7)
  existing_away_mode: |-
    CREATE TABLE t(n NUMERIC(5,1) OPTIONS(rounding_mode='ROUND_HALF_AWAY_FROM_ZERO'),b BIGNUMERIC(10,0),away NUMERIC(5,1) OPTIONS(rounding_mode='ROUND_HALF_AWAY_FROM_ZERO')); INSERT t VALUES(7,7,7)
  dataset_body: {"datasetReference": {"datasetId": "${dataset}"}, "location": "US"}
stepTemplates:
  sql: {"sql": "${sql}", "observe": {"error": "/error", "errors": "/body/status/errors", "state": "/body/status/state"}, "expect": {"state": "DONE"}}
  rows:
    sql: |-
      ${sql}
    observe: {"state": "/body/status/state", "error": "/error", "errors": "/body/status/errors", "rows": "/result/rows"}
    expect: {"state": "DONE", "rows": "${rows}"}
  create_dataset: {"rest": {"method": "POST", "path": "/bigquery/v2/projects/${project}/datasets", "body": "${dataset_body}"}}
  delete_dataset: {"rest": {"method": "DELETE", "path": "/bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true"}}
templates:
  updated_default:
    steps:
      - {"name": "create_dataset", "use": "create_dataset"}
      - {"name": "create", "use": "sql", "vars": {"sql": "CREATE TABLE t(old NUMERIC(5,1)) OPTIONS(default_rounding_mode='${old_mode}')"}}
      - name: "update"
        rest:
          method: "${method}"
          path: "/bigquery/v2/projects/${project}/datasets/${dataset}/tables/t"
          body:
            defaultRoundingMode: "${new_mode}"
            schema:
              fields:
                - {"name": "old", "precision": "5", "roundingMode": "${old_mode}", "scale": "1", "type": "NUMERIC"}
                - {"name": "added", "precision": "5", "scale": "1", "type": "NUMERIC"}
                - {"name": "big", "precision": "10", "type": "BIGNUMERIC"}
                - {"fields": [{"name": "nested", "precision": "5", "scale": "1", "type": "NUMERIC"}], "name": "record", "type": "RECORD"}
            tableReference: {"datasetId": "${dataset}", "projectId": "${project}", "tableId": "t"}
      - name: "metadata"
        expect:
          defaultRoundingMode: "${stored_default}"
          schema:
            "$subset":
              fields:
                - {"$subset": {"fields": {"$oneOf": [{"$missing": true}, null, []]}, "name": "old", "roundingMode": "${old_mode}"}}
                - {"$subset": {"fields": {"$oneOf": [{"$missing": true}, null, []]}, "name": "added", "roundingMode": "${added_mode}"}}
                - {"$subset": {"fields": {"$oneOf": [{"$missing": true}, null, []]}, "name": "big", "roundingMode": "${added_mode}"}}
                - "$subset":
                    fields: [{"$subset": {"fields": {"$oneOf": [{"$missing": true}, null, []]}, "name": "nested", "roundingMode": "${added_mode}"}}]
                    name: "record"
                    roundingMode: {"$oneOf": [{"$missing": true}, null, ""]}
        rest: {"method": "GET", "path": "/bigquery/v2/projects/${project}/datasets/${dataset}/tables/t"}
        observe: {"defaultRoundingMode": "/body/defaultRoundingMode", "schema": "/body/schema"}
      - {"name": "insert", "use": "sql", "vars": {"sql": "INSERT t VALUES(2.25,2.25,2.5,STRUCT(NUMERIC '2.25'))"}}
      - name: "values"
        use: "rows"
        vars: {"sql": "SELECT CAST(old AS STRING),CAST(added AS STRING),CAST(big AS STRING),CAST(record.nested AS STRING) FROM t", "rows": "${expected_rows}"}
    cleanup: [{"name": "delete_0", "use": "delete_dataset"}]
  create_load:
    steps:
      - name: "create_dataset"
        use: "create_dataset"
        vars: {"dataset_body": {"datasetReference": {"datasetId": "${dataset}"}, "defaultRoundingMode": "ROUND_HALF_EVEN", "location": "US"}}
      - name: "load"
        job:
          configuration:
            load:
              destinationTable: {"datasetId": "${dataset}", "projectId": "${project}", "tableId": "t"}
              schema: {"fields": "${load_fields}"}
              sourceFormat: "${format}"
          upload: "${input}"
        expect: {"state": "DONE"}
        observe: {"error": "/error", "errors": "/body/status/errors", "state": "/body/status/state"}
      - name: "metadata"
        expect: "${metadata_expect}"
        rest: {"method": "GET", "path": "/bigquery/v2/projects/${project}/datasets/${dataset}/tables/t"}
        observe:
          defaultRoundingMode: "/body/defaultRoundingMode"
          precision: "/body/schema/fields/0/precision"
          scale: "/body/schema/fields/0/scale"
          schema: "/body/schema"
      - name: "values"
        use: "rows"
        vars: {"sql": "SELECT CAST(n AS STRING),CAST(b AS STRING),CAST(away AS STRING) FROM t ORDER BY n", "rows": "${expected_rows}"}
    cleanup: [{"name": "delete_0", "use": "delete_dataset"}]
  replace_load:
    steps:
      - name: "create_dataset"
        use: "create_dataset"
        vars: {"dataset_body": {"datasetReference": {"datasetId": "${dataset}"}, "defaultRoundingMode": "ROUND_HALF_EVEN", "location": "US"}}
      - {"name": "existing", "use": "sql", "vars": {"sql": "${existing_sql}"}}
      - name: "load"
        job:
          configuration:
            load:
              destinationTable: {"datasetId": "${dataset}", "projectId": "${project}", "tableId": "t"}
              schema: {"fields": "${load_fields}"}
              sourceFormat: "${format}"
              writeDisposition: "WRITE_TRUNCATE"
          upload: "${input}"
        expect: {"state": "DONE"}
        observe: {"error": "/error", "errors": "/body/status/errors", "state": "/body/status/state"}
      - name: "metadata"
        expect: "${metadata_expect}"
        rest: {"method": "GET", "path": "/bigquery/v2/projects/${project}/datasets/${dataset}/tables/t"}
        observe:
          defaultRoundingMode: "/body/defaultRoundingMode"
          precision: "/body/schema/fields/0/precision"
          scale: "/body/schema/fields/0/scale"
          schema: "/body/schema"
      - name: "values"
        use: "rows"
        vars: {"sql": "SELECT CAST(n AS STRING),CAST(b AS STRING),CAST(away AS STRING) FROM t ORDER BY n", "rows": "${expected_rows}"}
    cleanup: [{"name": "delete_0", "use": "delete_dataset"}]
  nested_load:
    steps:
      - name: "create_dataset"
        use: "create_dataset"
        vars: {"dataset_body": {"datasetReference": {"datasetId": "${dataset}"}, "defaultRoundingMode": "ROUND_HALF_EVEN", "location": "US"}}
      - name: "load"
        job:
          configuration:
            load:
              destinationTable: {"datasetId": "${dataset}", "projectId": "${project}", "tableId": "t"}
              schema: {"fields": "${load_fields}"}
              sourceFormat: "NEWLINE_DELIMITED_JSON"
          upload: "${input}"
        expect: {"state": "DONE"}
        observe: {"error": "/error", "errors": "/body/status/errors", "state": "/body/status/state"}
      - name: "values"
        use: "rows"
        vars:
          sql: |-
            SELECT CAST(n AS STRING),CAST(b AS STRING),CAST(away AS STRING),CAST(s.n AS STRING),ARRAY_TO_STRING(ARRAY(SELECT CAST(x AS STRING) FROM UNNEST(a) AS x WITH OFFSET ORDER BY offset),',') FROM t
          rows: "${expected_rows}"
    cleanup: [{"name": "delete_0", "use": "delete_dataset"}]
  create_overflow:
    steps:
      - name: "create_dataset"
        use: "create_dataset"
        vars: {"dataset_body": {"datasetReference": {"datasetId": "${dataset}"}, "defaultRoundingMode": "ROUND_HALF_EVEN", "location": "US"}}
      - name: "overflow"
        job:
          configuration:
            load:
              destinationTable: {"datasetId": "${dataset}", "projectId": "${project}", "tableId": "t"}
              schema: {"fields": "${explicit_fields}"}
              sourceFormat: "${format}"
          upload: "${input}"
        expect: {"message": {"$contains": "not in range"}}
        expectFailure: true
        observe: {"message": "/error/message"}
      - name: "absent"
        expect: {}
        expectFailure: true
        rest: {"method": "GET", "path": "/bigquery/v2/projects/${project}/datasets/${dataset}/tables/t"}
        observe: {}
    cleanup: [{"name": "delete_0", "use": "delete_dataset"}]
  replace_overflow:
    steps:
      - name: "create_dataset"
        use: "create_dataset"
        vars: {"dataset_body": {"datasetReference": {"datasetId": "${dataset}"}, "defaultRoundingMode": "ROUND_HALF_EVEN", "location": "US"}}
      - name: "existing"
        use: "sql"
        vars: {"sql": "CREATE TABLE t(n NUMERIC(5,1),b BIGNUMERIC(10,0),away NUMERIC(5,1)); INSERT t VALUES(7,7,7)"}
      - name: "overflow"
        job:
          configuration:
            load:
              destinationTable: {"datasetId": "${dataset}", "projectId": "${project}", "tableId": "t"}
              schema: {"fields": "${explicit_fields}"}
              sourceFormat: "${format}"
              writeDisposition: "WRITE_TRUNCATE"
          upload: "${input}"
        expect: {"message": {"$contains": "not in range"}}
        expectFailure: true
        observe: {"message": "/error/message"}
      - name: "unchanged"
        use: "rows"
        vars:
          sql: |-
            SELECT COUNT(*),CAST(MAX(n) AS STRING),CAST(MAX(b) AS STRING),CAST(MAX(away) AS STRING) FROM t
          rows: [{"f": [{"v": "1"}, {"v": "7"}, {"v": "7"}, {"v": "7"}]}]
    cleanup: [{"name": "delete_0", "use": "delete_dataset"}]
  unparameterized_load:
    steps:
      - {"name": "create_dataset", "use": "create_dataset"}
      - name: "create"
        job:
          configuration:
            load:
              destinationTable: {"datasetId": "${dataset}", "projectId": "${project}", "tableId": "t"}
              schema:
                fields: [{"name": "n", "roundingMode": "ROUND_HALF_EVEN", "type": "NUMERIC"}, {"name": "b", "roundingMode": "ROUND_HALF_EVEN", "type": "BIGNUMERIC"}]
              sourceFormat: "${format}"
              writeDisposition: "WRITE_EMPTY"
          upload: "${input}"
        expect: {"state": "DONE"}
        observe: {"error": "/error", "errors": "/body/status/errors", "state": "/body/status/state"}
      - name: "create_schema"
        expect:
          schema:
            fields:
              "$schema": [{"name": "n", "roundingMode": "ROUND_HALF_EVEN", "type": "NUMERIC"}, {"name": "b", "roundingMode": "ROUND_HALF_EVEN", "type": "BIGNUMERIC"}]
        rest: {"method": "GET", "path": "/bigquery/v2/projects/${project}/datasets/${dataset}/tables/t"}
        observe: {"schema": "/body/schema"}
      - name: "create_values"
        use: "rows"
        vars:
          sql: |-
            SELECT COUNT(*),CAST(MAX(n) AS STRING),CAST(MAX(b) AS STRING) FROM t
          rows: [{"f": [{"v": "1"}, {"v": "2.250000001"}, {"v": "2.50000000000000000000000000000000000001"}]}]
      - name: "replace"
        job:
          configuration:
            load:
              destinationTable: {"datasetId": "${dataset}", "projectId": "${project}", "tableId": "t"}
              schema:
                fields: [{"name": "n", "roundingMode": "ROUND_HALF_EVEN", "type": "NUMERIC"}, {"name": "b", "roundingMode": "ROUND_HALF_EVEN", "type": "BIGNUMERIC"}]
              sourceFormat: "${format}"
              writeDisposition: "WRITE_TRUNCATE"
          upload: "${input}"
        expect: {"state": "DONE"}
        observe: {"error": "/error", "errors": "/body/status/errors", "state": "/body/status/state"}
      - name: "replace_schema"
        expect:
          schema:
            fields:
              "$schema": [{"name": "n", "roundingMode": "ROUND_HALF_EVEN", "type": "NUMERIC"}, {"name": "b", "roundingMode": "ROUND_HALF_EVEN", "type": "BIGNUMERIC"}]
        rest: {"method": "GET", "path": "/bigquery/v2/projects/${project}/datasets/${dataset}/tables/t"}
        observe: {"schema": "/body/schema"}
      - name: "replace_values"
        use: "rows"
        vars:
          sql: |-
            SELECT COUNT(*),CAST(MAX(n) AS STRING),CAST(MAX(b) AS STRING) FROM t
          rows: [{"f": [{"v": "1"}, {"v": "2.250000001"}, {"v": "2.50000000000000000000000000000000000001"}]}]
    cleanup: [{"name": "delete_0", "use": "delete_dataset"}]
cases:
  - name: "column_modes"
    steps:
      - {"name": "create_dataset", "use": "create_dataset"}
      - name: "dml"
        use: "sql"
        vars:
          sql: |-
            CREATE TABLE t (id INT64,
                 even NUMERIC(5, 1) OPTIONS (rounding_mode = 'ROUND_HALF_EVEN'),
                 away NUMERIC(5, 1) OPTIONS (rounding_mode = 'ROUND_HALF_AWAY_FROM_ZERO'),
                 unset NUMERIC(5, 1),
                 big BIGNUMERIC(10, 0) OPTIONS (rounding_mode = 'ROUND_HALF_EVEN'),
                 s STRUCT<n NUMERIC OPTIONS (rounding_mode = 'ROUND_HALF_EVEN')>);
            INSERT t (id, even, away, unset, big) VALUES (1, 2.25, 2.25, 2.25, 1.5), (2, -2.25, -2.25, -2.25, 2.5);
            INSERT t (id, even, away, unset, big) SELECT 3, even, away, unset, big FROM t WHERE id = 1;
            UPDATE t SET even = -even, big = 2.5 WHERE id = 3;
            MERGE t USING (SELECT 4 AS id, NUMERIC '2.25' AS v) AS s ON t.id = s.id
                 WHEN NOT MATCHED THEN INSERT (id, even, big) VALUES (s.id, s.v, 1.5);
            CREATE TABLE ctas (even NUMERIC(5, 1) OPTIONS (rounding_mode = 'ROUND_HALF_EVEN')) AS SELECT NUMERIC '2.25' AS even
      - name: "rounded_rows"
        use: "rows"
        vars:
          sql: |-
            SELECT id, CAST(even AS STRING), CAST(away AS STRING), CAST(unset AS STRING), CAST(big AS STRING) FROM t ORDER BY id
          rows:
            - {"f": [{"v": "1"}, {"v": "2.2"}, {"v": "2.3"}, {"v": "2.3"}, {"v": "2"}]}
            - {"f": [{"v": "2"}, {"v": "-2.2"}, {"v": "-2.3"}, {"v": "-2.3"}, {"v": "2"}]}
            - {"f": [{"v": "3"}, {"v": "-2.2"}, {"v": "2.3"}, {"v": "2.3"}, {"v": "2"}]}
            - {"f": [{"v": "4"}, {"v": "2.2"}, {"v": null}, {"v": null}, {"v": "2"}]}
      - {"name": "ctas", "use": "rows", "vars": {"sql": "SELECT CAST(even AS STRING) FROM ctas", "rows": [{"f": [{"v": "2.2"}]}]}}
      - name: "column_metadata"
        expect:
          schema:
            "$subset":
              fields:
                - {"$subset": {"fields": {"$oneOf": [{"$missing": true}, null, []]}, "name": "id", "roundingMode": {"$oneOf": [{"$missing": true}, null, ""]}}}
                - {"$subset": {"fields": {"$oneOf": [{"$missing": true}, null, []]}, "name": "even", "roundingMode": "ROUND_HALF_EVEN"}}
                - {"$subset": {"fields": {"$oneOf": [{"$missing": true}, null, []]}, "name": "away", "roundingMode": "ROUND_HALF_AWAY_FROM_ZERO"}}
                - {"$subset": {"fields": {"$oneOf": [{"$missing": true}, null, []]}, "name": "unset", "roundingMode": {"$oneOf": [{"$missing": true}, null, ""]}}}
                - {"$subset": {"fields": {"$oneOf": [{"$missing": true}, null, []]}, "name": "big", "roundingMode": "ROUND_HALF_EVEN"}}
                - "$subset":
                    fields: [{"$subset": {"fields": {"$oneOf": [{"$missing": true}, null, []]}, "name": "n", "roundingMode": "ROUND_HALF_EVEN"}}]
                    name: "s"
                    roundingMode: {"$oneOf": [{"$missing": true}, null, ""]}
        rest: {"method": "GET", "path": "/bigquery/v2/projects/${project}/datasets/${dataset}/tables/t"}
        observe: {"schema": "/body/schema"}
      - name: "alter_columns"
        use: "sql"
        vars: {"sql": "ALTER TABLE t ALTER COLUMN even SET OPTIONS (rounding_mode = NULL), ALTER COLUMN unset SET OPTIONS (rounding_mode = 'ROUND_HALF_EVEN')"}
      - name: "field_paths"
        use: "rows"
        vars:
          sql: |-
            SELECT field_path, rounding_mode FROM INFORMATION_SCHEMA.COLUMN_FIELD_PATHS
                WHERE table_name = 't' AND rounding_mode IS NOT NULL ORDER BY field_path
          rows:
            - {"f": [{"v": "away"}, {"v": "ROUND_HALF_AWAY_FROM_ZERO"}]}
            - {"f": [{"v": "big"}, {"v": "ROUND_HALF_EVEN"}]}
            - {"f": [{"v": "s.n"}, {"v": "ROUND_HALF_EVEN"}]}
            - {"f": [{"v": "unset"}, {"v": "ROUND_HALF_EVEN"}]}
      - {"name": "insert_after_alter", "use": "sql", "vars": {"sql": "INSERT t (id, even, unset) VALUES (5, 2.25, 2.25)"}}
      - name: "after_alter"
        use: "rows"
