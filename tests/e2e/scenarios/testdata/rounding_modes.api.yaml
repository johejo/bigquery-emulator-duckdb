# Migrated expectations are from the original Go E2E tests, not emulator output.
version: 1
description: "Migrated from all ten rounding_mode tests. Values come from documented rounding examples and previously collected BigQuery answers; emulator-only rejections remain explicit. SDK PutMultiError decoding remains in Go."
vars: {"dataset": "e2e_${run}_${case}", "even": "ROUND_HALF_EVEN", "away": "ROUND_HALF_AWAY_FROM_ZERO"}
stepTemplates:
  sql:
    sql: |-
      ${sql}
    observe: {"state": "/body/status/state", "error": "/error", "errors": "/body/status/errors"}
cases:
  - name: "column_modes"
    steps:
      - name: "create_dataset"
        rest:
          method: "POST"
          path: "/bigquery/v2/projects/${project}/datasets"
          body: {"datasetReference": {"datasetId": "${dataset}"}, "location": "US"}
      - name: "dml"
        expect: {"state": "DONE"}
        use: "sql"
        vars:
          sql: |-
            CREATE TABLE t (id INT64,
                 even NUMERIC(5, 1) OPTIONS (rounding_mode = 'ROUND_HALF_EVEN'),
                 away NUMERIC(5, 1) OPTIONS (rounding_mode = 'ROUND_HALF_AWAY_FROM_ZERO'),
                 unset NUMERIC(5, 1),
                 big BIGNUMERIC(10, 0) OPTIONS (rounding_mode = 'ROUND_HALF_EVEN'),
                 s STRUCT<n NUMERIC OPTIONS (rounding_mode = 'ROUND_HALF_EVEN')>);
            INSERT t (id, even, away, unset, big) VALUES (1, 2.25, 2.25, 2.25, 1.5), (2, -2.25, -2.25, -2.25, 2.5);
            INSERT t (id, even, away, unset, big) SELECT 3, even, away, unset, big FROM t WHERE id = 1;
            UPDATE t SET even = -even, big = 2.5 WHERE id = 3;
            MERGE t USING (SELECT 4 AS id, NUMERIC '2.25' AS v) AS s ON t.id = s.id
                 WHEN NOT MATCHED THEN INSERT (id, even, big) VALUES (s.id, s.v, 1.5);
            CREATE TABLE ctas (even NUMERIC(5, 1) OPTIONS (rounding_mode = 'ROUND_HALF_EVEN')) AS SELECT NUMERIC '2.25' AS even
      - name: "rounded_rows"
        observe:
          state: "/body/status/state"
          error: "/error"
          errors: "/body/status/errors"
          rows: "/result/rows"
        expect:
          state: "DONE"
          rows:
            - f: [{"v": "1"}, {"v": "2.2"}, {"v": "2.3"}, {"v": "2.3"}, {"v": "2"}]
            - f: [{"v": "2"}, {"v": "-2.2"}, {"v": "-2.3"}, {"v": "-2.3"}, {"v": "2"}]
            - f: [{"v": "3"}, {"v": "-2.2"}, {"v": "2.3"}, {"v": "2.3"}, {"v": "2"}]
            - f: [{"v": "4"}, {"v": "2.2"}, {"v": null}, {"v": null}, {"v": "2"}]
        use: "sql"
        vars:
          sql: |-
            SELECT id, CAST(even AS STRING), CAST(away AS STRING), CAST(unset AS STRING), CAST(big AS STRING) FROM t ORDER BY id
      - name: "ctas"
        observe:
          state: "/body/status/state"
          error: "/error"
          errors: "/body/status/errors"
          rows: "/result/rows"
        expect: {"state": "DONE", "rows": [{"f": [{"v": "2.2"}]}]}
        use: "sql"
        vars: {"sql": "SELECT CAST(even AS STRING) FROM ctas"}
      - name: "column_metadata"
        rest: {"method": "GET", "path": "/bigquery/v2/projects/${project}/datasets/${dataset}/tables/t"}
        observe: {"schema": "/body/schema"}
        expect:
          schema:
            "$subset":
              fields:
                - "$subset":
                    name: "id"
                    roundingMode: {"$oneOf": [{"$missing": true}, null, ""]}
                    fields: {"$oneOf": [{"$missing": true}, null, []]}
                - "$subset":
                    name: "even"
                    roundingMode: "ROUND_HALF_EVEN"
                    fields: {"$oneOf": [{"$missing": true}, null, []]}
                - "$subset":
                    name: "away"
                    roundingMode: "ROUND_HALF_AWAY_FROM_ZERO"
                    fields: {"$oneOf": [{"$missing": true}, null, []]}
                - "$subset":
                    name: "unset"
                    roundingMode: {"$oneOf": [{"$missing": true}, null, ""]}
                    fields: {"$oneOf": [{"$missing": true}, null, []]}
                - "$subset": {"name": "big", "roundingMode": "ROUND_HALF_EVEN", "fields": {"$oneOf": [{"$missing": true}, null, []]}}
                - "$subset":
                    name: "s"
                    roundingMode: {"$oneOf": [{"$missing": true}, null, ""]}
                    fields:
                      - "$subset": {"name": "n", "roundingMode": "ROUND_HALF_EVEN", "fields": {"$oneOf": [{"$missing": true}, null, []]}}
      - name: "alter_columns"
        expect: {"state": "DONE"}
        use: "sql"
        vars:
          sql: |-
            ALTER TABLE t ALTER COLUMN even SET OPTIONS (rounding_mode = NULL), ALTER COLUMN unset SET OPTIONS (rounding_mode = 'ROUND_HALF_EVEN')
      - name: "field_paths"
        observe:
          state: "/body/status/state"
          error: "/error"
          errors: "/body/status/errors"
          rows: "/result/rows"
        expect:
          state: "DONE"
          rows:
            - f: [{"v": "away"}, {"v": "ROUND_HALF_AWAY_FROM_ZERO"}]
            - f: [{"v": "big"}, {"v": "ROUND_HALF_EVEN"}]
            - f: [{"v": "s.n"}, {"v": "ROUND_HALF_EVEN"}]
            - f: [{"v": "unset"}, {"v": "ROUND_HALF_EVEN"}]
        use: "sql"
        vars:
          sql: |-
            SELECT field_path, rounding_mode FROM INFORMATION_SCHEMA.COLUMN_FIELD_PATHS
                WHERE table_name = 't' AND rounding_mode IS NOT NULL ORDER BY field_path
      - name: "insert_after_alter"
        expect: {"state": "DONE"}
        use: "sql"
        vars: {"sql": "INSERT t (id, even, unset) VALUES (5, 2.25, 2.25)"}
      - name: "after_alter"
        observe:
          state: "/body/status/state"
          error: "/error"
          errors: "/body/status/errors"
          rows: "/result/rows"
        expect: {"state": "DONE", "rows": [{"f": [{"v": "2.3"}, {"v": "2.2"}]}]}
        use: "sql"
        vars: {"sql": "SELECT CAST(even AS STRING), CAST(unset AS STRING) FROM t WHERE id = 5"}
      - name: "api"
        rest:
          method: "POST"
          path: "/bigquery/v2/projects/${project}/datasets/${dataset}/tables"
          body:
            tableReference: {"projectId": "${project}", "datasetId": "${dataset}", "tableId": "api"}
            schema:
              fields:
                - name: "even"
                  type: "NUMERIC"
                  precision: "5"
                  scale: "1"
                  roundingMode: "ROUND_HALF_EVEN"
                - name: "away"
                  type: "BIGNUMERIC"
                  roundingMode: "ROUND_HALF_AWAY_FROM_ZERO"
      - name: "api_metadata"
        rest: {"method": "GET", "path": "/bigquery/v2/projects/${project}/datasets/${dataset}/tables/api"}
        observe: {"schema": "/body/schema"}
        expect:
          schema:
            "$subset":
              fields:
                - "$subset":
                    name: "even"
                    roundingMode: "ROUND_HALF_EVEN"
                    fields: {"$oneOf": [{"$missing": true}, null, []]}
                - "$subset":
                    name: "away"
                    roundingMode: "ROUND_HALF_AWAY_FROM_ZERO"
                    fields: {"$oneOf": [{"$missing": true}, null, []]}
      - name: "information_schema"
        observe:
          state: "/body/status/state"
          error: "/error"
          errors: "/body/status/errors"
          rows: "/result/rows"
        expect:
          state: "DONE"
          rows:
            - f: [{"v": "even"}, {"v": "ROUND_HALF_EVEN"}]
            - f: [{"v": "away"}, {"v": "ROUND_HALF_AWAY_FROM_ZERO"}]
        use: "sql"
        vars:
          sql: |-
            SELECT column_name, rounding_mode FROM INFORMATION_SCHEMA.COLUMNS
                WHERE table_name = 'api' ORDER BY ordinal_position
      - name: "additional_form_0"
        expect: {"state": "DONE"}
        use: "sql"
        vars: {"sql": "INSERT t (s) VALUES (STRUCT(NUMERIC '1'))"}
      - name: "additional_form_1"
        expect: {"state": "DONE"}
        use: "sql"
        vars: {"sql": "CREATE TABLE r (n NUMERIC(5, 1) DEFAULT 1 OPTIONS (rounding_mode = 'ROUND_HALF_EVEN'))"}
      - name: "additional_form_2"
        expectFailure: true
        observe: {"message": "/error/message"}
        expect: {"message": {"$contains": "rounding modes on INTEGER fields"}}
        use: "sql"
        vars: {"sql": "CREATE TABLE r (n INT64 OPTIONS (rounding_mode = 'ROUND_HALF_EVEN'))"}
      - name: "additional_form_3"
        expect: {"state": "DONE"}
        use: "sql"
        vars: {"sql": "INSERT api (even) SELECT NUMERIC '2.25'"}
      - name: "copy_already_rounded"
        job:
          configuration:
            copy:
              destinationTable: {"projectId": "${project}", "datasetId": "${dataset}", "tableId": "copied"}
              sourceTables: [{"projectId": "${project}", "datasetId": "${dataset}", "tableId": "api"}]
        observe: {"state": "/body/status/state", "error": "/error", "errors": "/body/status/errors"}
        expect: {"state": "DONE"}
    cleanup:
      - name: "delete_0"
        rest: {"method": "DELETE", "path": "/bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true"}
  - name: "appended_modes"
    steps:
      - name: "create_dataset"
        rest:
          method: "POST"
          path: "/bigquery/v2/projects/${project}/datasets"
          body: {"datasetReference": {"datasetId": "${dataset}"}, "location": "US"}
      - name: "flat"
        rest:
          method: "POST"
          path: "/bigquery/v2/projects/${project}/datasets/${dataset}/tables"
          body:
            tableReference: {"projectId": "${project}", "datasetId": "${dataset}", "tableId": "flat"}
            schema:
              fields:
                - name: "id"
                  type: "INTEGER"
                - name: "even"
                  type: "NUMERIC"
                  precision: "5"
                  scale: "1"
                  roundingMode: "ROUND_HALF_EVEN"
                - name: "away"
                  type: "NUMERIC"
                  precision: "5"
                  scale: "1"
                - name: "big"
                  type: "BIGNUMERIC"
                  precision: "10"
                  roundingMode: "ROUND_HALF_EVEN"
                - name: "big_away"
                  type: "BIGNUMERIC"
                  precision: "10"
      - name: "nested"
        rest:
          method: "POST"
          path: "/bigquery/v2/projects/${project}/datasets/${dataset}/tables"
          body:
            tableReference: {"projectId": "${project}", "datasetId": "${dataset}", "tableId": "nested"}
            schema:
              fields:
                - name: "id"
                  type: "INTEGER"
                - name: "even"
                  type: "NUMERIC"
                  precision: "5"
                  scale: "1"
                  roundingMode: "ROUND_HALF_EVEN"
                - name: "away"
                  type: "NUMERIC"
                  precision: "5"
                  scale: "1"
                - name: "big"
                  type: "BIGNUMERIC"
                  precision: "10"
                  roundingMode: "ROUND_HALF_EVEN"
                - name: "big_away"
                  type: "BIGNUMERIC"
                  precision: "10"
                - name: "s"
                  type: "RECORD"
                  fields: [{"name": "n", "type": "NUMERIC", "precision": "5", "scale": "1", "roundingMode": "ROUND_HALF_EVEN"}]
                - name: "a"
                  type: "NUMERIC"
                  precision: "5"
                  scale: "1"
                  roundingMode: "ROUND_HALF_EVEN"
                  mode: "REPEATED"
      - name: "query_append"
        sql: |-
          SELECT 1 AS id, NUMERIC '2.25' AS even, NUMERIC '2.25' AS away,
              BIGNUMERIC '2.5' AS big, STRUCT(NUMERIC '2.25' AS n) AS s,
              [NUMERIC '2.25', NUMERIC '-2.25', NUMERIC '2.35'] AS a
        queryOptions:
          destinationTable: {"projectId": "${project}", "datasetId": "${dataset}", "tableId": "nested"}
          writeDisposition: "WRITE_APPEND"
        observe: {"state": "/body/status/state", "error": "/error", "errors": "/body/status/errors"}
        expect: {"state": "DONE"}
      - name: "json_load"
        job:
          configuration:
            load:
              destinationTable: {"projectId": "${project}", "datasetId": "${dataset}", "tableId": "nested"}
              sourceFormat: "NEWLINE_DELIMITED_JSON"
          upload: |
            {"id": 2, "even": 2.25, "away": 2.25, "big": 2.5, "big_away": 2.5, "s": {"n": 2.25}, "a": [2.25, -2.25, 2.35]}
            {"id": 3, "even": "-2.25", "away": "2.25"}
        observe: {"state": "/body/status/state", "error": "/error", "errors": "/body/status/errors"}
        expect: {"state": "DONE"}
      - name: "csv_load"
        job:
          configuration:
            load:
              destinationTable: {"projectId": "${project}", "datasetId": "${dataset}", "tableId": "flat"}
              sourceFormat: "CSV"
          upload: |
            4,2.25,2.25,2.5,2.5
            5,-2.25,,,
        observe: {"state": "/body/status/state", "error": "/error", "errors": "/body/status/errors"}
        expect: {"state": "DONE"}
      - name: "streaming_insert"
        rest:
          method: "POST"
          path: "/bigquery/v2/projects/${project}/datasets/${dataset}/tables/nested/insertAll"
          body:
            rows:
              - json:
                  id: 6
                  even: 2.25
                  away: 2.25
                  big: 2.5
                  big_away: 2.5
                  s: {"n": 2.25}
                  a: [2.25, -2.25, 2.35]
              - json: {"id": 7, "even": "-2.25", "away": "2.25", "a": ["2.35"]}
        observe: {"errors": "/body/insertErrors"}
        expect: {"errors": {"$oneOf": [{"$missing": true}, null, []]}}
      - name: "appended_rows"
        observe:
          state: "/body/status/state"
          error: "/error"
          errors: "/body/status/errors"
          rows: "/result/rows"
        expect:
          state: "DONE"
          rows:
            - f: [{"v": "1"}, {"v": "2.2"}, {"v": "2.3"}, {"v": "2"}, {"v": null}, {"v": "2.2"}, {"v": "2.2,-2.2,2.4"}]
            - f: [{"v": "2"}, {"v": "2.2"}, {"v": "2.3"}, {"v": "2"}, {"v": "3"}, {"v": "2.2"}, {"v": "2.2,-2.2,2.4"}]
            - f: [{"v": "3"}, {"v": "-2.2"}, {"v": "2.3"}, {"v": null}, {"v": null}, {"v": null}, {"v": ""}]
            - f: [{"v": "4"}, {"v": "2.2"}, {"v": "2.3"}, {"v": "2"}, {"v": "3"}, {"v": null}, {"v": null}]
            - f: [{"v": "5"}, {"v": "-2.2"}, {"v": null}, {"v": null}, {"v": null}, {"v": null}, {"v": null}]
            - f: [{"v": "6"}, {"v": "2.2"}, {"v": "2.3"}, {"v": "2"}, {"v": "3"}, {"v": "2.2"}, {"v": "2.2,-2.2,2.4"}]
            - f: [{"v": "7"}, {"v": "-2.2"}, {"v": "2.3"}, {"v": null}, {"v": null}, {"v": null}, {"v": "2.4"}]
        use: "sql"
        vars:
          sql: |-
            SELECT id, CAST(even AS STRING), CAST(away AS STRING), CAST(big AS STRING),
                CAST(big_away AS STRING), CAST(s.n AS STRING),
                ARRAY_TO_STRING(ARRAY(SELECT CAST(x AS STRING) FROM UNNEST(a) AS x WITH OFFSET ORDER BY offset), ',')
                FROM ${dataset}.nested
                UNION ALL
                SELECT id, CAST(even AS STRING), CAST(away AS STRING), CAST(big AS STRING),
                CAST(big_away AS STRING), NULL, NULL FROM ${dataset}.flat
                ORDER BY id
      - name: "query_overflow"
        sql: |-
          SELECT NUMERIC '9999.95' AS even
        queryOptions:
          destinationTable: {"projectId": "${project}", "datasetId": "${dataset}", "tableId": "flat"}
          writeDisposition: "WRITE_APPEND"
        expectFailure: true
        observe: {"message": "/error/message"}
        expect:
          message:
            "$contains": "NUMERIC(5, 1) has precision 5 and scale 1 but got a value that is not in range of [-9999.9, 9999.9]"
      - name: "csv_overflow"
        job:
          configuration:
            load:
              destinationTable: {"projectId": "${project}", "datasetId": "${dataset}", "tableId": "flat"}
              sourceFormat: "CSV"
          upload: |
            6,9999.95,,,
        expectFailure: true
        observe: {"message": "/error/message"}
        expect:
          message:
            "$contains": "NUMERIC(5, 1) has precision 5 and scale 1 but got a value that is not in range of [-9999.9, 9999.9]"
      - name: "json_overflow"
        job:
          configuration:
            load:
              destinationTable: {"projectId": "${project}", "datasetId": "${dataset}", "tableId": "flat"}
              sourceFormat: "NEWLINE_DELIMITED_JSON"
          upload: |
            {"id":6,"even":9999.95,"away":1,"big":1,"big_away":1}
        expectFailure: true
        observe: {"message": "/error/message"}
        expect:
          message:
            "$contains": "NUMERIC(5, 1) has precision 5 and scale 1 but got a value that is not in range of [-9999.9, 9999.9]"
      - name: "streaming_overflow"
        rest:
          method: "POST"
          path: "/bigquery/v2/projects/${project}/datasets/${dataset}/tables/nested/insertAll"
          body: {"rows": [{"json": {"id": 8, "even": 9999.95}}]}
        observe: {"errors": "/body/insertErrors"}
        expect:
          errors:
            - "$subset":
                index: 0
                errors:
                  - "$subset":
                      message:
                        "$contains": "NUMERIC(5, 1) has precision 5 and scale 1 but got a value that is not in range of [-9999.9, 9999.9]"
    cleanup:
      - name: "delete_0"
        rest: {"method": "DELETE", "path": "/bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true"}
  - name: "dataset_defaults"
    steps:
      - name: "create_schema"
        sql: |-
          CREATE SCHEMA `${project}.${dataset}` OPTIONS (default_rounding_mode = 'ROUND_HALF_EVEN')
        queryOptions: {"defaultDataset": null}
        observe: {"state": "/body/status/state", "error": "/error", "errors": "/body/status/errors"}
        expect: {"state": "DONE"}
      - name: "create_tables"
        expect: {"state": "DONE"}
        use: "sql"
        vars:
          sql: |-
            CREATE TABLE t (n NUMERIC(5, 1),
                 away NUMERIC(5, 1) OPTIONS (rounding_mode = 'ROUND_HALF_AWAY_FROM_ZERO'),
                 s STRUCT<b BIGNUMERIC>, i INT64);
            CREATE TABLE own (n NUMERIC(5, 1)) OPTIONS (default_rounding_mode = 'ROUND_HALF_AWAY_FROM_ZERO');
            CREATE TABLE q AS SELECT NUMERIC '2.25' AS n;
            CREATE TABLE ctas (n NUMERIC(5, 1)) OPTIONS (default_rounding_mode = 'ROUND_HALF_EVEN')
                 AS SELECT NUMERIC '2.25' AS n
      - name: "api"
        rest:
          method: "POST"
          path: "/bigquery/v2/projects/${project}/datasets/${dataset}/tables"
          body:
            tableReference: {"projectId": "${project}", "datasetId": "${dataset}", "tableId": "api"}
            schema: {"fields": [{"name": "n", "type": "NUMERIC"}]}
      - name: "unsupported_view_option"
        expectFailure: true
        observe: {"message": "/error/message"}
        expect: {"message": {"$contains": "CREATE VIEW option default_rounding_mode"}}
        use: "sql"
        vars: {"sql": "CREATE VIEW v OPTIONS (default_rounding_mode = 'ROUND_HALF_EVEN') AS SELECT 1 AS x"}
      - name: "load"
        job:
          configuration:
            load:
              destinationTable: {"projectId": "${project}", "datasetId": "${dataset}", "tableId": "loaded"}
              sourceFormat: "NEWLINE_DELIMITED_JSON"
              schema: {"fields": [{"name": "n", "type": "NUMERIC"}]}
          upload: |
            {"n":2.25}
        observe: {"state": "/body/status/state", "error": "/error", "errors": "/body/status/errors"}
        expect: {"state": "DONE"}
      - name: "alter_defaults"
        expect: {"state": "DONE"}
        use: "sql"
        vars:
          sql: |-
            ALTER SCHEMA `${project}.${dataset}` SET OPTIONS (default_rounding_mode = 'ROUND_HALF_AWAY_FROM_ZERO');
            ALTER TABLE t ADD COLUMN added NUMERIC(5, 1);
            CREATE TABLE later (n NUMERIC(5, 1));
            ALTER TABLE own SET OPTIONS (default_rounding_mode = 'ROUND_HALF_EVEN');
            ALTER TABLE own ADD COLUMN m NUMERIC(5, 1)
      - name: "before_patch"
        rest: {"method": "GET", "path": "/bigquery/v2/projects/${project}/datasets/${dataset}/tables/t"}
        bind: {"etag": "/body/etag"}
      - name: "add_field"
        rest:
          method: "PATCH"
          path: "/bigquery/v2/projects/${project}/datasets/${dataset}/tables/t"
          body:
            schema:
              fields:
                - name: "n"
                  type: "NUMERIC"
                  precision: "5"
                  scale: "1"
                  roundingMode: "ROUND_HALF_EVEN"
                - name: "away"
                  type: "NUMERIC"
                  precision: "5"
                  scale: "1"
                  roundingMode: "ROUND_HALF_AWAY_FROM_ZERO"
                - name: "s"
                  type: "RECORD"
                  fields: [{"name": "b", "type": "BIGNUMERIC", "roundingMode": "ROUND_HALF_EVEN"}]
                - name: "i"
                  type: "INTEGER"
                - name: "added"
                  type: "NUMERIC"
                  precision: "5"
                  scale: "1"
                  roundingMode: "ROUND_HALF_EVEN"
                - name: "patched"
                  type: "BIGNUMERIC"
          headers: {"If-Match": "${etag}"}
      - name: "t_modes"
        rest: {"method": "GET", "path": "/bigquery/v2/projects/${project}/datasets/${dataset}/tables/t"}
        observe: {"schema": "/body/schema"}
        expect:
          schema:
            "$subset":
              fields:
                - "$subset": {"name": "n", "roundingMode": "ROUND_HALF_EVEN", "fields": {"$oneOf": [{"$missing": true}, null, []]}}
                - "$subset":
                    name: "away"
                    roundingMode: "ROUND_HALF_AWAY_FROM_ZERO"
                    fields: {"$oneOf": [{"$missing": true}, null, []]}
                - "$subset":
                    name: "s"
                    roundingMode: {"$oneOf": [{"$missing": true}, null, ""]}
                    fields:
                      - "$subset": {"name": "b", "roundingMode": "ROUND_HALF_EVEN", "fields": {"$oneOf": [{"$missing": true}, null, []]}}
                - "$subset":
                    name: "i"
                    roundingMode: {"$oneOf": [{"$missing": true}, null, ""]}
                    fields: {"$oneOf": [{"$missing": true}, null, []]}
                - "$subset":
                    name: "added"
                    roundingMode: "ROUND_HALF_EVEN"
                    fields: {"$oneOf": [{"$missing": true}, null, []]}
                - "$subset":
                    name: "patched"
                    roundingMode: "ROUND_HALF_EVEN"
                    fields: {"$oneOf": [{"$missing": true}, null, []]}
      - name: "own_modes"
        rest: {"method": "GET", "path": "/bigquery/v2/projects/${project}/datasets/${dataset}/tables/own"}
        observe: {"schema": "/body/schema"}
        expect:
          schema:
            "$subset":
              fields:
                - "$subset":
                    name: "n"
                    roundingMode: "ROUND_HALF_AWAY_FROM_ZERO"
                    fields: {"$oneOf": [{"$missing": true}, null, []]}
                - "$subset": {"name": "m", "roundingMode": "ROUND_HALF_EVEN", "fields": {"$oneOf": [{"$missing": true}, null, []]}}
      - name: "q_modes"
        rest: {"method": "GET", "path": "/bigquery/v2/projects/${project}/datasets/${dataset}/tables/q"}
        observe: {"schema": "/body/schema"}
        expect:
          schema:
            "$subset":
              fields:
                - "$subset": {"name": "n", "roundingMode": "ROUND_HALF_EVEN", "fields": {"$oneOf": [{"$missing": true}, null, []]}}
      - name: "ctas_modes"
        rest: {"method": "GET", "path": "/bigquery/v2/projects/${project}/datasets/${dataset}/tables/ctas"}
        observe: {"schema": "/body/schema"}
        expect:
