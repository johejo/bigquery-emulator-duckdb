  - name: "appended_modes"
    steps:
      - {"name": "create_dataset", "use": "create_dataset"}
      - name: "flat"
        rest:
          method: "POST"
          path: "/bigquery/v2/projects/${project}/datasets/${dataset}/tables"
          body:
            schema:
              fields:
                - {"name": "id", "type": "INTEGER"}
                - {"name": "even", "precision": "5", "roundingMode": "ROUND_HALF_EVEN", "scale": "1", "type": "NUMERIC"}
                - {"name": "away", "precision": "5", "scale": "1", "type": "NUMERIC"}
                - {"name": "big", "precision": "10", "roundingMode": "ROUND_HALF_EVEN", "type": "BIGNUMERIC"}
                - {"name": "big_away", "precision": "10", "type": "BIGNUMERIC"}
            tableReference: {"datasetId": "${dataset}", "projectId": "${project}", "tableId": "flat"}
      - name: "nested"
        rest:
          method: "POST"
          path: "/bigquery/v2/projects/${project}/datasets/${dataset}/tables"
          body:
            schema:
              fields:
                - {"name": "id", "type": "INTEGER"}
                - {"name": "even", "precision": "5", "roundingMode": "ROUND_HALF_EVEN", "scale": "1", "type": "NUMERIC"}
                - {"name": "away", "precision": "5", "scale": "1", "type": "NUMERIC"}
                - {"name": "big", "precision": "10", "roundingMode": "ROUND_HALF_EVEN", "type": "BIGNUMERIC"}
                - {"name": "big_away", "precision": "10", "type": "BIGNUMERIC"}
                - {"fields": [{"name": "n", "precision": "5", "roundingMode": "ROUND_HALF_EVEN", "scale": "1", "type": "NUMERIC"}], "name": "s", "type": "RECORD"}
                - {"mode": "REPEATED", "name": "a", "precision": "5", "roundingMode": "ROUND_HALF_EVEN", "scale": "1", "type": "NUMERIC"}
            tableReference: {"datasetId": "${dataset}", "projectId": "${project}", "tableId": "nested"}
      - name: "query_append"
        sql: |-
          SELECT 1 AS id, NUMERIC '2.25' AS even, NUMERIC '2.25' AS away,
              BIGNUMERIC '2.5' AS big, STRUCT(NUMERIC '2.25' AS n) AS s,
              [NUMERIC '2.25', NUMERIC '-2.25', NUMERIC '2.35'] AS a
        queryOptions: {"destinationTable": {"datasetId": "${dataset}", "projectId": "${project}", "tableId": "nested"}, "writeDisposition": "WRITE_APPEND"}
        expect: {"state": "DONE"}
        observe: {"error": "/error", "errors": "/body/status/errors", "state": "/body/status/state"}
      - name: "json_load"
        job:
          configuration:
            load: {"destinationTable": {"datasetId": "${dataset}", "projectId": "${project}", "tableId": "nested"}, "sourceFormat": "NEWLINE_DELIMITED_JSON"}
          upload: |
            {"id": 2, "even": 2.25, "away": 2.25, "big": 2.5, "big_away": 2.5, "s": {"n": 2.25}, "a": [2.25, -2.25, 2.35]}
            {"id": 3, "even": "-2.25", "away": "2.25"}
        expect: {"state": "DONE"}
        observe: {"error": "/error", "errors": "/body/status/errors", "state": "/body/status/state"}
      - name: "csv_load"
        job:
          configuration: {"load": {"destinationTable": {"datasetId": "${dataset}", "projectId": "${project}", "tableId": "flat"}, "sourceFormat": "CSV"}}
          upload: |
            4,2.25,2.25,2.5,2.5
            5,-2.25,,,
        expect: {"state": "DONE"}
        observe: {"error": "/error", "errors": "/body/status/errors", "state": "/body/status/state"}
      - name: "streaming_insert"
        expect: {"errors": {"$oneOf": [{"$missing": true}, null, []]}}
        rest:
          method: "POST"
          path: "/bigquery/v2/projects/${project}/datasets/${dataset}/tables/nested/insertAll"
          body:
            rows:
              - {"json": {"a": [2.25, -2.25, 2.35], "away": 2.25, "big": 2.5, "big_away": 2.5, "even": 2.25, "id": 6, "s": {"n": 2.25}}}
              - {"json": {"a": ["2.35"], "away": "2.25", "even": "-2.25", "id": 7}}
        observe: {"errors": "/body/insertErrors"}
      - name: "appended_rows"
        use: "rows"
        vars:
          sql: |-
            SELECT id, CAST(even AS STRING), CAST(away AS STRING), CAST(big AS STRING),
                CAST(big_away AS STRING), CAST(s.n AS STRING),
                ARRAY_TO_STRING(ARRAY(SELECT CAST(x AS STRING) FROM UNNEST(a) AS x WITH OFFSET ORDER BY offset), ',')
                FROM ${dataset}.nested
                UNION ALL
                SELECT id, CAST(even AS STRING), CAST(away AS STRING), CAST(big AS STRING),
                CAST(big_away AS STRING), NULL, NULL FROM ${dataset}.flat
                ORDER BY id
          rows:
            - {"f": [{"v": "1"}, {"v": "2.2"}, {"v": "2.3"}, {"v": "2"}, {"v": null}, {"v": "2.2"}, {"v": "2.2,-2.2,2.4"}]}
            - {"f": [{"v": "2"}, {"v": "2.2"}, {"v": "2.3"}, {"v": "2"}, {"v": "3"}, {"v": "2.2"}, {"v": "2.2,-2.2,2.4"}]}
            - {"f": [{"v": "3"}, {"v": "-2.2"}, {"v": "2.3"}, {"v": null}, {"v": null}, {"v": null}, {"v": ""}]}
            - {"f": [{"v": "4"}, {"v": "2.2"}, {"v": "2.3"}, {"v": "2"}, {"v": "3"}, {"v": null}, {"v": null}]}
            - {"f": [{"v": "5"}, {"v": "-2.2"}, {"v": null}, {"v": null}, {"v": null}, {"v": null}, {"v": null}]}
            - {"f": [{"v": "6"}, {"v": "2.2"}, {"v": "2.3"}, {"v": "2"}, {"v": "3"}, {"v": "2.2"}, {"v": "2.2,-2.2,2.4"}]}
            - {"f": [{"v": "7"}, {"v": "-2.2"}, {"v": "2.3"}, {"v": null}, {"v": null}, {"v": null}, {"v": "2.4"}]}
      - name: "query_overflow"
        sql: |-
          SELECT NUMERIC '9999.95' AS even
        queryOptions: {"destinationTable": {"datasetId": "${dataset}", "projectId": "${project}", "tableId": "flat"}, "writeDisposition": "WRITE_APPEND"}
        expect: {"message": {"$contains": "NUMERIC(5, 1) has precision 5 and scale 1 but got a value that is not in range of [-9999.9, 9999.9]"}}
        expectFailure: true
        observe: {"message": "/error/message"}
      - name: "csv_overflow"
        job:
          configuration: {"load": {"destinationTable": {"datasetId": "${dataset}", "projectId": "${project}", "tableId": "flat"}, "sourceFormat": "CSV"}}
          upload: |
            6,9999.95,,,
        expect: {"message": {"$contains": "NUMERIC(5, 1) has precision 5 and scale 1 but got a value that is not in range of [-9999.9, 9999.9]"}}
        expectFailure: true
        observe: {"message": "/error/message"}
      - name: "json_overflow"
        job:
          configuration:
            load: {"destinationTable": {"datasetId": "${dataset}", "projectId": "${project}", "tableId": "flat"}, "sourceFormat": "NEWLINE_DELIMITED_JSON"}
          upload: |
            {"id":6,"even":9999.95,"away":1,"big":1,"big_away":1}
        expect: {"message": {"$contains": "NUMERIC(5, 1) has precision 5 and scale 1 but got a value that is not in range of [-9999.9, 9999.9]"}}
        expectFailure: true
        observe: {"message": "/error/message"}
      - name: "streaming_overflow"
        expect:
          errors:
            - "$subset":
                errors: [{"$subset": {"message": {"$contains": "NUMERIC(5, 1) has precision 5 and scale 1 but got a value that is not in range of [-9999.9, 9999.9]"}}}]
                index: 0
        rest:
          method: "POST"
          path: "/bigquery/v2/projects/${project}/datasets/${dataset}/tables/nested/insertAll"
          body: {"rows": [{"json": {"even": 9999.95, "id": 8}}]}
        observe: {"errors": "/body/insertErrors"}
    cleanup: [{"name": "delete_0", "use": "delete_dataset"}]
  - name: "dataset_defaults"
    steps:
      - name: "create_schema"
        sql: |-
          CREATE SCHEMA `${project}.${dataset}` OPTIONS (default_rounding_mode = 'ROUND_HALF_EVEN')
        queryOptions: {"defaultDataset": null}
        expect: {"state": "DONE"}
        observe: {"error": "/error", "errors": "/body/status/errors", "state": "/body/status/state"}
      - name: "create_tables"
        use: "sql"
        vars:
          sql: |-
            CREATE TABLE t (n NUMERIC(5, 1),
                 away NUMERIC(5, 1) OPTIONS (rounding_mode = 'ROUND_HALF_AWAY_FROM_ZERO'),
                 s STRUCT<b BIGNUMERIC>, i INT64);
            CREATE TABLE own (n NUMERIC(5, 1)) OPTIONS (default_rounding_mode = 'ROUND_HALF_AWAY_FROM_ZERO');
            CREATE TABLE q AS SELECT NUMERIC '2.25' AS n;
            CREATE TABLE ctas (n NUMERIC(5, 1)) OPTIONS (default_rounding_mode = 'ROUND_HALF_EVEN')
                 AS SELECT NUMERIC '2.25' AS n
      - name: "api"
        rest:
          method: "POST"
          path: "/bigquery/v2/projects/${project}/datasets/${dataset}/tables"
          body:
            schema: {"fields": [{"name": "n", "type": "NUMERIC"}]}
            tableReference: {"datasetId": "${dataset}", "projectId": "${project}", "tableId": "api"}
      - name: "unsupported_view_option"
        use: "sql"
        vars: {"sql": "CREATE VIEW v OPTIONS (default_rounding_mode = 'ROUND_HALF_EVEN') AS SELECT 1 AS x"}
        expect: {"message": {"$contains": "CREATE VIEW option default_rounding_mode"}}
        expectFailure: true
        observe: {"message": "/error/message"}
      - name: "load"
        job:
          configuration:
            load:
              destinationTable: {"datasetId": "${dataset}", "projectId": "${project}", "tableId": "loaded"}
              schema: {"fields": [{"name": "n", "type": "NUMERIC"}]}
              sourceFormat: "NEWLINE_DELIMITED_JSON"
          upload: |
            {"n":2.25}
        expect: {"state": "DONE"}
        observe: {"error": "/error", "errors": "/body/status/errors", "state": "/body/status/state"}
      - name: "alter_defaults"
        use: "sql"
        vars:
          sql: |-
            ALTER SCHEMA `${project}.${dataset}` SET OPTIONS (default_rounding_mode = 'ROUND_HALF_AWAY_FROM_ZERO');
            ALTER TABLE t ADD COLUMN added NUMERIC(5, 1);
            CREATE TABLE later (n NUMERIC(5, 1));
            ALTER TABLE own SET OPTIONS (default_rounding_mode = 'ROUND_HALF_EVEN');
            ALTER TABLE own ADD COLUMN m NUMERIC(5, 1)
      - name: "before_patch"
        rest: {"method": "GET", "path": "/bigquery/v2/projects/${project}/datasets/${dataset}/tables/t"}
        bind: {"etag": "/body/etag"}
      - name: "add_field"
        rest:
          method: "PATCH"
          path: "/bigquery/v2/projects/${project}/datasets/${dataset}/tables/t"
          headers: {"If-Match": "${etag}"}
          body:
            schema:
              fields:
                - {"name": "n", "precision": "5", "roundingMode": "ROUND_HALF_EVEN", "scale": "1", "type": "NUMERIC"}
                - {"name": "away", "precision": "5", "roundingMode": "ROUND_HALF_AWAY_FROM_ZERO", "scale": "1", "type": "NUMERIC"}
                - {"fields": [{"name": "b", "roundingMode": "ROUND_HALF_EVEN", "type": "BIGNUMERIC"}], "name": "s", "type": "RECORD"}
                - {"name": "i", "type": "INTEGER"}
                - {"name": "added", "precision": "5", "roundingMode": "ROUND_HALF_EVEN", "scale": "1", "type": "NUMERIC"}
                - {"name": "patched", "type": "BIGNUMERIC"}
      - name: "t_modes"
        expect:
          schema:
            "$subset":
              fields:
                - {"$subset": {"fields": {"$oneOf": [{"$missing": true}, null, []]}, "name": "n", "roundingMode": "ROUND_HALF_EVEN"}}
                - {"$subset": {"fields": {"$oneOf": [{"$missing": true}, null, []]}, "name": "away", "roundingMode": "ROUND_HALF_AWAY_FROM_ZERO"}}
                - "$subset":
                    fields: [{"$subset": {"fields": {"$oneOf": [{"$missing": true}, null, []]}, "name": "b", "roundingMode": "ROUND_HALF_EVEN"}}]
                    name: "s"
                    roundingMode: {"$oneOf": [{"$missing": true}, null, ""]}
                - {"$subset": {"fields": {"$oneOf": [{"$missing": true}, null, []]}, "name": "i", "roundingMode": {"$oneOf": [{"$missing": true}, null, ""]}}}
                - {"$subset": {"fields": {"$oneOf": [{"$missing": true}, null, []]}, "name": "added", "roundingMode": "ROUND_HALF_EVEN"}}
                - {"$subset": {"fields": {"$oneOf": [{"$missing": true}, null, []]}, "name": "patched", "roundingMode": "ROUND_HALF_EVEN"}}
        rest: {"method": "GET", "path": "/bigquery/v2/projects/${project}/datasets/${dataset}/tables/t"}
        observe: {"schema": "/body/schema"}
      - name: "own_modes"
        expect:
          schema:
            "$subset":
              fields:
                - {"$subset": {"fields": {"$oneOf": [{"$missing": true}, null, []]}, "name": "n", "roundingMode": "ROUND_HALF_AWAY_FROM_ZERO"}}
                - {"$subset": {"fields": {"$oneOf": [{"$missing": true}, null, []]}, "name": "m", "roundingMode": "ROUND_HALF_EVEN"}}
        rest: {"method": "GET", "path": "/bigquery/v2/projects/${project}/datasets/${dataset}/tables/own"}
        observe: {"schema": "/body/schema"}
      - name: "q_modes"
        expect:
          schema: {"$subset": {"fields": [{"$subset": {"fields": {"$oneOf": [{"$missing": true}, null, []]}, "name": "n", "roundingMode": "ROUND_HALF_EVEN"}}]}}
        rest: {"method": "GET", "path": "/bigquery/v2/projects/${project}/datasets/${dataset}/tables/q"}
        observe: {"schema": "/body/schema"}
      - name: "ctas_modes"
        expect:
          schema: {"$subset": {"fields": [{"$subset": {"fields": {"$oneOf": [{"$missing": true}, null, []]}, "name": "n", "roundingMode": "ROUND_HALF_EVEN"}}]}}
        rest: {"method": "GET", "path": "/bigquery/v2/projects/${project}/datasets/${dataset}/tables/ctas"}
        observe: {"schema": "/body/schema"}
      - name: "api_modes"
        expect:
          schema: {"$subset": {"fields": [{"$subset": {"fields": {"$oneOf": [{"$missing": true}, null, []]}, "name": "n", "roundingMode": "ROUND_HALF_EVEN"}}]}}
        rest: {"method": "GET", "path": "/bigquery/v2/projects/${project}/datasets/${dataset}/tables/api"}
        observe: {"schema": "/body/schema"}
      - name: "loaded_modes"
        expect:
          schema: {"$subset": {"fields": [{"$subset": {"fields": {"$oneOf": [{"$missing": true}, null, []]}, "name": "n", "roundingMode": "ROUND_HALF_EVEN"}}]}}
        rest: {"method": "GET", "path": "/bigquery/v2/projects/${project}/datasets/${dataset}/tables/loaded"}
        observe: {"schema": "/body/schema"}
      - name: "later_modes"
        expect:
          schema:
            "$subset": {"fields": [{"$subset": {"fields": {"$oneOf": [{"$missing": true}, null, []]}, "name": "n", "roundingMode": "ROUND_HALF_AWAY_FROM_ZERO"}}]}
        rest: {"method": "GET", "path": "/bigquery/v2/projects/${project}/datasets/${dataset}/tables/later"}
        observe: {"schema": "/body/schema"}
      - {"name": "insert", "use": "sql", "vars": {"sql": "INSERT t (n, away, added) VALUES (2.25, 2.25, 2.25); INSERT own (n, m) VALUES (2.25, 2.25)"}}
      - name: "rows"
        use: "rows"
        vars:
          sql: |-
            SELECT 1 AS k, CAST(n AS STRING), CAST(away AS STRING), CAST(added AS STRING) FROM t
                UNION ALL SELECT 2, CAST(n AS STRING), CAST(m AS STRING), NULL FROM own
                UNION ALL SELECT 3, CAST(n AS STRING), NULL, NULL FROM ctas
                UNION ALL SELECT 4, CAST(n AS STRING), NULL, NULL FROM loaded ORDER BY k
          rows:
            - {"f": [{"v": "1"}, {"v": "2.2"}, {"v": "2.3"}, {"v": "2.2"}]}
            - {"f": [{"v": "2"}, {"v": "2.3"}, {"v": "2.2"}, {"v": null}]}
            - {"f": [{"v": "3"}, {"v": "2.2"}, {"v": null}, {"v": null}]}
            - {"f": [{"v": "4"}, {"v": "2.25"}, {"v": null}, {"v": null}]}
    cleanup: [{"name": "delete_0", "use": "delete_dataset"}]
  - name: "copied_defaults_like"
