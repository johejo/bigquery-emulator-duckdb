version: 1
description: >-
  Storage Write JSON number rounding, overflow and signed zero. Expectations are
  BigQuery's recorded answers in the sidecar.
vars:
  dataset: bqa_${run}_${case}
  stream: projects/${project}/datasets/${dataset}/tables/t/streams/_default
templates:
  json_number:
    steps:
      - name: create_dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: create_table
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            query: CREATE TABLE `${project}.${dataset}.t` (j JSON)
            useLegacySql: false
            location: US
      - name: append
        grpc:
          method: google.cloud.bigquery.storage.v1.BigQueryWrite/AppendRows
          headers:
            x-goog-request-params: write_stream=${stream}
          requests:
            - writeStream: ${stream}
              protoRows:
                writerSchema:
                  protoDescriptor:
                    name: Row
                    field:
                      - {name: j, number: 1, type: TYPE_STRING, label: LABEL_OPTIONAL}
                rows:
                  serializedRows: ['${row}']
        observe:
          code: /code
          errorCode: /messages/0/error/code
      - name: query
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            query: SELECT TO_JSON_STRING(j) AS value FROM `${project}.${dataset}.t`
            useLegacySql: false
            location: US
        observe:
          rows: /body/rows
    cleanup:
      - name: delete_dataset
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
cases:
  - name: wide_integer
    template: json_number
    vars:
      row: ChU5MjIzMzcyMDM2ODU0Nzc1ODA3MDE=
    expect:
      append: {code: OK}
      query: {rows: [{f: [{v: '9.223372036854776e+20'}]}]}
  - name: wide_decimal
    template: json_number
    vars:
      row: ChQxLjIzNDU2Nzg5MDEyMzQ1Njc4OQ==
    expect:
      append: {code: OK}
      query: {rows: [{f: [{v: '1.2345678901234567'}]}]}
  - name: overflow
    template: json_number
    vars:
      row: CgUxZTQwMA==
    expect:
      append: {code: OK, errorCode: 3}
      query: {}
  - name: negative_zero_integer
    template: json_number
    vars:
      row: CgItMA==
    expect:
      append: {code: OK}
      query: {rows: [{f: [{v: '0'}]}]}
  - name: negative_zero_float
    template: json_number
    vars:
      row: CgQtMC4w
    expect:
      append: {code: OK}
      query: {rows: [{f: [{v: '-0.0'}]}]}
