version: 1
# Recorded on BigQuery in run h6v7t44cr44fcchutzvx3ytper; see the adjacent answers file.
description: Verify the schema, version selection and sparse reads of promoted Bigtable qualifiers.
# Fixture: use the Bigtable instance from the bqanswers Bigtable metadata scenario.
# US below is the BigQuery dataset/job location, not a Bigtable cluster location.
# The instance and project passed to cbt must match the URI below. In Bash:
#   bt() { cbt -project "$PROJECT" -instance bqanswers "$@"; }
#   table=bigtable-qualifier-probe
#   bt createtable "$table" families=family_a:maxversions=2,family_b:maxversions=2
#   bt set "$table" both family_a:promoted=old@1000 family_a:promoted=new@2000 \
#     family_a:loose=unlisted@2000 $'family_a:\xff=raw-old@1000' $'family_a:\xff=raw-new@2000'
#   bt set "$table" fallback_only family_a:loose=unlisted@2000
#   bt set "$table" named_only family_a:promoted=solo@2000
#   bt set "$table" other_family family_b:loose=other@2000
# After collecting answers: bt deletetable "$table". The scenario cleans up only its BigQuery dataset.
vars:
  dataset: bqa_${run}_${case}
  uri: https://googleapis.com/bigtable/projects/${project}/instances/bqanswers/tables/bigtable-qualifier-probe
  metadata:
    options:
      readRowkeyAsString: true
      ignoreUnspecifiedColumnFamilies: true
      columnFamilies:
        - familyId: family_a
          type: STRING
          onlyReadLatest: true
          columns:
            - {qualifierString: promoted, onlyReadLatest: false}
            - {qualifierEncoded: /w==, fieldName: binary_name, type: BYTES}
        - {familyId: family_b}
    schema:
      - {name: rowkey, mode: NULLABLE, type: STRING}
      - name: family_a
        mode: NULLABLE
        type: RECORD
        fields:
          - name: column
            mode: REPEATED
            type: RECORD
            fields:
              - {name: name, mode: NULLABLE, type: STRING}
              - name: cell
                mode: NULLABLE
                type: RECORD
                fields:
                  - {name: timestamp, mode: NULLABLE, type: TIMESTAMP}
                  - {name: value, mode: NULLABLE, type: STRING}
          - name: promoted
            mode: NULLABLE
            type: RECORD
            fields:
              - name: cell
                mode: REPEATED
                type: RECORD
                fields:
                  - {name: timestamp, mode: NULLABLE, type: TIMESTAMP}
                  - {name: value, mode: NULLABLE, type: STRING}
          - name: binary_name
            mode: NULLABLE
            type: RECORD
            fields:
              - name: cell
                mode: NULLABLE
                type: RECORD
                fields:
                  - {name: timestamp, mode: NULLABLE, type: TIMESTAMP}
                  - {name: value, mode: NULLABLE, type: BYTES}
      - name: family_b
        mode: NULLABLE
        type: RECORD
        fields:
          - name: column
            mode: REPEATED
            type: RECORD
            fields:
              - {name: name, mode: NULLABLE, type: STRING}
              - name: cell
                mode: REPEATED
                type: RECORD
                fields:
                  - {name: timestamp, mode: NULLABLE, type: TIMESTAMP}
                  - {name: value, mode: NULLABLE, type: BYTES}
  versions: {f: [{v: [{v: {f: [{v: '0.002'}, {v: new}]}}, {v: {f: [{v: '0.001'}, {v: old}]}}]}]}
  solo: {f: [{v: [{v: {f: [{v: '0.002'}, {v: solo}]}}]}]}
  binary: {f: [{v: {f: [{v: '0.002'}, {v: cmF3LW5ldw==}]}}]}
  loose: [{v: {f: [{v: loose}, {v: {f: [{v: '0.002'}, {v: unlisted}]}}]}}]
cases:
  - name: bigtable_qualifiers
    steps:
      - name: dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body: {datasetReference: {datasetId: '${dataset}'}, location: US}
      - name: create_rest
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets/${dataset}/tables
          body:
            tableReference: {tableId: t}
            externalDataConfiguration:
              sourceFormat: BIGTABLE
              sourceUris: ['${uri}']
              bigtableOptions:
                readRowkeyAsString: true
                ignoreUnspecifiedColumnFamilies: true
                columnFamilies:
                  - familyId: family_a
                    type: STRING
                    onlyReadLatest: true
                    columns:
                      - qualifierString: promoted
                        onlyReadLatest: false
                      - qualifierEncoded: /w==
                        fieldName: binary_name
                        type: BYTES
                  - familyId: family_b
      - name: rest_metadata
        rest:
          method: GET
          path: /bigquery/v2/projects/${project}/datasets/${dataset}/tables/t
        observe: {schema: /body/schema/fields, options: /body/externalDataConfiguration/bigtableOptions}
      - name: rowkeys
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            location: US
            useLegacySql: false
            timeoutMs: 100000
            query: SELECT rowkey FROM `${project}.${dataset}.t` ORDER BY rowkey
        observe: {complete: /body/jobComplete, rows: /body/rows}
      - name: promoted_only
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            location: US
            useLegacySql: false
            timeoutMs: 100000
            query: SELECT rowkey, family_a.promoted FROM `${project}.${dataset}.t` ORDER BY rowkey
        observe: {complete: /body/jobComplete, rows: /body/rows}
      - name: encoded_only
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            location: US
            useLegacySql: false
            timeoutMs: 100000
            query: SELECT rowkey, family_a.binary_name FROM `${project}.${dataset}.t` ORDER BY rowkey
        observe: {complete: /body/jobComplete, rows: /body/rows}
      - name: fallback_only
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            location: US
            useLegacySql: false
            timeoutMs: 100000
            query: SELECT rowkey, family_a.column FROM `${project}.${dataset}.t` ORDER BY rowkey
        observe: {complete: /body/jobComplete, rows: /body/rows}
      - name: combined
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            location: US
            useLegacySql: false
            timeoutMs: 100000
            query: |
              SELECT rowkey, family_a.promoted, family_b.column
              FROM `${project}.${dataset}.t` ORDER BY rowkey
        observe: {complete: /body/jobComplete, rows: /body/rows}
      - name: entire_family
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            location: US
            useLegacySql: false
            timeoutMs: 100000
            query: SELECT rowkey, family_a FROM `${project}.${dataset}.t` ORDER BY rowkey
        observe: {complete: /body/jobComplete, rows: /body/rows}
      - name: create_ddl
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            location: US
            useLegacySql: false
            timeoutMs: 100000
            # The DDL reference lists STRING, but the recorded run accepted a singleton array:
            # ../../../../third_party/bigquery_docs/reference/standard-sql/data-definition-language.md#external_table_option_list
            query: |
              CREATE EXTERNAL TABLE `${project}.${dataset}.ddl`
              OPTIONS (
                format = 'CLOUD_BIGTABLE', uris = ['${uri}'],
                bigtable_options = '''{
                  "readRowkeyAsString": true,
                  "ignoreUnspecifiedColumnFamilies": true,
                  "columnFamilies": [
                    {"familyId": "family_a", "type": "STRING", "onlyReadLatest": true, "columns": [
                      {"qualifierString": "promoted", "onlyReadLatest": false},
                      {"qualifierEncoded": "/w==", "fieldName": "binary_name", "type": "BYTES"}
                    ]},
                    {"familyId": "family_b"}
                  ]
                }''');
        observe: {complete: /body/jobComplete}
      - name: ddl_metadata
        rest:
          method: GET
          path: /bigquery/v2/projects/${project}/datasets/${dataset}/tables/ddl
        observe: {schema: /body/schema/fields, options: /body/externalDataConfiguration/bigtableOptions}
    cleanup:
      - name: delete
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
    expect:
      rest_metadata: '${metadata}'
      ddl_metadata: '${metadata}'
      create_ddl: {complete: true}
      rowkeys:
        complete: true
        rows:
          - {f: [{v: both}]}
          - {f: [{v: fallback_only}]}
          - {f: [{v: named_only}]}
          - {f: [{v: other_family}]}
      promoted_only:
        complete: true
        rows:
          - {f: [{v: both}, {v: '${versions}'}]}
          - {f: [{v: named_only}, {v: '${solo}'}]}
      encoded_only:
        complete: true
        rows:
          - {f: [{v: both}, {v: '${binary}'}]}
      fallback_only:
        complete: true
        rows:
          - {f: [{v: both}, {v: '${loose}'}]}
          - {f: [{v: fallback_only}, {v: '${loose}'}]}
          - {f: [{v: named_only}, {v: []}]}
      combined:
        complete: true
        rows:
          - {f: [{v: both}, {v: '${versions}'}, {v: []}]}
          - {f: [{v: named_only}, {v: '${solo}'}, {v: []}]}
          - {f: [{v: other_family}, {v: null}, {v: [{v: {f: [{v: loose}, {v: [{v: {f: [{v: '0.002'}, {v: b3RoZXI=}]}}]}]}}]}]}
      entire_family:
        complete: true
        rows:
          - {f: [{v: both}, {v: {f: [{v: '${loose}'}, {v: '${versions}'}, {v: '${binary}'}]}}]}
          - {f: [{v: fallback_only}, {v: {f: [{v: '${loose}'}, {v: null}, {v: null}]}}]}
          - {f: [{v: named_only}, {v: {f: [{v: []}, {v: '${solo}'}, {v: null}]}}]}
