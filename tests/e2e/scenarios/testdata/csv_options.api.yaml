version: 1
# Recorded on BigQuery in project johejo-sandbox, runs 5mwkshfb5ydqnfom4xo4egeya6 (loads),
# 6zlqmx3pu5h2goqu5bjvus2npt (external tables, in the bucket johejo-sandbox-us) and
# smxwpcc2s6u2up7n2repko64y5 (control_characters, null_markers_empty_integer and the
# external_metadata cases); the answers sidecar keeps the observations. quote_two_characters and
# null_markers_with_null_marker take their expectations from the first collection's output, which
# reported jobs.insert rejecting them.
# Rejected loads and queries observe only their reason, since BigQuery's messages give byte offsets
# and columns the emulator does not report.
# The CSV options of third_party/bigquery_docs/loading-data-cloud-storage-csv.md, shared by load
# jobs and CSV external tables. Beyond the documentation, BigQuery reads a quote within an
# unquoted value as text, and a quoted CRLF as LF; a NULL marker matches quoted values too; an
# empty value is an empty STRING under nullMarker, and under nullMarkers without '', and fails for
# other types under either; by default NUL fails and other control characters but tab and line
# breaks, DEL included, read as spaces. tables.get returns the options as given, and
# INFORMATION_SCHEMA leaves out null_markers and, in its DDL, the default quote, field_delimiter
# and skip_leading_rows; TABLE_OPTIONS lists those given.
description: >-
  CSV quote, allowQuotedNewlines, allowJaggedRows, ignoreUnknownValues, nullMarker, nullMarkers
  and preserveAsciiControlCharacters in load jobs and CSV external tables.
vars:
  dataset: bqa_${run}_${case}
  destination: {projectId: '${project}', datasetId: '${dataset}', tableId: destination}
  schema:
    fields:
      - {name: id, type: INTEGER}
      - {name: s, type: STRING}
  required_schema:
    fields:
      - {name: id, type: INTEGER}
      - {name: s, type: STRING, mode: REQUIRED}
  prefix: gs://${bucket}/${run}/${case}
  # "1,\N,x\n2\n3,\"a\nb\"\n"
  external_csv: MSxcTix4CjIKMywiYQpiIgo=
templates:
  load:
    steps:
      - name: create_dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: load
        rest:
          method: POST
          path: /upload/bigquery/v2/projects/${project}/jobs?uploadType=multipart
          body:
            jobReference: {projectId: '${project}', location: US}
            configuration: '${load_configuration}'
          upload: '${csv}'
        bind: {job: /body/jobReference/jobId}
      - name: completed_load
        rest:
          method: GET
          path: /bigquery/v2/projects/${project}/jobs/${job}?location=US
        until: {/body/status/state: DONE}
        observe:
          status: /body/status
          outputRows: /body/statistics/load/outputRows
      - name: read
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            query: SELECT * FROM `${project}.${dataset}.destination` ORDER BY id
            useLegacySql: false
            location: US
            timeoutMs: 200000
        observe: {errors: /body/errors, rows: /body/rows, message: /body/error/message}
    cleanup:
      - name: delete_dataset
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
  load_bytes:
    steps:
      - name: create_dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: load
        rest:
          method: POST
          path: /upload/bigquery/v2/projects/${project}/jobs?uploadType=multipart
          body:
            jobReference: {projectId: '${project}', location: US}
            configuration: '${load_configuration}'
          uploadBase64: '${csv}'
        bind: {job: /body/jobReference/jobId}
      - name: completed_load
        rest:
          method: GET
          path: /bigquery/v2/projects/${project}/jobs/${job}?location=US
        until: {/body/status/state: DONE}
        observe: {status: /body/status}
      - name: read
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            query: SELECT id, TO_HEX(CAST(s AS BYTES)) AS s FROM `${project}.${dataset}.destination` ORDER BY id
            useLegacySql: false
            location: US
            timeoutMs: 200000
        observe: {errors: /body/errors, rows: /body/rows, message: /body/error/message}
    cleanup:
      - name: delete_dataset
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
  load_rejected:
    steps:
      - name: create_dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: load
        rest:
          method: POST
          path: /upload/bigquery/v2/projects/${project}/jobs?uploadType=multipart
          body:
            jobReference: {projectId: '${project}', location: US}
            configuration: '${load_configuration}'
          upload: '${csv}'
        bind: {job: /body/jobReference/jobId}
      - name: completed_load
        rest:
          method: GET
          path: /bigquery/v2/projects/${project}/jobs/${job}?location=US
        until: {/body/status/state: DONE}
        observe: {reason: /body/status/errorResult/reason}
    cleanup:
      - name: delete_dataset
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
  load_bytes_rejected:
    steps:
      - name: create_dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: load
        rest:
          method: POST
          path: /upload/bigquery/v2/projects/${project}/jobs?uploadType=multipart
          body:
            jobReference: {projectId: '${project}', location: US}
            configuration: '${load_configuration}'
          uploadBase64: '${csv}'
        bind: {job: /body/jobReference/jobId}
      - name: completed_load
        rest:
          method: GET
          path: /bigquery/v2/projects/${project}/jobs/${job}?location=US
        until: {/body/status/state: DONE}
        observe: {reason: /body/status/errorResult/reason}
    cleanup:
      - name: delete_dataset
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
  # jobs.insert rejects the load.
  request_rejected:
    steps:
      - name: create_dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: load
        rest:
          method: POST
          path: /upload/bigquery/v2/projects/${project}/jobs?uploadType=multipart
          body:
            jobReference: {projectId: '${project}', location: US}
            configuration: '${load_configuration}'
          upload: '${csv}'
        expectFailure: true
        observe:
          status: /status
          reason: /body/error/errors/0/reason
          message: /body/error/message
    cleanup:
      - name: delete_dataset
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
  # Creates an external table from external_csv with `create` and reads it back.
  external:
    steps:
      - name: dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: source
        gcs: {method: PUT, object: '${run}/${case}/a.csv', base64: '${external_csv}'}
      - name: create
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/${create_resource}
          body: ${create_body}
        observe:
          status: /status
          errors: /body/errors
      - name: get
        rest:
          method: GET
          path: /bigquery/v2/projects/${project}/datasets/${dataset}/tables/t
        observe:
          status: /status
          external: /body/externalDataConfiguration
      - name: options
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: SELECT option_name, option_type, option_value FROM `${project}.${dataset}.INFORMATION_SCHEMA.TABLE_OPTIONS` WHERE table_name = 't' ORDER BY option_name
        observe:
          errors: /body/errors
          rows: /body/rows
      - name: information_schema
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: SELECT ddl FROM `${project}.${dataset}.INFORMATION_SCHEMA.TABLES` WHERE table_name = 't'
        observe:
          errors: /body/errors
          rows: /body/rows
      - name: query
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: SELECT * FROM `${project}.${dataset}.t` ORDER BY id
        observe:
          status: /status
          errors: /body/errors
          rows: /body/rows
    cleanup:
      - name: delete
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
      - name: delete_source
        gcs: {method: DELETE, object: '${run}/${case}/a.csv'}
  # As external, for a table a query cannot read.
  external_unreadable:
    steps:
      - name: dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: source
        gcs: {method: PUT, object: '${run}/${case}/a.csv', base64: '${external_csv}'}
      - name: create
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/${create_resource}
          body: ${create_body}
        observe:
          status: /status
          errors: /body/errors
      - name: get
        rest:
          method: GET
          path: /bigquery/v2/projects/${project}/datasets/${dataset}/tables/t
        observe:
          status: /status
          external: /body/externalDataConfiguration
      - name: options
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: SELECT option_name, option_type, option_value FROM `${project}.${dataset}.INFORMATION_SCHEMA.TABLE_OPTIONS` WHERE table_name = 't' ORDER BY option_name
        observe:
          errors: /body/errors
          rows: /body/rows
      - name: information_schema
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: SELECT ddl FROM `${project}.${dataset}.INFORMATION_SCHEMA.TABLES` WHERE table_name = 't'
        observe:
          errors: /body/errors
          rows: /body/rows
      - name: query
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: SELECT * FROM `${project}.${dataset}.t` ORDER BY id
        expectFailure: true
        observe:
          status: /status
          reason: /body/error/errors/0/reason
    cleanup:
      - name: delete
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
      - name: delete_source
        gcs: {method: DELETE, object: '${run}/${case}/a.csv'}
  # As external, observing only the metadata.
  external_metadata:
    steps:
      - name: dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: source
        gcs: {method: PUT, object: '${run}/${case}/a.csv', base64: '${external_csv}'}
      - name: create
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: ${ddl}
        observe:
          status: /status
          errors: /body/errors
      - name: get
        rest:
          method: GET
          path: /bigquery/v2/projects/${project}/datasets/${dataset}/tables/t
        observe:
          external: /body/externalDataConfiguration
      - name: options
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: SELECT option_name, option_type, option_value FROM `${project}.${dataset}.INFORMATION_SCHEMA.TABLE_OPTIONS` WHERE table_name = 't' ORDER BY option_name
        observe:
          errors: /body/errors
          rows: /body/rows
      - name: information_schema
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: SELECT ddl FROM `${project}.${dataset}.INFORMATION_SCHEMA.TABLES` WHERE table_name = 't'
        observe:
          errors: /body/errors
          rows: /body/rows
    cleanup:
      - name: delete
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
      - name: delete_source
        gcs: {method: DELETE, object: '${run}/${case}/a.csv'}
cases:
  # quote
  - name: quote_single
    template: load
    vars:
      load_configuration: {load: {destinationTable: '${destination}', sourceFormat: CSV, schema: '${schema}', quote: "'"}}
      csv: "1,'a,b'\n2,'it''s'\n3,\"q\"\n"
    expect: {"completed_load": {"outputRows": "3", "status": {"state": "DONE"}}, "read": {"rows": [{"f": [{"v": "1"}, {"v": "a,b"}]}, {"f": [{"v": "2"}, {"v": "it's"}]}, {"f": [{"v": "3"}, {"v": "\"q\""}]}]}}
  - name: quote_empty
    template: load
    vars:
      load_configuration: {load: {destinationTable: '${destination}', sourceFormat: CSV, schema: '${schema}', quote: ''}}
      csv: "1,\"a\"\n2,a\"b\n"
    expect: {"completed_load": {"outputRows": "2", "status": {"state": "DONE"}}, "read": {"rows": [{"f": [{"v": "1"}, {"v": "\"a\""}]}, {"f": [{"v": "2"}, {"v": "a\"b"}]}]}}
  - name: quote_within_unquoted
    template: load
    vars:
      load_configuration: {load: {destinationTable: '${destination}', sourceFormat: CSV, schema: '${schema}'}}
      csv: "1,a\"b\n"
    expect: {"completed_load": {"outputRows": "1", "status": {"state": "DONE"}}, "read": {"rows": [{"f": [{"v": "1"}, {"v": "a\"b"}]}]}}
  - name: quote_data_after_close
    template: load_rejected
    vars:
      load_configuration: {load: {destinationTable: '${destination}', sourceFormat: CSV, schema: '${schema}'}}
      csv: "1,\"a\"b\n"
    expect: {"completed_load": {"reason": "invalid"}}
  - name: quote_two_characters
    template: request_rejected
    vars:
      load_configuration: {load: {destinationTable: '${destination}', sourceFormat: CSV, schema: '${schema}', quote: "''"}}
      csv: "1,'a'\n"
    expect: {"load": {"status": 400, "reason": "invalid", "message": "Quote char must be at most a single character."}}
  # allowQuotedNewlines
  - name: quoted_newline_default
    template: load_rejected
    vars:
      load_configuration: {load: {destinationTable: '${destination}', sourceFormat: CSV, schema: '${schema}'}}
      csv: "1,\"a\nb\"\n"
    expect: {"completed_load": {"reason": "invalid"}}
  - name: quoted_newline_allowed
    template: load
    vars:
      load_configuration: {load: {destinationTable: '${destination}', sourceFormat: CSV, schema: '${schema}', allowQuotedNewlines: true}}
      csv: "1,\"a\nb\"\n2,\"c\r\nd\"\n"
    expect: {"completed_load": {"outputRows": "2", "status": {"state": "DONE"}}, "read": {"rows": [{"f": [{"v": "1"}, {"v": "a\nb"}]}, {"f": [{"v": "2"}, {"v": "c\nd"}]}]}}
  # allowJaggedRows
  - name: jagged_default
    template: load_rejected
    vars:
      load_configuration: {load: {destinationTable: '${destination}', sourceFormat: CSV, schema: '${schema}'}}
      csv: "1,a\n2\n"
    expect: {"completed_load": {"reason": "invalid"}}
  - name: jagged_allowed
    template: load
    vars:
      load_configuration: {load: {destinationTable: '${destination}', sourceFormat: CSV, schema: '${schema}', allowJaggedRows: true}}
      csv: "1,a\n2\n3,\n"
    expect: {"completed_load": {"outputRows": "3", "status": {"state": "DONE"}}, "read": {"rows": [{"f": [{"v": "1"}, {"v": "a"}]}, {"f": [{"v": "2"}, {"v": null}]}, {"f": [{"v": "3"}, {"v": null}]}]}}
  - name: jagged_required
    template: load_rejected
    vars:
      load_configuration: {load: {destinationTable: '${destination}', sourceFormat: CSV, schema: '${required_schema}', allowJaggedRows: true}}
      csv: "1,a\n2\n"
    expect: {"completed_load": {"reason": "invalid"}}
  # ignoreUnknownValues
  - name: extra_default
    template: load_rejected
    vars:
      load_configuration: {load: {destinationTable: '${destination}', sourceFormat: CSV, schema: '${schema}'}}
      csv: "1,a,x\n"
    expect: {"completed_load": {"reason": "invalid"}}
  - name: extra_ignored
    template: load
    vars:
      load_configuration: {load: {destinationTable: '${destination}', sourceFormat: CSV, schema: '${schema}', ignoreUnknownValues: true}}
      csv: "1,a,x,y\n2,b\n"
    expect: {"completed_load": {"outputRows": "2", "status": {"state": "DONE"}}, "read": {"rows": [{"f": [{"v": "1"}, {"v": "a"}]}, {"f": [{"v": "2"}, {"v": "b"}]}]}}
  # nullMarker and nullMarkers
  - name: null_marker
    template: load
    vars:
      load_configuration: {load: {destinationTable: '${destination}', sourceFormat: CSV, schema: '${schema}', nullMarker: '\N'}}
      csv: "1,\\N\n2,\n3,\"\\N\"\n4,\"\"\n"
    expect: {"completed_load": {"outputRows": "4", "status": {"state": "DONE"}}, "read": {"rows": [{"f": [{"v": "1"}, {"v": null}]}, {"f": [{"v": "2"}, {"v": ""}]}, {"f": [{"v": "3"}, {"v": null}]}, {"f": [{"v": "4"}, {"v": ""}]}]}}
  - name: null_marker_empty_integer
    template: load_rejected
    vars:
      load_configuration: {load: {destinationTable: '${destination}', sourceFormat: CSV, schema: '${schema}', nullMarker: '\N'}}
      csv: ",a\n"
    expect: {"completed_load": {"reason": "invalid"}}
  - name: null_marker_value
    template: load
    vars:
      load_configuration: {load: {destinationTable: '${destination}', sourceFormat: CSV, schema: '${schema}', nullMarker: 'NULL'}}
      csv: "1,NULL\nNULL,null\n"
    expect: {"completed_load": {"outputRows": "2", "status": {"state": "DONE"}}, "read": {"rows": [{"f": [{"v": null}, {"v": "null"}]}, {"f": [{"v": "1"}, {"v": null}]}]}}
  - name: null_markers
    template: load
    vars:
      load_configuration: {load: {destinationTable: '${destination}', sourceFormat: CSV, schema: '${schema}', nullMarkers: ['\N', NA]}}
      csv: "1,NA\n2,\\N\n3,\n"
    expect: {"completed_load": {"outputRows": "3", "status": {"state": "DONE"}}, "read": {"rows": [{"f": [{"v": "1"}, {"v": null}]}, {"f": [{"v": "2"}, {"v": null}]}, {"f": [{"v": "3"}, {"v": ""}]}]}}
  - name: null_markers_empty_string
    template: load
    vars:
      load_configuration: {load: {destinationTable: '${destination}', sourceFormat: CSV, schema: '${schema}', nullMarkers: ['', NA]}}
      csv: "1,\n,NA\n"
    expect: {"completed_load": {"outputRows": "2", "status": {"state": "DONE"}}, "read": {"rows": [{"f": [{"v": null}, {"v": null}]}, {"f": [{"v": "1"}, {"v": null}]}]}}
  - name: null_markers_empty_integer
    template: load_rejected
    vars:
      load_configuration: {load: {destinationTable: '${destination}', sourceFormat: CSV, schema: '${schema}', nullMarkers: [NA]}}
      csv: ",a\n"
    expect: {"completed_load": {"reason": "invalid"}}
  - name: null_markers_with_null_marker
    template: request_rejected
    vars:
      load_configuration: {load: {destinationTable: '${destination}', sourceFormat: CSV, schema: '${schema}', nullMarker: NA, nullMarkers: [NA]}}
      csv: "1,NA\n"
    expect: {"load": {"status": 400, "reason": "invalid", "message": "null_marker and null_markers cannot be used at the same time. Please use null_markers to specify the NULL values in your CSV file."}}
  # preserveAsciiControlCharacters
  - name: nul_default
    template: load_bytes_rejected
    vars:
      load_configuration: {load: {destinationTable: '${destination}', sourceFormat: CSV, schema: '${schema}'}}
      # "1,a\0b\n"
      csv: MSxhAGIK
    expect: {"completed_load": {"reason": "invalid"}}
  - name: nul_preserved
    template: load_bytes
    vars:
      load_configuration: {load: {destinationTable: '${destination}', sourceFormat: CSV, schema: '${schema}', preserveAsciiControlCharacters: true}}
      csv: MSxhAGIK
    expect: {"completed_load": {"status": {"state": "DONE"}}, "read": {"rows": [{"f": [{"v": "1"}, {"v": "610062"}]}]}}
  - name: control_default
    template: load_bytes
    vars:
      load_configuration: {load: {destinationTable: '${destination}', sourceFormat: CSV, schema: '${schema}'}}
      # "1,a\x01b\n"
      csv: MSxhAWIK
    expect: {"completed_load": {"status": {"state": "DONE"}}, "read": {"rows": [{"f": [{"v": "1"}, {"v": "612062"}]}]}}
  - name: control_characters
    template: load_bytes
    vars:
      load_configuration: {load: {destinationTable: '${destination}', sourceFormat: CSV, schema: '${schema}'}}
      # "1,a\x0bb\n2,a\x1fb\n3,a\x7fb\n4,\"a\tb\"\n"
      csv: MSxhC2IKMixhH2IKMyxhf2IKNCwiYQliIgo=
    expect: {"completed_load": {"status": {"state": "DONE"}}, "read": {"rows": [{"f": [{"v": "1"}, {"v": "612062"}]}, {"f": [{"v": "2"}, {"v": "612062"}]}, {"f": [{"v": "3"}, {"v": "612062"}]}, {"f": [{"v": "4"}, {"v": "610962"}]}]}}
  # External tables: the options as stored, returned and applied by queries.
  - name: external_ddl
    template: external
    vars:
      create_resource: queries
      create_body:
        useLegacySql: false
        location: US
        timeoutMs: 200000
        query: >-
          CREATE EXTERNAL TABLE `${project}.${dataset}.t` (id INT64, s STRING) OPTIONS (format = 'CSV',
          uris = ['${prefix}/a.csv'], quote = '"', allow_quoted_newlines = true, allow_jagged_rows = true,
          ignore_unknown_values = true, null_marker = '\\N', preserve_ascii_control_characters = true)
