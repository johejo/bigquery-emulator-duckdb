# Migrated expectations are from the original Go E2E tests, not emulator output.
version: 1
description: "All three creation-path workflows: REST/DDL/query/load/copy schemas and defaults, INFORMATION_SCHEMA agreement, append/truncate semantics and atomic rejected replacements."
vars: {"dataset": "e2e_${run}_${case}"}
stepTemplates:
  sql:
    sql: |-
      ${sql}
    observe: {"state": "/body/status/state", "error": "/error", "errors": "/body/status/errors"}
cases:
  - name: "creation_paths"
    steps:
      - name: "create_dataset"
        rest:
          method: "POST"
          path: "/bigquery/v2/projects/${project}/datasets"
          body: {"datasetReference": {"datasetId": "${dataset}"}, "location": "US"}
      - name: "create_rest"
        rest:
          method: "POST"
          path: "/bigquery/v2/projects/${project}/datasets/${dataset}/tables"
          body:
            tableReference: {"projectId": "${project}", "datasetId": "${dataset}", "tableId": "rest"}
            schema:
              fields:
                - name: "id"
                  type: "INTEGER"
                  mode: "REQUIRED"
                  description: "key"
                - name: "name"
                  type: "STRING"
                  defaultValueExpression: "'none'"
                - name: "tags"
                  type: "STRING"
                  mode: "REPEATED"
            description: "the table"
            friendlyName: "Paths"
            labels: {"env": "dev"}
      - name: "rest_metadata"
        rest: {"method": "GET", "path": "/bigquery/v2/projects/${project}/datasets/${dataset}/tables/rest"}
        observe:
          schema: "/body/schema"
          description: "/body/description"
          friendlyName: "/body/friendlyName"
          labels: "/body/labels"
        expect:
          schema:
            fields:
              "$schema":
                - name: "id"
                  type: "INTEGER"
                  mode: "REQUIRED"
                  description: "key"
                - name: "name"
                  type: "STRING"
                  defaultValueExpression: "'none'"
                - name: "tags"
                  type: "STRING"
                  mode: "REPEATED"
          description: "the table"
          friendlyName: "Paths"
          labels: {"env": "dev"}
        bind: {"rest_metadata_created": "/body/creationTime", "rest_metadata_fields": "/body/schema/fields"}
      - name: "rest_metadata_creation_time"
        observe:
          state: "/body/status/state"
          error: "/error"
          errors: "/body/status/errors"
          rows: "/result/rows"
        expect: {"state": "DONE", "rows": [{"f": [{"v": "true"}]}]}
        use: "sql"
        vars:
          sql: |-
            SELECT creation_time = TIMESTAMP_MILLIS(${rest_metadata_created}) FROM INFORMATION_SCHEMA.TABLES WHERE table_name = 'rest'
      - name: "rest_metadata_columns"
        observe:
          state: "/body/status/state"
          error: "/error"
          errors: "/body/status/errors"
          rows: "/result/rows"
        expect:
          state: "DONE"
          rows:
            - f: [{"v": "id"}, {"v": "NO"}, {"v": "INT64"}, {"v": "NULL"}]
            - f: [{"v": "name"}, {"v": "YES"}, {"v": "STRING"}, {"v": "'none'"}]
        bind: {"rest_metadata_columns": "/result/rows"}
        use: "sql"
        vars:
          sql: |-
            SELECT column_name,is_nullable,data_type,IFNULL(column_default,'NULL') FROM INFORMATION_SCHEMA.COLUMNS WHERE table_name = 'rest' AND data_type NOT LIKE 'ARRAY%' ORDER BY ordinal_position
      - name: "rest_metadata_paths"
        observe:
          state: "/body/status/state"
          error: "/error"
          errors: "/body/status/errors"
          rows: "/result/rows"
        expect:
          state: "DONE"
          rows:
            - f: [{"v": "id"}, {"v": "key"}]
            - f: [{"v": "name"}, {"v": ""}]
            - f: [{"v": "tags"}, {"v": ""}]
        bind: {"rest_metadata_paths": "/result/rows"}
        use: "sql"
        vars:
          sql: |-
            SELECT field_path,IFNULL(description,'') FROM INFORMATION_SCHEMA.COLUMN_FIELD_PATHS WHERE table_name = 'rest' ORDER BY field_path
      - name: "rest_insert"
        expect: {"state": "DONE"}
        use: "sql"
        vars: {"sql": "INSERT rest (id) VALUES (10)"}
      - name: "rest_defaults"
        observe:
          state: "/body/status/state"
          error: "/error"
          errors: "/body/status/errors"
          rows: "/result/rows"
        expect: {"state": "DONE", "rows": [{"f": [{"v": "none"}, {"v": "0"}]}]}
        use: "sql"
        vars: {"sql": "SELECT name,ARRAY_LENGTH(tags) FROM rest WHERE id = 10"}
      - name: "rest_required"
        expectFailure: true
        observe: {}
        expect: {}
        use: "sql"
        vars: {"sql": "INSERT rest (name) VALUES ('no id')"}
      - name: "create_ddl"
        expect: {"state": "DONE"}
        use: "sql"
        vars:
          sql: |-
            CREATE TABLE ddl (
                    id INT64 NOT NULL OPTIONS (description = 'key'), name STRING DEFAULT 'none', tags ARRAY<STRING>)
                    OPTIONS (description = 'the table', friendly_name = 'Paths', labels = [('env', 'dev')])
      - name: "ddl_metadata"
        rest: {"method": "GET", "path": "/bigquery/v2/projects/${project}/datasets/${dataset}/tables/ddl"}
        observe:
          schema: "/body/schema"
          description: "/body/description"
          friendlyName: "/body/friendlyName"
          labels: "/body/labels"
        expect:
          schema:
            fields:
              "$schema":
                - name: "id"
                  type: "INTEGER"
                  mode: "REQUIRED"
                  description: "key"
                - name: "name"
                  type: "STRING"
                  defaultValueExpression: "'none'"
                - name: "tags"
                  type: "STRING"
                  mode: "REPEATED"
          description: "the table"
          friendlyName: "Paths"
          labels: {"env": "dev"}
        bind: {"ddl_metadata_created": "/body/creationTime", "ddl_metadata_fields": "/body/schema/fields"}
      - name: "ddl_metadata_creation_time"
        observe:
          state: "/body/status/state"
          error: "/error"
          errors: "/body/status/errors"
          rows: "/result/rows"
        expect: {"state": "DONE", "rows": [{"f": [{"v": "true"}]}]}
        use: "sql"
        vars:
          sql: |-
            SELECT creation_time = TIMESTAMP_MILLIS(${ddl_metadata_created}) FROM INFORMATION_SCHEMA.TABLES WHERE table_name = 'ddl'
      - name: "ddl_metadata_columns"
        observe:
          state: "/body/status/state"
          error: "/error"
          errors: "/body/status/errors"
          rows: "/result/rows"
        expect:
          state: "DONE"
          rows:
            - f: [{"v": "id"}, {"v": "NO"}, {"v": "INT64"}, {"v": "NULL"}]
            - f: [{"v": "name"}, {"v": "YES"}, {"v": "STRING"}, {"v": "'none'"}]
        bind: {"ddl_metadata_columns": "/result/rows"}
        use: "sql"
        vars:
          sql: |-
            SELECT column_name,is_nullable,data_type,IFNULL(column_default,'NULL') FROM INFORMATION_SCHEMA.COLUMNS WHERE table_name = 'ddl' AND data_type NOT LIKE 'ARRAY%' ORDER BY ordinal_position
      - name: "ddl_metadata_paths"
        observe:
          state: "/body/status/state"
          error: "/error"
          errors: "/body/status/errors"
          rows: "/result/rows"
        expect:
          state: "DONE"
          rows:
            - f: [{"v": "id"}, {"v": "key"}]
            - f: [{"v": "name"}, {"v": ""}]
            - f: [{"v": "tags"}, {"v": ""}]
        bind: {"ddl_metadata_paths": "/result/rows"}
        use: "sql"
        vars:
          sql: |-
            SELECT field_path,IFNULL(description,'') FROM INFORMATION_SCHEMA.COLUMN_FIELD_PATHS WHERE table_name = 'ddl' ORDER BY field_path
      - name: "ddl_insert"
        expect: {"state": "DONE"}
        use: "sql"
        vars: {"sql": "INSERT ddl (id) VALUES (11)"}
      - name: "ddl_defaults"
        observe:
          state: "/body/status/state"
          error: "/error"
          errors: "/body/status/errors"
          rows: "/result/rows"
        expect: {"state": "DONE", "rows": [{"f": [{"v": "none"}, {"v": "0"}]}]}
        use: "sql"
        vars: {"sql": "SELECT name,ARRAY_LENGTH(tags) FROM ddl WHERE id = 11"}
      - name: "ddl_required"
        expectFailure: true
        observe: {}
        expect: {}
        use: "sql"
        vars: {"sql": "INSERT ddl (name) VALUES ('no id')"}
      - name: "create_query"
        sql: |-
          SELECT 0 AS id, 'a' AS name, ['x'] AS tags
        queryOptions:
          destinationTable: {"projectId": "${project}", "datasetId": "${dataset}", "tableId": "query"}
          writeDisposition: "WRITE_EMPTY"
        observe: {"state": "/body/status/state", "error": "/error", "errors": "/body/status/errors"}
        expect: {"state": "DONE"}
      - name: "query_metadata"
        rest: {"method": "GET", "path": "/bigquery/v2/projects/${project}/datasets/${dataset}/tables/query"}
        observe:
          schema: "/body/schema"
          description: "/body/description"
          friendlyName: "/body/friendlyName"
          labels: "/body/labels"
        expect:
          schema:
            fields:
              "$schema":
                - name: "id"
                  type: "INTEGER"
                - name: "name"
                  type: "STRING"
                - name: "tags"
                  type: "STRING"
                  mode: "REPEATED"
          description: {"$oneOf": [{"$missing": true}, null, ""]}
          friendlyName: {"$oneOf": [{"$missing": true}, null, ""]}
          labels: {"$oneOf": [{"$missing": true}, null, {}]}
        bind: {"query_metadata_created": "/body/creationTime", "query_metadata_fields": "/body/schema/fields"}
      - name: "query_metadata_creation_time"
        observe:
          state: "/body/status/state"
          error: "/error"
          errors: "/body/status/errors"
          rows: "/result/rows"
        expect: {"state": "DONE", "rows": [{"f": [{"v": "true"}]}]}
        use: "sql"
        vars:
          sql: |-
            SELECT creation_time = TIMESTAMP_MILLIS(${query_metadata_created}) FROM INFORMATION_SCHEMA.TABLES WHERE table_name = 'query'
      - name: "query_metadata_columns"
        observe:
          state: "/body/status/state"
          error: "/error"
          errors: "/body/status/errors"
          rows: "/result/rows"
        expect:
          state: "DONE"
          rows:
            - f: [{"v": "id"}, {"v": "YES"}, {"v": "INT64"}, {"v": "NULL"}]
            - f: [{"v": "name"}, {"v": "YES"}, {"v": "STRING"}, {"v": "NULL"}]
        bind: {"query_metadata_columns": "/result/rows"}
        use: "sql"
        vars:
          sql: |-
            SELECT column_name,is_nullable,data_type,IFNULL(column_default,'NULL') FROM INFORMATION_SCHEMA.COLUMNS WHERE table_name = 'query' AND data_type NOT LIKE 'ARRAY%' ORDER BY ordinal_position
      - name: "query_metadata_paths"
        observe:
          state: "/body/status/state"
          error: "/error"
          errors: "/body/status/errors"
          rows: "/result/rows"
        expect:
          state: "DONE"
          rows: [{"f": [{"v": "id"}, {"v": ""}]}, {"f": [{"v": "name"}, {"v": ""}]}, {"f": [{"v": "tags"}, {"v": ""}]}]
        bind: {"query_metadata_paths": "/result/rows"}
        use: "sql"
        vars:
          sql: |-
            SELECT field_path,IFNULL(description,'') FROM INFORMATION_SCHEMA.COLUMN_FIELD_PATHS WHERE table_name = 'query' ORDER BY field_path
      - name: "query_insert"
        expect: {"state": "DONE"}
        use: "sql"
        vars: {"sql": "INSERT query (id) VALUES (12)"}
      - name: "query_defaults"
        observe:
          state: "/body/status/state"
          error: "/error"
          errors: "/body/status/errors"
          rows: "/result/rows"
        expect: {"state": "DONE", "rows": [{"f": [{"v": null}, {"v": "0"}]}]}
        use: "sql"
        vars: {"sql": "SELECT name,ARRAY_LENGTH(tags) FROM query WHERE id = 12"}
      - name: "create_load"
        job:
          configuration:
            load:
              destinationTable: {"projectId": "${project}", "datasetId": "${dataset}", "tableId": "load"}
              sourceFormat: "NEWLINE_DELIMITED_JSON"
              schema:
                fields:
                  - name: "id"
                    type: "INTEGER"
                    mode: "REQUIRED"
                    description: "key"
                  - name: "name"
                    type: "STRING"
                  - name: "tags"
                    type: "STRING"
                    mode: "REPEATED"
              writeDisposition: "WRITE_EMPTY"
          upload: "{\"id\":0,\"name\":\"a\",\"tags\":[\"x\"]}"
        observe: {"state": "/body/status/state", "error": "/error", "errors": "/body/status/errors"}
        expect: {"state": "DONE"}
      - name: "load_metadata"
        rest: {"method": "GET", "path": "/bigquery/v2/projects/${project}/datasets/${dataset}/tables/load"}
        observe:
          schema: "/body/schema"
          description: "/body/description"
          friendlyName: "/body/friendlyName"
          labels: "/body/labels"
        expect:
          schema:
            fields:
              "$schema":
                - name: "id"
                  type: "INTEGER"
                  mode: "REQUIRED"
                  description: "key"
                - name: "name"
                  type: "STRING"
                - name: "tags"
                  type: "STRING"
                  mode: "REPEATED"
          description: {"$oneOf": [{"$missing": true}, null, ""]}
          friendlyName: {"$oneOf": [{"$missing": true}, null, ""]}
          labels: {"$oneOf": [{"$missing": true}, null, {}]}
        bind: {"load_metadata_created": "/body/creationTime", "load_metadata_fields": "/body/schema/fields"}
      - name: "load_metadata_creation_time"
        observe:
          state: "/body/status/state"
          error: "/error"
          errors: "/body/status/errors"
          rows: "/result/rows"
        expect: {"state": "DONE", "rows": [{"f": [{"v": "true"}]}]}
        use: "sql"
        vars:
          sql: |-
            SELECT creation_time = TIMESTAMP_MILLIS(${load_metadata_created}) FROM INFORMATION_SCHEMA.TABLES WHERE table_name = 'load'
      - name: "load_metadata_columns"
        observe:
          state: "/body/status/state"
          error: "/error"
          errors: "/body/status/errors"
          rows: "/result/rows"
        expect:
          state: "DONE"
          rows:
            - f: [{"v": "id"}, {"v": "NO"}, {"v": "INT64"}, {"v": "NULL"}]
            - f: [{"v": "name"}, {"v": "YES"}, {"v": "STRING"}, {"v": "NULL"}]
        bind: {"load_metadata_columns": "/result/rows"}
        use: "sql"
        vars:
          sql: |-
            SELECT column_name,is_nullable,data_type,IFNULL(column_default,'NULL') FROM INFORMATION_SCHEMA.COLUMNS WHERE table_name = 'load' AND data_type NOT LIKE 'ARRAY%' ORDER BY ordinal_position
      - name: "load_metadata_paths"
        observe:
          state: "/body/status/state"
          error: "/error"
          errors: "/body/status/errors"
          rows: "/result/rows"
        expect:
          state: "DONE"
          rows:
            - f: [{"v": "id"}, {"v": "key"}]
            - f: [{"v": "name"}, {"v": ""}]
            - f: [{"v": "tags"}, {"v": ""}]
        bind: {"load_metadata_paths": "/result/rows"}
        use: "sql"
        vars:
