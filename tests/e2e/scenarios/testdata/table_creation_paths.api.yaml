            SELECT column_name,is_nullable,data_type,IFNULL(column_default,'NULL') FROM INFORMATION_SCHEMA.COLUMNS WHERE table_name = 'copy_defaults' AND data_type NOT LIKE 'ARRAY%' ORDER BY ordinal_position
