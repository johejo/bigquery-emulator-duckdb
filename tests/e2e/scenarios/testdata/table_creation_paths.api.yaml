          error: "/error"
          errors: "/body/status/errors"
          rows: "/result/rows"
        expect: {"state": "DONE", "rows": [{"f": [{"v": null}, {"v": "0"}]}]}
        use: "sql"
        vars: {"sql": "SELECT name,ARRAY_LENGTH(tags) FROM load WHERE id = 13"}
      - name: "load_required"
        expectFailure: true
        observe: {}
        expect: {}
        use: "sql"
        vars: {"sql": "INSERT load (name) VALUES ('no id')"}
      - name: "create_copy"
        job:
          configuration:
            copy:
              destinationTable: {"projectId": "${project}", "datasetId": "${dataset}", "tableId": "copy"}
              sourceTables: [{"projectId": "${project}", "datasetId": "${dataset}", "tableId": "load"}]
              writeDisposition: "WRITE_EMPTY"
        observe: {"state": "/body/status/state", "error": "/error", "errors": "/body/status/errors"}
        expect: {"state": "DONE"}
      - name: "copy_metadata"
        rest: {"method": "GET", "path": "/bigquery/v2/projects/${project}/datasets/${dataset}/tables/copy"}
        observe: {"schema": "/body/schema"}
        expect:
          schema:
            fields:
              "$schema":
                - name: "id"
                  type: "INTEGER"
                  mode: "REQUIRED"
                  description: "key"
                - name: "name"
                  type: "STRING"
                - name: "tags"
                  type: "STRING"
                  mode: "REPEATED"
        bind: {"copy_metadata_created": "/body/creationTime", "copy_metadata_fields": "/body/schema/fields"}
