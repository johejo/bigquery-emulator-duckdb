# Expectations are preserved from the original Go E2E tests and recorded BigQuery answers.
version: 1
description: "All three creation-path workflows: REST/DDL/query/load/copy schemas and defaults, INFORMATION_SCHEMA agreement, append/truncate semantics and atomic rejected replacements."
vars:
  dataset: "e2e_${run}_${case}"
  declared_metadata:
    description: "the table"
    friendlyName: "Paths"
    labels: {"env": "dev"}
    schema:
      fields:
        "$schema":
          - {"description": "key", "mode": "REQUIRED", "name": "id", "type": "INTEGER"}
          - {"defaultValueExpression": "'none'", "name": "name", "type": "STRING"}
          - {"mode": "REPEATED", "name": "tags", "type": "STRING"}
  unchanged_target_metadata:
    creationTime: "${before_created}"
    description: "the table"
    friendlyName: {"$oneOf": [{"$missing": true}, null, ""]}
    labels: {"env": "dev"}
    schema: {"fields": {"$schema": "${before_fields}"}}
  unchanged_keep_metadata:
    creationTime: "${before_created}"
    description: "the table"
    friendlyName: "Keep"
    labels: {"env": "dev"}
    numRows: "1"
    schema: {"fields": {"$schema": "${before_fields}"}}
  declared_columns:
    rows: [{"f": [{"v": "id"}, {"v": "NO"}, {"v": "INT64"}, {"v": "NULL"}]}, {"f": [{"v": "name"}, {"v": "YES"}, {"v": "STRING"}, {"v": "'none'"}]}]
    state: "DONE"
  query_columns:
    rows: [{"f": [{"v": "id"}, {"v": "YES"}, {"v": "INT64"}, {"v": "NULL"}]}, {"f": [{"v": "name"}, {"v": "YES"}, {"v": "STRING"}, {"v": "NULL"}]}]
    state: "DONE"
  load_columns:
    rows: [{"f": [{"v": "id"}, {"v": "NO"}, {"v": "INT64"}, {"v": "NULL"}]}, {"f": [{"v": "name"}, {"v": "YES"}, {"v": "STRING"}, {"v": "NULL"}]}]
    state: "DONE"
  unchanged_columns: {"columns": "${before_columns}", "state": "DONE"}
  declared_paths: {"rows": [{"f": [{"v": "id"}, {"v": "key"}]}, {"f": [{"v": "name"}, {"v": ""}]}, {"f": [{"v": "tags"}, {"v": ""}]}], "state": "DONE"}
  unchanged_paths: {"paths": "${before_paths}", "state": "DONE"}
  dataset_body: {"datasetReference": {"datasetId": "${dataset}"}, "location": "US"}
stepTemplates:
  sql: {"sql": "${sql}", "observe": {"error": "/error", "errors": "/body/status/errors", "state": "/body/status/state"}, "expect": {"state": "DONE"}}
  rows:
    sql: |-
      ${sql}
    observe: {"state": "/body/status/state", "error": "/error", "errors": "/body/status/errors", "rows": "/result/rows"}
    expect: {"state": "DONE", "rows": "${rows}"}
  snapshot_metadata:
    expect: "${metadata_expect}"
    rest: {"method": "GET", "path": "/bigquery/v2/projects/${project}/datasets/${dataset}/tables/${table}"}
    bind: {"created": "/body/creationTime", "fields": "/body/schema/fields"}
    observe: {"description": "/body/description", "friendlyName": "/body/friendlyName", "labels": "/body/labels", "schema": "/body/schema"}
  snapshot_creation_time:
    sql: |-
      SELECT creation_time = TIMESTAMP_MILLIS(${created}) FROM INFORMATION_SCHEMA.TABLES WHERE table_name = '${table}'
    observe: {"state": "/body/status/state", "error": "/error", "errors": "/body/status/errors", "rows": "/result/rows"}
    expect: {"state": "DONE", "rows": [{"f": [{"v": "true"}]}]}
  snapshot_columns:
    expect: "${columns_expect}"
    bind: {"columns": "/result/rows"}
    observe: {"error": "/error", "errors": "/body/status/errors", "rows": "/result/rows", "state": "/body/status/state"}
    sql: |-
      SELECT column_name,is_nullable,data_type,IFNULL(column_default,'NULL') FROM INFORMATION_SCHEMA.COLUMNS WHERE table_name = '${table}' AND data_type NOT LIKE 'ARRAY%' ORDER BY ordinal_position
  snapshot_paths:
    expect: "${paths_expect}"
    bind: {"paths": "/result/rows"}
    observe: {"error": "/error", "errors": "/body/status/errors", "rows": "/result/rows", "state": "/body/status/state"}
    sql: |-
      SELECT field_path,IFNULL(description,'') FROM INFORMATION_SCHEMA.COLUMN_FIELD_PATHS WHERE table_name = '${table}' ORDER BY field_path
  create_dataset: {"rest": {"method": "POST", "path": "/bigquery/v2/projects/${project}/datasets", "body": "${dataset_body}"}}
  delete_dataset: {"rest": {"method": "DELETE", "path": "/bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true"}}
stepGroups:
  table_snapshot:
    - {"name": "metadata", "use": "snapshot_metadata"}
    - {"name": "creation_time", "use": "snapshot_creation_time"}
    - {"name": "columns", "use": "snapshot_columns"}
    - {"name": "paths", "use": "snapshot_paths"}
  schema_snapshot:
    - {"name": "metadata", "use": "snapshot_metadata", "observe": {"schema": "/body/schema"}}
    - {"name": "creation_time", "use": "snapshot_creation_time"}
    - {"name": "columns", "use": "snapshot_columns"}
    - {"name": "paths", "use": "snapshot_paths"}
  unchanged_table:
    - name: "metadata"
      use: "snapshot_metadata"
      observe:
        creationTime: "/body/creationTime"
        description: "/body/description"
        friendlyName: "/body/friendlyName"
        labels: "/body/labels"
        schema: "/body/schema"
    - {"name": "creation_time", "use": "snapshot_creation_time"}
    - name: "columns"
      use: "snapshot_columns"
      observe: {"columns": "/result/rows", "error": "/error", "errors": "/body/status/errors", "state": "/body/status/state"}
    - name: "paths"
      use: "snapshot_paths"
      observe: {"error": "/error", "errors": "/body/status/errors", "paths": "/result/rows", "state": "/body/status/state"}
  table_with_rows:
    - name: "metadata"
      use: "snapshot_metadata"
      observe:
        description: "/body/description"
        friendlyName: "/body/friendlyName"
        labels: "/body/labels"
        numRows: "/body/numRows"
        schema: "/body/schema"
    - {"name": "creation_time", "use": "snapshot_creation_time"}
    - {"name": "columns", "use": "snapshot_columns"}
    - {"name": "paths", "use": "snapshot_paths"}
  unchanged_table_with_rows:
    - name: "metadata"
      use: "snapshot_metadata"
      observe:
        creationTime: "/body/creationTime"
        description: "/body/description"
        friendlyName: "/body/friendlyName"
        labels: "/body/labels"
        numRows: "/body/numRows"
        schema: "/body/schema"
    - {"name": "creation_time", "use": "snapshot_creation_time"}
    - name: "columns"
      use: "snapshot_columns"
      observe: {"columns": "/result/rows", "error": "/error", "errors": "/body/status/errors", "state": "/body/status/state"}
    - name: "paths"
      use: "snapshot_paths"
      observe: {"error": "/error", "errors": "/body/status/errors", "paths": "/result/rows", "state": "/body/status/state"}
cases:
  - name: "creation_paths"
    steps:
      - {"name": "create_dataset", "use": "create_dataset"}
      - name: "create_rest"
        rest:
          method: "POST"
          path: "/bigquery/v2/projects/${project}/datasets/${dataset}/tables"
          body:
            description: "the table"
            friendlyName: "Paths"
            labels: {"env": "dev"}
            schema:
              fields:
                - {"description": "key", "mode": "REQUIRED", "name": "id", "type": "INTEGER"}
                - {"defaultValueExpression": "'none'", "name": "name", "type": "STRING"}
                - {"mode": "REPEATED", "name": "tags", "type": "STRING"}
            tableReference: {"datasetId": "${dataset}", "projectId": "${project}", "tableId": "rest"}
      - name: "rest_metadata"
        group: "table_snapshot"
        vars: {"table": "rest", "metadata_expect": "${declared_metadata}", "columns_expect": "${declared_columns}", "paths_expect": "${declared_paths}"}
      - {"name": "rest_insert", "use": "sql", "vars": {"sql": "INSERT rest (id) VALUES (10)"}}
      - name: "rest_defaults"
        use: "rows"
        vars: {"sql": "SELECT name,ARRAY_LENGTH(tags) FROM rest WHERE id = 10", "rows": [{"f": [{"v": "none"}, {"v": "0"}]}]}
      - name: "rest_required"
        use: "sql"
        vars: {"sql": "INSERT rest (name) VALUES ('no id')"}
        expect: {}
        expectFailure: true
        observe: {}
      - name: "create_ddl"
        use: "sql"
        vars:
          sql: |-
            CREATE TABLE ddl (
                    id INT64 NOT NULL OPTIONS (description = 'key'), name STRING DEFAULT 'none', tags ARRAY<STRING>)
                    OPTIONS (description = 'the table', friendly_name = 'Paths', labels = [('env', 'dev')])
      - name: "ddl_metadata"
        group: "table_snapshot"
        vars: {"table": "ddl", "metadata_expect": "${declared_metadata}", "columns_expect": "${declared_columns}", "paths_expect": "${declared_paths}"}
      - {"name": "ddl_insert", "use": "sql", "vars": {"sql": "INSERT ddl (id) VALUES (11)"}}
      - name: "ddl_defaults"
        use: "rows"
        vars: {"sql": "SELECT name,ARRAY_LENGTH(tags) FROM ddl WHERE id = 11", "rows": [{"f": [{"v": "none"}, {"v": "0"}]}]}
      - {"name": "ddl_required", "use": "sql", "vars": {"sql": "INSERT ddl (name) VALUES ('no id')"}, "expect": {}, "expectFailure": true, "observe": {}}
      - name: "create_query"
        sql: |-
          SELECT 0 AS id, 'a' AS name, ['x'] AS tags
        queryOptions: {"destinationTable": {"datasetId": "${dataset}", "projectId": "${project}", "tableId": "query"}, "writeDisposition": "WRITE_EMPTY"}
        expect: {"state": "DONE"}
        observe: {"error": "/error", "errors": "/body/status/errors", "state": "/body/status/state"}
      - name: "query_metadata"
        group: "table_snapshot"
        vars:
          table: "query"
          metadata_expect:
            description: {"$oneOf": [{"$missing": true}, null, ""]}
            friendlyName: {"$oneOf": [{"$missing": true}, null, ""]}
            labels: {"$oneOf": [{"$missing": true}, null, {}]}
            schema:
              fields: {"$schema": [{"name": "id", "type": "INTEGER"}, {"name": "name", "type": "STRING"}, {"mode": "REPEATED", "name": "tags", "type": "STRING"}]}
          columns_expect: "${query_columns}"
          paths_expect: {"rows": [{"f": [{"v": "id"}, {"v": ""}]}, {"f": [{"v": "name"}, {"v": ""}]}, {"f": [{"v": "tags"}, {"v": ""}]}], "state": "DONE"}
      - {"name": "query_insert", "use": "sql", "vars": {"sql": "INSERT query (id) VALUES (12)"}}
      - name: "query_defaults"
        use: "rows"
        vars: {"sql": "SELECT name,ARRAY_LENGTH(tags) FROM query WHERE id = 12", "rows": [{"f": [{"v": null}, {"v": "0"}]}]}
      - name: "create_load"
        job:
          configuration:
            load:
              destinationTable: {"datasetId": "${dataset}", "projectId": "${project}", "tableId": "load"}
              schema:
                fields:
                  - {"description": "key", "mode": "REQUIRED", "name": "id", "type": "INTEGER"}
                  - {"name": "name", "type": "STRING"}
                  - {"mode": "REPEATED", "name": "tags", "type": "STRING"}
              sourceFormat: "NEWLINE_DELIMITED_JSON"
              writeDisposition: "WRITE_EMPTY"
          upload: "{\"id\":0,\"name\":\"a\",\"tags\":[\"x\"]}"
        expect: {"state": "DONE"}
        observe: {"error": "/error", "errors": "/body/status/errors", "state": "/body/status/state"}
      - name: "load_metadata"
        group: "table_snapshot"
        vars:
          table: "load"
          metadata_expect:
            description: {"$oneOf": [{"$missing": true}, null, ""]}
            friendlyName: {"$oneOf": [{"$missing": true}, null, ""]}
            labels: {"$oneOf": [{"$missing": true}, null, {}]}
            schema:
              fields:
                "$schema":
                  - {"description": "key", "mode": "REQUIRED", "name": "id", "type": "INTEGER"}
                  - {"name": "name", "type": "STRING"}
                  - {"mode": "REPEATED", "name": "tags", "type": "STRING"}
          columns_expect: "${load_columns}"
          paths_expect: "${declared_paths}"
      - {"name": "load_insert", "use": "sql", "vars": {"sql": "INSERT load (id) VALUES (13)"}}
      - name: "load_defaults"
        use: "rows"
        vars: {"sql": "SELECT name,ARRAY_LENGTH(tags) FROM load WHERE id = 13", "rows": [{"f": [{"v": null}, {"v": "0"}]}]}
      - name: "load_required"
        use: "sql"
        vars: {"sql": "INSERT load (name) VALUES ('no id')"}
        expect: {}
        expectFailure: true
        observe: {}
      - name: "create_copy"
        job:
          configuration:
            copy:
              destinationTable: {"datasetId": "${dataset}", "projectId": "${project}", "tableId": "copy"}
              sourceTables: [{"datasetId": "${dataset}", "projectId": "${project}", "tableId": "load"}]
              writeDisposition: "WRITE_EMPTY"
        expect: {"state": "DONE"}
        observe: {"error": "/error", "errors": "/body/status/errors", "state": "/body/status/state"}
      - name: "copy_metadata"
        group: "schema_snapshot"
        vars:
          table: "copy"
          metadata_expect:
            schema:
              fields:
                "$schema":
                  - {"description": "key", "mode": "REQUIRED", "name": "id", "type": "INTEGER"}
                  - {"name": "name", "type": "STRING"}
                  - {"mode": "REPEATED", "name": "tags", "type": "STRING"}
          columns_expect: "${load_columns}"
          paths_expect: "${declared_paths}"
      - {"name": "copy_insert", "use": "sql", "vars": {"sql": "INSERT copy (id) VALUES (14)"}}
      - name: "copy_defaults"
        use: "rows"
        vars: {"sql": "SELECT name,ARRAY_LENGTH(tags) FROM copy WHERE id = 14", "rows": [{"f": [{"v": null}, {"v": "0"}]}]}
      - name: "copy_required"
        use: "sql"
        vars: {"sql": "INSERT copy (name) VALUES ('no id')"}
        expect: {}
        expectFailure: true
        observe: {}
      - name: "create_copy_defaults"
        job:
          configuration:
            copy:
              destinationTable: {"datasetId": "${dataset}", "projectId": "${project}", "tableId": "copy_defaults"}
              sourceTables: [{"datasetId": "${dataset}", "projectId": "${project}", "tableId": "ddl"}]
              writeDisposition: "WRITE_EMPTY"
        expect: {"state": "DONE"}
        observe: {"error": "/error", "errors": "/body/status/errors", "state": "/body/status/state"}
      - name: "copy_defaults_metadata"
        group: "schema_snapshot"
        vars:
          table: "copy_defaults"
          metadata_expect:
            schema:
              fields:
                "$schema":
                  - {"description": "key", "mode": "REQUIRED", "name": "id", "type": "INTEGER"}
                  - {"defaultValueExpression": "'none'", "name": "name", "type": "STRING"}
                  - {"mode": "REPEATED", "name": "tags", "type": "STRING"}
          columns_expect: "${declared_columns}"
          paths_expect: "${declared_paths}"
      - {"name": "copy_defaults_insert", "use": "sql", "vars": {"sql": "INSERT copy_defaults (id) VALUES (15)"}}
      - name: "copy_defaults_defaults"
        use: "rows"
        vars: {"sql": "SELECT name,ARRAY_LENGTH(tags) FROM copy_defaults WHERE id = 15", "rows": [{"f": [{"v": "none"}, {"v": "0"}]}]}
      - name: "copy_defaults_required"
        use: "sql"
        vars: {"sql": "INSERT copy_defaults (name) VALUES ('no id')"}
        expect: {}
        expectFailure: true
        observe: {}
      - name: "invalid_default"
        expect: {}
        expectFailure: true
        rest:
          method: "POST"
          path: "/bigquery/v2/projects/${project}/datasets/${dataset}/tables"
          body:
            schema: {"fields": [{"defaultValueExpression": "'one'", "name": "id", "type": "INTEGER"}]}
            tableReference: {"datasetId": "${dataset}", "projectId": "${project}", "tableId": "bad_default"}
        observe: {}
      - name: "failed_ddl"
        use: "sql"
        vars: {"sql": "CREATE TABLE failed_ddl AS SELECT ERROR('boom') AS id"}
        expect: {}
        expectFailure: true
        observe: {}
      - name: "failed_ddl_absent"
        expect: {}
        expectFailure: true
        rest: {"method": "GET", "path": "/bigquery/v2/projects/${project}/datasets/${dataset}/tables/failed_ddl"}
        observe: {}
      - name: "failed_query"
        sql: |-
          SELECT ERROR('boom') AS id
        queryOptions: {"destinationTable": {"datasetId": "${dataset}", "projectId": "${project}", "tableId": "failed_query"}, "writeDisposition": "WRITE_EMPTY"}
        expect: {}
        expectFailure: true
        observe: {}
      - name: "failed_query_absent"
        expect: {}
        expectFailure: true
        rest: {"method": "GET", "path": "/bigquery/v2/projects/${project}/datasets/${dataset}/tables/failed_query"}
        observe: {}
      - name: "failed_load"
        job:
          configuration:
            load:
              destinationTable: {"datasetId": "${dataset}", "projectId": "${project}", "tableId": "failed_load"}
              schema: {"fields": [{"description": "key", "mode": "REQUIRED", "name": "id", "type": "INTEGER"}]}
              sourceFormat: "NEWLINE_DELIMITED_JSON"
              writeDisposition: "WRITE_TRUNCATE"
          upload: "{\"id\":null}"
        expect: {}
        expectFailure: true
        observe: {}
      - name: "failed_load_absent"
        expect: {}
        expectFailure: true
        rest: {"method": "GET", "path": "/bigquery/v2/projects/${project}/datasets/${dataset}/tables/failed_load"}
        observe: {}
    cleanup: [{"name": "delete_0", "use": "delete_dataset"}]
  - name: "writes_to_existing_tables"
    steps:
      - {"name": "create_dataset", "use": "create_dataset"}
      - name: "setup"
        use: "sql"
        vars:
          sql: |-
            CREATE TABLE target (id INT64 OPTIONS (description = 'key'), name STRING DEFAULT 'none', tags ARRAY<STRING>)
                OPTIONS (description = 'the table', labels = [('env', 'dev')]);CREATE TABLE narrow (id INT64, tags ARRAY<STRING>);INSERT narrow (id) VALUES (9)
      - name: "before"
        group: "table_snapshot"
        vars:
          table: "target"
          metadata_expect:
            description: "the table"
            friendlyName: {"$oneOf": [{"$missing": true}, null, ""]}
            labels: {"env": "dev"}
            schema:
              fields:
                "$schema":
                  - {"description": "key", "name": "id", "type": "INTEGER"}
                  - {"defaultValueExpression": "'none'", "name": "name", "type": "STRING"}
                  - {"mode": "REPEATED", "name": "tags", "type": "STRING"}
          columns_expect:
            rows: [{"f": [{"v": "id"}, {"v": "YES"}, {"v": "INT64"}, {"v": "NULL"}]}, {"f": [{"v": "name"}, {"v": "YES"}, {"v": "STRING"}, {"v": "'none'"}]}]
            state: "DONE"
          paths_expect: "${declared_paths}"
      - name: "query_append"
        sql: |-
          SELECT 1 AS id
        queryOptions: {"destinationTable": {"datasetId": "${dataset}", "projectId": "${project}", "tableId": "target"}, "writeDisposition": "WRITE_APPEND"}
        expect: {"state": "DONE"}
        observe: {"error": "/error", "errors": "/body/status/errors", "state": "/body/status/state"}
      - name: "after_query_append"
        group: "unchanged_table"
        vars:
          table: "target"
          metadata_expect: "${unchanged_target_metadata}"
          columns_expect: "${unchanged_columns}"
          paths_expect: "${unchanged_paths}"
      - name: "load_omitted"
        job:
          configuration:
            load:
              destinationTable: {"datasetId": "${dataset}", "projectId": "${project}", "tableId": "target"}
              schema: {"fields": [{"name": "id", "type": "INTEGER"}]}
              sourceFormat: "NEWLINE_DELIMITED_JSON"
              writeDisposition: "WRITE_APPEND"
          upload: "{\"id\":2}"
        expect: {"state": "DONE"}
        observe: {"error": "/error", "errors": "/body/status/errors", "state": "/body/status/state"}
      - name: "load_null"
        job:
          configuration:
            load:
              destinationTable: {"datasetId": "${dataset}", "projectId": "${project}", "tableId": "target"}
              schema: {"fields": [{"name": "id", "type": "INTEGER"}, {"name": "name", "type": "STRING"}]}
              sourceFormat: "NEWLINE_DELIMITED_JSON"
              writeDisposition: "WRITE_APPEND"
          upload: "{\"id\":3,\"name\":null}"
        expect: {"state": "DONE"}
        observe: {"error": "/error", "errors": "/body/status/errors", "state": "/body/status/state"}
      - name: "appended_rows"
        use: "rows"
        vars:
          sql: |-
            SELECT id,name FROM target ORDER BY id
          rows: [{"f": [{"v": "1"}, {"v": "none"}]}, {"f": [{"v": "2"}, {"v": "none"}]}, {"f": [{"v": "3"}, {"v": null}]}]
      - name: "rejected_copy"
        job:
          configuration:
            copy:
              destinationTable: {"datasetId": "${dataset}", "projectId": "${project}", "tableId": "target"}
              sourceTables: [{"datasetId": "${dataset}", "projectId": "${project}", "tableId": "narrow"}]
              writeDisposition: "WRITE_APPEND"
        expect: {}
        expectFailure: true
        observe: {}
      - {"name": "copy_kept_three_rows", "use": "rows", "vars": {"sql": "SELECT COUNT(*) FROM target", "rows": [{"f": [{"v": "3"}]}]}}
      - name: "after_rejected_copy"
        group: "unchanged_table"
        vars:
          table: "target"
          metadata_expect: "${unchanged_target_metadata}"
          columns_expect: "${unchanged_columns}"
          paths_expect: "${unchanged_paths}"
      - name: "truncate_data"
        sql: |-
          SELECT 4 AS id
        queryOptions: {"destinationTable": {"datasetId": "${dataset}", "projectId": "${project}", "tableId": "target"}, "writeDisposition": "WRITE_TRUNCATE_DATA"}
        expect: {"state": "DONE"}
        observe: {"error": "/error", "errors": "/body/status/errors", "state": "/body/status/state"}
      - name: "truncate_data_rows"
        use: "rows"
        vars: {"sql": "SELECT id,name FROM target ORDER BY id", "rows": [{"f": [{"v": "4"}, {"v": "none"}]}]}
      - name: "after_truncate_data"
        group: "unchanged_table"
        vars:
          table: "target"
          metadata_expect: "${unchanged_target_metadata}"
          columns_expect: "${unchanged_columns}"
          paths_expect: "${unchanged_paths}"
      - name: "truncate"
        sql: |-
          SELECT 5 AS id,'five' AS name
        queryOptions: {"destinationTable": {"datasetId": "${dataset}", "projectId": "${project}", "tableId": "target"}, "writeDisposition": "WRITE_TRUNCATE"}
        expect: {"state": "DONE"}
        observe: {"error": "/error", "errors": "/body/status/errors", "state": "/body/status/state"}
      - name: "replaced"
        group: "schema_snapshot"
        vars:
          table: "target"
          metadata_expect: {"schema": {"fields": {"$schema": [{"name": "id", "type": "INTEGER"}, {"name": "name", "type": "STRING"}]}}}
          columns_expect: "${query_columns}"
          paths_expect: {"rows": [{"f": [{"v": "id"}, {"v": ""}]}, {"f": [{"v": "name"}, {"v": ""}]}], "state": "DONE"}
      - {"name": "truncate_rows", "use": "rows", "vars": {"sql": "SELECT id,name FROM target ORDER BY id", "rows": [{"f": [{"v": "5"}, {"v": "five"}]}]}}
    cleanup: [{"name": "delete_0", "use": "delete_dataset"}]
  - name: "failed_replacements"
    steps:
      - {"name": "create_dataset", "use": "create_dataset"}
      - name: "setup"
        use: "sql"
        vars:
          sql: |-
            CREATE TABLE keep (id INT64 NOT NULL OPTIONS (description = 'key'), name STRING DEFAULT 'none')
                OPTIONS (description = 'the table', friendly_name = 'Keep', labels = [('env', 'dev')]);INSERT keep (id) VALUES (1);CREATE TABLE other (id INT64)
      - name: "before"
        group: "table_with_rows"
        vars:
          table: "keep"
          metadata_expect:
            description: "the table"
            friendlyName: "Keep"
            labels: {"env": "dev"}
            numRows: "1"
            schema:
              fields:
                "$schema":
                  - {"description": "key", "mode": "REQUIRED", "name": "id", "type": "INTEGER"}
                  - {"defaultValueExpression": "'none'", "name": "name", "type": "STRING"}
          columns_expect: "${declared_columns}"
          paths_expect: {"rows": [{"f": [{"v": "id"}, {"v": "key"}]}, {"f": [{"v": "name"}, {"v": ""}]}], "state": "DONE"}
      - {"name": "existing_ddl", "use": "sql", "vars": {"sql": "CREATE TABLE keep (id INT64)"}, "expect": {}, "expectFailure": true, "observe": {}}
      - name: "after_existing_ddl"
        group: "unchanged_table_with_rows"
