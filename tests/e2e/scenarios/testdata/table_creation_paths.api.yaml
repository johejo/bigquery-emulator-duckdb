            SELECT creation_time = TIMESTAMP_MILLIS(${copy_defaults_metadata_created}) FROM INFORMATION_SCHEMA.TABLES WHERE table_name = 'copy_defaults'
      - name: "copy_defaults_metadata_columns"
        observe:
          state: "/body/status/state"
          error: "/error"
          errors: "/body/status/errors"
          rows: "/result/rows"
        expect:
          state: "DONE"
          rows:
            - f: [{"v": "id"}, {"v": "NO"}, {"v": "INT64"}, {"v": "NULL"}]
