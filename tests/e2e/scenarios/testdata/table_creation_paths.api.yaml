        rest:
          method: "POST"
          path: "/bigquery/v2/projects/${project}/datasets/${dataset}/tables"
          body:
            tableReference: {"projectId": "${project}", "datasetId": "${dataset}", "tableId": "bad_default"}
            schema: {"fields": [{"name": "id", "type": "INTEGER", "defaultValueExpression": "'one'"}]}
        expectFailure: true
        observe: {}
        expect: {}
      - name: "failed_ddl"
        expectFailure: true
        observe: {}
        expect: {}
        use: "sql"
        vars: {"sql": "CREATE TABLE failed_ddl AS SELECT ERROR('boom') AS id"}
      - name: "failed_ddl_absent"
        rest: {"method": "GET", "path": "/bigquery/v2/projects/${project}/datasets/${dataset}/tables/failed_ddl"}
        expectFailure: true
        observe: {}
        expect: {}
      - name: "failed_query"
        sql: |-
          SELECT ERROR('boom') AS id
        queryOptions:
          destinationTable: {"projectId": "${project}", "datasetId": "${dataset}", "tableId": "failed_query"}
          writeDisposition: "WRITE_EMPTY"
        expectFailure: true
        observe: {}
