version: 1
# Recorded on BigQuery in project johejo-sandbox, run u7xjbk4utowz2ye6g65bzxcnug, in the bucket
# johejo-sandbox-us; the answers sidecar keeps the observations. The rows query differs from the
# collected one: it sorts custom metadata, which BigQuery listed in either order across cases, and
# leaves out a comparison of ref.details' updated, which tests/e2e/goclient/testdata/unverified/
# object_tables.api.yaml asks about. The ddl case leaves out the empty schema of its jobs.query
# response, as external_table_schema.api.yaml does: the emulator omits schemas for CREATE EXTERNAL
# TABLE.
# Object tables, as third_party/bigquery_docs/object-table-introduction.md and
# third_party/bigquery_docs/object-tables.md describe them. Collection needs a Cloud resource
# connection `storage` in US, with the Storage Object Viewer role on ${bucket}; end-to-end
# verification uses test.us.storage, which tools/e2e declares.
# Beyond the documentation: md5_hash is hex, as the introduction's example shows, although its
# schema table says base64. A table created by DDL is marked autodetect and its INFORMATION_SCHEMA
# DDL lists no columns, while one created through tables.insert lists them; object_metadata is
# unquoted there and in TABLE_OPTIONS. A URI that names no object reads as no rows, and an object two URIs name, once.
description: >-
  Object tables created through DDL and tables.insert: their metadata, the rows they list, and
  the forms BigQuery rejects.
vars:
  dataset: bqa_${run}_${case}
  connection: us.storage
  prefix: gs://${bucket}/${run}/${case}
  # "hello\n"
  text: aGVsbG8K
  # "\x00\xff"
  binary: AP8=
  ddl: >-
    CREATE EXTERNAL TABLE `${project}.${dataset}.t` WITH CONNECTION `${connection}`
    OPTIONS (object_metadata = 'SIMPLE', uris = ['${prefix}/*'])
  rows_query: >-
    SELECT uri, content_type, size, md5_hash,
    ARRAY(SELECT AS STRUCT * FROM UNNEST(metadata) ORDER BY name) AS metadata,
    generation > 0 AS generation,
    ref.uri = uri AS ref_uri, ref.version = CAST(generation AS STRING) AS ref_version,
    ref.authorizer, TO_JSON_STRING(JSON_REMOVE(ref.details, '$.gcs_metadata.updated')) AS details
    FROM `${project}.${dataset}.t` ORDER BY uri
templates:
  # Creates the table through the request `create_body` to `create_path`, over two objects, then
  # reads its metadata and rows.
  created:
    steps:
      - name: dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: text
        gcs:
          method: PUT
          object: ${run}/${case}/a.txt
          base64: ${text}
          contentType: text/plain
          metadata: {k2: v2, k1: v1}
      - name: binary
        gcs: {method: PUT, object: '${run}/${case}/b/c.bin', base64: '${binary}'}
      - name: create
        rest: {method: POST, path: '/bigquery/v2/projects/${project}/${create_path}', body: '${create_body}'}
        observe:
          type: /body/type
          schema: /body/schema
          external: /body/externalDataConfiguration
      - name: get
        rest:
          method: GET
          path: /bigquery/v2/projects/${project}/datasets/${dataset}/tables/t
        observe:
          type: /body/type
          schema: /body/schema
          external: /body/externalDataConfiguration
          numRows: /body/numRows
          numBytes: /body/numBytes
      - name: list
        rest:
          method: GET
          path: /bigquery/v2/projects/${project}/datasets/${dataset}/tables
        observe:
          type: /body/tables/0/type
          external: /body/tables/0/externalDataConfiguration
      - name: information_schema
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            query: >-
              SELECT table_type, is_insertable_into, ddl
              FROM `${project}.${dataset}.INFORMATION_SCHEMA.TABLES` WHERE table_name = 't'
        observe: {errors: /body/errors, rows: /body/rows}
      - name: table_options
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            query: >-
              SELECT option_name, option_type, option_value
              FROM `${project}.${dataset}.INFORMATION_SCHEMA.TABLE_OPTIONS`
              WHERE table_name = 't' ORDER BY option_name
        observe: {errors: /body/errors, rows: /body/rows}
      - name: rows
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: ${rows_query}
        observe: {errors: /body/errors, rows: /body/rows, schema: /body/schema}
    cleanup:
      - name: delete_dataset
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
      - name: delete_text
        gcs: {method: DELETE, object: '${run}/${case}/a.txt'}
      - name: delete_binary
        gcs: {method: DELETE, object: '${run}/${case}/b/c.bin'}
  # Runs `query` against an object table created through DDL.
  query:
    steps:
      - name: dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: text
        gcs: {method: PUT, object: '${run}/${case}/a.txt', base64: '${text}', contentType: text/plain}
      - name: create
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body: {useLegacySql: false, location: US, query: '${ddl}'}
        observe: {errors: /body/errors}
      - name: query
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body: {useLegacySql: false, location: US, timeoutMs: 200000, query: '${query}'}
        observe: {errors: /body/errors, rows: /body/rows}
    cleanup:
      - name: delete_dataset
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
      - name: delete_text
        gcs: {method: DELETE, object: '${run}/${case}/a.txt'}
  # Fails to run `query` against an object table created through DDL.
  rejected_query:
    steps:
      - name: dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: text
        gcs: {method: PUT, object: '${run}/${case}/a.txt', base64: '${text}', contentType: text/plain}
      - name: create
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body: {useLegacySql: false, location: US, query: '${ddl}'}
        observe: {errors: /body/errors}
      - name: query
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body: {useLegacySql: false, location: US, timeoutMs: 200000, query: '${query}'}
        observe:
          status: /status
          reason: /body/error/errors/0/reason
          message: /body/error/message
        expectFailure: true
    cleanup:
      - name: delete_dataset
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
      - name: delete_text
        gcs: {method: DELETE, object: '${run}/${case}/a.txt'}
  # Fails to create a table with the DDL `statement`.
  rejected_ddl:
    steps:
      - name: dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: create
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body: {useLegacySql: false, location: US, query: '${statement}'}
        observe:
          status: /status
          reason: /body/error/errors/0/reason
          message: /body/error/message
        expectFailure: true
    cleanup:
      - name: delete_dataset
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
  # Fails to create the table `table` through tables.insert.
  rejected_rest:
    steps:
      - name: dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: create
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets/${dataset}/tables
          body: ${table}
        observe:
          status: /status
          reason: /body/error/errors/0/reason
          message: /body/error/message
        expectFailure: true
    cleanup:
      - name: delete_dataset
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
