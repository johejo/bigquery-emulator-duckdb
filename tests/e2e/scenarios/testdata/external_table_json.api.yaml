version: 1
description: JSON external-read boundaries and metadata recorded on BigQuery in johejo-sandbox; original observations and run identifiers are retained in the answers sidecar.
vars:
  columns: (id INT64)
  contents: eyJpZCI6MX0=
  dataset: bqa_${run}_${case}
  uri: gs://${bucket}/${run}/${case}/source.json
templates:
  external:
    cleanup:
    - name: delete_dataset
      rest:
        method: DELETE
        path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
    - gcs:
        method: DELETE
        object: ${run}/${case}/source.json
      name: delete_source
    steps:
    - name: dataset
      rest:
        body:
          datasetReference:
            datasetId: ${dataset}
          location: US
        method: POST
        path: /bigquery/v2/projects/${project}/datasets
    - gcs:
        base64: ${contents}
        method: PUT
        object: ${run}/${case}/source.json
      name: source
    - name: create
      observe:
        errors: /body/errors
        message: /body/error/message
        status: /status
      rest:
        body:
          location: US
          query: CREATE EXTERNAL TABLE `${project}.${dataset}.t` ${columns} OPTIONS (format = 'JSON', uris = ['${uri}'])
          useLegacySql: false
        method: POST
        path: /bigquery/v2/projects/${project}/queries
    - name: get
      observe:
        external: /body/externalDataConfiguration
        schema: /body/schema
        status: /status
      rest:
        method: GET
        path: /bigquery/v2/projects/${project}/datasets/${dataset}/tables/t
    - name: query
      observe:
        errors: /body/errors
        message: /body/error/message
        rows: /body/rows
        status: /status
      rest:
        body:
          location: US
          query: SELECT TO_JSON_STRING(t) FROM `${project}.${dataset}.t` AS t ORDER BY 1
          useLegacySql: false
        method: POST
        path: /bigquery/v2/projects/${project}/queries
    - name: ddl
      observe:
        errors: /body/errors
        rows: /body/rows
      rest:
        body:
          location: US
          query: SELECT ddl FROM `${project}.${dataset}.INFORMATION_SCHEMA.TABLES` WHERE table_name = 't'
          useLegacySql: false
        method: POST
        path: /bigquery/v2/projects/${project}/queries
  failure:
    cleanup:
    - name: delete_dataset
      rest:
        method: DELETE
        path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
    - gcs:
        method: DELETE
        object: ${run}/${case}/source.json
      name: delete_source
    steps:
    - name: dataset
      rest:
        body:
          datasetReference:
            datasetId: ${dataset}
          location: US
        method: POST
        path: /bigquery/v2/projects/${project}/datasets
    - gcs:
        base64: ${contents}
        method: PUT
        object: ${run}/${case}/source.json
      name: source
    - name: create
      observe:
        errors: /body/errors
        message: /body/error/message
        status: /status
      rest:
        body:
          location: US
          query: CREATE EXTERNAL TABLE `${project}.${dataset}.t` ${columns} OPTIONS (format = 'JSON', uris = ['${uri}'])
          useLegacySql: false
        method: POST
        path: /bigquery/v2/projects/${project}/queries
    - name: get
      observe:
        external: /body/externalDataConfiguration
        schema: /body/schema
        status: /status
      rest:
        method: GET
        path: /bigquery/v2/projects/${project}/datasets/${dataset}/tables/t
    - expectFailure: true
      name: query
      observe:
        reason: /body/error/errors/0/reason
        status: /status
      rest:
        body:
          location: US
          query: SELECT TO_JSON_STRING(t) FROM `${project}.${dataset}.t` AS t ORDER BY 1
          useLegacySql: false
        method: POST
        path: /bigquery/v2/projects/${project}/queries
cases:
- name: large_native_integer
  template: external
  vars:
    contents: eyJpZCI6OTAwNzE5OTI1NDc0MDk5M30=
  expect:
    create:
      status: 200
    get:
      external:
        sourceFormat: NEWLINE_DELIMITED_JSON
        sourceUris:
        - ${uri}
      schema:
        fields:
        - name: id
          type: INTEGER
      status: 200
    query:
      rows:
      - f:
        - v: '{"id":"9007199254740993"}'
      status: 200
    ddl:
      rows:
      - f:
        - v: |-
            CREATE EXTERNAL TABLE `${project}.${dataset}.t`
            (
              id INT64
            )
            OPTIONS(
              format="NEWLINE_DELIMITED_JSON",
              uris=["${uri}"]
            );
- expect:
    create:
      status: 200
    get:
      external:
        sourceFormat: NEWLINE_DELIMITED_JSON
        sourceUris:
        - ${uri}
      schema:
        fields:
        - name: id
          type: INTEGER
      status: 200
    query:
      reason: invalid
      status: 400
  name: fraction_integer
  template: failure
