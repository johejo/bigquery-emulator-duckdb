version: 1
# See third_party/bigquery_docs/reference/standard-sql/data-definition-language.md
# for defaultDataset on CREATE/DROP PROCEDURE, and
# third_party/bigquery_docs/multi-statement-queries.md for CALL dry runs.
# CALL takes expressions (reference/standard-sql/procedural-language.md), and
# expressions can use positional parameters (reference/standard-sql/lexical.md).
description: Procedure defaults, CALL dry runs, and positional parameters.
vars:
  dataset: bqa_${run}_${case}
cases:
  - name: procedure_defaults_and_dry_run
    steps:
      - name: dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: create
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            query: CREATE PROCEDURE p(x INT64) OPTIONS(strict_mode=FALSE) BEGIN SELECT missing_column; END
            defaultDataset: {projectId: '${project}', datasetId: '${dataset}'}
            useLegacySql: false
      - name: dry_run
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            query: 'CALL `${project}.${dataset}.p`(42);'
            dryRun: true
            useLegacySql: false
        observe:
          status: /status
      - name: leading_call_dry_run
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            query: >-
              CALL `${project}.${dataset}.p`(42);
              SELECT missing_column;
            dryRun: true
            useLegacySql: false
        observe:
          status: /status
      - name: call_after_select_dry_run
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            query: |
              SELECT IF(TRUE, ERROR('must not execute'), 1);
              SELECT @n;
              CALL `${project}.${dataset}.p`(@n);
              SELECT missing_column;
            dryRun: true
            useLegacySql: false
            parameterMode: NAMED
            queryParameters:
              - name: n
                parameterType: {type: INT64}
                parameterValue: {value: '42'}
        observe: {status: /status}
      - name: positional_call_after_select_dry_run
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            query: |
              SELECT CONCAT('?', ?); -- ? in a comment
              SELECT '?';
              CALL `${project}.${dataset}.p`(? + ?);
              SELECT missing_column;
            dryRun: true
            useLegacySql: false
            parameterMode: POSITIONAL
            queryParameters:
              - parameterType: {type: STRING}
                parameterValue: {value: example}
              - parameterType: {type: INT64}
                parameterValue: {value: '17'}
              - parameterType: {type: INT64}
                parameterValue: {value: '25'}
        observe: {status: /status}
      - name: invalid_select_before_call
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            query: |
              SELECT missing_column;
              CALL `${project}.${dataset}.p`(42);
            dryRun: true
            useLegacySql: false
        expectFailure: true
        observe: {status: /status}
      - name: missing_call_after_select
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            query: |
              SELECT 1;
              CALL `${project}.${dataset}.missing_procedure`();
            dryRun: true
            useLegacySql: false
        expectFailure: true
        observe: {status: /status}
      - name: wrong_type
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            query: 'CALL `${project}.${dataset}.p`([42])'
            dryRun: true
            useLegacySql: false
        expectFailure: true
        observe:
          status: /status
      - name: wrong_arity
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            query: 'CALL `${project}.${dataset}.p`()'
            dryRun: true
            useLegacySql: false
        expectFailure: true
        observe:
          status: /status
      - name: create_positional
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            query: 'CREATE PROCEDURE `${project}.${dataset}.p_args`(n INT64, label STRING) BEGIN SELECT n, label; END'
            useLegacySql: false
      - name: positional_call
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            query: "CALL `${project}.${dataset}.p_args`(? + ?, CONCAT('?', ?))"
            useLegacySql: false
            parameterMode: POSITIONAL
            queryParameters:
              - parameterType: {type: INT64}
                parameterValue: {value: '17'}
              - parameterType: {type: INT64}
                parameterValue: {value: '25'}
              - parameterType: {type: STRING}
                parameterValue: {value: example}
        observe:
          n: /body/rows/0/f/0/v
          label: /body/rows/0/f/1/v
      - name: create_output
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            query: CREATE PROCEDURE p_out(OUT x INT64) BEGIN SET x = 42; END
            defaultDataset: {projectId: '${project}', datasetId: '${dataset}'}
            useLegacySql: false
      - name: output_literal
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            query: 'CALL `${project}.${dataset}.p_out`(42)'
            dryRun: true
            useLegacySql: false
        expectFailure: true
        observe:
          status: /status
      - name: drop
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            query: DROP PROCEDURE p
            defaultDataset: {projectId: '${project}', datasetId: '${dataset}'}
            useLegacySql: false
      - name: missing
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            query: 'CALL `${project}.${dataset}.p`(42)'
            dryRun: true
            useLegacySql: false
        expectFailure: true
        observe:
          status: /status
    expect:
      dry_run: {status: 200}
      leading_call_dry_run: {status: 200}
      call_after_select_dry_run: {status: 200}
      positional_call_after_select_dry_run: {status: 200}
      invalid_select_before_call: {status: 400}
      missing_call_after_select: {status: 400}
      wrong_type: {status: 400}
      wrong_arity: {status: 400}
      positional_call: {n: '42', label: '?example'}
      output_literal: {status: 400}
      missing: {status: 400}
    cleanup:
      - name: delete
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
