version: 1
description: >-
  BigQuery enforces STRING(L) and BYTES(L) for protobuf, reporting the offending
  row without publishing any of the batch. Arrow writes preserve both rows even
  when one exceeds the length limits in
  third_party/bigquery_docs/reference/standard-sql/data-types.md. See the recorded BigQuery answers.
vars:
  dataset: bqa_${run}_${case}
  stream: projects/${project}/datasets/${dataset}/tables/t/streams/_default
  proto_request:
    writeStream: ${stream}
    protoRows:
      writerSchema:
        protoDescriptor:
          name: Row
          field:
            - {name: value, number: 1, type: '${proto_type}', label: LABEL_OPTIONAL}
      rows: {serializedRows: '${proto_rows}'}
  arrow_request:
    writeStream: ${stream}
    arrowRows:
      writerSchema: {serializedSchema: '${arrow_schema}'}
      rows: {serializedRecordBatch: '${arrow_batch}'}
  # Uncompressed Arrow IPC messages for one nullable column named value.
  string_schema: '/////3AAAAAQAAAAAAAKAAwACgAJAAQACgAAABAAAAAAAQQACAAIAAAABAAIAAAABAAAAAEAAAAUAAAAEAAUABAADwAOAAgAAAAEABAAAAAQAAAAFAAAAAAABQEQAAAAAAAAAAQABAAEAAAABQAAAHZhbHVlAAAA'
  bytes_schema: '/////3AAAAAQAAAAAAAKAAwACgAJAAQACgAAABAAAAAAAQQACAAIAAAABAAIAAAABAAAAAEAAAAUAAAAEAAUABAADwAOAAgAAAAEABAAAAAQAAAAFAAAAAAABAEQAAAAAAAAAAQABAAEAAAABQAAAHZhbHVlAAAA'
  # Protobuf field 1: UTF-8 strings é界 and é界x, and byte strings 00ff and 00ff01.
  string_limit_row: CgXDqeeVjA==
  string_over_row: CgbDqeeVjHg=
  bytes_limit_row: CgIA/w==
  bytes_over_row: CgMA/wE=
templates:
  append_length:
    steps:
      - name: create_dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: create_table
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets/${dataset}/tables
          body:
            tableReference: {projectId: '${project}', datasetId: '${dataset}', tableId: t}
            schema:
              fields:
                - {name: value, type: '${type}', maxLength: '2'}
      - name: append
        grpc:
          method: google.cloud.bigquery.storage.v1.BigQueryWrite/AppendRows
          headers:
            x-goog-request-params: write_stream=${stream}
          requests: ['${append_request}']
        observe:
          code: /code
          appendResult: /messages/0/appendResult
          errorCode: /messages/0/error/code
          rowErrors: /messages/0/rowErrors
      - name: query
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            query: SELECT ${expression} AS rendered FROM `${project}.${dataset}.t` ORDER BY rendered
            useLegacySql: false
            location: US
            timeoutMs: 60000
        observe:
          jobComplete: /body/jobComplete
          totalRows: /body/totalRows
          rows: /body/rows
    cleanup:
      - name: delete_dataset
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
cases:
  - name: proto_string_at_limit
    template: append_length
    vars:
      type: STRING
      expression: value
      append_request: '${proto_request}'
      proto_type: TYPE_STRING
      proto_rows: ['${string_limit_row}']
    expect:
      append: {code: OK, appendResult: {}}
      query: {jobComplete: true, totalRows: '1', rows: [{f: [{v: 'é界'}]}]}
  - name: proto_string_mixed
    template: append_length
    vars:
      type: STRING
      expression: value
      append_request: '${proto_request}'
      proto_type: TYPE_STRING
      proto_rows: ['${string_limit_row}', '${string_over_row}']
    expect:
      append:
        code: OK
        errorCode: 3
        rowErrors:
          - code: FIELDS_ERROR
            index: '1'
            message: 'Field value: STRING(2) has maximum length 2 but got a value with length 3 on field value.'
      query: {jobComplete: true, totalRows: '0'}
  - name: proto_bytes_at_limit
    template: append_length
    vars:
      type: BYTES
      expression: TO_HEX(value)
      append_request: '${proto_request}'
      proto_type: TYPE_BYTES
      proto_rows: ['${bytes_limit_row}']
    expect:
      append: {code: OK, appendResult: {}}
      query: {jobComplete: true, totalRows: '1', rows: [{f: [{v: '00ff'}]}]}
  - name: proto_bytes_mixed
    template: append_length
    vars:
      type: BYTES
      expression: TO_HEX(value)
      append_request: '${proto_request}'
      proto_type: TYPE_BYTES
      proto_rows: ['${bytes_limit_row}', '${bytes_over_row}']
    expect:
      append:
        code: OK
        errorCode: 3
        rowErrors:
          - code: FIELDS_ERROR
            index: '1'
            message: 'Field value: BYTES(2) has maximum length 2 but got a value with length 3 on field value.'
      query: {jobComplete: true, totalRows: '0'}
  # Arrow Utf8: é界 has two Unicode characters but five bytes; é界x has three characters.
  - name: arrow_string_at_limit
    template: append_length
    vars:
      type: STRING
      expression: value
      append_request: '${arrow_request}'
      arrow_schema: '${string_schema}'
      arrow_batch: '/////5gAAAAUAAAAAAAAAAwAFgAUABMADAAEAAwAAAAQAAAAAAAAABQAAAAAAAADBAAKABgADAAIAAQACgAAABQAAABIAAAAAQAAAAAAAAAAAAAAAwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAgAAAAAAAAACAAAAAAAAAAFAAAAAAAAAAAAAAABAAAAAQAAAAAAAAAAAAAAAAAAAAAAAAAFAAAAw6nnlYwAAAA='
    expect:
      append: {code: OK, appendResult: {}}
      query: {jobComplete: true, totalRows: '1', rows: [{f: [{v: 'é界'}]}]}
  - name: arrow_string_mixed
    template: append_length
    vars:
      type: STRING
      expression: value
      append_request: '${arrow_request}'
      arrow_schema: '${string_schema}'
      arrow_batch: '/////5gAAAAUAAAAAAAAAAwAFgAUABMADAAEAAwAAAAgAAAAAAAAABQAAAAAAAADBAAKABgADAAIAAQACgAAABQAAABIAAAAAgAAAAAAAAAAAAAAAwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAwAAAAAAAAAEAAAAAAAAAALAAAAAAAAAAAAAAABAAAAAgAAAAAAAAAAAAAAAAAAAAAAAAAFAAAACwAAAAAAAADDqeeVjMOp55WMeAAAAAAA'
    expect:
      append: {code: OK, appendResult: {}}
      query: {jobComplete: true, totalRows: '2', rows: [{f: [{v: 'é界'}]}, {f: [{v: 'é界x'}]}]}
  # Arrow Binary: 00ff is two bytes and 00ff01 is three.
  - name: arrow_bytes_at_limit
    template: append_length
    vars:
      type: BYTES
      expression: TO_HEX(value)
      append_request: '${arrow_request}'
      arrow_schema: '${bytes_schema}'
      arrow_batch: '/////5gAAAAUAAAAAAAAAAwAFgAUABMADAAEAAwAAAAQAAAAAAAAABQAAAAAAAADBAAKABgADAAIAAQACgAAABQAAABIAAAAAQAAAAAAAAAAAAAAAwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAgAAAAAAAAACAAAAAAAAAACAAAAAAAAAAAAAAABAAAAAQAAAAAAAAAAAAAAAAAAAAAAAAACAAAAAP8AAAAAAAA='
    expect:
      append: {code: OK, appendResult: {}}
      query: {jobComplete: true, totalRows: '1', rows: [{f: [{v: '00ff'}]}]}
  - name: arrow_bytes_mixed
    template: append_length
    vars:
      type: BYTES
      expression: TO_HEX(value)
      append_request: '${arrow_request}'
      arrow_schema: '${bytes_schema}'
      arrow_batch: '/////5gAAAAUAAAAAAAAAAwAFgAUABMADAAEAAwAAAAYAAAAAAAAABQAAAAAAAADBAAKABgADAAIAAQACgAAABQAAABIAAAAAgAAAAAAAAAAAAAAAwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAwAAAAAAAAAEAAAAAAAAAAFAAAAAAAAAAAAAAABAAAAAgAAAAAAAAAAAAAAAAAAAAAAAAACAAAABQAAAAAAAAAA/wD/AQAAAA=='
    expect:
      append: {code: OK, appendResult: {}}
      query: {jobComplete: true, totalRows: '2', rows: [{f: [{v: '00ff'}]}, {f: [{v: '00ff01'}]}]}
