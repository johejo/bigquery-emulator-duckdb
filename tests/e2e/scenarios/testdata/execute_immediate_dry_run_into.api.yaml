version: 1
description: EXECUTE IMMEDIATE dry runs check whether INTO targets were declared.
cases:
  - name: into_declared_target
    steps:
      - name: dry_run
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            query: |
              DECLARE target INT64;
              EXECUTE IMMEDIATE 'SELECT 42' INTO target;
            dryRun: true
            useLegacySql: false
        observe: {status: /status}
    expect:
      dry_run: {status: 200}
  - name: into_undeclared_target
    steps:
      - name: dry_run
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            query: |
              DECLARE target INT64;
              EXECUTE IMMEDIATE 'SELECT 42' INTO missing_target;
            dryRun: true
            useLegacySql: false
        expectFailure: true
        observe:
          status: /status
          message: /body/error/message
    expect:
      dry_run:
        status: 400
        message: 'Undeclared variable: missing_target at [2:36]'
