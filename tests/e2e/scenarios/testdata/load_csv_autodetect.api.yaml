# Expectations are from the accompanying BigQuery answer sidecar.
version: 1
# third_party/bigquery_docs/loading-data-cloud-storage-csv.md describes CSV schema
# auto-detection only in outline: header inference, generic names "such as string_field_1",
# detected delimiters and the types autodetection does not detect. These cases check the
# names, types, modes, values and errors it produces. Rejections observe the error's reason
# and, where it holds no generated name or row count, its message.
description: >-
  CSV schema auto-detection in load jobs: header inference with and without skipLeadingRows,
  generic and header-derived column names, inferred types and their boundaries, delimiters,
  empty and quoted values, and autodetected loads that replace or append to an existing table.
  Use multipart CSV uploads to avoid GCS prerequisites.
vars:
  dataset: bqa_${run}_${case}
  fixture: SELECT 1;
  load_configuration:
    load:
      destinationTable: {projectId: '${project}', datasetId: '${dataset}', tableId: destination}
      sourceFormat: CSV
      autodetect: true
templates:
  detect:
    steps:
      - name: create_dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: fixture
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            query: '${fixture}'
            useLegacySql: false
            timeoutMs: 200000
      - name: load
        rest:
          method: POST
          path: /upload/bigquery/v2/projects/${project}/jobs?uploadType=multipart
          body:
            jobReference: {projectId: '${project}', location: US}
            configuration: '${load_configuration}'
          upload: '${csv}'
        bind: {job: /body/jobReference/jobId}
      - name: completed_load
        rest:
          method: GET
          path: /bigquery/v2/projects/${project}/jobs/${job}?location=US
        until: {/body/status/state: DONE}
        observe: {status: /body/status, outputRows: /body/statistics/load/outputRows}
      - name: table
        rest:
          method: GET
          path: /bigquery/v2/projects/${project}/datasets/${dataset}/tables/destination
        observe: {schema: /body/schema, numRows: /body/numRows}
      - name: read
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            query: |
              SELECT * FROM `${project}.${dataset}.destination` AS t ORDER BY TO_JSON_STRING(t)
            useLegacySql: false
            timeoutMs: 200000
        observe: {jobComplete: /body/jobComplete, errors: /body/errors, rows: /body/rows}
    cleanup:
      - name: delete_dataset
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
  rejected:
    steps:
      - name: create_dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: fixture
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            query: '${fixture}'
            useLegacySql: false
            timeoutMs: 200000
      - name: load
        rest:
          method: POST
          path: /upload/bigquery/v2/projects/${project}/jobs?uploadType=multipart
          body:
            jobReference: {projectId: '${project}', location: US}
            configuration: '${load_configuration}'
          upload: '${csv}'
        bind: {job: /body/jobReference/jobId}
      - name: completed_load
        rest:
          method: GET
          path: /bigquery/v2/projects/${project}/jobs/${job}?location=US
        until: {/body/status/state: DONE}
        observe: {reason: /body/status/errorResult/reason, message: /body/status/errorResult/message}
    cleanup:
      - name: delete_dataset
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
  rejected_reason:
    steps:
      - name: create_dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: fixture
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            query: '${fixture}'
            useLegacySql: false
            timeoutMs: 200000
      - name: load
        rest:
          method: POST
          path: /upload/bigquery/v2/projects/${project}/jobs?uploadType=multipart
          body:
            jobReference: {projectId: '${project}', location: US}
            configuration: '${load_configuration}'
          upload: '${csv}'
        bind: {job: /body/jobReference/jobId}
      - name: completed_load
        rest:
          method: GET
          path: /bigquery/v2/projects/${project}/jobs/${job}?location=US
        until: {/body/status/state: DONE}
        observe: {reason: /body/status/errorResult/reason}
    cleanup:
      - name: delete_dataset
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
  append_rejected:
    steps:
      - name: create_dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: fixture
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            query: '${fixture}'
            useLegacySql: false
            timeoutMs: 200000
      - name: load
        rest:
          method: POST
          path: /upload/bigquery/v2/projects/${project}/jobs?uploadType=multipart
          body:
            jobReference: {projectId: '${project}', location: US}
            configuration: '${load_configuration}'
          upload: '${csv}'
        bind: {job: /body/jobReference/jobId}
      - name: completed_load
        rest:
          method: GET
          path: /bigquery/v2/projects/${project}/jobs/${job}?location=US
        until: {/body/status/state: DONE}
        observe: {reason: /body/status/errorResult/reason, message: /body/status/errorResult/message}
      - name: table
        rest:
          method: GET
          path: /bigquery/v2/projects/${project}/datasets/${dataset}/tables/destination
        observe: {schema: /body/schema, numRows: /body/numRows}
      - name: read
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            query: |
              SELECT * FROM `${project}.${dataset}.destination` AS t ORDER BY TO_JSON_STRING(t)
            useLegacySql: false
            timeoutMs: 200000
        observe: {jobComplete: /body/jobComplete, errors: /body/errors, rows: /body/rows}
    cleanup:
      - name: delete_dataset
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
cases:
  # Generic names.
  - name: generic_names_strings
    template: detect
    vars: {csv: "new,A,A\n"}
    expect: {"completed_load": {"status": {"state": "DONE"}, "outputRows": "1"}, "table": {"numRows": "1", "schema": {"fields": [{"mode": "NULLABLE", "name": "string_field_0", "type": "STRING"}, {"mode": "NULLABLE", "name": "string_field_1", "type": "STRING"}, {"mode": "NULLABLE", "name": "string_field_2", "type": "STRING"}]}}, "read": {"jobComplete": true, "rows": [{"f": [{"v": "new"}, {"v": "A"}, {"v": "A"}]}]}}
  - name: generic_names_by_type
    template: detect
    vars:
      csv: "1,1.5,true,2024-01-02,2024-01-02 03:04:05,2024-01-02 03:04:05Z,03:04:05,x\n"
    expect: {"completed_load": {"status": {"state": "DONE"}, "outputRows": "1"}, "table": {"numRows": "1", "schema": {"fields": [{"mode": "NULLABLE", "name": "int64_field_0", "type": "INTEGER"}, {"mode": "NULLABLE", "name": "double_field_1", "type": "FLOAT"}, {"mode": "NULLABLE", "name": "bool_field_2", "type": "BOOLEAN"}, {"mode": "NULLABLE", "name": "date_field_3", "type": "DATE"}, {"mode": "NULLABLE", "name": "timestamp_field_4", "type": "TIMESTAMP"}, {"mode": "NULLABLE", "name": "timestamp_field_5", "type": "TIMESTAMP"}, {"mode": "NULLABLE", "name": "time_field_6", "type": "TIME"}, {"mode": "NULLABLE", "name": "string_field_7", "type": "STRING"}]}}, "read": {"jobComplete": true, "rows": [{"f": [{"v": "1"}, {"v": "1.5"}, {"v": "true"}, {"v": "2024-01-02"}, {"v": "1.704164645E9"}, {"v": "1.704164645E9"}, {"v": "03:04:05"}, {"v": "x"}]}]}}
  - name: generic_names_many_rows
    template: detect
    vars: {csv: "1,x\n2,y\n3,z\n"}
    expect: {"completed_load": {"status": {"state": "DONE"}, "outputRows": "3"}, "table": {"numRows": "3", "schema": {"fields": [{"mode": "NULLABLE", "name": "int64_field_0", "type": "INTEGER"}, {"mode": "NULLABLE", "name": "string_field_1", "type": "STRING"}]}}, "read": {"jobComplete": true, "rows": [{"f": [{"v": "1"}, {"v": "x"}]}, {"f": [{"v": "2"}, {"v": "y"}]}, {"f": [{"v": "3"}, {"v": "z"}]}]}}

  # Header inference without skipLeadingRows.
  - name: header_detected
    template: detect
    vars: {csv: "name,age\nx,1\ny,2\n"}
    expect: {"completed_load": {"status": {"state": "DONE"}, "outputRows": "2"}, "table": {"numRows": "2", "schema": {"fields": [{"mode": "NULLABLE", "name": "name", "type": "STRING"}, {"mode": "NULLABLE", "name": "age", "type": "INTEGER"}]}}, "read": {"jobComplete": true, "rows": [{"f": [{"v": "x"}, {"v": "1"}]}, {"f": [{"v": "y"}, {"v": "2"}]}]}}
  - name: header_all_strings
    template: detect
    vars: {csv: "name,city\nx,y\n"}
    expect: {"completed_load": {"status": {"state": "DONE"}, "outputRows": "1"}, "table": {"numRows": "1", "schema": {"fields": [{"mode": "NULLABLE", "name": "name", "type": "STRING"}, {"mode": "NULLABLE", "name": "city", "type": "BOOLEAN"}]}}, "read": {"jobComplete": true, "rows": [{"f": [{"v": "x"}, {"v": "true"}]}]}}
  - name: header_only_row
    template: detect
    vars: {csv: "name,age\n"}
    expect: {"completed_load": {"status": {"state": "DONE"}, "outputRows": "1"}, "table": {"numRows": "1", "schema": {"fields": [{"mode": "NULLABLE", "name": "string_field_0", "type": "STRING"}, {"mode": "NULLABLE", "name": "string_field_1", "type": "STRING"}]}}, "read": {"jobComplete": true, "rows": [{"f": [{"v": "name"}, {"v": "age"}]}]}}
  - name: header_first_row_has_number
    template: detect
    vars: {csv: "name,1\nx,2\n"}
    expect: {"completed_load": {"status": {"state": "DONE"}, "outputRows": "2"}, "table": {"numRows": "2", "schema": {"fields": [{"mode": "NULLABLE", "name": "string_field_0", "type": "STRING"}, {"mode": "NULLABLE", "name": "int64_field_1", "type": "INTEGER"}]}}, "read": {"jobComplete": true, "rows": [{"f": [{"v": "name"}, {"v": "1"}]}, {"f": [{"v": "x"}, {"v": "2"}]}]}}
  - name: header_partial_strings
    template: detect
    vars: {csv: "name,city\nx,1\n"}
    expect: {"completed_load": {"status": {"state": "DONE"}, "outputRows": "1"}, "table": {"numRows": "1", "schema": {"fields": [{"mode": "NULLABLE", "name": "name", "type": "STRING"}, {"mode": "NULLABLE", "name": "city", "type": "INTEGER"}]}}, "read": {"jobComplete": true, "rows": [{"f": [{"v": "x"}, {"v": "1"}]}]}}
  - name: header_spaces_punctuation
    template: rejected
    vars: {csv: "first name,a-b.c,x/y,  padded  \n1,2,3,4\n"}
    expect: {"completed_load": {"reason": "invalidQuery", "message": "Field name 'a-b.c' is not supported by the current character map. Please change your field name or use character map V2 to let the system modify the field names."}}
  - name: header_leading_digit
    template: detect
    vars: {csv: "1st,2nd\n1,2\n"}
    expect: {"completed_load": {"status": {"state": "DONE"}, "outputRows": "1"}, "table": {"numRows": "1", "schema": {"fields": [{"mode": "NULLABLE", "name": "1st", "type": "INTEGER"}, {"mode": "NULLABLE", "name": "2nd", "type": "INTEGER"}]}}, "read": {"jobComplete": true, "rows": [{"f": [{"v": "1"}, {"v": "2"}]}]}}
  - name: header_unicode
    template: detect
    vars: {csv: "名前,café\n1,2\n"}
    expect: {"completed_load": {"status": {"state": "DONE"}, "outputRows": "1"}, "table": {"numRows": "1", "schema": {"fields": [{"mode": "NULLABLE", "name": "名前", "type": "INTEGER"}, {"mode": "NULLABLE", "name": "café", "type": "INTEGER"}]}}, "read": {"jobComplete": true, "rows": [{"f": [{"v": "1"}, {"v": "2"}]}]}}
  - name: header_duplicate_names
    template: rejected
    vars: {csv: "a,a,A\n1,2,3\n"}
    expect: {"completed_load": {"reason": "invalidQuery", "message": "Duplicated field name 'a'"}}
  - name: header_empty_name
    template: detect
    vars: {csv: "a,,c\n1,2,3\n"}
    expect: {"completed_load": {"status": {"state": "DONE"}, "outputRows": "1"}, "table": {"numRows": "1", "schema": {"fields": [{"mode": "NULLABLE", "name": "a", "type": "INTEGER"}, {"mode": "NULLABLE", "name": "int64_field_1", "type": "INTEGER"}, {"mode": "NULLABLE", "name": "c", "type": "INTEGER"}]}}, "read": {"jobComplete": true, "rows": [{"f": [{"v": "1"}, {"v": "2"}, {"v": "3"}]}]}}
  - name: header_reserved_prefix
    template: rejected
    vars: {csv: "_TABLE_x,_FILE_y,_PARTITIONTIME\n1,2,3\n"}
    expect: {"completed_load": {"reason": "invalid", "message": "Invalid field name \"_TABLE_x\". Field names are not allowed to start with the (case-insensitive) prefixes _PARTITION, _TABLE_, _FILE_, _ROW_TIMESTAMP, __ROOT__, _COLIDENTIFIER, and __DREMEL_PK_MERGED_STRUCT_"}}
  - name: header_quoted
    template: rejected
    vars: {csv: "\"a,b\",\"c\"\"d\"\n1,2\n"}
    expect: {"completed_load": {"reason": "invalidQuery", "message": "Field name 'a,b' is not supported by the current character map. Please change your field name or use character map V2 to let the system modify the field names."}}

  # Header inference with skipLeadingRows.
  - name: skip_zero_header_like
    template: detect
    vars:
      csv: "name,age\nx,1\n"
      load_configuration:
        load:
          destinationTable: {projectId: '${project}', datasetId: '${dataset}', tableId: destination}
          sourceFormat: CSV
          autodetect: true
          skipLeadingRows: 0
    expect: {"completed_load": {"status": {"state": "DONE"}, "outputRows": "2"}, "table": {"numRows": "2", "schema": {"fields": [{"mode": "NULLABLE", "name": "string_field_0", "type": "STRING"}, {"mode": "NULLABLE", "name": "string_field_1", "type": "STRING"}]}}, "read": {"jobComplete": true, "rows": [{"f": [{"v": "name"}, {"v": "age"}]}, {"f": [{"v": "x"}, {"v": "1"}]}]}}
  - name: skip_one_header
    template: detect
    vars:
      csv: "name,age\nx,1\n"
      load_configuration:
        load:
          destinationTable: {projectId: '${project}', datasetId: '${dataset}', tableId: destination}
          sourceFormat: CSV
          autodetect: true
          skipLeadingRows: 1
    expect: {"completed_load": {"status": {"state": "DONE"}, "outputRows": "1"}, "table": {"numRows": "1", "schema": {"fields": [{"mode": "NULLABLE", "name": "name", "type": "STRING"}, {"mode": "NULLABLE", "name": "age", "type": "INTEGER"}]}}, "read": {"jobComplete": true, "rows": [{"f": [{"v": "x"}, {"v": "1"}]}]}}
  - name: skip_one_all_strings
    template: detect
    vars:
      csv: "name,city\nx,y\n"
      load_configuration:
        load:
          destinationTable: {projectId: '${project}', datasetId: '${dataset}', tableId: destination}
          sourceFormat: CSV
          autodetect: true
          skipLeadingRows: 1
    expect: {"completed_load": {"status": {"state": "DONE"}, "outputRows": "1"}, "table": {"numRows": "1", "schema": {"fields": [{"mode": "NULLABLE", "name": "name", "type": "STRING"}, {"mode": "NULLABLE", "name": "city", "type": "BOOLEAN"}]}}, "read": {"jobComplete": true, "rows": [{"f": [{"v": "x"}, {"v": "true"}]}]}}
  - name: skip_one_numeric_row
    template: detect
    vars:
      csv: "1,2\n3,4\n"
      load_configuration:
        load:
          destinationTable: {projectId: '${project}', datasetId: '${dataset}', tableId: destination}
          sourceFormat: CSV
          autodetect: true
          skipLeadingRows: 1
    expect: {"completed_load": {"status": {"state": "DONE"}, "outputRows": "1"}, "table": {"numRows": "1", "schema": {"fields": [{"mode": "NULLABLE", "name": "int64_field_0", "type": "INTEGER"}, {"mode": "NULLABLE", "name": "int64_field_1", "type": "INTEGER"}]}}, "read": {"jobComplete": true, "rows": [{"f": [{"v": "3"}, {"v": "4"}]}]}}
  - name: skip_two_header_second
    template: detect
    vars:
      csv: "junk,junk\nname,age\nx,1\n"
      load_configuration:
        load:
          destinationTable: {projectId: '${project}', datasetId: '${dataset}', tableId: destination}
          sourceFormat: CSV
          autodetect: true
          skipLeadingRows: 2
    expect: {"completed_load": {"status": {"state": "DONE"}, "outputRows": "1"}, "table": {"numRows": "1", "schema": {"fields": [{"mode": "NULLABLE", "name": "name", "type": "STRING"}, {"mode": "NULLABLE", "name": "age", "type": "INTEGER"}]}}, "read": {"jobComplete": true, "rows": [{"f": [{"v": "x"}, {"v": "1"}]}]}}
  - name: skip_all_rows
    template: detect
    vars:
      csv: "name,age\nx,1\n"
      load_configuration:
        load:
          destinationTable: {projectId: '${project}', datasetId: '${dataset}', tableId: destination}
          sourceFormat: CSV
          autodetect: true
          skipLeadingRows: 2
    expect: {"completed_load": {"status": {"state": "DONE"}, "outputRows": "0"}, "table": {"numRows": "0", "schema": {"fields": [{"mode": "NULLABLE", "name": "string_field_0", "type": "STRING"}, {"mode": "NULLABLE", "name": "int64_field_1", "type": "INTEGER"}]}}, "read": {"jobComplete": true}}

  # INT64 and FLOAT64.
  - name: int64_forms
    template: detect
    vars: {csv: "1\n-2\n+3\n007\n"}
    expect: {"completed_load": {"status": {"state": "DONE"}, "outputRows": "4"}, "table": {"numRows": "4", "schema": {"fields": [{"mode": "NULLABLE", "name": "int64_field_0", "type": "INTEGER"}]}}, "read": {"jobComplete": true, "rows": [{"f": [{"v": "-2"}]}, {"f": [{"v": "1"}]}, {"f": [{"v": "3"}]}, {"f": [{"v": "7"}]}]}}
  - name: int64_bounds
    template: detect
    vars: {csv: "9223372036854775807\n-9223372036854775808\n"}
    expect: {"completed_load": {"status": {"state": "DONE"}, "outputRows": "2"}, "table": {"numRows": "2", "schema": {"fields": [{"mode": "NULLABLE", "name": "int64_field_0", "type": "INTEGER"}]}}, "read": {"jobComplete": true, "rows": [{"f": [{"v": "-9223372036854775808"}]}, {"f": [{"v": "9223372036854775807"}]}]}}
  - name: int64_overflow
    template: detect
    vars: {csv: "9223372036854775807\n9223372036854775808\n"}
    expect: {"completed_load": {"status": {"state": "DONE"}, "outputRows": "2"}, "table": {"numRows": "2", "schema": {"fields": [{"mode": "NULLABLE", "name": "double_field_0", "type": "FLOAT"}]}}, "read": {"jobComplete": true, "rows": [{"f": [{"v": "9.223372036854776E18"}]}, {"f": [{"v": "9.223372036854776E18"}]}]}}
  - name: int64_whitespace
    template: detect
    vars: {csv: " 1\n2 \n"}
    expect: {"completed_load": {"status": {"state": "DONE"}, "outputRows": "2"}, "table": {"numRows": "2", "schema": {"fields": [{"mode": "NULLABLE", "name": "int64_field_0", "type": "INTEGER"}]}}, "read": {"jobComplete": true, "rows": [{"f": [{"v": "1"}]}, {"f": [{"v": "2"}]}]}}
  - name: int64_thousands_separator
    template: detect
    vars: {csv: "\"1,000\"\n2\n"}
    expect: {"completed_load": {"status": {"state": "DONE"}, "outputRows": "2"}, "table": {"numRows": "2", "schema": {"fields": [{"mode": "NULLABLE", "name": "int64_field_0", "type": "INTEGER"}]}}, "read": {"jobComplete": true, "rows": [{"f": [{"v": "1000"}]}, {"f": [{"v": "2"}]}]}}
  - name: float64_forms
    template: detect
    vars: {csv: "1.5\n1e3\n-0.25\n.5\n5.\n"}
    expect: {"completed_load": {"status": {"state": "DONE"}, "outputRows": "5"}, "table": {"numRows": "5", "schema": {"fields": [{"mode": "NULLABLE", "name": "double_field_0", "type": "FLOAT"}]}}, "read": {"jobComplete": true, "rows": [{"f": [{"v": "-0.25"}]}, {"f": [{"v": "0.5"}]}, {"f": [{"v": "1.5"}]}, {"f": [{"v": "1000.0"}]}, {"f": [{"v": "5.0"}]}]}}
  - name: float64_special
    template: detect
    vars: {csv: "NaN\ninf\n-Infinity\n"}
    expect: {"completed_load": {"status": {"state": "DONE"}, "outputRows": "3"}, "table": {"numRows": "3", "schema": {"fields": [{"mode": "NULLABLE", "name": "double_field_0", "type": "FLOAT"}]}}, "read": {"jobComplete": true, "rows": [{"f": [{"v": "-Infinity"}]}, {"f": [{"v": "Infinity"}]}, {"f": [{"v": "NaN"}]}]}}
  - name: float64_precision
    template: detect
    vars: {csv: "0.1234567890123456789\n123456789012345678901234567890\n"}
    expect: {"completed_load": {"status": {"state": "DONE"}, "outputRows": "2"}, "table": {"numRows": "2", "schema": {"fields": [{"mode": "NULLABLE", "name": "double_field_0", "type": "FLOAT"}]}}, "read": {"jobComplete": true, "rows": [{"f": [{"v": "0.12345678901234568"}]}, {"f": [{"v": "1.2345678901234568E29"}]}]}}
  - name: int64_and_float64
    template: detect
    vars: {csv: "1\n2.5\n"}
    expect: {"completed_load": {"status": {"state": "DONE"}, "outputRows": "2"}, "table": {"numRows": "2", "schema": {"fields": [{"mode": "NULLABLE", "name": "double_field_0", "type": "FLOAT"}]}}, "read": {"jobComplete": true, "rows": [{"f": [{"v": "1.0"}]}, {"f": [{"v": "2.5"}]}]}}
  - name: int64_and_string
    template: detect
    vars: {csv: "1\nx\n"}
    expect: {"completed_load": {"status": {"state": "DONE"}, "outputRows": "2"}, "table": {"numRows": "2", "schema": {"fields": [{"mode": "NULLABLE", "name": "string_field_0", "type": "STRING"}]}}, "read": {"jobComplete": true, "rows": [{"f": [{"v": "1"}]}, {"f": [{"v": "x"}]}]}}
  - name: epoch_seconds
    template: detect
    vars: {csv: "1534680695\n1.534680695e12\n"}
    expect: {"completed_load": {"status": {"state": "DONE"}, "outputRows": "2"}, "table": {"numRows": "2", "schema": {"fields": [{"mode": "NULLABLE", "name": "double_field_0", "type": "FLOAT"}]}}, "read": {"jobComplete": true, "rows": [{"f": [{"v": "1.534680695E12"}]}, {"f": [{"v": "1.534680695E9"}]}]}}
  - name: hex_number
    template: detect
    vars: {csv: "0x1F\n"}
    expect: {"completed_load": {"status": {"state": "DONE"}, "outputRows": "1"}, "table": {"numRows": "1", "schema": {"fields": [{"mode": "NULLABLE", "name": "double_field_0", "type": "FLOAT"}]}}, "read": {"jobComplete": true, "rows": [{"f": [{"v": "31.0"}]}]}}

  # BOOL.
  - name: bool_true_false
    template: detect
    vars: {csv: "true\nFALSE\nTrue\n"}
