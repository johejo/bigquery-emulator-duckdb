version: 1
description: >-
  The Storage Write Arrow mapping table in third_party/bigquery_docs/supported-data-types.md
  omits TIME, but BigQuery accepts Time64(MICROSECOND). BigQuery also preserves
  sub-microsecond precision in Arrow MONTH_DAY_NANO intervals.
vars:
  dataset: bqa_${run}_${case}
  stream: projects/${project}/datasets/${dataset}/tables/t/streams/_default
templates:
  append_arrow:
    steps:
      - name: create_dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: create_table
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            query: CREATE TABLE `${project}.${dataset}.t` (value ${type})
            useLegacySql: false
            location: US
      - name: append
        grpc:
          method: google.cloud.bigquery.storage.v1.BigQueryWrite/AppendRows
          headers:
            x-goog-request-params: write_stream=${stream}
          requests:
            - writeStream: ${stream}
              arrowRows:
                writerSchema: {serializedSchema: '${schema}'}
                rows: {serializedRecordBatch: '${batch}'}
        observe:
          code: /code
          error: /messages/0/error
      - name: query
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            query: SELECT CAST(value AS STRING) AS value FROM `${project}.${dataset}.t`
            useLegacySql: false
            location: US
        observe:
          rows: /body/rows
    cleanup:
      - name: delete_dataset
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
cases:
  # Arrow Time64(MICROSECOND) with 12:34:56.123456.
  - name: time64_micro
    template: append_arrow
    vars:
      type: TIME
      schema: '/////4AAAAAQAAAAAAAKAAwACgAJAAQACgAAABAAAAAAAQQACAAIAAAABAAIAAAABAAAAAEAAAAUAAAAEAAUABAADwAOAAgAAAAEABAAAAAQAAAAGAAAAAAACQEcAAAAAAAAAAgADAAKAAQACAAAAEAAAAAAAAIABQAAAHZhbHVlAAAAAAAAAA=='
      batch: '/////4gAAAAUAAAAAAAAAAwAFgAUABMADAAEAAwAAAAIAAAAAAAAABQAAAAAAAADBAAKABgADAAIAAQACgAAABQAAAA4AAAAAQAAAAAAAAAAAAAAAgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAgAAAAAAAAAAAAAAAEAAAABAAAAAAAAAAAAAAAAAAAAQP7biwoAAAA='
    expect:
      append: {code: OK}
      query: {rows: [{f: [{v: '12:34:56.123456'}]}]}
  # Arrow MonthDayNanoInterval with 1001 nanoseconds, no days or months.
  - name: interval_nano
    template: append_arrow
    vars:
      type: INTERVAL
      schema: '/////3gAAAAQAAAAAAAKAAwACgAJAAQACgAAABAAAAAAAQQACAAIAAAABAAIAAAABAAAAAEAAAAUAAAAEAAUABAADwAOAAgAAAAEABAAAAAQAAAAGAAAAAAACwEYAAAAAAAAAAAABgAIAAYABgAAAAAAAgAFAAAAdmFsdWUAAAA='
      batch: '/////4gAAAAUAAAAAAAAAAwAFgAUABMADAAEAAwAAAAQAAAAAAAAABQAAAAAAAADBAAKABgADAAIAAQACgAAABQAAAA4AAAAAQAAAAAAAAAAAAAAAgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAEAAAABAAAAAAAAAAAAAAAAAAAAAAAAAAAAAADpAwAAAAAAAA=='
    expect:
      append: {code: OK}
      query: {rows: [{f: [{v: '0-0 0 0:0:0.000001001'}]}]}
