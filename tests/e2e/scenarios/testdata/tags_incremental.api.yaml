    vars:
      initial_tags: "[('${key_b}', 'sales')]"
      query: ALTER SCHEMA `${project}.${dataset}` SET OPTIONS (tags -= [('${key_a}', 'test')])
    expect: {"created": {"complete": true}, "dataset": {"legacy_tags": [{"tagKey": "${project}/emulator_compat_b", "tagValue": "sales"}], "tags": {"${project}/emulator_compat_b": "sales"}}, "mutated": {}, "options": {"complete": true, "rows": [{"f": [{"v": "dataset"}, {"v": "ARRAY<STRUCT<STRING, STRING>>"}, {"v": "[STRUCT(\"${project}/emulator_compat_b\", \"sales\")]"}]}, {"f": [{"v": "t"}, {"v": "ARRAY<STRUCT<STRING, STRING>>"}, {"v": "[STRUCT(\"${project}/emulator_compat_b\", \"sales\")]"}]}]}, "table": {"tags": {"${project}/emulator_compat_b": "sales"}}}
