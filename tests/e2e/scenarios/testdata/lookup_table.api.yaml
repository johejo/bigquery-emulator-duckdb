version: 1
description: >-
  BigQuery rejects LookupTable with a literal name even when the referenced
  physical table exists. Observed with tools/bqanswers; the adjacent answers
  file retains the original observation.
vars:
  dataset: bqa_${run}_${case}
cases:
  - name: physical_table
    steps:
      - name: create_dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: create_table
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            query: |
              CREATE TABLE `${project}.${dataset}.source` AS
              SELECT 1 AS id, 'one' AS value UNION ALL SELECT 2, 'two'
            useLegacySql: false
            timeoutMs: 200000
      - name: literal_name
        expectFailure: true
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            query: |
              SELECT id, value
              FROM LookupTable('${project}.${dataset}.source')
              ORDER BY id
            useLegacySql: false
        observe:
          status: /status
          reason: /body/error/errors/0/reason
    cleanup:
      - name: delete_dataset
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
    expect:
      literal_name:
        status: 400
        reason: invalidQuery
