version: 1
# Recorded on BigQuery in project johejo-sandbox, run gp7vz4dwtnq36k2fkr2nw2redl, with
# sources in the bucket johejo-sandbox-us; the answers sidecar keeps the
# observations. BigQuery's answers settle what time_zone, date_format, datetime_format, time_format
#   and
# timestamp_format, which third_party/bigquery_docs/reference/standard-sql/
# data-definition-language.md and the timeZone, dateFormat, datetimeFormat, timeFormat
# and timestampFormat of reference/rest/v2/tables.md describe, do to the reads and
# metadata of CSV and JSON external tables: whether they take SQL-style format elements,
# C-style ones or both, whether a format excludes the default forms, which values
# time_zone takes and applies to, and how tables.get and INFORMATION_SCHEMA store them.
# The Parquet case reuses types.parquet of external_table_parquet_types.api.yaml.
# Sources, as `id,value` records or JSON lines:
# - date_format_sql: "1,01/02/2024\n2,2024-01-02\n3,1/2/2024\n4,01/02/24\n"
# - date_format_c: "1,01/02/2024\n2,2024-01-02\n3,1/2/2024\n4,01/02/24\n"
# - datetime_format: "1,01/02/2024 03:04:05.123\n2,01/02/2024 03:04:05\n3,01/02/2024
#   03:04:05.123456\n4,2024-01-02 03:04:05\n"
# - time_format: "1,03:04:05.123\n2,03:04:05\n3,03:04:05.123456\n"
# - time_format_12_hour: "1,03:04:05 PM\n2,15:04:05\n3,03:04:05 AM\n"
# - timestamp_format: "1,01/02/2024 03:04:05\n2,2024-01-02 03:04:05\n3,01/02/2024 03:04:05 +09\n"
# - timestamp_format_zone: "1,01/02/2024 03:04:05 +09\n2,01/02/2024 03:04:05\n"
# - timestamp_format_c: "1,01/02/2024 03:04:05\n2,2024-01-02 03:04:05\n"
# - time_zone_name: "1,2024-01-02 03:04:05\n2,2024-01-02 03:04:05 UTC\n3,2024-01-02
#   03:04:05+09\n4,2024-07-02 03:04:05\n5,2024-01-02T03:04:05Z\n6,2024-01-02\n"
# - time_zone_offset: "1,2024-01-02 03:04:05\n2,2024-01-02 03:04:05 UTC\n3,2024-01-02
#   03:04:05+09\n4,2024-07-02 03:04:05\n5,2024-01-02T03:04:05Z\n6,2024-01-02\n"
# - time_zone_datetime: "1,2024-01-02 03:04:05\n2,2024-01-02 03:04:05 UTC\n"
# - time_zone_with_format: "1,01/02/2024 03:04:05\n"
# - time_zone_invalid: "1,2024-01-02 03:04:05\n"
# - date_format_invalid: "1,2024-01-02\n"
# - date_format_empty: "1,2024-01-02\n"
# - date_format_other_types: "1,01/02/2024,2024-01-02 03:04:05,2024-01-02
#   03:04:05\n2,01/02/2024,01/02/2024 03:04:05,01/02/2024 03:04:05\n"
# - all_formats: "1,2024/01/02,2024/01/02 03:04:05,03.04.05,2024/01/02 03:04:05\n"
# - autodetect_date_format: "d\n01/02/2024\n"
# - json_date_format: "{\"id\":1,\"v\":\"01/02/2024\"}\n{\"id\":2,\"v\":\"2024-01-02\"}\n"
# - json_time_zone: "{\"id\":1,\"v\":\"2024-01-02
#   03:04:05\"}\n{\"id\":2,\"v\":\"2024-01-02T03:04:05Z\"}\n"
# - rest_formats: "1,2024/01/02,2024/01/02 03:04:05,03.04.05,2024/01/02 03:04:05\n"
description: >-
  time_zone, date_format, datetime_format, time_format and timestamp_format of external
  tables.
vars:
  dataset: bqa_${run}_${case}
  prefix: gs://${bucket}/${run}/${case}
  query: SELECT * FROM `${project}.${dataset}.t` ORDER BY 1
  types: ""
templates:
  # Creates `t` with the DDL statement `ddl` over the object `object`, whose contents are
  # `source`, and runs `query` on it.
  ddl:
    steps:
      - name: dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: source
        gcs: {method: PUT, object: '${run}/${case}/${object}', base64: '${source}'}
      - name: create
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: ${ddl}
        observe:
          status: /status
          errors: /body/errors
      - name: get
        rest:
          method: GET
          path: /bigquery/v2/projects/${project}/datasets/${dataset}/tables/t
        observe:
          external: /body/externalDataConfiguration
          schema: /body/schema
      - name: ddl
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: SELECT ddl FROM `${project}.${dataset}.INFORMATION_SCHEMA.TABLES` WHERE table_name = 't'
        observe:
          rows: /body/rows
      - name: options
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: SELECT option_name, option_type, option_value FROM `${project}.${dataset}.INFORMATION_SCHEMA.TABLE_OPTIONS` WHERE table_name = 't' ORDER BY option_name
        observe:
          rows: /body/rows
      - name: query
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: ${query}
        bind:
          job: /body/jobReference/jobId
        observe:
          status: /status
          jobComplete: /body/jobComplete
          schema: /body/schema
          rows: /body/rows
          errors: /body/errors
      - name: job
        rest:
          method: GET
          path: /bigquery/v2/projects/${project}/jobs/${job}?location=US
        observe:
          status: /body/status
    cleanup:
      - name: delete
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
      - name: delete_source
        gcs: {method: DELETE, object: '${run}/${case}/${object}'}
  # As ddl, creating `t` with tables.insert and the resource `table`.
  rest:
    steps:
      - name: dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: source
        gcs: {method: PUT, object: '${run}/${case}/${object}', base64: '${source}'}
      - name: create
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets/${dataset}/tables
          body: ${table}
        observe:
          status: /status
          external: /body/externalDataConfiguration
          schema: /body/schema
      - name: get
        rest:
          method: GET
          path: /bigquery/v2/projects/${project}/datasets/${dataset}/tables/t
        observe:
          external: /body/externalDataConfiguration
          schema: /body/schema
      - name: ddl
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: SELECT ddl FROM `${project}.${dataset}.INFORMATION_SCHEMA.TABLES` WHERE table_name = 't'
        observe:
          rows: /body/rows
      - name: options
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: SELECT option_name, option_type, option_value FROM `${project}.${dataset}.INFORMATION_SCHEMA.TABLE_OPTIONS` WHERE table_name = 't' ORDER BY option_name
        observe:
          rows: /body/rows
      - name: query
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: ${query}
        bind:
          job: /body/jobReference/jobId
        observe:
          status: /status
          jobComplete: /body/jobComplete
          schema: /body/schema
          rows: /body/rows
          errors: /body/errors
      - name: job
        rest:
          method: GET
          path: /bigquery/v2/projects/${project}/jobs/${job}?location=US
        observe:
          status: /body/status
    cleanup:
      - name: delete
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
      - name: delete_source
        gcs: {method: DELETE, object: '${run}/${case}/${object}'}
  # As ddl, where the query fails.
  ddl_failure:
    steps:
      - name: dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: source
        gcs: {method: PUT, object: '${run}/${case}/${object}', base64: '${source}'}
      - name: create
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: ${ddl}
        observe:
          status: /status
          errors: /body/errors
      - name: get
        rest:
          method: GET
          path: /bigquery/v2/projects/${project}/datasets/${dataset}/tables/t
        observe:
          external: /body/externalDataConfiguration
          schema: /body/schema
      - name: ddl
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: SELECT ddl FROM `${project}.${dataset}.INFORMATION_SCHEMA.TABLES` WHERE table_name = 't'
        observe:
          rows: /body/rows
      - name: options
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: SELECT option_name, option_type, option_value FROM `${project}.${dataset}.INFORMATION_SCHEMA.TABLE_OPTIONS` WHERE table_name = 't' ORDER BY option_name
        observe:
          rows: /body/rows
      - name: query
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: ${query}
        expectFailure: true
        observe:
          status: /status
          reason: /body/error/errors/0/reason
          message: /body/error/message
    cleanup:
      - name: delete
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
      - name: delete_source
        gcs: {method: DELETE, object: '${run}/${case}/${object}'}
  # As ddl, where the statement fails.
  create_failure:
    steps:
      - name: dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: source
        gcs: {method: PUT, object: '${run}/${case}/${object}', base64: '${source}'}
      - name: create
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: ${ddl}
        expectFailure: true
        observe:
          status: /status
          reason: /body/error/errors/0/reason
          message: /body/error/message
    cleanup:
      - name: delete
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
      - name: delete_source
        gcs: {method: DELETE, object: '${run}/${case}/${object}'}
  # As rest, where the query fails.
  rest_failure:
    steps:
      - name: dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: source
        gcs: {method: PUT, object: '${run}/${case}/${object}', base64: '${source}'}
      - name: create
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets/${dataset}/tables
          body: ${table}
        observe:
          status: /status
          external: /body/externalDataConfiguration
          schema: /body/schema
      - name: get
        rest:
          method: GET
          path: /bigquery/v2/projects/${project}/datasets/${dataset}/tables/t
        observe:
          external: /body/externalDataConfiguration
          schema: /body/schema
      - name: ddl
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: SELECT ddl FROM `${project}.${dataset}.INFORMATION_SCHEMA.TABLES` WHERE table_name = 't'
        observe:
          rows: /body/rows
      - name: options
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: SELECT option_name, option_type, option_value FROM `${project}.${dataset}.INFORMATION_SCHEMA.TABLE_OPTIONS` WHERE table_name = 't' ORDER BY option_name
        observe:
          rows: /body/rows
      - name: query
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: ${query}
        expectFailure: true
        observe:
          status: /status
          reason: /body/error/errors/0/reason
          message: /body/error/message
    cleanup:
      - name: delete
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
      - name: delete_source
        gcs: {method: DELETE, object: '${run}/${case}/${object}'}
  # As rest, where tables.insert fails.
  rest_create_failure:
    steps:
      - name: dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: source
        gcs: {method: PUT, object: '${run}/${case}/${object}', base64: '${source}'}
      - name: create
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets/${dataset}/tables
          body: ${table}
        expectFailure: true
        observe:
          status: /status
          reason: /body/error/errors/0/reason
          message: /body/error/message
    cleanup:
      - name: delete
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
      - name: delete_source
        gcs: {method: DELETE, object: '${run}/${case}/${object}'}
cases:
  - name: date_format_sql
    template: ddl
    vars:
      object: "s.csv"
      source: "MSwwMS8wMi8yMDI0CjIsMjAyNC0wMS0wMgozLDEvMi8yMDI0CjQsMDEvMDIvMjQK"
      ddl: "CREATE EXTERNAL TABLE `${project}.${dataset}.t` (id INT64, v DATE) OPTIONS (format = 'CSV', uris = ['${prefix}/s.csv'], date_format = 'MM/DD/YYYY', max_bad_records = 100)"
    expect: {
        "create": {
          "status": 200
        },
        "ddl": {
          "rows": [
            {
              "f": [
                {
                  "v": "CREATE EXTERNAL TABLE `${project}.bqa_${run}_date_format_sql.t`\n(\n  id INT64,\n  v DATE\n)\nOPTIONS(\n  max_bad_records=100,\n  date_format=\"MM/DD/YYYY\",\n  format=\"CSV\",\n  uris=[\"gs://${bucket}/${run}/date_format_sql/s.csv\"]\n);"
                }
              ]
            }
          ]
        },
        "get": {
          "external": {
            "dateFormat": "MM/DD/YYYY",
            "maxBadRecords": 100,
            "sourceFormat": "CSV",
            "sourceUris": [
              "gs://${bucket}/${run}/date_format_sql/s.csv"
            ]
          },
          "schema": {
            "fields": [
              {
                "name": "id",
                "type": "INTEGER"
              },
              {
                "name": "v",
                "type": "DATE"
              }
            ]
          }
        },
        "job": {
          "status": {
            "errors": [
              {
                "location": "gs://${bucket}/${run}/date_format_sql/s.csv",
                "message": "Error while reading data, error message: Failed to parse input timestamp string at 0 with format element 'MM'; line_number: 2 byte_offset_to_start_of_line: 13 column_index: 1 column_name: \"v\" column_type: DATE value: \"2024-01-02\" File: gs://${bucket}/${run}/date_format_sql/s.csv",
                "reason": "invalid"
              }
            ],
            "state": "DONE"
          }
        },
        "options": {
          "rows": [
            {
              "f": [
                {
                  "v": "date_format"
                },
                {
                  "v": "STRING"
                },
                {
                  "v": "\"MM/DD/YYYY\""
                }
              ]
            },
            {
              "f": [
                {
                  "v": "format"
                },
                {
                  "v": "STRING"
                },
                {
                  "v": "\"CSV\""
                }
              ]
            },
            {
              "f": [
                {
                  "v": "max_bad_records"
                },
                {
                  "v": "INT64"
                },
                {
                  "v": "100"
                }
              ]
            },
            {
              "f": [
                {
                  "v": "uris"
                },
                {
                  "v": "ARRAY<STRING>"
                },
                {
                  "v": "[\"gs://${bucket}/${run}/date_format_sql/s.csv\"]"
                }
              ]
            }
          ]
        },
        "query": {
          "errors": [
            {
              "location": "gs://${bucket}/${run}/date_format_sql/s.csv",
              "reason": "invalid"
            }
          ],
          "jobComplete": true,
          "rows": [
            {
              "f": [
                {
                  "v": "1"
                },
                {
                  "v": "2024-01-02"
                }
              ]
            },
            {
              "f": [
                {
                  "v": "3"
                },
                {
                  "v": "2024-01-02"
                }
              ]
            },
            {
              "f": [
                {
                  "v": "4"
                },
                {
                  "v": "0024-01-02"
                }
              ]
            }
          ],
          "schema": {
            "fields": [
              {
                "mode": "NULLABLE",
                "name": "id",
                "type": "INTEGER"
              },
              {
                "mode": "NULLABLE",
                "name": "v",
                "type": "DATE"
              }
            ]
          },
          "status": 200
        }
      }
  - name: date_format_c
    template: create_failure
    vars:
      object: "s.csv"
      source: "MSwwMS8wMi8yMDI0CjIsMjAyNC0wMS0wMgozLDEvMi8yMDI0CjQsMDEvMDIvMjQK"
      ddl: "CREATE EXTERNAL TABLE `${project}.${dataset}.t` (id INT64, v DATE) OPTIONS (format = 'CSV', uris = ['${prefix}/s.csv'], date_format = '%m/%d/%Y', max_bad_records = 100)"
    expect: {
        "create": {
          "status": 400,
          "reason": "invalidQuery",
          "message": "Invalid format for option 'date_format': Cannot find matched format element at 0"
        }
      }
  - name: datetime_format
    template: ddl
    vars:
      object: "s.csv"
      source: "MSwwMS8wMi8yMDI0IDAzOjA0OjA1LjEyMwoyLDAxLzAyLzIwMjQgMDM6MDQ6MDUKMywwMS8wMi8yMDI0IDAzOjA0OjA1LjEyMzQ1Ngo0LDIwMjQtMDEtMDIgMDM6MDQ6MDUK"
      ddl: "CREATE EXTERNAL TABLE `${project}.${dataset}.t` (id INT64, v DATETIME) OPTIONS (format = 'CSV', uris = ['${prefix}/s.csv'], datetime_format = 'MM/DD/YYYY HH24:MI:SS.FF3', max_bad_records = 100)"
