            {
              "f": [
                {
                  "v": "CREATE EXTERNAL TABLE `${project}.bqa_${run}_datetime_format.t`\n(\n  id INT64,\n  v DATETIME\n)\nOPTIONS(\n  max_bad_records=100,\n  datetime_format=\"MM/DD/YYYY HH24:MI:SS.FF3\",\n  format=\"CSV\",\n  uris=[\"gs://${bucket}/${run}/datetime_format/s.csv\"]\n);"
