                "reason": "invalid"
              },
              {
                "location": "gs://${bucket}/${run}/datetime_format/s.csv",
                "message": "Error while reading data, error message: Illegal non-space trailing data '456' in timestamp string; line_number: 3 byte_offset_to_start_of_line: 48 column_index: 1 column_name: \"v\" column_type: DATETIME value: \"01/02/2024 03:04:...\" File: gs://${bucket}/${run}/datetime_format/s.csv",
                "reason": "invalid"
              },
              {
                "location": "gs://${bucket}/${run}/datetime_format/s.csv",
                "message": "Error while reading data, error message: Failed to parse input timestamp string at 0 with format element 'MM'; line_number: 4 byte_offset_to_start_of_line: 77 column_index: 1 column_name: \"v\" column_type: DATETIME value: \"2024-01-02 03:04:05\" File: gs://${bucket}/${run}/datetime_format/s.csv",
                "reason": "invalid"
              }
            ],
            "state": "DONE"
          }
        },
        "options": {
          "rows": [
            {
              "f": [
                {
                  "v": "datetime_format"
                },
                {
                  "v": "STRING"
                },
                {
                  "v": "\"MM/DD/YYYY HH24:MI:SS.FF3\""
                }
              ]
            },
            {
              "f": [
                {
                  "v": "format"
                },
                {
                  "v": "STRING"
                },
                {
                  "v": "\"CSV\""
                }
              ]
            },
            {
              "f": [
                {
                  "v": "max_bad_records"
                },
                {
                  "v": "INT64"
                },
                {
                  "v": "100"
                }
              ]
            },
            {
