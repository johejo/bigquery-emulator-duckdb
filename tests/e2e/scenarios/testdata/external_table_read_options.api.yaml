version: 1
# Recorded on BigQuery in project johejo-sandbox, runs u7cpdqrvw5o36sz2dqity2hjp7 and
# jkuzqacy4awgmgefozp4uve2bm, with sources in the bucket johejo-sandbox-us; the answers sidecar
# keeps the observations. compression, encoding
# and max_bad_records of third_party/bigquery_docs/reference/standard-sql/data-definition-language.md
# and ExternalDataConfiguration in third_party/bigquery_docs/reference/rest/v2/tables.md. Beyond
# the documentation, the DDL takes compression GZIP and the encodings in any case, UTF8 and
# ISO_8859_1 too, and stores their REST names, but rejects compression NONE; tables.insert takes
# only the REST names and NONE, and stores no compression for an empty one. A gzip source reads
# without compression, compression GZIP fails on one that is not gzip and NONE reads its gzip data
# as it is; an ISO-8859-1 gzip source decodes, but a UTF-16LE one fails, its values split before
# they are decoded. The DDL encoding applies to JSON too, as jsonOptions.encoding, which takes
# ISO-8859-1, and a UTF-16 or UTF-32 byte order mark is skipped. INFORMATION_SCHEMA's DDL leaves out
# UTF-8, which TABLE_OPTIONS lists. maxBadRecords counts the records of all of a query's sources.
# A query within it has an errors[] entry, of reason invalid and the source's location, for each
# record it skips. When more are bad, BigQuery's message gives the Rows of every record of a CSV
# table but those of too many values, and of a JSON table of one file the number of the record
# that exceeds the limit.
description: >-
  compression, maxBadRecords and csvOptions.encoding or jsonOptions.encoding of external tables.
vars:
  dataset: bqa_${run}_${case}
  schema:
    fields:
      - {name: id, type: INTEGER}
      - {name: s, type: STRING}
  prefix: gs://${bucket}/${run}/${case}
  # "1,a\n2,b\n", and gzip of it.
  csv: MSxhCjIsYgo=
  csv_gzip: H4sIAAAAAAAC/zPUSeQy0kniAgCpdCtxCAAAAA==
  # '{"id": 1, "s": "a"}\n{"id": 2, "s": "b"}\n', and gzip of it.
  json: eyJpZCI6IDEsICJzIjogImEifQp7ImlkIjogMiwgInMiOiAiYiJ9Cg==
  json_gzip: H4sIAAAAAAAC/6tWykxRslIw1FFQKgbSSolKtVzVEDEjmFgSUAwAn8D+DSgAAAA=
  # "1,a\nx,b\n3,c,extra\n4,d\n": a value INT64 cannot hold and one value too many.
  bad_csv: MSxhCngsYgozLGMsZXh0cmEKNCxkCg==
  # "5,e\ny,f\n"
  bad_csv_b: NSxlCnksZgo=
  # '{"id": 1, "s": "a"}\n{"id": 2.5, "s": "b"}\n{"id": 3,\n{"id": 4, "s": "d"}\n': a fraction
  # of an INT64 and a malformed line.
  bad_json: eyJpZCI6IDEsICJzIjogImEifQp7ImlkIjogMi41LCAicyI6ICJiIn0KeyJpZCI6IDMsCnsiaWQiOiA0LCAicyI6ICJkIn0K
  # "1,café\n2,ü€\n" in UTF-16LE, without and with a byte order mark, UTF-16BE, UTF-32LE and
  # UTF-32BE, and "1,café\n2,ü\n" in ISO-8859-1.
  utf16le: MQAsAGMAYQBmAOkACgAyACwA/ACsIAoA
  utf16le_bom: //4xACwAYwBhAGYA6QAKADIALAD8AKwgCgA=
  utf16be: ADEALABjAGEAZgDpAAoAMgAsAPwgrAAK
  utf32le: MQAAACwAAABjAAAAYQAAAGYAAADpAAAACgAAADIAAAAsAAAA/AAAAKwgAAAKAAAA
  utf32be: AAAAMQAAACwAAABjAAAAYQAAAGYAAADpAAAACgAAADIAAAAsAAAA/AAAIKwAAAAK
  iso_8859_1: MSxjYWbpCjIs/Ao=
  # "1,café\n2,ü€\n" in UTF-32LE with a byte order mark, and "1,café\n2,ü\n" in ISO-8859-1 in
  # gzip.
  utf32le_bom: //4AADEAAAAsAAAAYwAAAGEAAABmAAAA6QAAAAoAAAAyAAAALAAAAPwAAACsIAAACgAAAA==
  iso_8859_1_gzip: H4sIAAAAAAAC/zPUSU5Me8llpPOHCwAfOJkOCwAAAA==
  # gzip of utf16le.
  utf16le_gzip: H4sIAAAAAAAC/zNk0GFIZkhkSGN4ycDFYATk/WFYo8DFAADFrZ8CGAAAAA==
  # '{"id": 1, "s": "café"}\n' in UTF-16LE and in ISO-8859-1.
  json_utf16le: ewAiAGkAZAAiADoAIAAxACwAIAAiAHMAIgA6ACAAIgBjAGEAZgDpACIAfQAKAA==
  json_iso_8859_1: eyJpZCI6IDEsICJzIjogImNhZukifQo=
templates:
  # Creates the table `t` with `create_body` sent to `create_resource`, from the object
  # `${object}` of `source`, and reads its metadata and rows.
  external:
    steps:
      - name: dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: source
        gcs: {method: PUT, object: '${run}/${case}/${object}', base64: '${source}'}
      - name: create
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/${create_resource}
          body: ${create_body}
        observe:
          status: /status
          errors: /body/errors
      - name: get
        rest:
          method: GET
          path: /bigquery/v2/projects/${project}/datasets/${dataset}/tables/t
        observe:
          external: /body/externalDataConfiguration
      - name: options
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: SELECT option_name, option_type, option_value FROM `${project}.${dataset}.INFORMATION_SCHEMA.TABLE_OPTIONS` WHERE table_name = 't' ORDER BY option_name
        observe:
          errors: /body/errors
          rows: /body/rows
      - name: information_schema
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: SELECT ddl FROM `${project}.${dataset}.INFORMATION_SCHEMA.TABLES` WHERE table_name = 't'
        observe:
          errors: /body/errors
          rows: /body/rows
      - name: query
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: SELECT * FROM `${project}.${dataset}.t` ORDER BY id
        observe:
          status: /status
          errors: /body/errors
          rows: /body/rows
    cleanup:
      - name: delete
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
      - name: delete_source
        gcs: {method: DELETE, object: '${run}/${case}/${object}'}
  # As external, for a table a query cannot read.
  external_unreadable:
    steps:
      - name: dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: source
        gcs: {method: PUT, object: '${run}/${case}/${object}', base64: '${source}'}
      - name: create
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/${create_resource}
          body: ${create_body}
        observe:
          status: /status
          errors: /body/errors
      - name: get
        rest:
          method: GET
          path: /bigquery/v2/projects/${project}/datasets/${dataset}/tables/t
        observe:
          external: /body/externalDataConfiguration
      - name: options
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: SELECT option_name, option_type, option_value FROM `${project}.${dataset}.INFORMATION_SCHEMA.TABLE_OPTIONS` WHERE table_name = 't' ORDER BY option_name
        observe:
          errors: /body/errors
          rows: /body/rows
      - name: information_schema
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: SELECT ddl FROM `${project}.${dataset}.INFORMATION_SCHEMA.TABLES` WHERE table_name = 't'
        observe:
          errors: /body/errors
          rows: /body/rows
      - name: query
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: SELECT * FROM `${project}.${dataset}.t` ORDER BY id
        expectFailure: true
        observe:
          status: /status
          reason: /body/error/errors/0/reason
          message: /body/error/message
    cleanup:
      - name: delete
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
      - name: delete_source
        gcs: {method: DELETE, object: '${run}/${case}/${object}'}
  # As external_unreadable, observing only the reason.
  external_unreadable_reason:
    steps:
      - name: dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: source
        gcs: {method: PUT, object: '${run}/${case}/${object}', base64: '${source}'}
      - name: create
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/${create_resource}
          body: ${create_body}
        observe:
          status: /status
          errors: /body/errors
      - name: get
        rest:
          method: GET
          path: /bigquery/v2/projects/${project}/datasets/${dataset}/tables/t
        observe:
          external: /body/externalDataConfiguration
      - name: options
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: SELECT option_name, option_type, option_value FROM `${project}.${dataset}.INFORMATION_SCHEMA.TABLE_OPTIONS` WHERE table_name = 't' ORDER BY option_name
        observe:
          errors: /body/errors
          rows: /body/rows
      - name: information_schema
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: SELECT ddl FROM `${project}.${dataset}.INFORMATION_SCHEMA.TABLES` WHERE table_name = 't'
        observe:
          errors: /body/errors
          rows: /body/rows
      - name: query
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: SELECT * FROM `${project}.${dataset}.t` ORDER BY id
        expectFailure: true
        observe:
          status: /status
          reason: /body/error/errors/0/reason
    cleanup:
      - name: delete
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
      - name: delete_source
        gcs: {method: DELETE, object: '${run}/${case}/${object}'}
  # The statement `ddl`, which BigQuery rejects.
  rejected:
    steps:
      - name: dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: create
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: ${ddl}
        expectFailure: true
        observe:
          status: /status
          reason: /body/error/errors/0/reason
          message: /body/error/message
    cleanup:
      - name: delete
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
  # A table of `ddl` over the objects `${object}` and `${object_b}`, which a query cannot read.
  two_unreadable:
    steps:
      - name: dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: source
        gcs: {method: PUT, object: '${run}/${case}/${object}', base64: '${source}'}
      - name: source_b
        gcs: {method: PUT, object: '${run}/${case}/${object_b}', base64: '${source_b}'}
      - name: create
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: ${ddl}
        observe:
          status: /status
          errors: /body/errors
      - name: query
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: SELECT * FROM `${project}.${dataset}.t` ORDER BY id
        expectFailure: true
        observe:
          status: /status
          reason: /body/error/errors/0/reason
          message: /body/error/message
    cleanup:
      - name: delete
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
      - name: delete_source
        gcs: {method: DELETE, object: '${run}/${case}/${object}'}
      - name: delete_source_b
        gcs: {method: DELETE, object: '${run}/${case}/${object_b}'}
  # The table `create_body`, which tables.insert rejects.
  api_rejected:
    steps:
      - name: dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: create
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets/${dataset}/tables
          body: ${create_body}
        expectFailure: true
        observe:
          status: /status
          reason: /body/error/errors/0/reason
          message: /body/error/message
    cleanup:
      - name: delete
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
cases:
  - name: compression_gzip_ddl
    template: external
    vars:
      object: a.csv.gz
      source: '${csv_gzip}'
      create_resource: queries
      create_body:
        useLegacySql: false
        location: US
        timeoutMs: 200000
        query: CREATE EXTERNAL TABLE `${project}.${dataset}.t` (id INT64, s STRING) OPTIONS (format = 'CSV', uris = ['${prefix}/a.csv.gz'], compression = 'GZIP')
    expect: {"create": {"status": 200}, "get": {"external": {"compression": "GZIP", "sourceFormat": "CSV", "sourceUris": ["${prefix}/a.csv.gz"]}}, "options": {"rows": [{"f": [{"v": "compression"}, {"v": "STRING"}, {"v": "\"GZIP\""}]}, {"f": [{"v": "format"}, {"v": "STRING"}, {"v": "\"CSV\""}]}, {"f": [{"v": "uris"}, {"v": "ARRAY<STRING>"}, {"v": "[\"${prefix}/a.csv.gz\"]"}]}]}, "information_schema": {"rows": [{"f": [{"v": "CREATE EXTERNAL TABLE `${project}.${dataset}.t`\n(\n  id INT64,\n  s STRING\n)\nOPTIONS(\n  compression=\"GZIP\",\n  format=\"CSV\",\n  uris=[\"${prefix}/a.csv.gz\"]\n);"}]}]}, "query": {"rows": [{"f": [{"v": "1"}, {"v": "a"}]}, {"f": [{"v": "2"}, {"v": "b"}]}], "status": 200}}
  - name: compression_gzip_api
    template: external
    vars:
      object: a.csv.gz
      source: '${csv_gzip}'
      create_resource: datasets/${dataset}/tables
      create_body:
        tableReference: {tableId: t}
        schema: '${schema}'
        externalDataConfiguration:
          sourceFormat: CSV
          sourceUris: ['${prefix}/a.csv.gz']
          compression: GZIP
    expect: {"create": {"status": 200}, "get": {"external": {"compression": "GZIP", "sourceFormat": "CSV", "sourceUris": ["${prefix}/a.csv.gz"]}}, "options": {"rows": [{"f": [{"v": "compression"}, {"v": "STRING"}, {"v": "\"GZIP\""}]}, {"f": [{"v": "format"}, {"v": "STRING"}, {"v": "\"CSV\""}]}, {"f": [{"v": "uris"}, {"v": "ARRAY<STRING>"}, {"v": "[\"${prefix}/a.csv.gz\"]"}]}]}, "information_schema": {"rows": [{"f": [{"v": "CREATE EXTERNAL TABLE `${project}.${dataset}.t`\n(\n  id INT64,\n  s STRING\n)\nOPTIONS(\n  compression=\"GZIP\",\n  format=\"CSV\",\n  uris=[\"${prefix}/a.csv.gz\"]\n);"}]}]}, "query": {"rows": [{"f": [{"v": "1"}, {"v": "a"}]}, {"f": [{"v": "2"}, {"v": "b"}]}], "status": 200}}
  - name: compression_none_api
    template: external
    vars:
      object: a.csv
      source: '${csv}'
      create_resource: datasets/${dataset}/tables
      create_body:
        tableReference: {tableId: t}
        schema: '${schema}'
        externalDataConfiguration:
          sourceFormat: CSV
          sourceUris: ['${prefix}/a.csv']
          compression: NONE
    expect: {"create": {"status": 200}, "get": {"external": {"compression": "NONE", "sourceFormat": "CSV", "sourceUris": ["${prefix}/a.csv"]}}, "options": {"rows": [{"f": [{"v": "compression"}, {"v": "STRING"}, {"v": "\"NONE\""}]}, {"f": [{"v": "format"}, {"v": "STRING"}, {"v": "\"CSV\""}]}, {"f": [{"v": "uris"}, {"v": "ARRAY<STRING>"}, {"v": "[\"${prefix}/a.csv\"]"}]}]}, "information_schema": {"rows": [{"f": [{"v": "CREATE EXTERNAL TABLE `${project}.${dataset}.t`\n(\n  id INT64,\n  s STRING\n)\nOPTIONS(\n  compression=\"NONE\",\n  format=\"CSV\",\n  uris=[\"${prefix}/a.csv\"]\n);"}]}]}, "query": {"rows": [{"f": [{"v": "1"}, {"v": "a"}]}, {"f": [{"v": "2"}, {"v": "b"}]}], "status": 200}}
  - name: compression_gzip_json
    template: external
    vars:
      object: a.json.gz
      source: '${json_gzip}'
      create_resource: queries
      create_body:
        useLegacySql: false
        location: US
        timeoutMs: 200000
        query: CREATE EXTERNAL TABLE `${project}.${dataset}.t` (id INT64, s STRING) OPTIONS (format = 'JSON', uris = ['${prefix}/a.json.gz'], compression = 'GZIP')
    expect: {"create": {"status": 200}, "get": {"external": {"compression": "GZIP", "sourceFormat": "NEWLINE_DELIMITED_JSON", "sourceUris": ["${prefix}/a.json.gz"]}}, "options": {"rows": [{"f": [{"v": "compression"}, {"v": "STRING"}, {"v": "\"GZIP\""}]}, {"f": [{"v": "format"}, {"v": "STRING"}, {"v": "\"NEWLINE_DELIMITED_JSON\""}]}, {"f": [{"v": "uris"}, {"v": "ARRAY<STRING>"}, {"v": "[\"${prefix}/a.json.gz\"]"}]}]}, "information_schema": {"rows": [{"f": [{"v": "CREATE EXTERNAL TABLE `${project}.${dataset}.t`\n(\n  id INT64,\n  s STRING\n)\nOPTIONS(\n  compression=\"GZIP\",\n  format=\"NEWLINE_DELIMITED_JSON\",\n  uris=[\"${prefix}/a.json.gz\"]\n);"}]}]}, "query": {"rows": [{"f": [{"v": "1"}, {"v": "a"}]}, {"f": [{"v": "2"}, {"v": "b"}]}], "status": 200}}
  - name: compression_unset_gzip_source
    template: external
    vars:
      object: a.csv.gz
      source: '${csv_gzip}'
      create_resource: queries
      create_body:
        useLegacySql: false
        location: US
        timeoutMs: 200000
        query: CREATE EXTERNAL TABLE `${project}.${dataset}.t` (id INT64, s STRING) OPTIONS (format = 'CSV', uris = ['${prefix}/a.csv.gz'])
    expect: {"create": {"status": 200}, "get": {"external": {"sourceFormat": "CSV", "sourceUris": ["${prefix}/a.csv.gz"]}}, "options": {"rows": [{"f": [{"v": "format"}, {"v": "STRING"}, {"v": "\"CSV\""}]}, {"f": [{"v": "uris"}, {"v": "ARRAY<STRING>"}, {"v": "[\"${prefix}/a.csv.gz\"]"}]}]}, "information_schema": {"rows": [{"f": [{"v": "CREATE EXTERNAL TABLE `${project}.${dataset}.t`\n(\n  id INT64,\n  s STRING\n)\nOPTIONS(\n  format=\"CSV\",\n  uris=[\"${prefix}/a.csv.gz\"]\n);"}]}]}, "query": {"rows": [{"f": [{"v": "1"}, {"v": "a"}]}, {"f": [{"v": "2"}, {"v": "b"}]}], "status": 200}}
  - name: compression_none_gzip_source
    template: rejected
    vars:
      ddl: CREATE EXTERNAL TABLE `${project}.${dataset}.t` (id INT64, s STRING) OPTIONS (format = 'CSV', uris = ['${prefix}/a.csv.gz'], compression = 'NONE')
    expect: {"create": {"status": 400, "reason": "invalidQuery", "message": "'NONE' is not a valid value; failed to set 'compression' in external table OPTIONS"}}
  - name: compression_gzip_plain_source
    template: external_unreadable
    vars:
      object: a.csv
      source: '${csv}'
      create_resource: queries
      create_body:
        useLegacySql: false
        location: US
        timeoutMs: 200000
        query: CREATE EXTERNAL TABLE `${project}.${dataset}.t` (id INT64, s STRING) OPTIONS (format = 'CSV', uris = ['${prefix}/a.csv'], compression = 'GZIP')
    expect: {"create": {"status": 200}, "get": {"external": {"compression": "GZIP", "sourceFormat": "CSV", "sourceUris": ["${prefix}/a.csv"]}}, "options": {"rows": [{"f": [{"v": "compression"}, {"v": "STRING"}, {"v": "\"GZIP\""}]}, {"f": [{"v": "format"}, {"v": "STRING"}, {"v": "\"CSV\""}]}, {"f": [{"v": "uris"}, {"v": "ARRAY<STRING>"}, {"v": "[\"${prefix}/a.csv\"]"}]}]}, "information_schema": {"rows": [{"f": [{"v": "CREATE EXTERNAL TABLE `${project}.${dataset}.t`\n(\n  id INT64,\n  s STRING\n)\nOPTIONS(\n  compression=\"GZIP\",\n  format=\"CSV\",\n  uris=[\"${prefix}/a.csv\"]\n);"}]}]}, "query": {"status": 400, "reason": "invalid", "message": "Error while reading table: ${project}.${dataset}.t, error message: Decompression failed: Invalid gzip file: unrecognized format. File: ${prefix}/a.csv"}}
  - name: compression_lowercase
    template: external
    vars:
      object: a.csv.gz
      source: '${csv_gzip}'
      create_resource: queries
      create_body:
        useLegacySql: false
        location: US
        timeoutMs: 200000
        query: CREATE EXTERNAL TABLE `${project}.${dataset}.t` (id INT64, s STRING) OPTIONS (format = 'CSV', uris = ['${prefix}/a.csv.gz'], compression = 'gzip')
    expect: {"create": {"status": 200}, "get": {"external": {"compression": "GZIP", "sourceFormat": "CSV", "sourceUris": ["${prefix}/a.csv.gz"]}}, "options": {"rows": [{"f": [{"v": "compression"}, {"v": "STRING"}, {"v": "\"GZIP\""}]}, {"f": [{"v": "format"}, {"v": "STRING"}, {"v": "\"CSV\""}]}, {"f": [{"v": "uris"}, {"v": "ARRAY<STRING>"}, {"v": "[\"${prefix}/a.csv.gz\"]"}]}]}, "information_schema": {"rows": [{"f": [{"v": "CREATE EXTERNAL TABLE `${project}.${dataset}.t`\n(\n  id INT64,\n  s STRING\n)\nOPTIONS(\n  compression=\"GZIP\",\n  format=\"CSV\",\n  uris=[\"${prefix}/a.csv.gz\"]\n);"}]}]}, "query": {"rows": [{"f": [{"v": "1"}, {"v": "a"}]}, {"f": [{"v": "2"}, {"v": "b"}]}], "status": 200}}
  - name: compression_empty_api
    template: external
    vars:
      object: a.csv
      source: '${csv}'
      create_resource: datasets/${dataset}/tables
      create_body:
        tableReference: {tableId: t}
        schema: '${schema}'
        externalDataConfiguration:
          sourceFormat: CSV
