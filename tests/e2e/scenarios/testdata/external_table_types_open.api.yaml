version: 1
# Recorded on BigQuery in project johejo-sandbox, run 7d66b5tzdcdehezgqc5taknfnh, with sources in the
# bucket johejo-sandbox-us; the answers sidecar keeps the observations.
# BigQuery's answers settle questions those in external_table_csv_types,
# external_table_json_types, external_table_parquet_types and external_table_types_followups
# leave open: Parquet DECIMALs that NUMERIC does not hold, of other values, scales and widths;
# other Parquet columns read as TIMESTAMP; CSV and JSON schema detection with the date and time
# options; and the warnings of malformed JSON lines. types.parquet is that of
# external_table_parquet_types.api.yaml. The other Parquet files, written by arrow-go v18.8.0
# without statistics or dictionaries, each have one nullable column:
# - dec50_frac, dec50_big and dec50_null: dec50 FIXED_LEN_BYTE_ARRAY DECIMAL(50, 20) of one row
#   1.0123456789, one row 1e29, and rows NULL and 1.25.
# - dec38_20 and dec38_20_frac: dec38 FIXED_LEN_BYTE_ARRAY DECIMAL(38, 20) of one row 1.25 and
#   1.0123456789.
# - dec18_10: dec18 INT64 DECIMAL(18, 10) of one row 1.25.
# - dec76_40: dec76 FIXED_LEN_BYTE_ARRAY DECIMAL(76, 40) of one row 1.25.
# - s_null: s BYTE_ARRAY (UTF8) of rows 'a' and NULL.
description: >-
  External table DECIMAL and TIMESTAMP reads, schema detection with date and time options, and
  malformed JSON lines.
vars:
  dataset: bqa_${run}_${case}
  prefix: gs://${bucket}/${run}/${case}
  query: SELECT * FROM `${project}.${dataset}.t` ORDER BY 1
  types: ""
  dec50_frac: "UEFSMRUAFTYVNiwVAhUAFQYVBhwAAAACAAAAAgEAAAAAAAAAAAAAAAAFfOlvIdmdtAAVBBksSAZzY2hlbWEVAgAVDhUqFQIYBWRlYzUwJQoVKBVkLFwVKBVkAAAAFgIZHBkcJggcFQ4ZJQAGGRgFZGVjNTAVABYCFlwWXCYISRwVABUAFQIAAAAWXBYCJggWXBQAACgZcGFycXVldC1nbyB2ZXJzaW9uIDE4LjguMBkcHAAAAIMAAABQQVIx"
