cases:
  # Whether a DECIMAL(50, 20) value of 10 fractional digits, 1.0123456789, rounds or fails as NUMERIC.
  - name: dec50_frac_numeric
    template: ddl_failure
    vars:
      object: "dec50_frac.parquet"
      source: "${dec50_frac}"
      ddl: "CREATE EXTERNAL TABLE `${project}.${dataset}.t` (dec50 NUMERIC) OPTIONS (format = 'PARQUET', uris = ['${prefix}/dec50_frac.parquet'])"
    expect: {
        "create": {
          "status": 200
        },
        "get": {
          "external": {
            "sourceFormat": "PARQUET",
            "sourceUris": [
              "gs://${bucket}/${run}/dec50_frac_numeric/dec50_frac.parquet"
            ]
          },
          "schema": {
            "fields": [
              {
                "name": "dec50",
                "type": "NUMERIC"
              }
            ]
          }
        },
        "ddl": {
          "rows": [
            {
              "f": [
                {
                  "v": "CREATE EXTERNAL TABLE `${project}.bqa_${run}_dec50_frac_numeric.t`\nOPTIONS(\n  format=\"PARQUET\",\n  uris=[\"gs://${bucket}/${run}/dec50_frac_numeric/dec50_frac.parquet\"]\n);"
                }
              ]
            }
          ]
        },
        "options": {
          "rows": [
            {
              "f": [
                {
                  "v": "format"
                },
                {
                  "v": "STRING"
                },
                {
                  "v": "\"PARQUET\""
                }
              ]
            },
            {
              "f": [
                {
                  "v": "uris"
                },
                {
                  "v": "ARRAY<STRING>"
                },
                {
                  "v": "[\"gs://${bucket}/${run}/dec50_frac_numeric/dec50_frac.parquet\"]"
                }
              ]
            }
          ]
        },
        "query": {
          "status": 400,
          "reason": "invalid",
          "message": "Error while reading data, error message: The value for column 'dec50' is out of valid NUMERIC range: Value will lose precision after scaling down to NUMERIC type; input length: 21; scale: 20; input data: 000000000000000000000000057ce96f21d99db400 File: gs://${bucket}/${run}/dec50_frac_numeric/dec50_frac.parquet"
        }
      }
  # As dec50_frac_numeric, with the schema BigQuery detects.
  - name: dec50_frac_detected
    template: ddl_failure
    vars:
      object: "dec50_frac.parquet"
      source: "${dec50_frac}"
      ddl: "CREATE EXTERNAL TABLE `${project}.${dataset}.t` OPTIONS (format = 'PARQUET', uris = ['${prefix}/dec50_frac.parquet'])"
    expect: {
        "create": {
          "status": 200
        },
        "get": {
          "external": {
            "autodetect": true,
            "sourceFormat": "PARQUET",
            "sourceUris": [
              "gs://${bucket}/${run}/dec50_frac_detected/dec50_frac.parquet"
            ]
          },
          "schema": {
            "fields": [
              {
                "mode": "NULLABLE",
                "name": "dec50",
                "type": "NUMERIC"
              }
            ]
          }
        },
        "ddl": {
          "rows": [
            {
              "f": [
                {
                  "v": "CREATE EXTERNAL TABLE `${project}.bqa_${run}_dec50_frac_detected.t`\nOPTIONS(\n  format=\"PARQUET\",\n  uris=[\"gs://${bucket}/${run}/dec50_frac_detected/dec50_frac.parquet\"]\n);"
                }
              ]
            }
          ]
        },
        "options": {
          "rows": [
            {
              "f": [
                {
                  "v": "format"
                },
                {
                  "v": "STRING"
                },
                {
                  "v": "\"PARQUET\""
                }
              ]
            },
            {
              "f": [
                {
                  "v": "uris"
                },
                {
                  "v": "ARRAY<STRING>"
                },
                {
                  "v": "[\"gs://${bucket}/${run}/dec50_frac_detected/dec50_frac.parquet\"]"
                }
              ]
            }
          ]
        },
        "query": {
          "status": 400,
          "reason": "invalid",
          "message": "Error while reading data, error message: The value for column 'dec50' is out of valid NUMERIC range: Value will lose precision after scaling down to NUMERIC type; input length: 21; scale: 20; input data: 000000000000000000000000057ce96f21d99db400 File: gs://${bucket}/${run}/dec50_frac_detected/dec50_frac.parquet"
        }
      }
  # How a DECIMAL(50, 20) value of 30 integer digits, 1e29, which NUMERIC cannot hold, fails as NUMERIC.
  - name: dec50_big_numeric
