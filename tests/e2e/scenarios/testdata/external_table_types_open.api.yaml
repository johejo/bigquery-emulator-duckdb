  # The warning of each malformed line of a JSON table, of which BigQuery's answers settle a line
  # that ends where a key is expected and [1,}, one per line:
  #   {"id":1}
  #   {
  #   {"id":2,}
  #   {"id" 3}
  #   [4}
  #   {"id":5]
  #   {"id":}
  #   abc
  #   {"id":7}x
  #   {"id":"\x"}
  #   "s"
  #   {"id":8,"v":{"a":1]}
  #   {"id":9}
  - name: json_malformed_lines
    template: ddl
    vars:
      object: "s.json"
      source: "eyJpZCI6MX0Kewp7ImlkIjoyLH0KeyJpZCIgM30KWzR9CnsiaWQiOjVdCnsiaWQiOn0KYWJjCnsiaWQiOjd9eAp7ImlkIjoiXHgifQoicyIKeyJpZCI6OCwidiI6eyJhIjoxXX0KeyJpZCI6OX0K"
      ddl: "CREATE EXTERNAL TABLE `${project}.${dataset}.t` (id INT64, v JSON) OPTIONS (format = 'JSON', uris = ['${prefix}/s.json'], max_bad_records = 100)"
    expect: {
        "create": {
          "status": 200
        },
        "get": {
          "external": {
