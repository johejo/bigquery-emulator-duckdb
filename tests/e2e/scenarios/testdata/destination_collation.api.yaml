templates:
  destination:
    steps:
      - name: setup_job
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/jobs
          body:
            jobReference: {location: US}
            configuration:
              query:
                useLegacySql: false
                query: >-
                  CREATE SCHEMA `${project}.${source_dataset}` OPTIONS(location = 'US');
                  CREATE SCHEMA `${project}.${destination_dataset}` ${dataset_default} OPTIONS(location = 'US');
                  CREATE TABLE `${project}.${source_dataset}.source` (
                    unassigned STRING,
                    binary STRING COLLATE '',
                    ci STRING COLLATE 'und:ci',
                    nested STRUCT<unassigned STRING, binary STRING COLLATE '', ci STRING COLLATE 'und:ci'>,
                    repeated_unassigned ARRAY<STRING>,
                    repeated_binary ARRAY<STRING COLLATE ''>,
                    repeated_ci ARRAY<STRING COLLATE 'und:ci'>
                  );
                  INSERT `${project}.${source_dataset}.source`
                  VALUES ('a', 'a', 'a', STRUCT('a', 'a', 'a'), ['a'], ['a'], ['a']);
                  ${source_default}
                  ${destination_setup}
        bind: {setup_job: /body/jobReference/jobId}
      - name: setup
        rest: {method: GET, path: '/bigquery/v2/projects/${project}/jobs/${setup_job}?location=US'}
        until: {/body/status/state: DONE}
        observe: {status: /body/status}
      - name: source
        rest: {method: GET, path: '/bigquery/v2/projects/${project}/datasets/${source_dataset}/tables/source'}
        observe:
          defaultCollation: /body/defaultCollation
          schema: /body/schema
      - name: dataset
        rest: {method: GET, path: '/bigquery/v2/projects/${project}/datasets/${destination_dataset}'}
        observe: {defaultCollation: /body/defaultCollation}
      - name: write_job
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/jobs
          body:
            jobReference: {location: US}
            configuration: '${configuration}'
        bind: {write_job: /body/jobReference/jobId}
        observe: {error: /body/error}
      - name: write
        rest: {method: GET, path: '/bigquery/v2/projects/${project}/jobs/${write_job}?location=US'}
        until: {/body/status/state: DONE}
        observe: {status: /body/status}
      - name: destination
        rest: {method: GET, path: '/bigquery/v2/projects/${project}/datasets/${destination_dataset}/tables/destination'}
        observe:
          defaultCollation: /body/defaultCollation
          schema: /body/schema
          numRows: /body/numRows
      - name: add_column_job
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/jobs
          body:
            jobReference: {location: US}
            configuration:
              query:
                useLegacySql: false
                query: ALTER TABLE `${project}.${destination_dataset}.destination` ADD COLUMN added STRING
        bind: {add_column_job: /body/jobReference/jobId}
      - name: add_column
        rest: {method: GET, path: '/bigquery/v2/projects/${project}/jobs/${add_column_job}?location=US'}
        until: {/body/status/state: DONE}
        observe: {status: /body/status}
      - name: after_add
        rest: {method: GET, path: '/bigquery/v2/projects/${project}/datasets/${destination_dataset}/tables/destination'}
        observe:
          defaultCollation: /body/defaultCollation
          schema: /body/schema
    cleanup:
      - name: delete_destination_dataset
        rest: {method: DELETE, path: '/bigquery/v2/projects/${project}/datasets/${destination_dataset}?deleteContents=true'}
      - name: delete_source_dataset
        rest: {method: DELETE, path: '/bigquery/v2/projects/${project}/datasets/${source_dataset}?deleteContents=true'}
cases:
  - name: copy_create_no_defaults
    template: destination
    vars: {configuration: '${copy_configuration}'}
    expect:
      add_column:
        status:
          state: DONE
      after_add:
        schema: ${copied_after_add}
      dataset: {}
      destination:
        numRows: "1"
        schema: ${source_schema}
      setup:
        status:
