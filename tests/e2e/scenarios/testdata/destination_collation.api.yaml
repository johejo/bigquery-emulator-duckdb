version: 1
# Recorded on BigQuery in project johejo-sandbox, run vznpv2dvzlrkv3nddc2mqd5x2y.
# Job inheritance differs from CREATE TABLE / CTAS; retain the answer sidecar as provenance.
# In particular, keep absent defaults and explicit empty defaults distinguishable.
# Source defaults are changed AFTER inserting rows, leaving the mixed column
# collations fixed so table-default inheritance can be isolated from column copying.
# Specification context (does not settle copy/query replacement behavior):
# ../../../../../third_party/bigquery_docs/reference/standard-sql/collation-concepts.md
description: >-
  Copy and query destination creation/replacement: distinguish source table defaults,
  destination dataset defaults, existing destination defaults, and column collations.
  Read metadata before and after adding a column to exercise the resulting default.
vars:
  source_dataset: bqa_${run}_${case}_src
  destination_dataset: bqa_${run}_${case}_dst
  dataset_default: ''
  source_default: ''
  destination_setup: ''
  disposition: WRITE_EMPTY
  copy_configuration:
    copy:
      sourceTable: {projectId: '${project}', datasetId: '${source_dataset}', tableId: source}
      destinationTable: {projectId: '${project}', datasetId: '${destination_dataset}', tableId: destination}
      writeDisposition: '${disposition}'
  query_configuration:
    query:
      query: SELECT * FROM `${project}.${source_dataset}.source`
      useLegacySql: false
      destinationTable: {projectId: '${project}', datasetId: '${destination_dataset}', tableId: destination}
      writeDisposition: '${disposition}'
  replace_unassigned: >-
    CREATE TABLE `${project}.${destination_dataset}.destination` (old_value STRING);
    INSERT `${project}.${destination_dataset}.destination` VALUES ('old');
  replace_ci: >-
    CREATE TABLE `${project}.${destination_dataset}.destination` (old_value STRING) DEFAULT COLLATE 'und:ci';
    INSERT `${project}.${destination_dataset}.destination` VALUES ('old');
  replace_empty: >-
    CREATE TABLE `${project}.${destination_dataset}.destination` (old_value STRING) DEFAULT COLLATE '';
    INSERT `${project}.${destination_dataset}.destination` VALUES ('old');
  set_source_ci: ALTER TABLE `${project}.${source_dataset}.source` SET DEFAULT COLLATE 'und:ci';
  set_source_empty: ALTER TABLE `${project}.${source_dataset}.source` SET DEFAULT COLLATE '';
  copied_after_add:
    fields:
    - name: unassigned
      type: STRING
    - collation: ""
      name: binary
      type: STRING
    - collation: und:ci
      name: ci
      type: STRING
    - fields:
      - name: unassigned
        type: STRING
      - collation: ""
        name: binary
        type: STRING
      - collation: und:ci
        name: ci
        type: STRING
      name: nested
      type: RECORD
    - mode: REPEATED
      name: repeated_unassigned
      type: STRING
    - collation: ""
      mode: REPEATED
      name: repeated_binary
      type: STRING
    - collation: und:ci
      mode: REPEATED
      name: repeated_ci
      type: STRING
    - name: added
      type: STRING
  source_schema:
