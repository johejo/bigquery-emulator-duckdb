version: 1
# Recorded on BigQuery in project johejo-sandbox, run wwvjukwmmf2k2uozb63t4dgpuu, with
# sources in the bucket johejo-sandbox-us; the answers sidecar keeps the
# observations. BigQuery's answers settle which declared types a Parquet external table reads each
# Parquet type as: the Parquet conversions of third_party/bigquery_docs/
# loading-data-cloud-storage-parquet.md give the detected type only. Each case declares
# one column of types.parquet, which DuckDB 2.0.0 wrote uncompressed, of one row:
# bool BOOLEAN = true; i32 INT32 (INT_32), i64 INT64 (INT_64), i8 INT32 (INT_8), u32 INT32
# (UINT_32) and u64 INT64 (UINT_64) = 42; f32 FLOAT and f64 DOUBLE = 1.5; dec9 INT32
# DECIMAL(9, 2), dec18 INT64 DECIMAL(18, 4) and dec38 FIXED_LEN_BYTE_ARRAY DECIMAL(38, 9) =
# 1.25; s = 'a', s_int = '42', s_date = '2024-01-02', s_datetime = '2024-01-02 03:04:05',
# s_json = '{"a":1}' and s_wkt = 'POINT(1 2)', BYTE_ARRAY (UTF8); b BYTE_ARRAY = b'a';
# b_wkb BYTE_ARRAY = the WKB of POINT(1 2); d INT32 (DATE) = 2024-01-02; t INT64
# TIME(MICROS) = 03:04:05.000006; ts INT64 TIMESTAMP(MICROS, isAdjustedToUTC) and tsl
# INT64 TIMESTAMP(MICROS, not adjusted) = 2024-01-02 03:04:05.000006; tsms TIMESTAMP(MILLIS,
# not adjusted) = 2024-01-02 03:04:05.006; tsns TIMESTAMP(NANOS, not adjusted) =
# 2024-01-02 03:04:05.000006007. wide.parquet, written by arrow-go v18.8.0 without
# statistics or dictionaries, has one row of dec50 FIXED_LEN_BYTE_ARRAY DECIMAL(50, 20) =
# 1.25.
description: >-
  Declared types of Parquet external table columns other than the detected ones.
vars:
  dataset: bqa_${run}_${case}
  prefix: gs://${bucket}/${run}/${case}
  query: SELECT * FROM `${project}.${dataset}.t` ORDER BY 1
  types: ""
templates:
  # Creates `t` with the DDL statement `ddl` over the object `object`, whose contents are
  # `source`, and runs `query` on it.
  ddl:
    steps:
      - name: dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: source
        gcs: {method: PUT, object: '${run}/${case}/${object}', base64: '${source}'}
      - name: create
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: ${ddl}
        observe:
          status: /status
          errors: /body/errors
      - name: get
        rest:
          method: GET
          path: /bigquery/v2/projects/${project}/datasets/${dataset}/tables/t
        observe:
          external: /body/externalDataConfiguration
          schema: /body/schema
      - name: query
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: ${query}
        bind:
          job: /body/jobReference/jobId
        observe:
          status: /status
          jobComplete: /body/jobComplete
          schema: /body/schema
          rows: /body/rows
          errors: /body/errors
      - name: job
        rest:
          method: GET
          path: /bigquery/v2/projects/${project}/jobs/${job}?location=US
        observe:
          status: /body/status
    cleanup:
      - name: delete
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
      - name: delete_source
        gcs: {method: DELETE, object: '${run}/${case}/${object}'}
  # As ddl, creating `t` with tables.insert and the resource `table`.
  rest:
    steps:
      - name: dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: source
        gcs: {method: PUT, object: '${run}/${case}/${object}', base64: '${source}'}
      - name: create
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets/${dataset}/tables
          body: ${table}
        observe:
          status: /status
          external: /body/externalDataConfiguration
          schema: /body/schema
      - name: get
        rest:
          method: GET
          path: /bigquery/v2/projects/${project}/datasets/${dataset}/tables/t
        observe:
          external: /body/externalDataConfiguration
          schema: /body/schema
      - name: query
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: ${query}
        bind:
          job: /body/jobReference/jobId
        observe:
          status: /status
          jobComplete: /body/jobComplete
          schema: /body/schema
          rows: /body/rows
          errors: /body/errors
      - name: job
        rest:
          method: GET
          path: /bigquery/v2/projects/${project}/jobs/${job}?location=US
        observe:
          status: /body/status
    cleanup:
      - name: delete
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
      - name: delete_source
        gcs: {method: DELETE, object: '${run}/${case}/${object}'}
  # As ddl, where the query fails.
  ddl_failure:
    steps:
      - name: dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: source
        gcs: {method: PUT, object: '${run}/${case}/${object}', base64: '${source}'}
      - name: create
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: ${ddl}
        observe:
          status: /status
          errors: /body/errors
      - name: get
        rest:
          method: GET
          path: /bigquery/v2/projects/${project}/datasets/${dataset}/tables/t
        observe:
          external: /body/externalDataConfiguration
          schema: /body/schema
      - name: query
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: ${query}
        expectFailure: true
        observe:
          status: /status
          reason: /body/error/errors/0/reason
          message: /body/error/message
    cleanup:
      - name: delete
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
      - name: delete_source
        gcs: {method: DELETE, object: '${run}/${case}/${object}'}
  # As ddl, where the statement fails.
  create_failure:
    steps:
      - name: dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: source
        gcs: {method: PUT, object: '${run}/${case}/${object}', base64: '${source}'}
      - name: create
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: ${ddl}
        expectFailure: true
        observe:
          status: /status
          reason: /body/error/errors/0/reason
          message: /body/error/message
    cleanup:
      - name: delete
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
      - name: delete_source
        gcs: {method: DELETE, object: '${run}/${case}/${object}'}
cases:
  - name: bool_as_bool
    template: ddl
    vars:
      object: "types.parquet"
      source: "${types}"
      ddl: "CREATE EXTERNAL TABLE `${project}.${dataset}.t` (bool BOOL) OPTIONS (format = 'PARQUET', uris = ['${prefix}/types.parquet'])"
    expect: {
        "create": {
          "status": 200
        },
        "get": {
          "external": {
            "sourceFormat": "PARQUET",
            "sourceUris": [
              "gs://${bucket}/${run}/bool_as_bool/types.parquet"
            ]
          },
          "schema": {
            "fields": [
              {
                "name": "bool",
                "type": "BOOLEAN"
              }
            ]
          }
        },
        "job": {
          "status": {
            "state": "DONE"
          }
        },
        "query": {
          "jobComplete": true,
          "rows": [
            {
              "f": [
                {
                  "v": "true"
                }
              ]
            }
          ],
          "schema": {
            "fields": [
              {
                "mode": "NULLABLE",
                "name": "bool",
                "type": "BOOLEAN"
              }
            ]
          },
          "status": 200
        }
      }
  - name: bool_as_int64
    template: ddl_failure
    vars:
      object: "types.parquet"
      source: "${types}"
      ddl: "CREATE EXTERNAL TABLE `${project}.${dataset}.t` (bool INT64) OPTIONS (format = 'PARQUET', uris = ['${prefix}/types.parquet'])"
    expect: {
        "create": {
          "status": 200
        },
        "get": {
          "external": {
            "sourceFormat": "PARQUET",
            "sourceUris": [
              "gs://${bucket}/${run}/bool_as_int64/types.parquet"
            ]
          },
          "schema": {
            "fields": [
              {
                "name": "bool",
                "type": "INTEGER"
              }
            ]
          }
        },
        "query": {
          "status": 400,
          "reason": "invalidQuery",
          "message": "Column 'bool' has unsupported Parquet type(BOOLEAN) for GoogleSQL type(INT64)"
        }
      }
  - name: bool_as_string
    template: ddl_failure
    vars:
      object: "types.parquet"
      source: "${types}"
      ddl: "CREATE EXTERNAL TABLE `${project}.${dataset}.t` (bool STRING) OPTIONS (format = 'PARQUET', uris = ['${prefix}/types.parquet'])"
