          "reason": "invalid",
          "message": "Error while reading data, error message: Parquet type for field 'bool' needs to be FIXED_LEN_BYTE_ARRAY or BYTE_ARRAY (found BOOLEAN). File: gs://${bucket}/${run}/bool_as_string/types.parquet"
        }
      }
