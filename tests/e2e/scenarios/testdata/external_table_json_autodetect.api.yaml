version: 1
# Recorded on BigQuery in project johejo-sandbox, runs k7rzotp3mfasddg3wgjgb22fp4 and
# zjkr3yfemu4okj5pa4gwpabctw, with sources in the bucket johejo-sandbox-us; the answers sidecar
# keeps the observations.
# third_party/bigquery_docs/schema-detect.md and
# third_party/bigquery_docs/loading-data-cloud-storage-json.md say only that objects are RECORDs,
# arrays REPEATED, and strings convert to BOOL, numeric and date/time types when possible. These
# cases settle the rest for external tables: the alphabetically last file gives the schema; a
# field's values merge as CSV columns do, an object or an array outweighs a scalar, and a field
# with only nulls or empty arrays is a STRING; strings convert as CSV values do, and queries read
# them converted, and a STRING field reads a number as its text; the order of columns is the
# order in which a libc++ std::unordered_map iterates their names, inserted as they first appear,
# and the same names in the same order always give the same order.
description: >-
  Schema auto-detection of JSON external tables created by DDL and tables.insert, with sources in
  a Cloud Storage bucket.
vars:
  dataset: bqa_${run}_${case}
  prefix: gs://${bucket}/${run}/${case}
  # A second source, for cases that read only the first: {"z":true}.
  second: eyJ6Ijp0cnVlfQo=
  uris: "['${prefix}/a.json']"
templates:
  # Creates the table by DDL from a.json (`first`) and b.json (`second`), which `uris` lists.
  ddl:
    steps:
      - name: dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: a
        gcs: {method: PUT, object: '${run}/${case}/a.json', base64: '${first}'}
      - name: b
        gcs: {method: PUT, object: '${run}/${case}/b.json', base64: '${second}'}
      - name: create
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: CREATE EXTERNAL TABLE `${project}.${dataset}.t` OPTIONS (format = 'JSON', uris = ${uris})
        observe:
          status: /status
          errors: /body/errors
          message: /body/error/message
      - name: get
        rest:
          method: GET
          path: /bigquery/v2/projects/${project}/datasets/${dataset}/tables/t
        observe:
          status: /status
          schema: /body/schema
          external: /body/externalDataConfiguration
      - name: information_schema
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: SELECT ddl FROM `${project}.${dataset}.INFORMATION_SCHEMA.TABLES` WHERE table_name = 't'
        observe:
          errors: /body/errors
          rows: /body/rows
      - name: query
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: SELECT TO_JSON_STRING(t), _FILE_NAME AS file FROM `${project}.${dataset}.t` AS t ORDER BY file, 1
        observe:
          status: /status
          errors: /body/errors
          message: /body/error/message
          rows: /body/rows
    cleanup:
      - name: delete
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
      - name: delete_a
        gcs: {method: DELETE, object: '${run}/${case}/a.json'}
      - name: delete_b
        gcs: {method: DELETE, object: '${run}/${case}/b.json'}
  # As ddl, for sources a query cannot read.
  ddl_unreadable:
    steps:
      - name: dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: a
        gcs: {method: PUT, object: '${run}/${case}/a.json', base64: '${first}'}
      - name: b
        gcs: {method: PUT, object: '${run}/${case}/b.json', base64: '${second}'}
      - name: create
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: CREATE EXTERNAL TABLE `${project}.${dataset}.t` OPTIONS (format = 'JSON', uris = ${uris})
        observe:
          status: /status
          errors: /body/errors
          message: /body/error/message
      - name: get
        rest:
          method: GET
          path: /bigquery/v2/projects/${project}/datasets/${dataset}/tables/t
        observe:
          status: /status
          schema: /body/schema
          external: /body/externalDataConfiguration
      - name: information_schema
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: SELECT ddl FROM `${project}.${dataset}.INFORMATION_SCHEMA.TABLES` WHERE table_name = 't'
        observe:
          errors: /body/errors
          rows: /body/rows
      - name: query
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: SELECT TO_JSON_STRING(t), _FILE_NAME AS file FROM `${project}.${dataset}.t` AS t ORDER BY file, 1
        expectFailure: true
        observe:
          status: /status
          reason: /body/error/errors/0/reason
          message: /body/error/message
    cleanup:
      - name: delete
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
      - name: delete_a
        gcs: {method: DELETE, object: '${run}/${case}/a.json'}
      - name: delete_b
        gcs: {method: DELETE, object: '${run}/${case}/b.json'}
  # As ddl, for sources BigQuery detects no schema of.
  ddl_rejected:
    steps:
      - name: dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: a
        gcs: {method: PUT, object: '${run}/${case}/a.json', base64: '${first}'}
      - name: b
        gcs: {method: PUT, object: '${run}/${case}/b.json', base64: '${second}'}
      - name: create
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: CREATE EXTERNAL TABLE `${project}.${dataset}.t` OPTIONS (format = 'JSON', uris = ${uris})
        expectFailure: true
        observe:
          status: /status
          reason: /body/error/errors/0/reason
          message: /body/error/message
    cleanup:
      - name: delete
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
      - name: delete_a
        gcs: {method: DELETE, object: '${run}/${case}/a.json'}
      - name: delete_b
        gcs: {method: DELETE, object: '${run}/${case}/b.json'}
  # Creates the table by tables.insert with `configuration` from a.json: {"id":"1","name":"a"}.
  api:
    steps:
      - name: dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: a
        gcs: {method: PUT, object: '${run}/${case}/a.json', base64: '${first}'}
      - name: create
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets/${dataset}/tables
          body:
            tableReference: {tableId: t}
            externalDataConfiguration: ${configuration}
        observe:
          status: /status
          schema: /body/schema
          external: /body/externalDataConfiguration
      - name: query
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body:
            useLegacySql: false
            location: US
            timeoutMs: 200000
            query: SELECT TO_JSON_STRING(t) FROM `${project}.${dataset}.t` AS t ORDER BY 1
        observe:
          status: /status
          errors: /body/errors
          rows: /body/rows
    cleanup:
      - name: delete
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
      - name: delete_a
        gcs: {method: DELETE, object: '${run}/${case}/a.json'}
  # tables.insert rejects `configuration`.
  api_rejected:
    steps:
      - name: dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body:
            datasetReference: {datasetId: '${dataset}'}
            location: US
      - name: a
        gcs: {method: PUT, object: '${run}/${case}/a.json', base64: '${first}'}
      - name: create
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets/${dataset}/tables
          body:
            tableReference: {tableId: t}
            externalDataConfiguration: ${configuration}
        expectFailure: true
        observe:
          status: /status
          reason: /body/error/errors/0/reason
          message: /body/error/message
    cleanup:
      - name: delete
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
      - name: delete_a
        gcs: {method: DELETE, object: '${run}/${case}/a.json'}
cases:
  # Native JSON scalars and a null-only field.
  # a.json: {"i":1,"f":1.5,"b":true,"s":"a","n":null,"g":1.0,"e":1e2}
  - name: ddl_scalars
    template: ddl
    vars:
      first: 'eyJpIjoxLCJmIjoxLjUsImIiOnRydWUsInMiOiJhIiwibiI6bnVsbCwiZyI6MS4wLCJlIjoxZTJ9Cg=='
    expect: {"create": {"status": 200}, "get": {"external": {"autodetect": true, "sourceFormat": "NEWLINE_DELIMITED_JSON", "sourceUris": ["${prefix}/a.json"]}, "schema": {"fields": [{"mode": "NULLABLE", "name": "g", "type": "FLOAT"}, {"mode": "NULLABLE", "name": "s", "type": "STRING"}, {"mode": "NULLABLE", "name": "b", "type": "BOOLEAN"}, {"mode": "NULLABLE", "name": "n", "type": "STRING"}, {"mode": "NULLABLE", "name": "e", "type": "FLOAT"}, {"mode": "NULLABLE", "name": "f", "type": "FLOAT"}, {"mode": "NULLABLE", "name": "i", "type": "INTEGER"}]}, "status": 200}, "information_schema": {"rows": [{"f": [{"v": "CREATE EXTERNAL TABLE `${project}.${dataset}.t`\nOPTIONS(\n  format=\"NEWLINE_DELIMITED_JSON\",\n  uris=[\"${prefix}/a.json\"]\n);"}]}]}, "query": {"rows": [{"f": [{"v": "{\"g\":1,\"s\":\"a\",\"b\":true,\"n\":null,\"e\":100,\"f\":1.5,\"i\":1}"}, {"v": "${prefix}/a.json"}]}], "status": 200}}
  # Detected column order: first appearance or name.
  # a.json: {"b":1,"a":2,"c":3}
  # a.json: {"d":4,"a":5}
  - name: ddl_field_order
    template: ddl
    vars:
      first: 'eyJiIjoxLCJhIjoyLCJjIjozfQp7ImQiOjQsImEiOjV9Cg=='
    expect: {"create": {"status": 200}, "get": {"external": {"autodetect": true, "sourceFormat": "NEWLINE_DELIMITED_JSON", "sourceUris": ["${prefix}/a.json"]}, "schema": {"fields": [{"mode": "NULLABLE", "name": "d", "type": "INTEGER"}, {"mode": "NULLABLE", "name": "c", "type": "INTEGER"}, {"mode": "NULLABLE", "name": "a", "type": "INTEGER"}, {"mode": "NULLABLE", "name": "b", "type": "INTEGER"}]}, "status": 200}, "information_schema": {"rows": [{"f": [{"v": "CREATE EXTERNAL TABLE `${project}.${dataset}.t`\nOPTIONS(\n  format=\"NEWLINE_DELIMITED_JSON\",\n  uris=[\"${prefix}/a.json\"]\n);"}]}]}, "query": {"rows": [{"f": [{"v": "{\"d\":4,\"c\":null,\"a\":5,\"b\":null}"}, {"v": "${prefix}/a.json"}]}, {"f": [{"v": "{\"d\":null,\"c\":3,\"a\":2,\"b\":1}"}, {"v": "${prefix}/a.json"}]}], "status": 200}}
  # Boolean spellings: the documentation detects all but 0 and 1.
  # a.json: {"yes":"yes","t":"t","y":"Y","no":"NO","one":"1","zero":"0"}
  - name: ddl_string_booleans
    template: ddl
    vars:
      first: 'eyJ5ZXMiOiJ5ZXMiLCJ0IjoidCIsInkiOiJZIiwibm8iOiJOTyIsIm9uZSI6IjEiLCJ6ZXJvIjoiMCJ9Cg=='
    expect: {"create": {"status": 200}, "get": {"external": {"autodetect": true, "sourceFormat": "NEWLINE_DELIMITED_JSON", "sourceUris": ["${prefix}/a.json"]}, "schema": {"fields": [{"mode": "NULLABLE", "name": "zero", "type": "INTEGER"}, {"mode": "NULLABLE", "name": "one", "type": "INTEGER"}, {"mode": "NULLABLE", "name": "no", "type": "BOOLEAN"}, {"mode": "NULLABLE", "name": "y", "type": "BOOLEAN"}, {"mode": "NULLABLE", "name": "t", "type": "BOOLEAN"}, {"mode": "NULLABLE", "name": "yes", "type": "BOOLEAN"}]}, "status": 200}, "information_schema": {"rows": [{"f": [{"v": "CREATE EXTERNAL TABLE `${project}.${dataset}.t`\nOPTIONS(\n  format=\"NEWLINE_DELIMITED_JSON\",\n  uris=[\"${prefix}/a.json\"]\n);"}]}]}, "query": {"rows": [{"f": [{"v": "{\"zero\":0,\"one\":1,\"no\":false,\"y\":true,\"t\":true,\"yes\":true}"}, {"v": "${prefix}/a.json"}]}], "status": 200}}
  # Types merged across rows.
  # a.json: {"if":1,"is":1,"bs":true,"in":1,"ib":1,"sb":"true","fs":1.5}
  # a.json: {"if":1.5,"is":"a","bs":"a","in":null,"ib":true,"sb":true,"fs":"2"}
  - name: ddl_merge_scalars
    template: ddl
    vars:
      first: 'eyJpZiI6MSwiaXMiOjEsImJzIjp0cnVlLCJpbiI6MSwiaWIiOjEsInNiIjoidHJ1ZSIsImZzIjoxLjV9CnsiaWYiOjEuNSwiaXMiOiJhIiwiYnMiOiJhIiwiaW4iOm51bGwsImliIjp0cnVlLCJzYiI6dHJ1ZSwiZnMiOiIyIn0K'
    expect: {"create": {"status": 200}, "get": {"external": {"autodetect": true, "sourceFormat": "NEWLINE_DELIMITED_JSON", "sourceUris": ["${prefix}/a.json"]}, "schema": {"fields": [{"mode": "NULLABLE", "name": "fs", "type": "FLOAT"}, {"mode": "NULLABLE", "name": "bs", "type": "STRING"}, {"mode": "NULLABLE", "name": "ib", "type": "STRING"}, {"mode": "NULLABLE", "name": "sb", "type": "BOOLEAN"}, {"mode": "NULLABLE", "name": "in", "type": "INTEGER"}, {"mode": "NULLABLE", "name": "is", "type": "STRING"}, {"mode": "NULLABLE", "name": "if", "type": "FLOAT"}]}, "status": 200}, "information_schema": {"rows": [{"f": [{"v": "CREATE EXTERNAL TABLE `${project}.${dataset}.t`\nOPTIONS(\n  format=\"NEWLINE_DELIMITED_JSON\",\n  uris=[\"${prefix}/a.json\"]\n);"}]}]}, "query": {"rows": [{"f": [{"v": "{\"fs\":1.5,\"bs\":\"true\",\"ib\":\"1\",\"sb\":true,\"in\":1,\"is\":\"1\",\"if\":1}"}, {"v": "${prefix}/a.json"}]}, {"f": [{"v": "{\"fs\":2,\"bs\":\"a\",\"ib\":\"true\",\"sb\":true,\"in\":null,\"is\":\"a\",\"if\":1.5}"}, {"v": "${prefix}/a.json"}]}], "status": 200}}
  # Converted strings merged with native values and other strings.
  # a.json: {"i":1,"d":"2024-01-02","ts":"2024-01-02 03:04:05","n":"1"}
  # a.json: {"i":"2","d":"2024-01-02 03:04:05","ts":"2024-01-02","n":"1.5"}
  - name: ddl_merge_strings
    template: ddl
    vars:
      first: 'eyJpIjoxLCJkIjoiMjAyNC0wMS0wMiIsInRzIjoiMjAyNC0wMS0wMiAwMzowNDowNSIsIm4iOiIxIn0KeyJpIjoiMiIsImQiOiIyMDI0LTAxLTAyIDAzOjA0OjA1IiwidHMiOiIyMDI0LTAxLTAyIiwibiI6IjEuNSJ9Cg=='
    expect: {"create": {"status": 200}, "get": {"external": {"autodetect": true, "sourceFormat": "NEWLINE_DELIMITED_JSON", "sourceUris": ["${prefix}/a.json"]}, "schema": {"fields": [{"mode": "NULLABLE", "name": "n", "type": "FLOAT"}, {"mode": "NULLABLE", "name": "ts", "type": "STRING"}, {"mode": "NULLABLE", "name": "d", "type": "STRING"}, {"mode": "NULLABLE", "name": "i", "type": "INTEGER"}]}, "status": 200}, "information_schema": {"rows": [{"f": [{"v": "CREATE EXTERNAL TABLE `${project}.${dataset}.t`\nOPTIONS(\n  format=\"NEWLINE_DELIMITED_JSON\",\n  uris=[\"${prefix}/a.json\"]\n);"}]}]}, "query": {"rows": [{"f": [{"v": "{\"n\":1,\"ts\":\"2024-01-02 03:04:05\",\"d\":\"2024-01-02\",\"i\":1}"}, {"v": "${prefix}/a.json"}]}, {"f": [{"v": "{\"n\":1.5,\"ts\":\"2024-01-02\",\"d\":\"2024-01-02 03:04:05\",\"i\":2}"}, {"v": "${prefix}/a.json"}]}], "status": 200}}
  # Fields absent from some rows.
  # a.json: {"a":1}
  # a.json: {"b":"x"}
  # a.json: {"a":2,"c":true}
  - name: ddl_missing_fields
    template: ddl
    vars:
      first: 'eyJhIjoxfQp7ImIiOiJ4In0KeyJhIjoyLCJjIjp0cnVlfQo='
    expect: {"create": {"status": 200}, "get": {"external": {"autodetect": true, "sourceFormat": "NEWLINE_DELIMITED_JSON", "sourceUris": ["${prefix}/a.json"]}, "schema": {"fields": [{"mode": "NULLABLE", "name": "b", "type": "STRING"}, {"mode": "NULLABLE", "name": "c", "type": "BOOLEAN"}, {"mode": "NULLABLE", "name": "a", "type": "INTEGER"}]}, "status": 200}, "information_schema": {"rows": [{"f": [{"v": "CREATE EXTERNAL TABLE `${project}.${dataset}.t`\nOPTIONS(\n  format=\"NEWLINE_DELIMITED_JSON\",\n  uris=[\"${prefix}/a.json\"]\n);"}]}]}, "query": {"rows": [{"f": [{"v": "{\"b\":\"x\",\"c\":null,\"a\":null}"}, {"v": "${prefix}/a.json"}]}, {"f": [{"v": "{\"b\":null,\"c\":null,\"a\":1}"}, {"v": "${prefix}/a.json"}]}, {"f": [{"v": "{\"b\":null,\"c\":true,\"a\":2}"}, {"v": "${prefix}/a.json"}]}], "status": 200}}
  # Record fields merged across rows, and a null record.
  # a.json: {"r":{"x":1}}
  # a.json: {"r":{"y":"a"}}
  # a.json: {"r":null}
  - name: ddl_nested_merge
    template: ddl
    vars:
      first: 'eyJyIjp7IngiOjF9fQp7InIiOnsieSI6ImEifX0KeyJyIjpudWxsfQo='
    expect: {"create": {"status": 200}, "get": {"external": {"autodetect": true, "sourceFormat": "NEWLINE_DELIMITED_JSON", "sourceUris": ["${prefix}/a.json"]}, "schema": {"fields": [{"fields": [{"mode": "NULLABLE", "name": "y", "type": "STRING"}, {"mode": "NULLABLE", "name": "x", "type": "INTEGER"}], "mode": "NULLABLE", "name": "r", "type": "RECORD"}]}, "status": 200}, "information_schema": {"rows": [{"f": [{"v": "CREATE EXTERNAL TABLE `${project}.${dataset}.t`\nOPTIONS(\n  format=\"NEWLINE_DELIMITED_JSON\",\n  uris=[\"${prefix}/a.json\"]\n);"}]}]}, "query": {"rows": [{"f": [{"v": "{\"r\":null}"}, {"v": "${prefix}/a.json"}]}, {"f": [{"v": "{\"r\":{\"y\":\"a\",\"x\":null}}"}, {"v": "${prefix}/a.json"}]}, {"f": [{"v": "{\"r\":{\"y\":null,\"x\":1}}"}, {"v": "${prefix}/a.json"}]}], "status": 200}}
  # Field names differing only in case.
  # a.json: {"Name":1}
  # a.json: {"name":2}
  - name: ddl_case_variants
    template: ddl_rejected
    vars:
      first: 'eyJOYW1lIjoxfQp7Im5hbWUiOjJ9Cg=='
    expect: {"create": {"status": 400, "reason": "invalidQuery", "message": "Duplicate(Case Insensitive) field names: name and Name. Table: t"}}
  # A field that is a scalar in one row and an object in another.
  # a.json: {"x":1}
  # a.json: {"x":{"y":1}}
  - name: ddl_scalar_record_conflict
    template: ddl_unreadable
    vars:
      first: 'eyJ4IjoxfQp7IngiOnsieSI6MX19Cg=='
    expect: {"create": {"status": 200}, "get": {"external": {"autodetect": true, "sourceFormat": "NEWLINE_DELIMITED_JSON", "sourceUris": ["${prefix}/a.json"]}, "schema": {"fields": [{"fields": [{"mode": "NULLABLE", "name": "y", "type": "INTEGER"}], "mode": "NULLABLE", "name": "x", "type": "RECORD"}]}, "status": 200}, "information_schema": {"rows": [{"f": [{"v": "CREATE EXTERNAL TABLE `${project}.${dataset}.t`\nOPTIONS(\n  format=\"NEWLINE_DELIMITED_JSON\",\n  uris=[\"${prefix}/a.json\"]\n);"}]}]}, "query": {"status": 400, "reason": "invalid", "message": "Error while reading table: ${project}.${dataset}.t, error message: JSON parsing error in row starting at position 0: Flat value specified for record field. Field: x; Value: 1 File: ${prefix}/a.json"}}
  # A field that is a scalar in one row and an array in another.
  # a.json: {"x":1}
  # a.json: {"x":[2]}
  - name: ddl_scalar_array_conflict
    template: ddl_unreadable
    vars:
      first: 'eyJ4IjoxfQp7IngiOlsyXX0K'
    expect: {"create": {"status": 200}, "get": {"external": {"autodetect": true, "sourceFormat": "NEWLINE_DELIMITED_JSON", "sourceUris": ["${prefix}/a.json"]}, "schema": {"fields": [{"mode": "REPEATED", "name": "x", "type": "INTEGER"}]}, "status": 200}, "information_schema": {"rows": [{"f": [{"v": "CREATE EXTERNAL TABLE `${project}.${dataset}.t`\nOPTIONS(\n  format=\"NEWLINE_DELIMITED_JSON\",\n  uris=[\"${prefix}/a.json\"]\n);"}]}]}, "query": {"status": 400, "reason": "invalid", "message": "Error while reading table: ${project}.${dataset}.t, error message: JSON parsing error in row starting at position 0: Repeated field must be imported as a JSON array. Field: x. File: ${prefix}/a.json"}}
  # An array of arrays.
  # a.json: {"x":[[1]]}
  - name: ddl_nested_array
    template: ddl_unreadable
    vars:
      first: 'eyJ4IjpbWzFdXX0K'
    expect: {"create": {"status": 200}, "get": {"external": {"autodetect": true, "sourceFormat": "NEWLINE_DELIMITED_JSON", "sourceUris": ["${prefix}/a.json"]}, "schema": {"fields": [{"mode": "REPEATED", "name": "x", "type": "INTEGER"}]}, "status": 200}, "information_schema": {"rows": [{"f": [{"v": "CREATE EXTERNAL TABLE `${project}.${dataset}.t`\nOPTIONS(\n  format=\"NEWLINE_DELIMITED_JSON\",\n  uris=[\"${prefix}/a.json\"]\n);"}]}]}, "query": {"status": 400, "reason": "invalid", "message": "Error while reading table: ${project}.${dataset}.t, error message: JSON parsing error in row starting at position 0: Nested arrays not allowed. File: ${prefix}/a.json"}}
  # An array of mixed scalar types.
  # a.json: {"x":[1,"a",true]}
  - name: ddl_mixed_array
    template: ddl
    vars:
      first: 'eyJ4IjpbMSwiYSIsdHJ1ZV19Cg=='
    expect: {"create": {"status": 200}, "get": {"external": {"autodetect": true, "sourceFormat": "NEWLINE_DELIMITED_JSON", "sourceUris": ["${prefix}/a.json"]}, "schema": {"fields": [{"mode": "REPEATED", "name": "x", "type": "STRING"}]}, "status": 200}, "information_schema": {"rows": [{"f": [{"v": "CREATE EXTERNAL TABLE `${project}.${dataset}.t`\nOPTIONS(\n  format=\"NEWLINE_DELIMITED_JSON\",\n  uris=[\"${prefix}/a.json\"]\n);"}]}]}, "query": {"rows": [{"f": [{"v": "{\"x\":[\"1\",\"a\",\"true\"]}"}, {"v": "${prefix}/a.json"}]}], "status": 200}}
  # An array with a null element.
