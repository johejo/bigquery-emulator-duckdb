version: 1
# Recorded on BigQuery in run erimz3irep4co5kquuo2otx5ok; see the adjacent answers file.
description: >-
  Verify how INTEGER, FLOAT and BOOLEAN Bigtable cells with TEXT encoding are parsed: signs,
  whitespace, leading zeros, range limits, exponents, special floating-point values, letter
  case, numeric booleans, empty cells and invalid text.
# Fixture: use the instance from the Bigtable metadata scenario, in the same project
# as the URI below. For example, in Bash:
#   table=bigtable-text-encoding-probe
#   cbt -project "$PROJECT" -instance bqanswers createtable "$table" families=family
#   mutations=
#   cell() { mutations+="${mutations:+,}{\"setCell\":{\"familyName\":\"family\",\"columnQualifier\":\"$(printf %s "$1" | base64 -w0)\",\"timestampMicros\":\"1000\",\"value\":\"$(printf %s "$2" | base64 -w0)\"}}"; }
#   cell int_plain 42; cell int_negative -42; cell int_plus +42; cell int_leading_zero 042;
#   cell int_leading_space ' 42'; cell int_trailing_space '42 ';
#   cell int_max 9223372036854775807; cell int_min -9223372036854775808;
#   cell int_overflow 9223372036854775808; cell int_decimal 42.0; cell int_exponent 4e1;
#   cell int_hex 0x2a; cell int_underscore 4_2; cell int_empty ''; cell int_alpha abc;
#   cell float_integer 2; cell float_negative -0.5; cell float_plus +1.5;
#   cell float_exponent 1e3; cell float_leading_dot .5; cell float_trailing_dot 1.;
#   cell float_leading_space ' 1.5'; cell float_trailing_space '1.5 '; cell float_nan NaN;
#   cell float_nan_lower nan; cell float_infinity Infinity;
#   cell float_negative_infinity -Infinity; cell float_inf inf; cell float_overflow 1e400;
#   cell float_java_suffix 1.5d; cell float_comma 1,5; cell float_hex 0x1p3;
#   cell float_empty ''; cell float_alpha abc; cell bool_false false; cell bool_upper TRUE;
#   cell bool_mixed True; cell bool_upper_false FALSE; cell bool_one 1; cell bool_zero 0;
#   cell bool_t t; cell bool_yes yes; cell bool_leading_space ' true'; cell bool_empty '';
#   cell bool_alpha abc;
#   curl --fail-with-body -sS -H "Authorization: Bearer $(gcloud auth print-access-token)" \
#     -H 'Content-Type: application/json' \
#     "https://bigtable.googleapis.com/v2/projects/$PROJECT/instances/bqanswers/tables/$table:mutateRow" \
#     -d "{\"rowKey\":\"Zml4dHVyZQ==\",\"mutations\":[$mutations]}"
# The request is idempotent, so it can be repeated after a transient failure.
# After collecting answers, delete the Bigtable table. The cases only clean up their BigQuery datasets.
vars:
  dataset: bqa_${run}_${case}
  uri: https://googleapis.com/bigtable/projects/${project}/instances/bqanswers/tables/bigtable-text-encoding-probe
  table_options:
    ignoreUnspecifiedColumnFamilies: true
    columnFamilies:
      - familyId: family
        columns: ['${column}']
  create_body:
    tableReference: {tableId: t}
    externalDataConfiguration:
      sourceFormat: BIGTABLE
      sourceUris: ['${uri}']
      bigtableOptions: '${table_options}'
  read_body:
    location: US
    useLegacySql: false
    timeoutMs: 100000
    query: SELECT family.probe_value.cell.value FROM `${project}.${dataset}.t`
  created: {status: 200}
  success:
    complete: true
    schema: [{name: value, mode: NULLABLE, type: '${value_type}'}]
    rows: [{f: [{v: '${value}'}]}]
  rejection: {status: 400, reason: invalid}
templates:
  read:
    steps:
      - name: dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body: {datasetReference: {datasetId: '${dataset}'}, location: US}
      - name: create
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets/${dataset}/tables
          body: '${create_body}'
        observe: {status: /status}
      - name: read
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body: '${read_body}'
        observe: {complete: /body/jobComplete, schema: /body/schema/fields, rows: /body/rows, errors: /body/errors}
    cleanup:
      - name: delete
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
  reject:
    steps:
      - name: dataset
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets
          body: {datasetReference: {datasetId: '${dataset}'}, location: US}
      - name: create
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/datasets/${dataset}/tables
          body: '${create_body}'
        observe: {status: /status}
      - name: read
        rest:
          method: POST
          path: /bigquery/v2/projects/${project}/queries
          body: '${read_body}'
        expectFailure: true
        # The full message contains deployment-specific source and destination paths.
        observe: {status: /status, reason: /body/error/errors/0/reason}
    cleanup:
      - name: delete
        rest:
          method: DELETE
          path: /bigquery/v2/projects/${project}/datasets/${dataset}?deleteContents=true
cases:
  - name: int_plain
    template: read
    vars:
      value_type: INTEGER
      value: '42'
      column: {qualifierString: int_plain, fieldName: probe_value, type: INTEGER, encoding: TEXT, onlyReadLatest: true}
    expect: {create: '${created}', read: '${success}'}
  - name: int_negative
    template: read
