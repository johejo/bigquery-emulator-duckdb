desc: bq query --format=json prints result cells as BigQuery's bq does
# Result values are checked in goclient/testdata/scalars; these cases check only how bq formats
# what the emulator returns, such as a TIMESTAMP, ARRAYs and STRUCTs.
steps:
  timestamp:
    exec:
      command: >-
        tests/e2e/bq.sh query --nouse_legacy_sql --format=json
        "SELECT TIMESTAMP '2024-01-02 03:04:05' AS ts"
    test: |
      current.exit_code == 0 && trim(current.stdout) == '[{"ts":"2024-01-02 03:04:05"}]'
  arrays_and_structs:
    exec:
      command: >-
        tests/e2e/bq.sh query --nouse_legacy_sql --format=json
        "SELECT [1, 2] AS arr, STRUCT(1 AS a, 'x' AS b) AS s"
    test: |
      current.exit_code == 0 &&
      trim(current.stdout) == '[{"arr":["1","2"],"s":{"a":"1","b":"x"}}]'
