desc: the shell subcommand runs queries from standard input or -e without listening
steps:
  # Input that is not a terminal runs as one script, whose result is its last statement's.
  stdin_runs_one_script:
    exec:
      command: >-
        "$BQ_EMULATOR_BINARY" shell --project='{"projectId":"test"}'
      stdin: |
        CREATE SCHEMA ds;
        CREATE TABLE ds.t (x INT64, s STRING);
        INSERT ds.t VALUES (2, NULL), (1, 'a');
        SELECT x, s FROM ds.t ORDER BY x;
    test: |
      current.exit_code == 0 && current.stderr == "" &&
      current.stdout == '{"x":"1","s":"a"}' + "\n" + '{"x":"2","s":null}' + "\n"
  stdin_keeps_script_variables:
    exec:
      command: >-
        "$BQ_EMULATOR_BINARY" shell --project='{"projectId":"test"}'
      stdin: |
        DECLARE x INT64 DEFAULT 1;
        SELECT x + 1 AS y;
    test: current.exit_code == 0 && current.stdout == '{"y":"2"}' + "\n"
  execute:
    exec:
      command: >-
        "$BQ_EMULATOR_BINARY" shell --project='{"projectId":"test"}' -e 'SELECT 1 AS x'
    test: current.exit_code == 0 && current.stderr == "" && current.stdout == '{"x":"1"}' + "\n"
  # Values keep the REST API's encoding, such as INT64 as a string, in every format; columns keep
  # the schema's order.
  format_jsonl:
    exec:
      command: >-
        "$BQ_EMULATOR_BINARY" shell --project='{"projectId":"test"}' --format jsonl
      stdin: &rows |
        SELECT x, s, a, r FROM UNNEST([
          STRUCT(1 AS x, 'a,"b"' AS s, [2, 3] AS a, STRUCT('é' AS f) AS r),
          (NULL, '', [], NULL)]) WITH OFFSET ORDER BY offset
    test: |
      current.exit_code == 0 &&
      current.stdout == '{"x":"1","s":"a,\\"b\\"","a":["2","3"],"r":{"f":"é"}}' + "\n" +
        '{"x":null,"s":"","a":[],"r":null}' + "\n"
  format_json:
    exec:
      command: >-
        "$BQ_EMULATOR_BINARY" shell --project='{"projectId":"test"}' --format json
      stdin: *rows
    test: |
      current.exit_code == 0 &&
      current.stdout == '[{"x":"1","s":"a,\\"b\\"","a":["2","3"],"r":{"f":"é"}},' +
        '{"x":null,"s":"","a":[],"r":null}]' + "\n"
  # RFC 4180 quoting with CRLF line ends; NULL is an empty field.
  format_csv:
    exec:
      command: >-
        "$BQ_EMULATOR_BINARY" shell --project='{"projectId":"test"}' --format csv
      stdin: *rows
    test: |
      current.exit_code == 0 &&
      current.stdout == "x,s,a,r\r\n" +
        '1,"a,""b""","[""2"",""3""]","{""f"":""é""}"' + "\r\n" +
        ",,[],\r\n"
  # Columns align by code point, and NULL differs from an empty string.
  format_pretty:
    exec:
      command: >-
        "$BQ_EMULATOR_BINARY" shell --project='{"projectId":"test"}' --format pretty
      stdin: *rows
    test: |
      current.exit_code == 0 &&
      current.stdout ==
        "+------+-------+-----------+-----------+\n" +
        "| x    | s     | a         | r         |\n" +
        "+------+-------+-----------+-----------+\n" +
        '| 1    | a,"b" | ["2","3"] | {"f":"é"} |' + "\n" +
        "| NULL |       | []        | NULL      |\n" +
        "+------+-------+-----------+-----------+\n"
  empty_result:
    exec:
      command: >-
        "$BQ_EMULATOR_BINARY" shell --project='{"projectId":"test"}' -e 'SELECT 1 AS n LIMIT 0'
    test: current.exit_code == 0 && current.stdout == ""
  empty_result_keeps_csv_header:
    exec:
      command: >-
        "$BQ_EMULATOR_BINARY" shell --project='{"projectId":"test"}' --format csv
        -e 'SELECT 1 AS n LIMIT 0'
    test: current.exit_code == 0 && current.stdout == "n\r\n"
  blank_input:
    exec:
      command: >-
        "$BQ_EMULATOR_BINARY" shell --project='{"projectId":"test"}'
      stdin: " \n"
    test: current.exit_code == 0 && current.stdout == "" && current.stderr == ""
  error_exits_with_failure:
    exec:
      command: >-
        "$BQ_EMULATOR_BINARY" shell --project='{"projectId":"test"}'
      stdin: |
        SELECT * FROM missing.t;
    test: |
      current.exit_code == 1 && current.stdout == "" && current.stderr startsWith "Error: "
  invalid_format:
    exec:
      command: >-
        "$BQ_EMULATOR_BINARY" shell --project='{"projectId":"test"}' --format yaml -e 'SELECT 1'
    test: current.exit_code == 2 && current.stdout == ""
  default_project_is_required_with_several_projects:
    exec:
      command: >-
        "$BQ_EMULATOR_BINARY" shell --project='{"projectId":"test"}'
        --project='{"projectId":"other"}' -e 'SELECT 1'
    test: current.exit_code == 2 && current.stdout == ""
  default_project_sets_the_default_project:
    exec:
      command: >-
        "$BQ_EMULATOR_BINARY" shell --project='{"projectId":"test"}'
        --project='{"projectId":"other"}' --default-project other
      stdin: &other_table |
        CREATE SCHEMA other.ds;
        CREATE TABLE other.ds.t AS SELECT 'other' AS p;
        SELECT p FROM ds.t;
    test: current.exit_code == 0 && current.stdout == '{"p":"other"}' + "\n"
  default_project_of_another_project:
    exec:
      command: >-
        "$BQ_EMULATOR_BINARY" shell --project='{"projectId":"test"}'
        --project='{"projectId":"other"}' --default-project test
      stdin: *other_table
    test: current.exit_code == 1 && current.stdout == ""
  unregistered_default_project:
    exec:
      command: >-
        "$BQ_EMULATOR_BINARY" shell --project='{"projectId":"test"}' --default-project missing
        -e 'SELECT 1'
    test: current.exit_code == 2 && current.stdout == ""
  # A DML statement's affected rows go to standard error, leaving standard output to results.
  dml_reports_affected_rows:
    exec:
      command: |
        dir=$(mktemp -d)
        trap 'rm -rf "$dir"' EXIT
        "$BQ_EMULATOR_BINARY" shell --project='{"projectId":"test"}' --data-dir "$dir" \
          -e 'CREATE SCHEMA ds; CREATE TABLE ds.t (x INT64)'
        "$BQ_EMULATOR_BINARY" shell --data-dir "$dir" -e 'INSERT ds.t VALUES (1), (2)'
    test: current.exit_code == 0 && current.stdout == "" && current.stderr == "2 rows affected\n"
  data_dir_persists:
    exec:
      command: |
        dir=$(mktemp -d)
        trap 'rm -rf "$dir"' EXIT
        "$BQ_EMULATOR_BINARY" shell --project='{"projectId":"test"}' --data-dir "$dir" \
          -e 'CREATE SCHEMA ds; CREATE TABLE ds.t AS SELECT 1 AS x'
        "$BQ_EMULATOR_BINARY" shell --data-dir "$dir" --default-dataset ds -e 'SELECT x FROM t'
    test: current.exit_code == 0 && current.stdout == '{"x":"1"}' + "\n"
  # --semantics=googlesql drops BigQuery's differences, such as an empty CHR(0) and outward
  # geography bounds; function results themselves are covered by scalars.
  semantics_default:
    exec:
      command: >-
        "$BQ_EMULATOR_BINARY" shell --project='{"projectId":"test"}'
      stdin: &semantics |
        SELECT LENGTH(CHR(0)) AS chr, IF(ST_BOUNDINGBOX(ST_GEOGPOINT(0, 0)).xmin < 0,
                                         'expanded', 'unexpanded') AS bounds;
    test: current.exit_code == 0 && current.stdout == '{"chr":"0","bounds":"expanded"}' + "\n"
  semantics_bigquery:
    exec:
      command: >-
        "$BQ_EMULATOR_BINARY" shell --project='{"projectId":"test"}' --semantics bigquery
      stdin: *semantics
    test: current.exit_code == 0 && current.stdout == '{"chr":"0","bounds":"expanded"}' + "\n"
  semantics_googlesql:
    exec:
      command: >-
        "$BQ_EMULATOR_BINARY" shell --project='{"projectId":"test"}' --semantics=googlesql
      stdin: *semantics
    test: current.exit_code == 0 && current.stdout == '{"chr":"1","bounds":"unexpanded"}' + "\n"
  # Mode selection keeps BigQuery's STRUCT set-operation restriction out of GoogleSQL.
  # INTERVAL equality follows the compliance cases cited in scalars/interval.txt; NULL STRUCTs
  # remain distinct from non-NULL STRUCTs whose fields are NULL.
  semantics_struct_sets_googlesql:
    exec:
      command: >-
        "$BQ_EMULATOR_BINARY" shell --project='{"projectId":"test"}' --semantics=googlesql
      stdin: &struct_sets |
        WITH a AS (
          SELECT s FROM UNNEST([CAST(NULL AS STRUCT<i INTERVAL>),
                                STRUCT<i INTERVAL>(NULL),
                                STRUCT(INTERVAL 1 MONTH AS i),
                                STRUCT(INTERVAL 30 DAY AS i)]) AS s),
        b AS (SELECT STRUCT(INTERVAL 30 DAY AS i) AS s)
        SELECT (SELECT COUNT(*) FROM (SELECT s FROM a UNION DISTINCT SELECT s FROM b)) AS u,
               (SELECT COUNT(*) FROM (SELECT s FROM a INTERSECT DISTINCT SELECT s FROM b)) AS i,
               (SELECT COUNT(*) FROM (SELECT s FROM a EXCEPT DISTINCT SELECT s FROM b)) AS e;
    test: current.exit_code == 0 && current.stdout == '{"u":"3","i":"1","e":"2"}' + "\n"
  semantics_struct_sets_bigquery:
    exec:
      command: >-
        "$BQ_EMULATOR_BINARY" shell --project='{"projectId":"test"}' --semantics=bigquery
      stdin: *struct_sets
    test: current.exit_code == 1 && current.stdout == "" && current.stderr contains "Type STRUCT is not supported"
  # ARRAY grouping follows data-types.md's "Grouping with arrays": NULL arrays, empty
  # arrays and NULL elements differ; element order, length and multiplicity matter.
  # BigQuery's DISTINCT set-operation rejection is also covered by scalars/interval_set_operations.txt.
  semantics_array_sets_googlesql:
    exec:
      command: >-
        "$BQ_EMULATOR_BINARY" shell --project='{"projectId":"test"}' --semantics=googlesql
      stdin: &array_sets |
        WITH a AS (
          SELECT CAST(NULL AS ARRAY<INT64>) AS v UNION ALL SELECT []
          UNION ALL SELECT [NULL] UNION ALL SELECT [1, 2] UNION ALL SELECT [2, 1]
          UNION ALL SELECT [1] UNION ALL SELECT [1, 1] UNION ALL SELECT [1, 2]),
        b AS (SELECT [1, 2] AS v UNION ALL SELECT [] UNION ALL SELECT [9])
        SELECT (SELECT COUNT(*) FROM (SELECT v FROM a UNION DISTINCT SELECT v FROM b)) AS u,
               (SELECT COUNT(*) FROM (SELECT v FROM a INTERSECT DISTINCT SELECT v FROM b)) AS i,
               (SELECT COUNT(*) FROM (SELECT v FROM a EXCEPT DISTINCT SELECT v FROM b)) AS e;
    test: current.exit_code == 0 && current.stdout == '{"u":"8","i":"2","e":"5"}' + "\n"
  semantics_array_sets_bigquery:
    exec:
      command: >-
        "$BQ_EMULATOR_BINARY" shell --project='{"projectId":"test"}' --semantics=bigquery
      stdin: *array_sets
    test: current.exit_code == 1 && current.stdout == "" && current.stderr contains "Type ARRAY is not supported"
  # Nested INTERVAL equality and und:ci equality use the same keys as the STRUCT set
  # cases above and scalars/collation_nested_observed.txt. Return a source value, not its key.
  semantics_array_sets_nested_keys:
    exec:
      command: >-
        "$BQ_EMULATOR_BINARY" shell --project='{"projectId":"test"}' --semantics=googlesql
      stdin: |
        WITH a AS (
          SELECT [STRUCT(INTERVAL 1 MONTH AS i, COLLATE('A', 'und:ci') AS s), NULL] AS v),
        b AS (
          SELECT [STRUCT(INTERVAL 30 DAY AS i, COLLATE('a', 'und:ci') AS s), NULL] AS v)
        SELECT (SELECT COUNT(*) FROM (SELECT v FROM a UNION DISTINCT SELECT v FROM b)) AS u,
               (SELECT COUNT(*) FROM (SELECT v FROM a INTERSECT DISTINCT SELECT v FROM b)) AS i,
               (SELECT COUNT(*) FROM (SELECT v FROM a EXCEPT DISTINCT SELECT v FROM b)) AS e,
               (SELECT LOWER(v[OFFSET(0)].s) FROM (SELECT v FROM a UNION DISTINCT SELECT v FROM b)) AS s;
    test: current.exit_code == 0 && current.stdout == '{"u":"1","i":"1","e":"0","s":"a"}' + "\n"
  # data-types.md's floating-point grouping puts all NaNs in one group and both zeros
  # in one group, but keeps NULL separate. These rules apply to ARRAY elements too.
  semantics_array_sets_float_keys:
    exec:
      command: >-
        "$BQ_EMULATOR_BINARY" shell --project='{"projectId":"test"}' --semantics=googlesql
      stdin: |
        WITH a AS (
          SELECT [CAST('NaN' AS FLOAT64), -0.0] AS v
          UNION ALL SELECT [CAST(NULL AS FLOAT64), 0.0]),
        b AS (SELECT [CAST('NaN' AS FLOAT64), 0.0] AS v)
        SELECT (SELECT COUNT(*) FROM (SELECT v FROM a UNION DISTINCT SELECT v FROM b)) AS u,
               (SELECT COUNT(*) FROM (SELECT v FROM a INTERSECT DISTINCT SELECT v FROM b)) AS i,
               (SELECT COUNT(*) FROM (SELECT v FROM a EXCEPT DISTINCT SELECT v FROM b)) AS e;
    test: current.exit_code == 0 && current.stdout == '{"u":"2","i":"1","e":"1"}' + "\n"
  # GoogleSQL's struct_queries.test represents STRUCT() as an empty STRUCT, not its
  # DuckDB placeholder. Exercise the shell's schema and JSON encoding, including nested NULLs.
  semantics_empty_struct_results_googlesql:
    exec:
      command: >-
        "$BQ_EMULATOR_BINARY" shell --project='{"projectId":"test"}' --semantics=googlesql
      stdin: &empty_struct_results |
        SELECT STRUCT() AS e, [STRUCT(), CAST(NULL AS STRUCT<>)] AS a;
    test: current.exit_code == 0 && current.stdout == '{"e":{},"a":[{},null]}' + "\n"
  semantics_empty_struct_results_bigquery:
    exec:
      command: >-
        "$BQ_EMULATOR_BINARY" shell --project='{"projectId":"test"}' --semantics=bigquery
      stdin: *empty_struct_results
    test: current.exit_code == 1 && current.stdout == "" && current.stderr contains "Unsupported empty struct type for field 'e'"
  # A script and its dynamic SQL use the selected result restrictions too. Anonymous value
  # table fields have empty names in GoogleSQL's union_distinct_queries.test.
  semantics_struct_result_script_googlesql:
    exec:
      command: >-
        "$BQ_EMULATOR_BINARY" shell --project='{"projectId":"test"}' --semantics=googlesql
      stdin: &struct_result_script |
        BEGIN
          SELECT AS STRUCT 7, STRUCT() AS e;
          EXECUTE IMMEDIATE 'SELECT AS STRUCT 8, STRUCT() AS e';
        END;
    test: current.exit_code == 0 && current.stdout == '{"":"8","e":{}}' + "\n"
  semantics_struct_result_script_bigquery:
    exec:
      command: >-
        "$BQ_EMULATOR_BINARY" shell --project='{"projectId":"test"}' --semantics=bigquery
      stdin: *struct_result_script
    test: current.exit_code == 1 && current.stdout == "" && current.stderr contains 'Invalid field name ""'
  # GoogleSQL's nanosecond precision spans the full TIMESTAMP range, not TIMESTAMP_NS's
  # 1677–2262 interval. These epoch values are -1ns and +1ns.
  semantics_nanosecond_values:
    exec:
      command: >-
        "$BQ_EMULATOR_BINARY" shell --project='{"projectId":"test"}' --semantics=googlesql
      stdin: |
        SELECT TIMESTAMP '1969-12-31 23:59:59.999999999+00' AS before_epoch,
               TIMESTAMP '1970-01-01 00:00:00.000000001+00' AS after_epoch,
               TIMESTAMP '0001-01-01 00:00:00+00' AS first,
               TIMESTAMP '9999-12-31 23:59:59.999999999+00' AS last;
    test: >-
      current.exit_code == 0 && current.stdout ==
      '{"before_epoch":"1969-12-31 23:59:59.999999999+00","after_epoch":"1970-01-01 00:00:00.000000001+00","first":"0001-01-01 00:00:00+00","last":"9999-12-31 23:59:59.999999999+00"}' + "\n"
  semantics_nanosecond_comparisons:
    exec:
      command: >-
        "$BQ_EMULATOR_BINARY" shell --project='{"projectId":"test"}' --semantics=googlesql
      stdin: |
        WITH timestamps AS (
          SELECT t FROM UNNEST([TIMESTAMP '1970-01-01 00:00:00.000000001+00',
                                TIMESTAMP '1970-01-01 00:00:00.000000002+00',
                                TIMESTAMP '1970-01-01 00:00:00.000000001+00']) AS t)
        SELECT COUNT(DISTINCT t) AS n,
               CAST(MIN(t) AS STRING) AS first, CAST(MAX(t) AS STRING) AS last
        FROM timestamps;
    test: >-
      current.exit_code == 0 && current.stdout ==
      '{"n":"2","first":"1970-01-01 00:00:00.000000001+00","last":"1970-01-01 00:00:00.000000002+00"}' + "\n"
  semantics_nanosecond_short_circuit:
    exec:
      command: >-
        "$BQ_EMULATOR_BINARY" shell --project='{"projectId":"test"}' --semantics=googlesql
      stdin: |
        SELECT IF(TRUE, TIMESTAMP '1970-01-01 00:00:00.000000001+00',
                       TIMESTAMP_ADD(TIMESTAMP '1970-01-01 00:00:00.000000001+00',
                                     INTERVAL 1 SECOND)) AS t;
    test: current.exit_code == 0 && current.stdout == '{"t":"1970-01-01 00:00:00.000000001+00"}' + "\n"
  # Until an operation has a nanosecond implementation, its adapter must not truncate.
  semantics_nanosecond_operation_rejects:
    exec:
      command: >-
        "$BQ_EMULATOR_BINARY" shell --project='{"projectId":"test"}' --semantics=googlesql
      stdin: |
        SELECT TIMESTAMP_ADD(TIMESTAMP '1970-01-01 00:00:00.000000001+00', INTERVAL 1 SECOND);
    test: current.exit_code == 1 && current.stdout == "" && current.stderr contains "nanosecond TIMESTAMP precision"
  duckdb_reads_stored_nanoseconds:
    exec:
      command: |
        dir=$(mktemp -d)
        trap 'rm -rf "$dir"' EXIT
        "$BQ_EMULATOR_BINARY" shell --project='{"projectId":"test"}' --data-dir "$dir" \
          --semantics=googlesql -e "CREATE SCHEMA ds; CREATE TABLE ds.t AS SELECT TIMESTAMP '1969-12-31 23:59:59.999999999+00' AS t"
        "$BQ_EMULATOR_BINARY" shell --data-dir "$dir" --duckdb \
          -e 'SELECT bq_timestamp_nanos_text(t) AS t FROM test.ds.t'
    test: current.exit_code == 0 && current.stdout == '{"t":"1969-12-31 23:59:59.999999999+00"}' + "\n"
  # A table keeps the TIMESTAMP precision of the semantics that created it.
  semantics_rejects_stored_nanoseconds:
    exec:
      command: |
        dir=$(mktemp -d)
        trap 'rm -rf "$dir"' EXIT
        "$BQ_EMULATOR_BINARY" shell --project='{"projectId":"test"}' --data-dir "$dir" \
          --semantics=googlesql -e "CREATE SCHEMA ds; CREATE TABLE ds.t AS SELECT [STRUCT(TIMESTAMP '2020-01-01 00:00:00+00' AS t)] AS a"
        "$BQ_EMULATOR_BINARY" shell --project='{"projectId":"test"}' --data-dir "$dir" \
          -e 'SELECT COUNT(*) AS n FROM ds.t'
    test: current.exit_code == 1 && current.stderr contains "Column a holds nanosecond TIMESTAMP values"
  semantics_rejects_stored_microseconds:
    exec:
      command: |
        dir=$(mktemp -d)
        trap 'rm -rf "$dir"' EXIT
        "$BQ_EMULATOR_BINARY" shell --project='{"projectId":"test"}' --data-dir "$dir" \
          -e "CREATE SCHEMA ds; CREATE TABLE ds.t AS SELECT TIMESTAMP '2020-01-01 00:00:00+00' AS t"
        "$BQ_EMULATOR_BINARY" shell --project='{"projectId":"test"}' --data-dir "$dir" \
          --semantics=googlesql -e 'SELECT COUNT(*) AS n FROM ds.t'
    test: current.exit_code == 1 && current.stderr contains "Column t holds microsecond TIMESTAMP values"
  # RANGE bounds keep microseconds under either semantics.
  semantics_reads_stored_timestamp_range:
    exec:
      command: |
        dir=$(mktemp -d)
        trap 'rm -rf "$dir"' EXIT
        "$BQ_EMULATOR_BINARY" shell --project='{"projectId":"test"}' --data-dir "$dir" \
          -e "CREATE SCHEMA ds; CREATE TABLE ds.t AS SELECT RANGE(TIMESTAMP '2020-01-01 00:00:00+00', NULL) AS r"
        "$BQ_EMULATOR_BINARY" shell --project='{"projectId":"test"}' --data-dir "$dir" \
          --semantics=googlesql -e 'SELECT CAST(x.r AS STRING) AS r FROM ds.t AS x'
    test: current.exit_code == 0 && current.stdout == '{"r":"[2020-01-01 00:00:00+00, UNBOUNDED)"}' + "\n"
  # Column defaults, routine bodies and views are analyzed with nanosecond precision too.
  semantics_nanosecond_definitions:
    exec:
      command: >-
        "$BQ_EMULATOR_BINARY" shell --project='{"projectId":"test"}' --semantics=googlesql
      stdin: |
        CREATE SCHEMA ds;
        CREATE TABLE ds.d (a INT64, t TIMESTAMP DEFAULT TIMESTAMP '1970-01-01 00:00:00.000000001+00');
        INSERT ds.d (a) VALUES (1);
        CREATE FUNCTION ds.f() AS (TIMESTAMP '1970-01-01 00:00:00.000000002+00');
        CREATE VIEW ds.v AS SELECT TIMESTAMP '1970-01-01 00:00:00.000000003+00' AS t;
        SELECT CAST(x.t AS STRING) AS d, CAST(ds.f() AS STRING) AS f,
               (SELECT CAST(v.t AS STRING) FROM ds.v AS v) AS v
        FROM ds.d AS x;
    test: >-
      current.exit_code == 0 && current.stdout ==
      '{"d":"1970-01-01 00:00:00.000000001+00","f":"1970-01-01 00:00:00.000000002+00","v":"1970-01-01 00:00:00.000000003+00"}' + "\n"
  semantics_nanosecond_procedure:
    exec:
      command: >-
        "$BQ_EMULATOR_BINARY" shell --project='{"projectId":"test"}' --semantics=googlesql
      stdin: |
        CREATE SCHEMA ds;
        CREATE PROCEDURE ds.p() BEGIN SELECT CAST(TIMESTAMP '1970-01-01 00:00:00.000000004+00' AS STRING) AS t; END;
        CALL ds.p();
    test: current.exit_code == 0 && current.stdout == '{"t":"1970-01-01 00:00:00.000000004+00"}' + "\n"
  semantics_nanosecond_information_schema:
    exec:
      command: >-
        "$BQ_EMULATOR_BINARY" shell --project='{"projectId":"test"}' --semantics=googlesql
      stdin: |
        CREATE SCHEMA ds;
        CREATE TABLE ds.t (a INT64);
        SELECT COUNT(*) AS n FROM ds.INFORMATION_SCHEMA.TABLES
        WHERE creation_time > TIMESTAMP '2000-01-01 00:00:00+00';
    test: current.exit_code == 0 && current.stdout == '{"n":"1"}' + "\n"
  semantics_invalid:
    exec:
      command: >-
        "$BQ_EMULATOR_BINARY" shell --semantics=reference
    test: current.exit_code == 2 && current.stdout == ""
  semantics_missing_value:
    exec:
      command: >-
        "$BQ_EMULATOR_BINARY" shell --semantics
    test: current.exit_code == 2 && current.stdout == ""
  semantics_shell_only:
    exec:
      command: >-
        "$BQ_EMULATOR_BINARY" serve --semantics=googlesql
    test: current.exit_code == 2 && current.stdout == ""
  # --duckdb runs DuckDB SQL on the emulator's database, where each project is a catalog and
  # bq_geography_text shows the S2 vertices of a stored GEOGRAPHY: POINT(0 0) is the x axis.
  duckdb_reads_stored_geography:
    exec:
      command: |
        dir=$(mktemp -d)
        trap 'rm -rf "$dir"' EXIT
        "$BQ_EMULATOR_BINARY" shell --project='{"projectId":"test"}' --data-dir "$dir" \
          -e 'CREATE SCHEMA ds; CREATE TABLE ds.t AS SELECT ST_GEOGPOINT(0, 0) AS g'
        "$BQ_EMULATOR_BINARY" shell --data-dir "$dir" --duckdb \
          -e 'SELECT bq_geography_text(g) AS g FROM test.ds.t'
    test: current.exit_code == 0 && current.stderr == "" && current.stdout == '{"g":"POINT(1 0 0)"}' + "\n"
  # Queries cannot call the debugging function, which BigQuery does not have.
  geography_text_is_duckdb_only:
    exec:
      command: >-
        "$BQ_EMULATOR_BINARY" shell --project='{"projectId":"test"}'
        -e 'SELECT bq_geography_text(ST_GEOGPOINT(0, 0))'
    test: current.exit_code == 1 && current.stdout == ""
  duckdb_shell_only:
    exec:
      command: >-
        "$BQ_EMULATOR_BINARY" serve --duckdb
    test: current.exit_code == 2 && current.stdout == ""
  # A command is required, since serving and the shell take different flags.
  no_subcommand:
    exec:
      command: >-
        "$BQ_EMULATOR_BINARY"
    test: current.exit_code == 2 && current.stdout == ""
  # The shell's help lists its own flags, not the server's.
  help:
    exec:
      command: >-
        "$BQ_EMULATOR_BINARY" shell --help
    test: |
      current.exit_code == 0 && current.stdout contains "--default-project" &&
      current.stdout contains "--data-dir" && !(current.stdout contains "--grpc-port")
  # Every flag that takes a value also takes it after '='.
  flag_values_after_equals:
    exec:
      command: >-
        "$BQ_EMULATOR_BINARY" shell --project='{"projectId":"test"}'
        --default-project=test --format=csv --execute='SELECT 1 AS x'
    test: current.exit_code == 0 && current.stdout == "x\r\n1\r\n"
  # SQL can start with a comment, which looks like a flag.
  execute_starting_with_comment:
    exec:
      command: |
        "$BQ_EMULATOR_BINARY" shell --project='{"projectId":"test"}' -e '-- comment
        SELECT 1 AS x'
    test: current.exit_code == 0 && current.stdout == '{"x":"1"}' + "\n"
  # Empty SQL is a mistake, such as an unset variable, rather than a request to read standard input.
  execute_empty:
    exec:
      command: >-
        "$BQ_EMULATOR_BINARY" shell --project='{"projectId":"test"}' -e ' '
      stdin: SELECT 1;
    test: current.exit_code == 2 && current.stdout == ""
  server_flag_in_shell:
    exec:
      command: >-
        "$BQ_EMULATOR_BINARY" shell --project='{"projectId":"test"}' --http-port 9050 -e 'SELECT 1'
    test: current.exit_code == 2 && current.stdout == ""
  # Shared flags follow the command, as its help lists them.
  flag_before_shell:
    exec:
      command: >-
        "$BQ_EMULATOR_BINARY" --project='{"projectId":"test"}' shell -e 'SELECT 1'
    test: current.exit_code == 2 && current.stdout == ""
  unknown_flag:
    exec:
      command: >-
        "$BQ_EMULATOR_BINARY" shell --project='{"projectId":"test"}' --unknown -e 'SELECT 1'
    test: current.exit_code == 2 && current.stdout == ""
  # The log file gets every message at the level, appended; the jobs, their query text and the
  # DuckDB SQL they run at debug, which standard error would only get from warnings up.
  log_file_appends_at_level:
    exec:
      command: |
        dir=$(mktemp -d)
        trap 'rm -rf "$dir"' EXIT
        "$BQ_EMULATOR_BINARY" shell --project='{"projectId":"test"}' --log-file "$dir/log" \
          --log-level debug -e 'SELECT 1 AS x'
        "$BQ_EMULATOR_BINARY" shell --project='{"projectId":"test"}' --log-file "$dir/log" \
          -e 'SELECT 2 AS y'
        cat "$dir/log"
    test: |
      current.exit_code == 0 && current.stderr == "" &&
      current.stdout startsWith '{"x":"1"}' + "\n" + '{"y":"2"}' + "\n" &&
      current.stdout matches '(?m)^\\d{4}-\\d\\d-\\d\\dT\\d\\d:\\d\\d:\\d\\d\\.\\d{6}Z DEBUG job=test:job_1 Query: SELECT 1 AS x$' &&
      current.stdout contains ' DEBUG job=test:job_1 DuckDB: ' &&
      current.stdout matches '(?ms)(^\\S+ INFO job=test:job_1 Job done in \\d+ ms$.*){2}' &&
      !(current.stdout contains 'Query: SELECT 2 AS y')
  log_level_invalid:
    exec:
      command: >-
        "$BQ_EMULATOR_BINARY" shell --project='{"projectId":"test"}' --log-level trace -e 'SELECT 1'
    test: current.exit_code == 2 && current.stdout == ""
  log_file_unwritable:
    exec:
      command: |
        dir=$(mktemp -d)
        trap 'rm -rf "$dir"' EXIT
        "$BQ_EMULATOR_BINARY" shell --project='{"projectId":"test"}' --log-file "$dir/missing/log" \
          -e 'SELECT 1'
    test: current.exit_code == 1 && current.stdout == ""
  # runn cannot give the shell a terminal, so a Go test drives it through a pty.
  terminal:
    exec:
      command: bash tests/e2e/go-test.sh shell -count=1 ./tests/e2e/shell
    dump:
      expr: current.stdout + current.stderr
    test: current.exit_code == 0
