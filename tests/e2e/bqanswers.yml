desc: BigQuery answer scenarios run locally without overwriting BigQuery observations
steps:
  scenarios:
    exec:
      command: bash tests/e2e/go-test.sh bqanswers -count=1 ./internal/bqscenario -run '^TestScenarioFixturesAgainstEmulator$'
    dump:
      expr: current.stdout + current.stderr
    test: current.exit_code == 0
