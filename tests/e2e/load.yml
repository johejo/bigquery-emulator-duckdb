# What a load does is left to tests/e2e/goclient/load_test.go; these steps cover the requests bq
# builds from its own flags: an inline schema, a schema file and Parquet list inference.
desc: bq load builds requests the emulator accepts from its schema and format flags
steps:
  mk_dataset:
    exec:
      command: tests/e2e/bq.sh mk --dataset e2e_load
    test: current.exit_code == 0
  load_inline_schema:
    exec:
      command: >-
        tests/e2e/bq.sh load --source_format=CSV --skip_leading_rows=1
        e2e_load.people tests/e2e/data/people.csv id:INTEGER,name:STRING
    test: current.exit_code == 0
  inline_schema_rows:
    exec:
      command: tests/e2e/bq.sh head --format=json e2e_load.people
    test: |
      current.exit_code == 0 &&
      trim(current.stdout) == '[{"id":"1","name":"alice"},{"id":"2","name":"bob"}]'
  load_schema_file:
    exec:
      command: >-
        tests/e2e/bq.sh load --source_format=NEWLINE_DELIMITED_JSON
        e2e_load.people_json gs://load-fixtures/nested/people.jsonl tests/e2e/data/people_schema.json
    test: current.exit_code == 0
  schema_file_rows:
    exec:
      command: tests/e2e/bq.sh head --format=json e2e_load.people_json
    test: |
      current.exit_code == 0 &&
      trim(current.stdout) == '[{"id":"3","name":"carol"},{"id":"4","name":"dave"}]'
  # three_level_list.parquet has a column a, a standard three-level LIST of INT64, of one row
  # [1, 2]. bq sends --parquet_enable_list_inference as parquetOptions.enable_list_inference.
  load_parquet_list_inference:
    exec:
      command: >-
        tests/e2e/bq.sh load --source_format=PARQUET --parquet_enable_list_inference
        e2e_load.parquet_list_inference tests/e2e/data/three_level_list.parquet
    test: current.exit_code == 0
  parquet_list_inference_rows:
    exec:
      command: tests/e2e/bq.sh head --format=json e2e_load.parquet_list_inference
    test: |
      current.exit_code == 0 &&
      trim(current.stdout) == '[{"a":["1","2"]}]'
  cleanup:
    exec:
      command: tests/e2e/bq.sh rm -r -f -d e2e_load
    test: current.exit_code == 0
