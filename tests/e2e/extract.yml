# What an extract writes is left to tests/e2e/goclient/extract_test.go; these steps cover the
# request bq builds from its format flags and how it shows the job.
desc: bq extract builds requests the emulator accepts from its format flags
runners:
  gcs: http://${STORAGE_EMULATOR_HOST}
steps:
  mk_bucket:
    gcs:
      /storage/v1/b?project=test:
        post:
          body:
            application/json: {name: extract-output}
    test: current.res.status == 200
  mk_dataset:
    exec:
      command: tests/e2e/bq.sh mk --dataset e2e_extract
    test: current.exit_code == 0
  table:
    exec:
      command: tests/e2e/bq.sh query --nouse_legacy_sql "CREATE TABLE e2e_extract.t AS SELECT 1 AS i"
    test: current.exit_code == 0
  extract:
    exec:
      command: >-
        tests/e2e/bq.sh --job_id=e2e_extract_csv extract --compression=GZIP --field_delimiter='|'
        --noprint_header e2e_extract.t 'gs://extract-output/part-*.csv.gz'
    test: current.exit_code == 0
  job:
    exec:
      command: tests/e2e/bq.sh show --format=json -j e2e_extract_csv
    test: |
      current.exit_code == 0 &&
      current.stdout contains '"jobType":"EXTRACT"' &&
      current.stdout contains '"destinationUriFileCounts":["1"]'
  rm_dataset:
    exec:
      command: tests/e2e/bq.sh rm -r -f -d e2e_extract
    test: current.exit_code == 0
