desc: edits the stopped emulator's database as another DuckDB client would
steps:
  edit:
    exec:
      command: duckdb -no-agent "$E2E_DATA_DIR/test.duckdb"
      stdin: |
        -- Comments the emulator did not write, or that describe another column.
        COMMENT ON COLUMN persist.column_comments.b IS 'written by someone else';
        COMMENT ON COLUMN persist.column_comments.c IS '{"name": "other", "type": "STRING"}';
        COMMENT ON COLUMN persist.column_comments.d IS '{"name": "d", "type": "NOPE"}';
        COMMENT ON COLUMN persist.column_comments.e IS NULL;
        ALTER TABLE persist.column_comments ADD COLUMN f DOUBLE;
        -- External edits can leave numeric metadata inconsistent with the actual type.
        ALTER TABLE persist.decimal_bignumeric ALTER n TYPE DECIMAL(18, 9);
        ALTER TABLE persist.nested_decimal_bignumeric ALTER s TYPE STRUCT(n DECIMAL(18, 9));
    test: current.exit_code == 0 && current.stderr == ""
  # A view written by another DuckDB client has no GoogleSQL definition or schema.
  unmanaged_view:
    exec:
      command: duckdb -no-agent "$E2E_DATA_DIR/test.duckdb"
      stdin: |
        CREATE SCHEMA unmanaged;
        CREATE VIEW unmanaged.v AS SELECT 1 AS x;
    test: current.exit_code == 0 && current.stderr == ""
  # A table written by another DuckDB client can hold types the emulator never writes.
  duckdb_types:
    exec:
      command: duckdb -no-agent "$E2E_DATA_DIR/test.duckdb"
      stdin: |
        CREATE SCHEMA duckdb_types;
        CREATE TABLE duckdb_types.t AS SELECT
          'happy'::ENUM('sad', 'happy') AS e, '101'::BIT AS b, MAP {'x': [1, NULL]} AS m,
          union_value(s := 'hello') AS u, '00112233-4455-6677-8899-aabbccddeeff'::UUID AS uuid,
          TIMESTAMP_NS '2020-01-02 03:04:05.123456789' AS ns, TIMESTAMP_NS 'infinity' AS inf,
          -1.23::DECIMAL(4, 2) AS d16, -12345.67::DECIMAL(9, 2) AS d32,
          -1234567890.123456::DECIMAL(18, 6) AS d64,
          [{'x': 1}, {'x': NULL}]::STRUCT(x INTEGER)[2] AS fixed, NULL::STRUCT(x INTEGER) AS s,
          NULL::INTEGER[2] AS n;
        CREATE TABLE duckdb_types.numeric AS SELECT
          '18446744073709551615'::UBIGINT AS u,
          '-170141183460469231731687303715884105728'::HUGEINT AS h,
          '340282366920938463463374607431768211455'::UHUGEINT AS uh,
          '-99999999999999999999999999999999999999'::DECIMAL(38, 0) AS w,
          '0.00000000000000000000000000000000000001'::DECIMAL(38, 38) AS f,
          [{'x': -1::HUGEINT}, {'x': NULL::HUGEINT}] AS a,
          NULL::STRUCT(x HUGEINT) AS s, NULL::DECIMAL(38, 0) AS n;
        CREATE TABLE duckdb_types.bignum AS SELECT 1::BIGNUM AS x;
        CREATE TABLE duckdb_types.nested_bignum AS SELECT [{'x': 1::BIGNUM}] AS a;
    test: current.exit_code == 0 && current.stderr == ""
  # Each project is stored in a file of its own, its id encoded into a single file name.
  project_files:
    exec:
      command: ls "$E2E_DATA_DIR"
    test: |
      current.exit_code == 0 && current.stdout contains 'test.duckdb' &&
      current.stdout contains 'example%2Ecom%3Aproj.duckdb'
  numeric_storage_type:
    exec:
      command: duckdb -no-agent -noheader -csv "$E2E_DATA_DIR/test.duckdb"
      stdin: SELECT typeof(n), typeof(p), typeof(s), typeof(a) FROM persist.numeric_storage;
    test: |
      current.exit_code == 0 && current.stderr == "" &&
      current.stdout contains 'bq_bignumeric_units' && current.stdout contains 'bq_bignumeric_5_2'
