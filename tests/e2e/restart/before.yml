desc: writes data that restart/after.yml expects to survive an emulator restart
runners:
  req: ${BQ_EMULATOR_API}
steps:
  mk_dataset:
    req:
      /projects/test/datasets:
        post:
          body:
            application/json:
              datasetReference: {datasetId: persist}
    test: current.res.status == 200
  table:
    req:
      /projects/test/queries:
        post:
          body:
            application/json:
              query: "CREATE TABLE persist.t AS SELECT 1 AS a, ['x', 'y'] AS b"
              useLegacySql: false
    test: current.res.status == 200
  view:
    req:
      /projects/test/queries:
        post:
          body:
            application/json:
              query: CREATE VIEW persist.v AS SELECT a, b FROM persist.t
              useLegacySql: false
    test: current.res.status == 200
  # A domain-scoped project id is escaped into the file name.
  materialized_view:
    req:
      /projects/test/queries:
        post:
          body:
            application/json:
              query: CREATE MATERIALIZED VIEW persist.mv AS SELECT COUNT(*) AS n FROM persist.t
              useLegacySql: false
    test: current.res.status == 200
  scoped_dataset:
    req:
      /projects/example.com:proj/datasets:
        post:
          body:
            application/json:
              datasetReference: {datasetId: scoped}
    test: current.res.status == 200
  session_user_view:
    req:
      /projects/test/queries:
        post:
          body:
            application/json:
              query: CREATE VIEW persist.identity AS SELECT SESSION_USER() AS identity
              useLegacySql: false
    test: current.res.status == 200
  function:
    req:
      /projects/test/queries:
        post:
          body:
            application/json:
              query: CREATE FUNCTION persist.add_one(x INT64) AS (x + 1)
              useLegacySql: false
    test: current.res.status == 200
  table_function_view:
    req:
      /projects/test/queries:
        post:
          body:
            application/json:
              query: >-
                CREATE TABLE FUNCTION persist.added(x INT64) AS (SELECT persist.add_one(x) AS y);
                CREATE VIEW persist.routine_view AS SELECT y FROM persist.added(1)
              useLegacySql: false
    test: current.res.status == 200
  # restart/stopped.yml rewrites these tables' column comments and types as another DuckDB client
  # would leave them.
  column_comments:
    req:
      /projects/test/queries:
        post:
          body:
            application/json:
              query: >-
                CREATE TABLE persist.column_comments (a JSON NOT NULL OPTIONS(description = 'a'),
                b STRING OPTIONS(description = 'b'), c INT64 OPTIONS(description = 'c'),
                d STRING OPTIONS(description = 'd'), e STRING OPTIONS(description = 'e'))
              useLegacySql: false
    test: current.res.status == 200
  decimal_bignumeric:
    req:
      /projects/test/queries:
        post:
          body:
            application/json:
              query: CREATE TABLE persist.decimal_bignumeric (n BIGNUMERIC)
              useLegacySql: false
    test: current.res.status == 200
  nested_decimal_bignumeric:
    req:
      /projects/test/queries:
        post:
          body:
            application/json:
              query: CREATE TABLE persist.nested_decimal_bignumeric (s STRUCT<n BIGNUMERIC>)
              useLegacySql: false
    test: current.res.status == 200
  numeric_storage:
    req:
      /projects/test/queries:
        post:
          body:
            application/json:
              query: >-
                CREATE TABLE persist.numeric_storage
                  (n BIGNUMERIC, p BIGNUMERIC(5, 2), s STRUCT<n BIGNUMERIC>, a ARRAY<BIGNUMERIC>);
                INSERT INTO persist.numeric_storage VALUES
                  (1.25, 2.25, STRUCT(BIGNUMERIC '-1.25'), [BIGNUMERIC '0.00000000000000000000000000000000000001', BIGNUMERIC '-1'])
              useLegacySql: false
    test: current.res.status == 200
  numeric_anonymous:
    req:
      /projects/test/queries:
        post:
          body:
            application/json:
              query: CREATE TABLE persist.numeric_anonymous AS SELECT STRUCT(BIGNUMERIC '1.25') AS s
              useLegacySql: false
    test: current.res.status == 200
  graph:
    req:
      /projects/test/queries:
        post:
          body:
            application/json:
              query: CREATE PROPERTY GRAPH persist.g NODE TABLES (persist.t KEY (a) LABEL Item PROPERTIES (a) LABEL Stored NO PROPERTIES)
              useLegacySql: false
    test: current.res.status == 200
  python_routine:
    req:
      /projects/test/queries:
        post:
          body:
            application/json:
              query: "CREATE FUNCTION persist.py(x STRING) RETURNS STRING LANGUAGE python OPTIONS(runtime_version='python-3.11', entry_point='f') AS 'def f(x): return x'"
              useLegacySql: false
    test: current.res.status == 200
  # Synthetic Cloud tag definitions use the documented IAM exception.
  resource_tags:
    req:
      /projects/test/queries:
        post:
          body:
            application/json:
              useLegacySql: false
              query: >-
                CREATE SCHEMA persist_tags OPTIONS (tags = [('123456789012/env', 'test')]);
                CREATE TABLE persist_tags.t (x INT64) OPTIONS (tags = [('123456789012/env', 'test')]);
                CREATE VIEW persist_tags.v OPTIONS (tags = [('123456789012/env', 'test')]) AS SELECT x FROM persist_tags.t
    test: current.res.status == 200 && !("errors" in current.res.body)
