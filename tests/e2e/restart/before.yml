desc: writes data that restart/after.yml expects to survive an emulator restart
steps:
  mk_dataset:
    exec:
      command: tests/e2e/bq.sh mk --dataset persist
    test: current.exit_code == 0
  table:
    exec:
      command: >-
        tests/e2e/bq.sh query --nouse_legacy_sql
        "CREATE TABLE persist.t AS SELECT 1 AS a, ['x', 'y'] AS b"
    test: current.exit_code == 0
  view:
    exec:
      command: >-
        tests/e2e/bq.sh query --nouse_legacy_sql
        "CREATE VIEW persist.v AS SELECT a, b FROM persist.t"
    test: current.exit_code == 0
  # A domain-scoped project id is escaped into the file name.
  scoped_dataset:
    exec:
      command: BQ_EMULATOR_PROJECT=example.com:proj tests/e2e/bq.sh mk --dataset scoped
    test: current.exit_code == 0
  session_user_view:
    exec:
      command: >-
        tests/e2e/bq.sh query --nouse_legacy_sql
        "CREATE VIEW persist.identity AS SELECT SESSION_USER() AS identity"
    test: current.exit_code == 0
  function:
    exec:
      command: >-
        tests/e2e/bq.sh query --nouse_legacy_sql
        "CREATE FUNCTION persist.add_one(x INT64) AS (x + 1)"
    test: current.exit_code == 0
  # restart/stopped.yml rewrites these tables' column comments and types as another DuckDB client
  # or an earlier emulator would leave them.
  column_comments:
    exec:
      command: >-
        tests/e2e/bq.sh query --nouse_legacy_sql
        "CREATE TABLE persist.column_comments (a JSON NOT NULL OPTIONS(description = 'a'),
        b STRING OPTIONS(description = 'b'), c INT64 OPTIONS(description = 'c'),
        d STRING OPTIONS(description = 'd'), e STRING OPTIONS(description = 'e'))"
    test: current.exit_code == 0
  decimal_bignumeric:
    exec:
      command: >-
        tests/e2e/bq.sh query --nouse_legacy_sql
        "CREATE TABLE persist.decimal_bignumeric (n BIGNUMERIC)"
    test: current.exit_code == 0
  nested_decimal_bignumeric:
    exec:
      command: >-
        tests/e2e/bq.sh query --nouse_legacy_sql
        "CREATE TABLE persist.nested_decimal_bignumeric (s STRUCT<n BIGNUMERIC>)"
    test: current.exit_code == 0
