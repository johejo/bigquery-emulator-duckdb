desc: writes data that restart/after.yml expects to survive an emulator restart
runners:
  req: ${BQ_EMULATOR_API}
steps:
  mk_dataset:
    req:
      /projects/test/datasets:
        post:
          body:
            application/json:
              datasetReference: {datasetId: persist}
    test: current.res.status == 200
  table:
    req:
      /projects/test/queries:
        post:
          body:
            application/json:
              query: "CREATE TABLE persist.t AS SELECT 1 AS a, ['x', 'y'] AS b"
              useLegacySql: false
    test: current.res.status == 200
  view:
    req:
      /projects/test/queries:
        post:
          body:
            application/json:
              query: CREATE VIEW persist.v AS SELECT a, b FROM persist.t
              useLegacySql: false
    test: current.res.status == 200
  # A domain-scoped project id is escaped into the file name.
  scoped_dataset:
    req:
      /projects/example.com:proj/datasets:
        post:
          body:
            application/json:
              datasetReference: {datasetId: scoped}
    test: current.res.status == 200
  session_user_view:
    req:
      /projects/test/queries:
        post:
          body:
            application/json:
              query: CREATE VIEW persist.identity AS SELECT SESSION_USER() AS identity
              useLegacySql: false
    test: current.res.status == 200
  function:
    req:
      /projects/test/queries:
        post:
          body:
            application/json:
              query: CREATE FUNCTION persist.add_one(x INT64) AS (x + 1)
              useLegacySql: false
    test: current.res.status == 200
  table_function_view:
    req:
      /projects/test/queries:
        post:
          body:
            application/json:
              query: >-
                CREATE TABLE FUNCTION persist.added(x INT64) AS (SELECT persist.add_one(x) AS y);
                CREATE VIEW persist.routine_view AS SELECT y FROM persist.added(1)
              useLegacySql: false
    test: current.res.status == 200
  # restart/stopped.yml rewrites these tables' column comments and types as another DuckDB client
  # or an earlier emulator would leave them.
  column_comments:
    req:
      /projects/test/queries:
        post:
          body:
            application/json:
              query: >-
                CREATE TABLE persist.column_comments (a JSON NOT NULL OPTIONS(description = 'a'),
                b STRING OPTIONS(description = 'b'), c INT64 OPTIONS(description = 'c'),
                d STRING OPTIONS(description = 'd'), e STRING OPTIONS(description = 'e'))
              useLegacySql: false
    test: current.res.status == 200
  decimal_bignumeric:
    req:
      /projects/test/queries:
        post:
          body:
            application/json:
              query: CREATE TABLE persist.decimal_bignumeric (n BIGNUMERIC)
              useLegacySql: false
    test: current.res.status == 200
  nested_decimal_bignumeric:
    req:
      /projects/test/queries:
        post:
          body:
            application/json:
              query: CREATE TABLE persist.nested_decimal_bignumeric (s STRUCT<n BIGNUMERIC>)
              useLegacySql: false
    test: current.res.status == 200
