desc: data written with --data-dir survives a restart
runners:
  req: ${BQ_EMULATOR_API}
steps:
  rows:
    req:
      /projects/test/queries:
        post:
          body:
            application/json: {query: 'SELECT a, b FROM persist.v', useLegacySql: false}
    test: |
      current.res.status == 200 &&
      current.res.body.rows == [{"f": [{"v": "1"}, {"v": [{"v": "x"}, {"v": "y"}]}]}]
  view:
    req:
      /projects/test/datasets/persist/tables/v:
        get:
          body: null
    test: |
      current.res.status == 200 &&
      current.res.body.view.query == 'SELECT a, b FROM persist.t'
  materialized_view:
    req:
      /projects/test/datasets/persist/tables/mv:
        get:
          body: null
    test: |
      current.res.status == 200 &&
      current.res.body.type == 'MATERIALIZED_VIEW' &&
      current.res.body.materializedView.query == 'SELECT COUNT(*) AS n FROM persist.t'
  materialized_view_rows:
    req:
      /projects/test/queries:
        post:
          body:
            application/json:
              query: SELECT n FROM persist.mv
              useLegacySql: false
    test: |
      current.res.status == 200 && current.res.body.rows == [{"f": [{"v": "1"}]}]
  scoped_dataset:
    req:
      /projects/example.com:proj/datasets:
        get:
          body: null
    test: |
      current.res.status == 200 &&
      current.res.body.datasets[0].datasetReference.datasetId == 'scoped'
  session_user_view:
    req:
      /projects/test/queries:
        post:
          body:
            application/json: {query: 'SELECT v.identity FROM persist.identity AS v', useLegacySql: false}
    test: |
      current.res.status == 200 &&
      current.res.body.rows == [{"f": [{"v": "principal://iam.googleapis.com/projects/123/locations/global/workloadIdentityPools/test/subject/alice"}]}]
  function:
    req:
      /projects/test/queries:
        post:
          body:
            application/json: {query: 'SELECT persist.add_one(a) AS b FROM persist.t', useLegacySql: false}
    test: |
      current.res.status == 200 && current.res.body.rows == [{"f": [{"v": "2"}]}]
  table_function_view:
    req:
      /projects/test/queries:
        post:
          body:
            application/json:
              query: >-
                CREATE OR REPLACE FUNCTION persist.add_one(x INT64) AS (x + 2);
                SELECT y FROM persist.routine_view
              useLegacySql: false
    test: |
      current.res.status == 200 && current.res.body.rows == [{"f": [{"v": "3"}]}]
  # A column keeps the field derived from its DuckDB type unless its comment is a field the
  # emulator wrote for it.
  column_comments:
    req:
      /projects/test/datasets/persist/tables/column_comments:
        get:
          body: null
    test: |
      current.res.status == 200 &&
      current.res.body.schema.fields == [
        {"name": "a", "type": "JSON", "mode": "REQUIRED", "description": "a"},
        {"name": "b", "type": "STRING"},
        {"name": "c", "type": "INTEGER"},
        {"name": "d", "type": "STRING"},
        {"name": "e", "type": "STRING"},
        {"name": "f", "type": "FLOAT"}]
  decimal_bignumeric:
    req:
      /projects/test/datasets/persist/tables/decimal_bignumeric:
        get:
          body: null
    test: |
      current.res.status == 400 &&
      current.res.body.error.message contains 'Column n metadata does not match its DuckDB numeric storage type'
  nested_decimal_bignumeric:
    req:
      /projects/test/datasets/persist/tables/nested_decimal_bignumeric:
        get:
          body: null
    test: |
      current.res.status == 400 &&
      current.res.body.error.message contains 'Column s metadata does not match its DuckDB numeric storage type'
  # restart/stopped.yml writes duckdb_types.t with types BigQuery does not have; queries and
  # tabledata.list read them alike, as docs/compatibility.md describes.
  duckdb_types_query:
    req:
      /projects/test/queries:
        post:
          body:
            application/json: {query: 'SELECT * FROM duckdb_types.t', useLegacySql: false}
    test: |
      current.res.status == 200 &&
      current.res.body.rows == [{"f": [
        {"v": "happy"}, {"v": "101"}, {"v": "{x=[1, NULL]}"}, {"v": "hello"},
        {"v": "00112233-4455-6677-8899-aabbccddeeff"}, {"v": "2020-01-02T03:04:05.123456"},
        {"v": "infinity"}, {"v": "-1.23"}, {"v": "-12345.67"}, {"v": "-1234567890.123456"},
        {"v": [{"v": {"f": [{"v": "1"}]}}, {"v": {"f": [{"v": null}]}}]}, {"v": null}, {"v": []}]}]
  duckdb_types_rows:
    req:
      /projects/test/datasets/duckdb_types/tables/t/data:
        get:
          body: null
    test: |
      current.res.status == 200 &&
      current.res.body.rows == steps.duckdb_types_query.res.body.rows
  # These explicit values originate in the DuckDB CLI setup, rather than an emulator answer.
  duckdb_numeric_query:
    req:
      /projects/test/queries:
        post:
          body:
            application/json: {query: 'SELECT * FROM duckdb_types.numeric', useLegacySql: false}
    test: |
      current.res.status == 200 &&
      current.res.body.schema.fields[0].type == 'BIGNUMERIC' &&
      current.res.body.schema.fields[4].type == 'BIGNUMERIC' &&
      current.res.body.rows == [{"f": [
        {"v": "18446744073709551615"}, {"v": "-170141183460469231731687303715884105728"},
        {"v": "340282366920938463463374607431768211455"},
        {"v": "-99999999999999999999999999999999999999"},
        {"v": "0.00000000000000000000000000000000000001"},
        {"v": [{"v": {"f": [{"v": "-1"}]}}, {"v": {"f": [{"v": null}]}}]},
        {"v": null}, {"v": null}]}]
  duckdb_numeric_rows:
    req:
      /projects/test/datasets/duckdb_types/tables/numeric/data:
        get:
          body: null
    test: |
      current.res.status == 200 && current.res.body.rows == steps.duckdb_numeric_query.res.body.rows
  duckdb_numeric_arithmetic:
    req:
      /projects/test/queries:
        post:
          body:
            application/json:
              query: SELECT h + 1 AS h, f * 2 AS f, a[OFFSET(0)].x AS x FROM duckdb_types.numeric
              useLegacySql: false
    test: |
      current.res.status == 200 && current.res.body.rows == [{"f": [
        {"v": "-170141183460469231731687303715884105727"},
        {"v": "0.00000000000000000000000000000000000002"}, {"v": "-1"}]}]
  duckdb_numeric_insert:
    req:
      /projects/test/queries:
        post:
          body:
            application/json:
              query: INSERT INTO duckdb_types.numeric (h) VALUES (BIGNUMERIC '0.00000000000000000000000000000000000001')
              useLegacySql: false
    test: |
      current.res.status == 400 && current.res.body.error.message contains 'DML on external numeric storage'
  duckdb_numeric_update:
    req:
      /projects/test/queries:
        post:
          body:
            application/json:
              query: UPDATE duckdb_types.numeric SET h = 1 WHERE TRUE
              useLegacySql: false
    test: |
      current.res.status == 400 && current.res.body.error.message contains 'DML on external numeric storage'
  duckdb_numeric_stream:
    req:
      /projects/test/datasets/duckdb_types/tables/numeric/insertAll:
        post:
          body:
            application/json: {rows: [{json: {h: '1'}}]}
    test: |
      current.res.status == 400 && current.res.body.error.message contains 'writing to external numeric storage'
  duckdb_numeric_copy:
    req:
      /projects/test/queries:
        post:
          body:
            application/json:
              query: CREATE TABLE duckdb_types.copied COPY duckdb_types.numeric
              useLegacySql: false
    test: current.res.status == 200
  duckdb_numeric_copied_rows:
    req:
      /projects/test/datasets/duckdb_types/tables/copied/data:
        get:
          body: null
    test: |
      current.res.status == 200 && current.res.body.rows == steps.duckdb_numeric_query.res.body.rows
  duckdb_numeric_copied_update:
    req:
      /projects/test/queries:
        post:
          body:
            application/json:
              query: UPDATE duckdb_types.copied SET h = 1 WHERE TRUE; SELECT h FROM duckdb_types.copied
              useLegacySql: false
    test: |
      current.res.status == 200 && current.res.body.rows == [{"f": [{"v": "1"}]}]
  duckdb_bignum:
    req:
      /projects/test/datasets/duckdb_types/tables/bignum/data:
        get:
          body: null
    test: |
      current.res.status == 400 && current.res.body.error.message contains 'Column x has the DuckDB type BIGNUM'
  duckdb_nested_bignum:
    req:
      /projects/test/queries:
        post:
          body:
            application/json: {query: 'SELECT * FROM duckdb_types.nested_bignum', useLegacySql: false}
    test: |
      current.res.status == 400 && current.res.body.error.message contains 'Column a has the DuckDB type BIGNUM'
  numeric_storage:
    req:
      /projects/test/datasets/persist/tables/numeric_storage/data:
        get:
          body: null
    test: |
      current.res.status == 200 && current.res.body.rows == [{"f": [
        {"v": "1.25"}, {"v": "2.25"}, {"v": {"f": [{"v": "-1.25"}]}},
        {"v": [{"v": "0.00000000000000000000000000000000000001"}, {"v": "-1"}]}]}]
  numeric_storage_update:
    req:
      /projects/test/queries:
        post:
          body:
            application/json:
              query: UPDATE persist.numeric_storage SET n = n + 1 WHERE TRUE; SELECT n FROM persist.numeric_storage
              useLegacySql: false
    test: |
      current.res.status == 200 && current.res.body.rows == [{"f": [{"v": "2.25"}]}]
  # restart/stopped.yml creates unmanaged.v without the emulator; it is listed, queried in
  # INFORMATION_SCHEMA and deleted, but has no metadata to show.
  unmanaged_view_list:
    req:
      /projects/test/datasets/unmanaged/tables:
        get:
          body: null
    test: |
      current.res.status == 200 &&
      current.res.body.tables[0].tableReference.tableId == 'v' &&
      current.res.body.tables[0].type == 'VIEW'
  unmanaged_view_show:
    req:
      /projects/test/datasets/unmanaged/tables/v:
        get:
          body: null
    test: current.res.status == 400 && current.res.body.error.message contains 'was not created by the'
  unmanaged_view_information_schema:
    req:
      /projects/test/queries:
        post:
          body:
            application/json:
              query: >-
                SELECT table_type, ddl IS NULL AS no_ddl FROM unmanaged.INFORMATION_SCHEMA.TABLES
                WHERE table_name = 'v'
              useLegacySql: false
    test: |
      current.res.status == 200 && current.res.body.rows == [{"f": [{"v": "VIEW"}, {"v": "true"}]}]
  unmanaged_view_delete:
    req:
      /projects/test/datasets/unmanaged/tables/v:
        delete:
          body: null
    test: current.res.status == 204
  # BigQuery omits the tables of a dataset that has none.
  unmanaged_view_deleted:
    req:
      /projects/test/datasets/unmanaged/tables:
        get:
          body: null
    test: |
      current.res.status == 200 && current.res.body.totalItems == 0 && !("tables" in current.res.body)
  numeric_anonymous_rows:
    req:
      /projects/test/datasets/persist/tables/numeric_anonymous/data:
        get:
          body: null
    test: |
      current.res.status == 200 && current.res.body.rows == [{"f": [{"v": {"f": [{"v": "1.25"}]}}]}]
  numeric_anonymous_query:
    req:
      /projects/test/queries:
        post:
          body:
            application/json: {query: 'SELECT s FROM persist.numeric_anonymous', useLegacySql: false}
    test: |
      current.res.status == 200 && current.res.body.rows == steps.numeric_anonymous_rows.res.body.rows
  graph:
    req:
      /projects/test/queries:
        post:
          body:
            application/json:
              query: SELECT item.a, t.b FROM GRAPH_TABLE(persist.g MATCH (n:Item) RETURN n.a AS a) AS item JOIN persist.t AS t ON item.a = t.a
              useLegacySql: false
    test: |
      current.res.status == 200 &&
      current.res.body.rows == [{"f": [{"v": "1"}, {"v": [{"v": "x"}, {"v": "y"}]}]}]
  python_routine:
    req:
      /projects/test/queries:
        post:
          body:
            application/json:
              query: "SELECT persist.py('restored') AS value"
              useLegacySql: false
    test: |
      current.res.status == 200 && current.res.body.rows == [{"f": [{"v": "restored"}]}]
