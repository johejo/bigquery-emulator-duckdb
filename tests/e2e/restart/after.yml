desc: data written with --data-dir survives a restart
steps:
  rows:
    exec:
      command: tests/e2e/bq.sh query --nouse_legacy_sql --format=json 'SELECT a, b FROM persist.v'
    test: |
      current.exit_code == 0 &&
      trim(current.stdout) == '[{"a":"1","b":["x","y"]}]'
  view:
    exec:
      command: tests/e2e/bq.sh show --format=json persist.v
    test: |
      current.exit_code == 0 &&
      current.stdout contains '"query":"SELECT a, b FROM persist.t"'
  scoped_dataset:
    exec:
      command: BQ_EMULATOR_PROJECT=example.com:proj tests/e2e/bq.sh ls --format=json
    test: |
      current.exit_code == 0 &&
      current.stdout contains '"datasetId":"scoped"'
  session_user_view:
    exec:
      command: tests/e2e/bq.sh query --nouse_legacy_sql --format=json 'SELECT v.identity FROM persist.identity AS v'
    test: |
      current.exit_code == 0 &&
      trim(current.stdout) == '[{"identity":"principal://iam.googleapis.com/projects/123/locations/global/workloadIdentityPools/test/subject/alice"}]'
  function:
    exec:
      command: tests/e2e/bq.sh query --nouse_legacy_sql --format=json 'SELECT persist.add_one(a) AS b FROM persist.t'
    test: |
      current.exit_code == 0 &&
      trim(current.stdout) == '[{"b":"2"}]'
  # A column keeps the field derived from its DuckDB type unless its comment is a field the
  # emulator wrote for it.
  column_comments:
    exec:
      command: tests/e2e/bq.sh show --schema --format=json persist.column_comments
    test: |
      current.exit_code == 0 &&
      trim(current.stdout) == '[{"description":"a","mode":"REQUIRED","name":"a","type":"JSON"},' +
        '{"mode":"NULLABLE","name":"b","type":"STRING"},{"mode":"NULLABLE","name":"c","type":"INTEGER"},' +
        '{"mode":"NULLABLE","name":"d","type":"STRING"},{"mode":"NULLABLE","name":"e","type":"STRING"},' +
        '{"mode":"NULLABLE","name":"f","type":"FLOAT"}]'
  decimal_bignumeric:
    exec:
      command: tests/e2e/bq.sh show --schema --format=json persist.decimal_bignumeric
    test: |
      current.exit_code != 0 && current.stdout contains 'Column n was created by an earlier' &&
      current.stdout contains 'recreate the table'
  nested_decimal_bignumeric:
    exec:
      command: tests/e2e/bq.sh show --schema --format=json persist.nested_decimal_bignumeric
    test: |
      current.exit_code != 0 && current.stdout contains 'Column s was created by an earlier' &&
      current.stdout contains 'recreate the table'
  # restart/stopped.yml writes duckdb_types.t with types BigQuery does not have; queries and
  # tabledata.list read them alike, as docs/compatibility.md describes.
  duckdb_types_query:
    exec:
      command: tests/e2e/bq.sh query --nouse_legacy_sql --format=json 'SELECT * FROM duckdb_types.t'
    test: |
      current.exit_code == 0 &&
      trim(current.stdout) == '[{"b":"101","d16":"-1.23","d32":"-12345.67","d64":"-1234567890.123456",' +
        '"e":"happy","fixed":[{"x":"1"},{"x":null}],"inf":"infinity","m":"{x=[1, NULL]}","n":[],' +
        '"ns":"2020-01-02T03:04:05.123456","s":null,"u":"hello","uuid":"00112233-4455-6677-8899-aabbccddeeff"}]'
  duckdb_types_head:
    exec:
      command: tests/e2e/bq.sh head --format=json duckdb_types.t
    test: |
      current.exit_code == 0 &&
      trim(current.stdout) == '[{"b":"101","d16":"-1.23","d32":"-12345.67","d64":"-1234567890.123456",' +
        '"e":"happy","fixed":[{"x":"1"},{"x":null}],"inf":"infinity","m":"{x=[1, NULL]}","n":[],' +
        '"ns":"2020-01-02T03:04:05.123456","s":null,"u":"hello","uuid":"00112233-4455-6677-8899-aabbccddeeff"}]'
  # restart/stopped.yml creates unmanaged.v without the emulator; it is listed, queried in
  # INFORMATION_SCHEMA and deleted, but has no metadata to show.
  unmanaged_view_list:
    exec:
      command: tests/e2e/bq.sh ls --format=json unmanaged
    test: |
      current.exit_code == 0 &&
      current.stdout contains '"tableId":"v"' && current.stdout contains '"type":"VIEW"'
  unmanaged_view_show:
    exec:
      command: tests/e2e/bq.sh show --format=json unmanaged.v
    test: current.exit_code != 0 && current.stdout contains 'was not created by the'
  unmanaged_view_information_schema:
    exec:
      command: >-
        tests/e2e/bq.sh query --nouse_legacy_sql --format=json
        "SELECT table_type, ddl IS NULL AS no_ddl FROM unmanaged.INFORMATION_SCHEMA.TABLES
        WHERE table_name = 'v'"
    test: |
      current.exit_code == 0 &&
      trim(current.stdout) == '[{"no_ddl":"true","table_type":"VIEW"}]'
  unmanaged_view_delete:
    exec:
      command: tests/e2e/bq.sh rm -f -t unmanaged.v && tests/e2e/bq.sh ls --format=json unmanaged
    test: current.exit_code == 0 && trim(current.stdout) == ''
