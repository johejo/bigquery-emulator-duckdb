desc: data written with --data-dir survives a restart
steps:
  rows:
    exec:
      command: tests/e2e/bq.sh query --nouse_legacy_sql --format=json 'SELECT a, b FROM persist.v'
    test: |
      current.exit_code == 0 &&
      trim(current.stdout) == '[{"a":"1","b":["x","y"]}]'
  view:
    exec:
      command: tests/e2e/bq.sh show --format=json persist.v
    test: |
      current.exit_code == 0 &&
      current.stdout contains '"query":"SELECT a, b FROM persist.t"'
  scoped_dataset:
    exec:
      command: BQ_EMULATOR_PROJECT=example.com:proj tests/e2e/bq.sh ls --format=json
    test: |
      current.exit_code == 0 &&
      current.stdout contains '"datasetId":"scoped"'
  session_user_view:
    exec:
      command: tests/e2e/bq.sh query --nouse_legacy_sql --format=json 'SELECT v.identity FROM persist.identity AS v'
    test: |
      current.exit_code == 0 &&
      trim(current.stdout) == '[{"identity":"principal://iam.googleapis.com/projects/123/locations/global/workloadIdentityPools/test/subject/alice"}]'
  function:
    exec:
      command: tests/e2e/bq.sh query --nouse_legacy_sql --format=json 'SELECT persist.add_one(a) AS b FROM persist.t'
    test: |
      current.exit_code == 0 &&
      trim(current.stdout) == '[{"b":"2"}]'
  # A column keeps the field derived from its DuckDB type unless its comment is a field the
  # emulator wrote for it.
  column_comments:
    exec:
      command: tests/e2e/bq.sh show --schema --format=json persist.column_comments
    test: |
      current.exit_code == 0 &&
      trim(current.stdout) == '[{"description":"a","mode":"REQUIRED","name":"a","type":"JSON"},' +
        '{"mode":"NULLABLE","name":"b","type":"STRING"},{"mode":"NULLABLE","name":"c","type":"INTEGER"},' +
        '{"mode":"NULLABLE","name":"d","type":"STRING"},{"mode":"NULLABLE","name":"e","type":"STRING"},' +
        '{"mode":"NULLABLE","name":"f","type":"FLOAT"}]'
  decimal_bignumeric:
    exec:
      command: tests/e2e/bq.sh show --schema --format=json persist.decimal_bignumeric
    test: |
      current.exit_code != 0 && current.stdout contains 'Column n was created by an earlier' &&
      current.stdout contains 'recreate the table'
  nested_decimal_bignumeric:
    exec:
      command: tests/e2e/bq.sh show --schema --format=json persist.nested_decimal_bignumeric
    test: |
      current.exit_code != 0 && current.stdout contains 'Column s was created by an earlier' &&
      current.stdout contains 'recreate the table'
