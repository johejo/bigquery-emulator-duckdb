desc: routines.list filters routine types and projects fields with readMask
# Expected fields follow the routines.list discovery definition and protobuf FieldMask rules.
runners:
  req: ${BQ_EMULATOR_API}
steps:
  dataset:
    req:
      /projects/rest-routines/datasets:
        post:
          body:
            application/json:
              datasetReference: {datasetId: ds}
    test: current.res.status == 200
  insert_javascript:
    req:
      /projects/rest-routines/datasets/ds/routines:
        post:
          body:
            application/json: {"routineReference": {"projectId": "rest-routines", "datasetId": "ds", "routineId": "bad"}, "routineType": "SCALAR_FUNCTION", "definitionBody": "1", "language": "JAVASCRIPT"}
    test: current.res.status == 400 && current.res.body.error.errors[0].reason == "invalid"
  insert_procedure:
    req:
      /projects/rest-routines/datasets/ds/routines:
        post:
          body:
            application/json: {"routineReference": {"projectId": "rest-routines", "datasetId": "ds", "routineId": "bad"}, "routineType": "PROCEDURE", "definitionBody": "1"}
    test: current.res.status == 400 && current.res.body.error.errors[0].reason == "invalid"
  insert_remote:
    req:
      /projects/rest-routines/datasets/ds/routines:
        post:
          body:
            application/json: {"routineReference": {"projectId": "rest-routines", "datasetId": "ds", "routineId": "bad"}, "routineType": "SCALAR_FUNCTION", "definitionBody": "1", "remoteFunctionOptions": {"connection": "projects/p/locations/us/connections/c", "endpoint": "https://example.com"}}
    test: current.res.status == 400 && current.res.body.error.errors[0].reason == "invalid"
  insert_security:
    req:
      /projects/rest-routines/datasets/ds/routines:
        post:
          body:
            application/json: {"routineReference": {"projectId": "rest-routines", "datasetId": "ds", "routineId": "bad"}, "routineType": "SCALAR_FUNCTION", "definitionBody": "1", "securityMode": "DEFINER"}
    test: current.res.status == 400 && current.res.body.error.errors[0].reason == "invalid"
  insert_determinism:
    req:
      /projects/rest-routines/datasets/ds/routines:
        post:
          body:
            application/json: {"routineReference": {"projectId": "rest-routines", "datasetId": "ds", "routineId": "bad"}, "routineType": "SCALAR_FUNCTION", "definitionBody": "1", "determinismLevel": "DETERMINISTIC"}
    test: current.res.status == 400 && current.res.body.error.errors[0].reason == "invalid"
  insert_argument_mode:
    req:
      /projects/rest-routines/datasets/ds/routines:
        post:
          body:
            application/json: {"routineReference": {"projectId": "rest-routines", "datasetId": "ds", "routineId": "bad"}, "routineType": "SCALAR_FUNCTION", "definitionBody": "1", "arguments": [{"name": "x", "mode": "OUT", "dataType": {"typeKind": "INT64"}}]}
    test: current.res.status == 400 && current.res.body.error.errors[0].reason == "invalid"
  insert_argument_kind:
    req:
      /projects/rest-routines/datasets/ds/routines:
        post:
          body:
            application/json: {"routineReference": {"projectId": "rest-routines", "datasetId": "ds", "routineId": "bad"}, "routineType": "SCALAR_FUNCTION", "definitionBody": "1", "arguments": [{"name": "x", "argumentKind": "ANY_TABLE"}]}
    test: current.res.status == 400 && current.res.body.error.errors[0].reason == "invalid"
  insert_malformed_arguments:
    req:
      /projects/rest-routines/datasets/ds/routines:
        post:
          body:
            application/json: {"routineReference": {"projectId": "rest-routines", "datasetId": "ds", "routineId": "bad"}, "routineType": "SCALAR_FUNCTION", "definitionBody": "1", "arguments": {}}
    test: current.res.status == 400 && current.res.body.error.errors[0].reason == "invalid"
  insert_malformed_type:
    req:
      /projects/rest-routines/datasets/ds/routines:
        post:
          body:
            application/json: {"routineReference": {"projectId": "rest-routines", "datasetId": "ds", "routineId": "bad"}, "routineType": "SCALAR_FUNCTION", "definitionBody": "1", "returnType": {"typeKind": "ARRAY"}}
    test: current.res.status == 400 && current.res.body.error.errors[0].reason == "invalid"
  insert_extra_type_field:
    req:
      /projects/rest-routines/datasets/ds/routines:
        post:
          body:
            application/json: {"routineReference": {"projectId": "rest-routines", "datasetId": "ds", "routineId": "bad"}, "routineType": "SCALAR_FUNCTION", "definitionBody": "1", "returnType": {"typeKind": "INT64", "arrayElementType": {"typeKind": "STRING"}}}
    test: current.res.status == 400 && current.res.body.error.errors[0].reason == "invalid"
  insert_missing_body:
    req:
      /projects/rest-routines/datasets/ds/routines:
        post:
          body:
            application/json: {"routineReference": {"projectId": "rest-routines", "datasetId": "ds", "routineId": "bad"}, "routineType": "SCALAR_FUNCTION", "definitionBody": null}
    test: current.res.status == 400 && current.res.body.error.errors[0].reason == "invalid"
  insert_mismatched_reference:
    req:
      /projects/rest-routines/datasets/ds/routines:
        post:
          body:
            application/json: {"routineReference": {"projectId": "rest-routines", "datasetId": "other", "routineId": "bad"}, "routineType": "SCALAR_FUNCTION", "definitionBody": "1"}
    test: current.res.status == 400 && current.res.body.error.errors[0].reason == "invalid"
  invalid_mask_on_empty_dataset:
    req:
      /projects/rest-routines/datasets/ds/routines?readMask=unknown:
        get:
          body: null
    test: current.res.status == 400 && current.res.body.error.errors[0].reason == "invalid"
  invalid_filter_on_empty_dataset:
    req:
      /projects/rest-routines/datasets/ds/routines?filter=routineType:INVALID:
        get:
          body: null
    test: current.res.status == 400 && current.res.body.error.errors[0].reason == "invalid"
  functions:
    req:
      /projects/rest-routines/queries:
        post:
          body:
            application/json:
              useLegacySql: false
              query: >-
                CREATE FUNCTION ds.a(x INT64) RETURNS INT64 AS (x + 1)
                OPTIONS (description = 'adds one');
                CREATE FUNCTION ds.b() RETURNS INT64 AS (2)
    test: current.res.status == 200
  conditional_update:
    req:
      /projects/rest-routines/datasets/ds/routines/a:
        put:
          headers:
            If-Match: stale
          body:
            application/json:
              routineReference: {projectId: rest-routines, datasetId: ds, routineId: a}
              routineType: SCALAR_FUNCTION
              definitionBody: "99"
    test: current.res.status == 400 && current.res.body.error.errors[0].reason == "invalid"
  mismatched_update:
    req:
      /projects/rest-routines/datasets/ds/routines/a:
        put:
          body:
            application/json:
              routineReference: {projectId: rest-routines, datasetId: ds, routineId: b}
              routineType: SCALAR_FUNCTION
              definitionBody: "99"
    test: current.res.status == 400 && current.res.body.error.errors[0].reason == "invalid"
  default:
    req:
      /projects/rest-routines/datasets/ds/routines:
        get:
          body: null
    test: |
      current.res.status == 200 &&
      len(current.res.body.routines) == 2 &&
      len(current.res.body.routines[0]) == 6 &&
      current.res.body.routines[0].routineReference == {"projectId": "rest-routines", "datasetId": "ds", "routineId": "a"} &&
      current.res.body.routines[0].routineType == "SCALAR_FUNCTION" &&
      current.res.body.routines[0].language == "SQL" &&
      "etag" in current.res.body.routines[0] &&
      "creationTime" in current.res.body.routines[0] && "lastModifiedTime" in current.res.body.routines[0]
  selected:
    req:
      /projects/rest-routines/datasets/ds/routines?readMask=definitionBody,description,arguments,returnType:
        get:
          body: null
    test: |
      current.res.status == 200 &&
      len(current.res.body.routines[0]) == 5 &&
      current.res.body.routines[0].definitionBody == "x + 1" &&
      current.res.body.routines[0].description == "adds one" &&
      current.res.body.routines[0].arguments[0].name == "x" &&
      current.res.body.routines[0].returnType == {"typeKind": "INT64"} &&
      current.res.body.routines[0].routineReference.routineId == "a"
  nested:
    req:
      /projects/rest-routines/datasets/ds/routines?readMask=returnType.typeKind,routineReference.routineId,returnType.typeKind:
        get:
          body: null
    test: |
      current.res.status == 200 &&
      current.res.body.routines[0] == {
        "routineReference": {"projectId": "rest-routines", "datasetId": "ds", "routineId": "a"},
        "returnType": {"typeKind": "INT64"}
      }
  parent:
    req:
      /projects/rest-routines/datasets/ds/routines?readMask=returnType.typeKind,returnType:
        get:
          body: null
    test: |
      current.res.status == 200 &&
      len(current.res.body.routines[0]) == 2 && current.res.body.routines[0].returnType == {"typeKind": "INT64"}
  all:
    req:
      /projects/rest-routines/datasets/ds/routines?readMask=*:
        get:
          body: null
    test: |
      current.res.status == 200 &&
      current.res.body.routines[0].routineType == "SCALAR_FUNCTION" &&
      current.res.body.routines[0].definitionBody == "x + 1" &&
      current.res.body.routines[0].description == "adds one" && "etag" in current.res.body.routines[0]
  first_page:
    req:
      /projects/rest-routines/datasets/ds/routines?filter=routineType:SCALAR_FUNCTION&readMask=description&maxResults=1:
        get:
          body: null
    test: |
      current.res.status == 200 &&
      len(current.res.body.routines) == 1 && "nextPageToken" in current.res.body &&
      current.res.body.routines[0].routineReference.routineId == "a" &&
      current.res.body.routines[0].description == "adds one" && len(current.res.body.routines[0]) == 2
  second_page:
    req:
      /projects/rest-routines/datasets/ds/routines?filter=routineType:SCALAR_FUNCTION&readMask=description&maxResults=1&pageToken={{ steps.first_page.res.body.nextPageToken }}:
        get:
          body: null
    test: |
      current.res.status == 200 &&
      len(current.res.body.routines) == 1 && !("nextPageToken" in current.res.body) &&
      current.res.body.routines[0].routineReference.routineId == "b" &&
      !("description" in current.res.body.routines[0])
  procedures:
    req:
      /projects/rest-routines/datasets/ds/routines?filter=routineType:PROCEDURE&maxResults=1:
        get:
          body: null
    test: |
      current.res.status == 200 &&
      len(current.res.body.routines) == 0 && !("nextPageToken" in current.res.body)
  table_functions:
    req:
      /projects/rest-routines/datasets/ds/routines?filter=routineType:TABLE_VALUED_FUNCTION:
        get:
          body: null
    test: |
      current.res.status == 200 &&
      len(current.res.body.routines) == 0
  empty_parameters:
    req:
      /projects/rest-routines/datasets/ds/routines?filter=&readMask=:
        get:
          body: null
    test: |
      current.res.status == 200 &&
      len(current.res.body.routines[0]) == 6
  invalid_filter_field:
    req:
      /projects/rest-routines/datasets/ds/routines?filter=language:SQL:
        get:
          body: null
    test: current.res.status == 400 && current.res.body.error.errors[0].reason == "invalid"
  invalid_routine_type:
    req:
      /projects/rest-routines/datasets/ds/routines?filter=routineType:INVALID:
        get:
          body: null
    test: current.res.status == 400 && current.res.body.error.errors[0].reason == "invalid"
  missing_routine_type:
    req:
      /projects/rest-routines/datasets/ds/routines?filter=routineType::
        get:
          body: null
    test: current.res.status == 400 && current.res.body.error.errors[0].reason == "invalid"
  unknown_mask_field:
    req:
      /projects/rest-routines/datasets/ds/routines?readMask=unknown:
        get:
          body: null
    test: current.res.status == 400 && current.res.body.error.errors[0].reason == "invalid"
  scalar_mask_child:
    req:
      /projects/rest-routines/datasets/ds/routines?readMask=definitionBody.child:
        get:
          body: null
    test: current.res.status == 400 && current.res.body.error.errors[0].reason == "invalid"
  unknown_nested_mask_field:
    req:
      /projects/rest-routines/datasets/ds/routines?readMask=returnType.unknown:
        get:
          body: null
    test: current.res.status == 400 && current.res.body.error.errors[0].reason == "invalid"
  repeated_mask_child:
    req:
      /projects/rest-routines/datasets/ds/routines?readMask=arguments.name:
        get:
          body: null
    test: current.res.status == 400 && current.res.body.error.errors[0].reason == "invalid"
  delete_dataset:
    req:
      /projects/rest-routines/datasets/ds?deleteContents=true:
        delete:
          body: null
    test: current.res.status == 204
