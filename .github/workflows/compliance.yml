name: Compliance

# GoogleSQL's compliance tests. A statement fails the job unless it passes or a known error in
# tests/compliance/known_errors.textproto allows its outcome.
on:
  push:
    branches: [main]
  # Every pull request runs it, since a workflow skipped by a path filter leaves a required check
  # pending.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compliance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compliance build
    # Jobs tend to finish sooner on the ARM runner.
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 120
    permissions:
      contents: read
      # Main runs delete the caches they replace.
      actions: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Configure Go cache paths
        run: |
          echo "GOCACHE=$RUNNER_TEMP/go-build" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$RUNNER_TEMP/go-mod" >> "$GITHUB_ENV"

      # Go caches are shared with the Test workflow, which saves them.
      - name: Restore Go cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.GOCACHE }}
            ${{ env.GOMODCACHE }}
          key: go-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'go.mod', 'go.sum') }}
          restore-keys: go-v1-${{ runner.os }}-${{ runner.arch }}-
      # Repository downloads are shared with the Test workflow, which saves this cache.
      - name: Restore Bazel repository cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/bazel-repo
            ~/.cache/bazelisk
          key: bazel-repo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('MODULE.bazel.lock', '.bazelversion') }}
      - name: Restore Bazel disk cache
        id: disk-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bazel-disk
          key: bazel-compliance-disk-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            bazel-compliance-disk-${{ runner.os }}-${{ runner.arch }}-
            bazel-disk-${{ runner.os }}-${{ runner.arch }}-
      - name: Configure Bazel for CI
        run: |
          echo 'common --config=ci' > .bazelrc.local
          mkdir -p "$RUNNER_TEMP/bazel-reports"

      - name: Build
        run: |
          echo "build --build_event_json_file=$RUNNER_TEMP/bazel-reports/build.bep.json --profile=$RUNNER_TEMP/bazel-reports/build.profile.json.gz" >> .bazelrc.local
          nix develop --command bazelisk build //:compliance_test
      - name: Package tests and summary tool
        run: nix develop --command .github/scripts/package-compliance.sh "$RUNNER_TEMP/compliance"
      # Bazel collects the disk cache once idle. Give it time, then stop the server so that it does
      # not delete entries while they are archived.
      - name: Stop Bazel
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          steps.disk-cache.outputs.cache-hit != 'true'
        run: |
          du -sh ~/.cache/bazel-disk
          sleep 30
          nix develop --command bazelisk --ignore_all_rc_files shutdown
          du -sh ~/.cache/bazel-disk
      # Save after the build so test failures do not discard compiled dependencies. Only main
      # pushes save caches; pull requests and manual runs reuse them.
      - name: Save Bazel disk cache
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          steps.disk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bazel-disk
          key: ${{ steps.disk-cache.outputs.cache-primary-key }}
      - name: Prune older caches
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          .github/scripts/prune-caches.sh '${{ steps.disk-cache.outputs.cache-primary-key }}'
          'bazel-compliance-disk-${{ runner.os }}-${{ runner.arch }}-'
      - name: Upload test bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compliance-bundle
          path: ${{ runner.temp }}/compliance/compliance.tar.gz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - name: Upload summary tool
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compliance-summary
          path: ${{ runner.temp }}/compliance/summary/
          retention-days: 1
          if-no-files-found: error
      - name: Upload Bazel reports
        if: success() || failure()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bazel-reports-compliance-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/bazel-reports/
          retention-days: 7
          if-no-files-found: ignore

  shards:
    name: Compliance shards (${{ matrix.group }})
    needs: build
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        group: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Use the same Nix runtime libraries and time zones as the build runner.
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Download test bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: compliance-bundle
          path: ${{ runner.temp }}/compliance
      - name: Extract tests
        run: tar -xzf "$RUNNER_TEMP/compliance/compliance.tar.gz" -C "$RUNNER_TEMP/compliance"
      - name: Compliance tests
        env:
          SHARD_GROUP: ${{ matrix.group }}
        run: >-
          nix develop --command .github/scripts/run-compliance-shards.sh
          "$RUNNER_TEMP/compliance" "$RUNNER_TEMP/compliance-logs" "$SHARD_GROUP" 4
      - name: Upload shard logs
        if: success() || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compliance-logs-${{ matrix.group }}
          path: ${{ runner.temp }}/compliance-logs/shard_*/test.log
          retention-days: 7
          if-no-files-found: warn

  compliance:
    # Keep the required check's name stable, and fail it if any preceding job failed.
    name: Compliance
    needs: [build, shards]
    if: always()
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    steps:
      - name: Download summary tool
        if: needs.build.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: compliance-summary
          path: ${{ runner.temp }}/compliance-summary
      - name: Download shard logs
        if: needs.build.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: compliance-logs-*
          merge-multiple: true
          path: ${{ runner.temp }}/compliance-logs
      # An explicit shard count detects missing artifacts, even when no shard left a log.
      - name: Summary
        if: (success() || failure()) && needs.build.result == 'success'
        run: |
          chmod +x "$RUNNER_TEMP/compliance-summary/compliance-summary"
          "$RUNNER_TEMP/compliance-summary/compliance-summary" \
            -shards "$(cat "$RUNNER_TEMP/compliance-summary/shard-count")" \
            -results compliance-results.tsv "$RUNNER_TEMP/compliance-logs" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload results
        if: (success() || failure()) && needs.build.result == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compliance-results
          path: compliance-results.tsv
          if-no-files-found: ignore
      - name: Check job results
        if: always()
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          SHARDS_RESULT: ${{ needs.shards.result }}
        run: test "$BUILD_RESULT" = success && test "$SHARDS_RESULT" = success
