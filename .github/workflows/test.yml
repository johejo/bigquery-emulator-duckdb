name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      # Main runs delete the caches they replace.
      actions: write
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-26.04
          - ubuntu-26.04-arm
          - macos-26

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Configure Go cache paths
        run: |
          echo "GOCACHE=$RUNNER_TEMP/go-build" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$HOME/.cache/go-mod" >> "$GITHUB_ENV"

      # Only pushes to main save caches; pull requests and the other workflows restore main's.
      # Each key prefix keeps one entry. Caches keyed by commit are saved by every main run; caches
      # keyed by the dependency files are saved only when those change.

      # Starts empty when the dependencies change, since Go never removes old modules. Modules do not
      # depend on the platform, so one entry, saved by the ARM Linux runner, serves every runner;
      # the path is spelled the same on each so that they agree on the cache version.
      - name: Restore Go module cache
        id: go-mod-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-mod
          key: go-mod-v2-${{ hashFiles('go.mod', 'go.sum') }}
      # Go checks cached builds against their inputs, so any earlier main run's cache is a useful start.
      - name: Restore Go build cache
        id: go-build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GOCACHE }}
          key: go-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: go-build-v1-${{ runner.os }}-${{ runner.arch }}-
      # Downloads are content-addressed, so when the dependencies change an earlier main run's cache
      # still serves the unchanged ones, even after their URLs stop working. Bazel never removes old
      # downloads; bump the key's version to start over if the cache grows too large.
      - name: Restore Bazel repository cache
        id: repo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/bazel-repo
            ~/.cache/bazelisk
          key: bazel-repo-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('MODULE.bazel.lock', '.bazelversion') }}
          restore-keys: bazel-repo-v2-${{ runner.os }}-${{ runner.arch }}-
      # The disk cache is content-addressed, so any earlier main run's cache is a useful start.
      - name: Restore Bazel disk cache
        id: disk-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bazel-disk
          key: bazel-disk-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: bazel-disk-${{ runner.os }}-${{ runner.arch }}-
      # Reuse earlier main runs only when the development shell dependencies match.
      - name: Restore Cppcheck cache
        id: cppcheck-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/cppcheck
          key: cppcheck-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}-${{ github.sha }}
          restore-keys: cppcheck-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}-
      - name: Configure Bazel for CI
        run: |
          echo 'common --config=ci' > .bazelrc.local
          echo "common --repo_env=TMP=$RUNNER_TEMP --repo_env=TEMP=$RUNNER_TEMP" >> .bazelrc.local
          mkdir -p "$RUNNER_TEMP/reports"
      - name: Cppcheck
        run: nix run .#cppcheck
      - name: Go vet
        run: nix run .#go-vet
      - name: Go staticcheck
        run: nix run .#go-staticcheck
      - name: Unit tests
        env:
          GO_TEST_JSON: ${{ runner.temp }}/reports/go-test.json
        run: |
          echo "build --build_event_json_file=$RUNNER_TEMP/reports/unit-tests.bep.json --profile=$RUNNER_TEMP/reports/unit-tests.profile.json.gz" >> .bazelrc.local
          nix run .#test
      - name: Generated docs check
        run: |
          echo "build --build_event_json_file=$RUNNER_TEMP/reports/docs-check.bep.json --profile=$RUNNER_TEMP/reports/docs-check.profile.json.gz" >> .bazelrc.local
          nix run .#docs-check
      - name: End-to-end tests
        run: |
          echo "build --build_event_json_file=$RUNNER_TEMP/reports/e2e.bep.json --profile=$RUNNER_TEMP/reports/e2e.profile.json.gz" >> .bazelrc.local
          nix run .#e2e -- --profile --profile-out "$RUNNER_TEMP/reports/e2e.runn.prof"

      - name: Upload reports
        if: success() || failure()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports-test-${{ matrix.os }}
          path: ${{ runner.temp }}/reports/
          retention-days: 7
          if-no-files-found: ignore

      - name: Save Go module cache
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          matrix.os == 'ubuntu-26.04-arm' && steps.go-mod-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-mod
          key: ${{ steps.go-mod-cache.outputs.cache-primary-key }}
      - name: Save Go build cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GOCACHE }}
          key: ${{ steps.go-build-cache.outputs.cache-primary-key }}
      # Bazel collects caches once idle, during the end-to-end tests. Stop the server so that it
      # does not delete entries while they are archived.
      - name: Stop Bazel
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          nix run .#bazel -- --ignore_all_rc_files shutdown
          du -sh ~/.cache/bazel-disk
      - name: Save Bazel disk cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bazel-disk
          key: ${{ steps.disk-cache.outputs.cache-primary-key }}
      - name: Save Bazel repository cache
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          steps.repo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/bazel-repo
            ~/.cache/bazelisk
          key: ${{ steps.repo-cache.outputs.cache-primary-key }}
      - name: Save Cppcheck cache
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          steps.cppcheck-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/cppcheck
          key: ${{ steps.cppcheck-cache.outputs.cache-primary-key }}
      - name: Prune older caches
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PREFIX: ${{ runner.os }}-${{ runner.arch }}-
        run: |
          if [[ '${{ matrix.os }}' == ubuntu-26.04-arm ]]; then
            .github/scripts/prune-caches.sh '${{ steps.go-mod-cache.outputs.cache-primary-key }}' go-mod-v2-
          fi
          .github/scripts/prune-caches.sh '${{ steps.go-build-cache.outputs.cache-primary-key }}' "go-build-v1-$PREFIX"
          .github/scripts/prune-caches.sh '${{ steps.disk-cache.outputs.cache-primary-key }}' "bazel-disk-$PREFIX"
          .github/scripts/prune-caches.sh '${{ steps.repo-cache.outputs.cache-primary-key }}' "bazel-repo-v2-$PREFIX"
          .github/scripts/prune-caches.sh '${{ steps.cppcheck-cache.outputs.cache-primary-key }}' "cppcheck-v1-$PREFIX"
