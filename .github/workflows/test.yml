name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      # Main runs delete the caches they replace.
      actions: write
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-26.04
          - ubuntu-26.04-arm
          - macos-26

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Configure Go cache paths
        run: |
          echo "GOCACHE=$RUNNER_TEMP/go-build" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$HOME/.cache/go-mod" >> "$GITHUB_ENV"

      # Only main pushes save caches; other runs and workflows restore them. Each key prefix keeps
      # one entry: commit-keyed caches are saved every run, dependency-keyed ones when those change.

      # Go never removes old modules, so this starts empty when they change. The ARM Linux runner
      # saves one entry for every platform, under a path spelled alike so the cache versions match.
      - name: Restore Go module cache
        id: go-mod-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-mod
          key: go-mod-v2-${{ hashFiles('go.mod', 'go.sum') }}
      # Go checks cached builds against their inputs, so any earlier cache helps.
      - name: Restore Go build cache
        id: go-build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GOCACHE }}
          key: go-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: go-build-v1-${{ runner.os }}-${{ runner.arch }}-
      # Only extracted repositories, which Bazel collects; it never removes downloads. The key also
      # covers what the lockfile omits: MODULE.bazel's archives and their patches and BUILD files.
      - name: Restore Bazel repository cache
        id: repo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/bazel-repo-contents
            ~/.cache/bazelisk
          key: bazel-repo-v3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('MODULE.bazel*', '.bazelversion', 'third_party/**/*.patch', 'third_party/**/BUILD.*.bazel', 'tools/clang_tidy/repository.bzl') }}
          restore-keys: bazel-repo-v3-${{ runner.os }}-${{ runner.arch }}-
      # Content-addressed, so any earlier cache helps.
      - name: Restore Bazel disk cache
        id: disk-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bazel-disk
          key: bazel-disk-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: bazel-disk-${{ runner.os }}-${{ runner.arch }}-
      - name: Configure Bazel for CI
        run: |
          echo 'common --config=ci' > .bazelrc.local
          echo "common --repo_env=TMP=$RUNNER_TEMP --repo_env=TEMP=$RUNNER_TEMP" >> .bazelrc.local
          mkdir -p "$RUNNER_TEMP/reports"
      - name: Unit tests
        env:
          GO_TEST_JSON: ${{ runner.temp }}/reports/go-test.json
          EMULATOR_LOG_DIR: ${{ runner.temp }}/reports/emulator-logs/unit
        run: |
          echo "build --build_event_json_file=$RUNNER_TEMP/reports/unit-tests.bep.json --profile=$RUNNER_TEMP/reports/unit-tests.profile.json.gz" >> .bazelrc.local
          nix run .#test
      - name: Build docs, end-to-end and compliance test binaries
        run: |
          echo "build --build_event_json_file=$RUNNER_TEMP/reports/build.bep.json --profile=$RUNNER_TEMP/reports/build.profile.json.gz" >> .bazelrc.local
          nix run .#bazel -- build //:bigquery-emulator-duckdb //:function_probe //:compliance_test
      - name: Generated docs check
        if: matrix.os == 'ubuntu-26.04-arm'
        env:
          EMULATOR_LOG_DIR: ${{ runner.temp }}/reports/emulator-logs/docs
        run: |
          echo "build --build_event_json_file=$RUNNER_TEMP/reports/docs-check.bep.json --profile=$RUNNER_TEMP/reports/docs-check.profile.json.gz" >> .bazelrc.local
          nix run .#docs-check
      - name: End-to-end tests
        env:
          E2E_GO_TEST_JSON_DIR: ${{ runner.temp }}/reports/go-test-e2e
          EMULATOR_LOG_DIR: ${{ runner.temp }}/reports/emulator-logs/e2e
        run: |
          echo "build --build_event_json_file=$RUNNER_TEMP/reports/e2e.bep.json --profile=$RUNNER_TEMP/reports/e2e.profile.json.gz" >> .bazelrc.local
          nix run .#e2e -- --profile --profile-out "$RUNNER_TEMP/reports/e2e.runn.prof"

      - name: Upload reports
        if: success() || failure()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports-test-${{ matrix.os }}
          path: ${{ runner.temp }}/reports/
          retention-days: 7
          if-no-files-found: ignore

      - name: Save Go module cache
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          matrix.os == 'ubuntu-26.04-arm' && steps.go-mod-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-mod
          key: ${{ steps.go-mod-cache.outputs.cache-primary-key }}
      - name: Save Go build cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GOCACHE }}
          key: ${{ steps.go-build-cache.outputs.cache-primary-key }}
      # Bazel collects caches once idle; stop it so that it does not delete entries being archived.
      - name: Stop Bazel
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          nix run .#bazel -- --ignore_all_rc_files shutdown
          du -sh ~/.cache/bazel-disk
      - name: Save Bazel disk cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bazel-disk
          key: ${{ steps.disk-cache.outputs.cache-primary-key }}
      - name: Save Bazel repository cache
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          steps.repo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/bazel-repo-contents
            ~/.cache/bazelisk
          key: ${{ steps.repo-cache.outputs.cache-primary-key }}
      - name: Prune older caches
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PREFIX: ${{ runner.os }}-${{ runner.arch }}-
        run: |
          if [[ '${{ matrix.os }}' == ubuntu-26.04-arm ]]; then
            .github/scripts/prune-caches.sh '${{ steps.go-mod-cache.outputs.cache-primary-key }}' go-mod-v2-
          fi
          .github/scripts/prune-caches.sh '${{ steps.go-build-cache.outputs.cache-primary-key }}' "go-build-v1-$PREFIX"
          .github/scripts/prune-caches.sh '${{ steps.disk-cache.outputs.cache-primary-key }}' "bazel-disk-$PREFIX"
          .github/scripts/prune-caches.sh '${{ steps.repo-cache.outputs.cache-primary-key }}' "bazel-repo-v3-$PREFIX"
