name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-26.04
          - ubuntu-26.04-arm
          - macos-26

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      # Caches are saved only from main; pull requests read main's caches, so they do not fill
      # the repository's cache quota with per-branch copies.
      - name: Restore Bazel repository cache
        id: repo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/bazel-repo
            ~/.cache/bazelisk
          key: bazel-repo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('MODULE.bazel.lock', '.bazelversion') }}
      # The disk cache is content-addressed, so any earlier main run's cache is a useful start.
      - name: Restore Bazel disk cache
        id: disk-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bazel-disk
          key: bazel-disk-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: bazel-disk-${{ runner.os }}-${{ runner.arch }}-
      # Cppcheck validates cached analysis against the current inputs; reuse earlier main runs
      # only when the development shell dependencies match.
      - name: Restore Cppcheck cache
        id: cppcheck-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/cppcheck
          key: cppcheck-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}-${{ github.sha }}
          restore-keys: cppcheck-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}-
      - name: Configure Bazel for CI
        run: echo 'common --config=ci' > .bazelrc.local
      - name: Format check
        run: nix develop --command just fmt-check
      - name: Cppcheck
        run: nix develop --command just cppcheck
      - name: Clang-tidy
        run: nix develop --command just tidy
      - name: Bazel tests
        run: nix develop --command just test
      - name: Generated docs check
        run: nix develop --command just docs-check
      - name: End-to-end tests
        run: nix develop --command just e2e

      - name: Report Bazel disk cache size
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: du -sh ~/.cache/bazel-disk
      - name: Save Bazel disk cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bazel-disk
          key: ${{ steps.disk-cache.outputs.cache-primary-key }}
      - name: Save Bazel repository cache
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          steps.repo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/bazel-repo
            ~/.cache/bazelisk
          key: ${{ steps.repo-cache.outputs.cache-primary-key }}
      - name: Save Cppcheck cache
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          steps.cppcheck-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/cppcheck
          key: ${{ steps.cppcheck-cache.outputs.cache-primary-key }}
